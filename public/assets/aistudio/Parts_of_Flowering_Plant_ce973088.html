<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parts of a Typical Flowering Plant - Interactive Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#06122b;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#eaf2ff;-webkit-user-select:none;user-select:none}
#app{height:100vh;min-width:980px;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;gap:14px 16px;padding:16px;
 background:radial-gradient(1200px 700px at 15% 0%,#17428f 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#0b6b57 0%,transparent 55%),linear-gradient(160deg,#07163a,#050d22)}
#stageCell{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center;perspective:1500px;min-height:0;min-width:0;overflow:hidden}
#stage{position:relative;border-radius:18px;overflow:hidden;transition:transform .25s ease-out;will-change:transform;
 box-shadow:0 34px 60px -22px rgba(0,0,0,.75),0 0 0 4px rgba(255,255,255,.14),0 0 46px rgba(70,160,255,.28)}
#stage img{width:100%;height:100%;display:block;pointer-events:none}
#fxsvg,#cv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;mix-blend-mode:soft-light;
 background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.35),transparent 48%)}
#stageCell:hover #glare{opacity:1}
#dim{opacity:0;transition:opacity .45s}
.sel #dim{opacity:1}
.ring{stroke-dasharray:16 10;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-52}}
.pop{filter:drop-shadow(0 12px 12px rgba(0,0,0,.6))}

.pill{position:absolute;border:0;border-radius:30px;background:transparent;cursor:pointer;transition:box-shadow .2s,background .2s}
.pill:hover{box-shadow:0 0 0 4px rgba(255,255,255,.95),0 0 28px 8px var(--b);background:rgba(255,255,255,.08)}
.pill.on{box-shadow:0 0 0 4px #fff,0 0 34px 10px var(--b)}
.hot{position:absolute;width:2.5%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 35% 30%,#fff 0,var(--l) 28%,var(--b) 68%,var(--d) 100%);animation:ping 1.8s infinite;transition:transform .2s}
.hot:hover,.hot.on{transform:translate(-50%,-50%) scale(1.3)}
@keyframes ping{0%{box-shadow:0 4px 8px rgba(0,0,0,.55),0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 4px 8px rgba(0,0,0,.55),0 0 0 20px rgba(255,255,255,0)}}

#controls{grid-column:1;grid-row:2;display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center;align-items:center;padding:4px 0 6px}
.sep{width:2px;height:34px;background:rgba(255,255,255,.22);border-radius:2px;margin:0 6px}
.btn{border:0;border-radius:14px;padding:12px 18px;font:700 15px "Segoe UI",Roboto,Arial,sans-serif;color:#fff;cursor:pointer;letter-spacing:.2px;
 text-shadow:0 1px 2px rgba(0,0,0,.45);background:linear-gradient(180deg,var(--l),var(--b));
 box-shadow:0 5px 0 var(--d),0 12px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--d),0 4px 8px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.3)}
.btn.on{outline:3px solid #fff;outline-offset:2px}

#panel{grid-column:2;grid-row:1/3;border-radius:22px;padding:22px 22px 18px;overflow:auto;
 background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);
 box-shadow:0 24px 50px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.25)}
#panel.in{animation:slide .45s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.tag{display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:12px;letter-spacing:1.2px;padding:5px 12px;border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#panel h2{font-size:30px;margin:12px 0 8px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);border-left:7px solid var(--c);padding-left:12px}
.lead{font-size:16px;line-height:1.5;color:#e4eeff;margin-bottom:14px}
.box{background:rgba(0,0,0,.25);border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.1)}
.box b{display:block;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#ffd166;margin-bottom:6px}
.box ul{list-style:none}
.box li{font-size:15px;line-height:1.45;padding-left:20px;position:relative;margin:3px 0}
.box li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.box p{font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:14px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3)}
.fact{background:linear-gradient(135deg,#ffb347,#ff7a18);color:#2a1300;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;font-weight:600;box-shadow:0 5px 0 #a64f00}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.08);cursor:pointer;transition:transform .15s,background .15s}
.row:hover{background:rgba(255,255,255,.18);transform:translateX(4px)}
.row span.dot{flex:0 0 16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.row b{font-size:16px;min-width:64px}
.row em{font-style:normal;font-size:14px;color:#d3e2fb}
.hint{margin-top:12px;font-size:12.5px;color:#a9bddf;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="stageCell">
    <div id="stage">
      <img id="photo" alt="Parts of a Typical Flowering Plant" draggable="false">
      <svg id="fxsvg" viewBox="0 0 1672 941" preserveAspectRatio="none">
        <defs><image id="base" width="1672" height="941"/></defs>
        <g id="fx"></g>
      </svg>
      <canvas id="cv"></canvas>
      <div id="glare"></div>
    </div>
  </div>
  <div id="controls"></div>
  <aside id="panel"></aside>
</div>

  spawn(dt,t);
  for(let i=P.length-1;i>=0;i--){if(!P[i].step(dt,t))P.splice(i,1);}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  for(const p of P)p.draw();
  drawMode(t);
  const s=1.05+.018*Math.sin(t*2.2);
  for(const g of pops){const cx=g.dataset.cx,cy=g.dataset.cy;g.setAttribute('transform',`translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`);}
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
renderPanel();syncUI();fit();
new ResizeObserver(fit).observe(cell);window.addEventListener('resize',fit);
requestAnimationFrame(frame);
</script>
