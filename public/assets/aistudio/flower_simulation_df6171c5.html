<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Parts of a Flower – Interactive Simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b1e3a;font-family:Segoe UI,Arial,sans-serif;color:#fff;overflow:hidden}
#app{display:flex;height:100vh;background:linear-gradient(135deg,#0b1e3a,#16407a)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#box{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #0008}
#fit{width:1536px;height:1024px;transform-origin:0 0;position:absolute;left:0;top:0;background:#fff}
#sway{width:1536px;height:1024px;position:relative;transform-origin:50% 100%}
#sway img,#sway canvas{position:absolute;left:0;top:0;width:1536px;height:1024px;display:block}
#cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000b;padding:8px 18px;border-radius:20px;font-size:15px;max-width:90%;text-align:center;display:none;border:1px solid #ffd93d}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#0006}
button{font:600 14px Segoe UI,Arial;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;color:#fff;background:#2e6bd6;transition:.15s}
button:hover{filter:brightness(1.2);transform:translateY(-1px)}
button.on{background:#e8a800;color:#222}
#bar .g{background:#1f9d55}#bar .r{background:#c0392b}#bar .p{background:#8e44ad}
#bar label{font-size:13px;display:flex;align-items:center;gap:6px}
#panel{width:300px;background:#f4f8ff;color:#1b2a41;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
#panel h2{font-size:18px;color:#0b3d91}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button{background:#fff;color:#1b2a41;border:2px solid #ffd93d;font-size:13px;padding:8px 4px}
.grid button.on{background:#ffd93d}
.grid button.pi{border-color:#8e44ad}.grid button.st{border-color:#6c3fc4}
.grid .wide{grid-column:span 2}
#info{background:#fff;border-radius:10px;padding:12px;border-left:6px solid #e8a800;flex:1;min-height:130px;box-shadow:0 2px 8px #0002}
#info b{font-size:20px;display:block;margin-bottom:4px}
#info span{font-size:12px;background:#8e44ad;color:#fff;border-radius:10px;padding:2px 8px}
#info p{margin-top:8px;font-size:15px;line-height:1.45}
@media(max-width:900px){#panel{width:220px}}
</style></head><body>

<script>
const W=1536,H=1024,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const P={
stigma:{n:'Stigma',x:730,y:268,r:50,g:'Pistil',t:'The sticky top of the pistil. It catches pollen grains brought by insects, birds or wind.'},
style:{n:'Style',x:737,y:390,r:62,g:'Pistil',t:'A slender tube that joins the stigma to the ovary. The pollen tube grows down through it.'},
ovary:{n:'Ovary',x:748,y:548,r:88,g:'Pistil',t:'The swollen base of the pistil. It holds ovules that become seeds; the ovary becomes the fruit.'},
anther:{n:'Anther',x:872,y:355,r:78,g:'Stamen',t:'The top of the stamen. It makes and releases pollen (the male cells).'},
filament:{n:'Filament',x:880,y:455,r:72,g:'Stamen',t:'A thin stalk that holds the anther up so that pollinators can reach the pollen.'},
petal:{n:'Petal',x:420,y:520,r:135,t:'Colourful parts that attract bees, butterflies and birds for pollination.'},
sepal:{n:'Sepal',x:660,y:775,r:75,t:'Small green leaf-like parts under the petals. They protect the flower while it is a bud.'},
leaf:{n:'Leaf',x:1130,y:815,r:145,t:'Makes food for the plant by photosynthesis, using sunlight, water and carbon dioxide.'},
stem:{n:'Stem',x:735,y:915,r:75,t:'Holds the flower upright and carries water and minerals up, and food to all parts.'}};
const G={Pistil:{n:'Pistil (Carpel)',k:['stigma','style','ovary'],t:'The female part of the flower, made of the stigma, style and ovary.'},
Stamen:{n:'Stamen',k:['anther','filament'],t:'The male part of the flower, made of the anther and the filament.'}};
const order=Object.keys(P);
let sel=[],selFade=0,paused=false,speed=1,T=0,mode='free',pt=0,tourT=0,tourI=0,fl={},parts=[],ambient=true,lastDir=1;
const $=id=>document.getElementById(id);
// buttons
const pg=$('parts');
function mk(label,cls,fn,wide){const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls+(wide?' wide':'');else if(wide)b.className='wide';b.onclick=fn;pg.appendChild(b);b.dataset.k=label;return b}
mk('Pistil (Carpel)','pi',()=>{stopModes();setSel(G.Pistil.k,'Pistil')},1);
mk('Stamen','st',()=>{stopModes();setSel(G.Stamen.k,'Stamen')},1);
order.forEach(k=>mk(P[k].n,'',()=>{stopModes();setSel([k])}));
mk('Show All / Clear','',()=>{stopModes();setSel([])},1);
function setSel(a,grp){sel=a;selFade=0;const bs=pg.children;for(const b of bs)b.classList.remove('on');
 a.forEach(k=>{for(const b of bs)if(b.dataset.k===P[k].n)b.classList.add('on')});
 if(grp)for(const b of bs)if(b.dataset.k.startsWith(grp))b.classList.add('on');
 const i=$('info');
 if(grp)i.innerHTML='<b>'+G[grp].n+'</b><span>Group</span><p>'+G[grp].t+'</p>';
 else if(a.length===1){const p=P[a[0]];i.innerHTML='<b>'+p.n+'</b>'+(p.g?'<span>'+p.g+'</span>':'')+'<p>'+p.t+'</p>'}
 else if(!a.length)i.innerHTML='<b>Parts of a Flower</b><p>Click a part on the flower or choose one from the buttons.</p>'}
function stopModes(){mode='free';fl={};parts=[];$('bTour').classList.remove('on');$('bPol').classList.remove('on');cap('')}
function cap(t){const c=$('cap');c.style.display=t?'block':'none';c.textContent=t}
$('bPlay').onclick=()=>{paused=!paused;$('bPlay').textContent=paused?'▶ Play':'⏸ Pause';$('bPlay').className=paused?'':'g'};
$('bTour').onclick=()=>{stopModes();mode='tour';tourI=0;tourT=0;setSel([order[0]]);$('bTour').classList.add('on');cap('Guided tour: learning each part')};
$('bPol').onclick=()=>{stopModes();mode='poll';pt=0;fl={};parts=[];setSel([]);$('bPol').classList.add('on');if(paused)$('bPlay').click()};
$('bReset').onclick=()=>{stopModes();setSel([]);T=0};
$('spd').oninput=e=>{speed=+e.target.value;$('spv').textContent=speed+'x'};
$('amb').onchange=e=>ambient=e.target.checked;
function isFS(){return document.fullscreenElement||document.webkitFullscreenElement}
function toggleFS(){const a=$('app');if(isFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(a.requestFullscreen||a.webkitRequestFullscreen).call(a)}
$('bFull').onclick=toggleFS;
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFS();if(e.key===' '){e.preventDefault();$('bPlay').click()}});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('bFull').textContent=isFS()?'🗗 Exit Full Screen':'⛶ Full Screen';setTimeout(fit,50)}));
function fit(){const s=$('stage'),w=s.clientWidth-20,h=s.clientHeight-20,k=Math.min(w/W,h/H);
 $('box').style.width=W*k+'px';$('box').style.height=H*k+'px';$('fit').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
cv.addEventListener('click',e=>{let best=null,bd=1e9;for(const k of order){const p=P[k],d=Math.hypot(e.offsetX-p.x,e.offsetY-p.y);if(d<p.r&&d<bd){bd=d;best=k}}
 if(best){stopModes();setSel([best])}});
cv.addEventListener('mousemove',e=>{let h=0;for(const k of order){const p=P[k];if(Math.hypot(e.offsetX-p.x,e.offsetY-p.y)<p.r)h=1}cv.style.cursor=h?'pointer':'default'});
// bee
const K=[{t:0,x:-90,y:140},{t:3,x:880,y:325},{t:5.5,x:880,y:325},{t:9,x:735,y:245},{t:16,x:735,y:245},{t:21,x:1650,y:60}];
function beePos(t){for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t<=b.t){let u=(t-a.t)/(b.t-a.t);u=u*u*(3-2*u);return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u}}}return K[K.length-1]}
function drawBee(x,y,dir,s,pol){ctx.save();ctx.translate(x,y);ctx.scale(dir*s,s);
 const f=Math.sin(T*60)*0.5+0.5;ctx.fillStyle='rgba(200,230,255,.75)';ctx.strokeStyle='#7aa';
 for(const o of[-1,1]){ctx.beginPath();ctx.ellipse(-4,-14,9,6+f*12,-0.5*o+0.3,0,7);ctx.fill();ctx.stroke()}
 ctx.fillStyle='#ffc400';ctx.beginPath();ctx.ellipse(0,0,24,15,0,0,7);ctx.fill();
 ctx.fillStyle='#222';for(const px of[-8,2,12]){ctx.beginPath();ctx.ellipse(px,0,3.5,14,0,0,7);ctx.fill()}
 ctx.beginPath();ctx.arc(24,-2,9,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(27,-5,3,0,7);ctx.fill();
 ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,-9);ctx.quadraticCurveTo(38,-20,44,-16);ctx.stroke();
 if(pol){ctx.fillStyle='#ff9800';for(const[a,b]of[[-4,14],[6,16],[-12,15]]){ctx.beginPath();ctx.arc(a,b,5,0,7);ctx.fill()}}
 ctx.restore()}
function burst(x,y,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-10,l:1.5+Math.random()*1.5})}}
const AN=[[843,345],[866,333],[893,350],[818,375],[929,407]];
const SEEDS=[[730,540],[765,545],[748,572],[725,588],[770,592],[748,612]];
const STEPS=[[0,'Step 1/6: A bee flies in, looking for nectar.'],[3,'Step 2/6: Pollen from the anther sticks to the bee.'],[5.5,'Step 3/6: The bee carries pollen to another flower.'],
[9,'Step 4/6: Pollen lands on the sticky stigma.'],[11,'Step 5/6: A pollen tube grows down the style to the ovary.'],[16,'Step 6/6: Fertilisation! Ovules become seeds, the ovary becomes fruit.'],[21.5,'Pollination complete! Press "Pollination" to watch again.']];
let lastCap=-1,lastSel='',emit=0;
function frame(now){const dt=Math.min(0.05,(now-(frame.l||now))/1000);frame.l=now;
 if(!paused){const d=dt*speed;T+=d;
  if(mode==='poll'&&pt<22)pt+=d;
  if(mode==='tour'){tourT+=d;if(tourT>4.5){tourT=0;tourI=(tourI+1)%order.length;setSel([order[tourI]])}}
  for(const p of parts){p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=(p.g?0:-4)*d;p.vx+=Math.sin(T*2+p.y*.02)*10*d;p.l-=d}
  parts=parts.filter(p=>p.l>0);
  emit+=d;if(ambient&&emit>0.12&&parts.length<80){emit=0;const a=AN[Math.random()*5|0];parts.push({x:a[0],y:a[1],vx:(Math.random()-.3)*14,vy:-8-Math.random()*10,l:3+Math.random()*2})}
  selFade=Math.min(1,selFade+d*2.5)}
 // pollination events
 if(mode==='poll'){
  let ci=0;STEPS.forEach((s,i)=>{if(pt>=s[0])ci=i});if(ci!==lastCap){lastCap=ci;cap(STEPS[ci][1])}
  const s=pt<3?[]:pt<5.5?['anther']:pt<9?[]:pt<11?['stigma']:pt<16?['style']:pt<19?['ovary']:[];
  if(s.join()!==lastSel){lastSel=s.join();setSel(s)}
  if(pt>3.2&&!fl.a){fl.a=1;burst(880,345,30,60)}
  if(pt>3.7&&!fl.b){fl.b=1;burst(870,340,20,50)}
  if(pt>9.2&&!fl.c){fl.c=1;for(let i=0;i<25;i++)parts.push({x:730+Math.random()*30-15,y:255,vx:Math.random()*40-20,vy:20+Math.random()*30,l:1.2,g:1})}
 }
