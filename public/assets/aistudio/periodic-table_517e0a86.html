.b:hover{filter:brightness(1.15)}.b:active{transform:translateY(3px);box-shadow:0 0 0 #000}
.b.on{outline:3px solid #fff;outline-offset:1px}.b:focus-visible{outline:3px solid #fff}
#q{border:0;border-radius:10px;padding:6px 10px;font:700 12px "Trebuchet MS",Verdana,sans-serif;width:130px}
@media (max-width:1100px){#side{width:240px}}

const CATS={a:['Alkali Metals','#ff6b6b'],e:['Alkaline Earth Metals','#ff9f43'],t:['Transition Metals','#f9c74f'],p:['Post-Transition Metals','#2ec4b6'],m:['Metalloids','#4cc9f0'],n:['Nonmetals','#4895ef'],h:['Halogens','#9d8df1'],g:['Noble Gases','#f15bb5'],l:['Lanthanides','#ff85a1'],c:['Actinides','#c08457']};

function pos(z){if(z===1)return[1,1];if(z===2)return[1,18];
 for(const[a,b,p]of[[3,10,2],[11,18,3],[19,36,4],[37,54,5]])if(z>=a&&z<=b){const i=z-a;return[p,b-a===7?(i<2?i+1:i+11):i+1]}

 const V=[['Atomic Number',e.z,'#e8590c'],['Atomic Mass',massTxt(e.m),'#1c7ed6'],['State (room temp.)',state(e)==='Unknown'?'Unknown (made in labs)':state(e),'#7048e8'],['Group / Period',(e.gr||'f-block')+' / '+e.pd,'#0ca678'],['Protons (+)',pr,'#e03131'],['Neutrons',ne,'#495057'],['Electrons (−)',pr,'#1971c2'],['Electron shells',sh.join(' , '),'#c2255c']];
 $('vals').innerHTML=V.map(v=>`<div class="val" style="background:${v[2]}">${v[0]}<b>${v[1]}</b></div>`).join('')}
function say(s){try{speechSynthesis.cancel();const q=new SpeechSynthesisUtterance(s);q.lang='en-US';q.rate=.9;speechSynthesis.speak(q)}catch(e){}}
function sayFull(){const e=EL[sel-1];say(`${e.n}. Symbol ${e.s}. Atomic number ${e.z}. It is a ${CATS[e.k][0].toLowerCase()}. ${e.u}.`)}
/* filters */
function setFilt(t,v){filt=filt&&filt[0]===t&&filt[1]===v?null:(t?[t,v]:null);document.querySelectorAll('#gFil .b').forEach(b=>b.classList.toggle('on',!!filt&&b.dataset.f===t+':'+v));paint()}
/* quiz */
function nextQ(){let e,ty;do{e=EL[Math.random()*118|0];ty=Math.random()*3|0}while(ty===2&&(e.e==='🧪'||e.e==='☢️'));
 const q=ty===0?`Click the element named <b style="display:inline">${e.n}</b>`:ty===1?`Click the element with symbol <b style="display:inline">${e.s}</b>`:`Which element? <b style="display:inline">${e.u}</b>`;qa={z:e.z,q};board_();say(ty===0?'Find '+e.n:ty===1?'Find the symbol '+e.s.split('').join(' '):'Which element is used for: '+e.u)}
/* atom canvas */
const cv=$('cv'),c=cv.getContext('2d');let CW=0,CH=0;
function rs(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;CW=r.width;CH=r.height;cv.width=CW*d;cv.height=CH*d;c.setTransform(d,0,0,d,0,0);fit()}
function atom(){c.clearRect(0,0,CW,CH);const e=EL[sel-1],sh=shells(sel),cx=CW/2,cy=CH/2-6,R=Math.min(CW,CH)/2-16,n=sh.length,ne=Math.max(0,Math.round(e.m)-sel);
 const g=c.createRadialGradient(cx,cy,10,cx,cy,R*1.4);g.addColorStop(0,'#1b2a7a');g.addColorStop(1,'#050a24');c.fillStyle=g;c.fillRect(0,0,CW,CH);
 const rn=9+Math.min(14,Math.sqrt(sel)*1.3);
 sh.forEach((cnt,k)=>{const r=n===1?R*.55:rn+14+(R-rn-14)*k/(n-1||1);c.strokeStyle='rgba(160,190,255,.45)';c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();
  const val=k===n-1;for(let i=0;i<cnt;i++){const a=at*(1.1/(k+1)+.15)*(k%2?-1:1)+i*2*Math.PI/cnt;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);c.fillStyle=val?'#ffd43b':'#4dd9ff';c.shadowColor=c.fillStyle;c.shadowBlur=val?14:8;c.beginPath();c.arc(x,y,4.6,0,7);c.fill()}c.shadowBlur=0});
 const ng=c.createRadialGradient(cx-rn*.3,cy-rn*.3,2,cx,cy,rn);ng.addColorStop(0,'#ff9aa2');ng.addColorStop(.6,'#e03131');ng.addColorStop(1,'#6b1010');c.fillStyle=ng;c.beginPath();c.arc(cx,cy,rn,0,7);c.fill();
 if(ne>0){c.fillStyle='rgba(180,190,210,.85)';c.beginPath();c.arc(cx+rn*.45,cy+rn*.35,rn*.45,0,7);c.fill()}
 c.font='bold 12px Trebuchet MS,Verdana';c.textAlign='left';c.fillStyle='#fff';c.fillText(e.s+' atom model',10,16);c.textAlign='right';c.fillStyle='#ffd43b';c.fillText('● Outer electrons: '+sh[n-1],CW-8,16);c.textAlign='center';c.fillStyle='#ff9aa2';c.fillText('Red = protons',CW*.28,CH-8);c.fillStyle='#b8c1d6';c.fillText('Grey = neutrons',CW*.7,CH-8)}
function loop(){if(spin)at+=.016;atom();requestAnimationFrame(loop)}
/* layout */
function fit(){const w=$('tw').clientWidth-16,h=$('tw').clientHeight-16,cw=Math.max(22,Math.min((w-60)/18.5,(h-40)/10.8));
 tbl.style.fontSize=cw+'px';tbl.style.gridTemplateColumns=`${cw*.5}px repeat(18,${cw-3}px)`;tbl.style.gridTemplateRows=`${cw*.5}px repeat(7,${cw*1.1-3}px) ${cw*.3}px repeat(2,${cw*1.1-3}px)`}
/* UI */
function mk(p,l,col,fn,cls){const b=document.createElement('button');b.className='b'+(cls?' '+cls:'');b.style.setProperty('--c',col);b.innerHTML=l;b.onclick=()=>fn(b);$(p).appendChild(b);return b}
function tog(p,l,col,get,set){const b=mk(p,l,col,b=>{set(!get());b.classList.toggle('on',get())});b.classList.toggle('on',get());return b}
const fsb=mk('gScr','⛶ Full Screen','#e8590c',()=>{const a=$('app');document.fullscreenElement?document.exitFullscreen():(a.requestFullscreen||a.webkitRequestFullscreen).call(a)});
document.addEventListener('fullscreenchange',()=>{fsb.innerHTML=document.fullscreenElement?'🗗 Exit Full Screen':'⛶ Full Screen';setTimeout(rs,150)});
const cm={};[['cat','🎨 Category','#7048e8'],['state','🧊 State of Matter','#1c7ed6'],['metal','🔩 Metal or Not','#f59f00'],['rain','🌈 Rainbow Order','#d6336c']].forEach(([k,l,col])=>cm[k]=mk('gCol',l,col,()=>{cmode=k;Object.entries(cm).forEach(([q,b])=>b.classList.toggle('on',q===k));paint()}));cm.cat.classList.add('on');
Object.entries(CATS).forEach(([k,[n,col]])=>{const b=mk('gFil',n,col,()=>setFilt('cat',k));b.dataset.f='cat:'+k});
[['Solid','🧱 Solids','#7c6cf0'],['Liquid','💧 Liquids','#12b886'],['Gas','💨 Gases','#f06595']].forEach(([k,l,col])=>{const b=mk('gFil',l,col,()=>setFilt('state',k));b.dataset.f='state:'+k});
mk('gFil','✖ Show All','#495057',()=>{filt=null;document.querySelectorAll('#gFil .b').forEach(b=>b.classList.remove('on'));paint()});
tog('gTab','🏷️ Names','#0ca678',()=>!tbl.classList.contains('nonm'),v=>tbl.classList.toggle('nonm',!v));
tog('gTab','⚖️ Atomic Mass','#1c7ed6',()=>tbl.classList.contains('mass'),v=>tbl.classList.toggle('mass',v));
tog('gTab','🧸 Real Objects','#f76707',()=>tbl.classList.contains('obj'),v=>tbl.classList.toggle('obj',v));
tog('gTab','🔢 Group & Period','#e03131',()=>tbl.classList.contains('lab'),v=>tbl.classList.toggle('lab',v));
mk('gExp','◀ Previous','#4263eb',()=>pick(sel>1?sel-1:118));mk('gExp','Next ▶','#4263eb',()=>pick(sel<118?sel+1:1));
mk('gExp','🎲 Random','#ae3ec9',()=>pick(1+Math.random()*118|0));
mk('gExp','🔊 Say About It','#d6336c',sayFull);
tog('gExp','↔ Same Period','#12b886',()=>samePer,v=>{samePer=v;paint()});tog('gExp','↕ Same Group','#fd7e14',()=>sameGrp,v=>{sameGrp=v;paint()});
tog('gExp','⚛️ Spin Atom','#f59f00',()=>spin,v=>spin=v);
const qb=tog('gExp','🎯 Quiz Game','#c2255c',()=>quiz,v=>{quiz=v;qa=null;$('score').style.display=v?'block':'none';if(v){score=0;$('score').textContent='⭐ Score: 0';nextQ()}else board_()});
mk('gExp','⏭ Skip Question','#e67700',()=>{if(quiz)nextQ()});
const inp=document.createElement('input');inp.id='q';inp.placeholder='Name, symbol or number';$('gExp').appendChild(inp);
function find(){const v=inp.value.trim().toLowerCase();if(!v)return;const e=EL.find(x=>String(x.z)===v||x.s.toLowerCase()===v||x.n.toLowerCase()===v)||EL.find(x=>x.n.toLowerCase().startsWith(v));if(e){pick(e.z);say(e.n)}else{inp.value='';inp.placeholder='Not found. Try again'}}
inp.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Enter')find()};mk('gExp','🔎 Find','#1098ad',find);
mk('gExp','↺ Reset','#343a40',()=>{filt=null;cmode='cat';samePer=sameGrp=false;quiz=false;qa=null;$('score').style.display='none';document.querySelectorAll('#bar .b.on').forEach(b=>{if(!/Names|Spin|Category|Group/.test(b.textContent))b.classList.remove('on')});Object.values(cm).forEach((b,i)=>b.classList.toggle('on',i===0));tbl.classList.remove('obj','mass','nonm');pick(79)});
document.querySelectorAll('#gTab .b')[3].click();
addEventListener('keydown',e=>{if(e.key==='ArrowRight')pick(sel<118?sel+1:1);if(e.key==='ArrowLeft')pick(sel>1?sel-1:118)});
addEventListener('resize',rs);
pick(79);rs();loop();
</script>
</body></html>
