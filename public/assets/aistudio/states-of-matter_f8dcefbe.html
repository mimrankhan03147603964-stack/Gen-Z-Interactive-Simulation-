<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>States of Matter - Solid, Liquid and Gas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;background:#0a1330;color:#fff}
#app{display:flex;flex-direction:column;height:100vh;background:radial-gradient(circle at 20% 0%,#1d3a8a,#0a1330 70%)}
h1{margin:0;padding:8px 16px 2px;font-size:24px;text-align:center;letter-spacing:.5px}
h1 span{color:#60a5fa}h1 b{color:#fbbf24}h1 i{color:#fb7185;font-style:normal}
#cv{flex:1;min-height:0;width:100%;object-fit:contain;display:block}
#ctl{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:8px 10px 12px;background:rgba(0,0,0,.35)}
button{border:0;color:#fff;font:bold 15px 'Trebuchet MS',Arial,sans-serif;padding:10px 15px;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .1s,filter .1s}
button:hover{filter:brightness(1.15);transform:translateY(-2px)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid #fff}
</style>
</head>
<body>
<div id="app">
<h1>States of Matter: <span>Solid</span>, <b>Liquid</b> and <i>Gas</i></h1>
<canvas id="cv"></canvas>
<div id="ctl"></div>
</div>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d'),W=1200,H=640;
cv.width=W;cv.height=H;
const BX=640,BY=90,BW=530,BH=380,R=11;
let T=-15,target=-15,state=0,N=90,paused=false,spd=1,labels=true,P=[],t=0;
const rnd=()=>Math.random()-.5;

function mk(old){
  const cols=18,sp=24,rows=Math.ceil(N/cols),x0=BX+BW/2-(cols-1)*sp/2;
  P=[];
  for(let i=0;i<N;i++){
    const hx=x0+(i%cols)*sp,hy=BY+BH-30-Math.floor(i/cols)*sp,o=old&&old[i];
    P.push(o?Object.assign(o,{hx,hy}):{hx,hy,vx:0,vy:0,
      x:state==0?hx:BX+R+Math.random()*(BW-2*R),
      y:state==0?hy:BY+R+Math.random()*(BH-2*R)});
  }
}
mk();

function spr(a,b){
  const o=document.createElement('canvas');o.width=o.height=44;
  const g=o.getContext('2d'),r=g.createRadialGradient(15,14,3,22,22,22);
  r.addColorStop(0,'#fff');r.addColorStop(.25,a);r.addColorStop(1,b);
  g.fillStyle=r;g.beginPath();g.arc(22,22,21,0,7);g.fill();return o;
}
const SP=[spr('#93c5fd','#1d4ed8'),spr('#67e8f9','#0e7490'),spr('#fda4af','#be123c')];

const INFO=[
 {n:'SOLID (Ice)',col:'#60a5fa',a:['Shape: fixed shape','Volume: fixed volume','Particles: packed tightly in a regular pattern','Movement: they only vibrate in place','Energy: low','Examples: ice, rock, wood']},
 {n:'LIQUID (Water)',col:'#22d3ee',a:['Shape: takes the shape of its container','Volume: fixed volume','Particles: close together, no fixed pattern','Movement: they slide and flow past each other','Energy: medium','Examples: water, milk, juice']},
 {n:'GAS (Steam)',col:'#fb7185',a:['Shape: fills the whole container','Volume: changes to fill the space','Particles: very far apart','Movement: fast, free and random','Energy: high','Examples: steam, air, oxygen']}
];

function step(dt){
  const near=Math.abs(T)<2||Math.abs(T-100)<2,d=target-T,rate=(near?5:30)*spd;
  T+=Math.sign(d)*Math.min(Math.abs(d),rate*dt);
  if(state==0&&T>.5)state=1;
  else if(state==1&&T<-.5)state=0;
  else if(state==1&&T>100.5)state=2;
  else if(state==2&&T<99.5)state=1;
  const f=dt*60*spd,l=BX+R,r=BX+BW-R,u=BY+R,b=BY+BH-R;
  for(const p of P){
    if(state==0){
      const j=.5+(T+30)/30*.9;
      p.vx=(p.vx+(p.hx-p.x)*.06)*.85+rnd()*j;
      p.vy=(p.vy+(p.hy-p.y)*.06)*.85+rnd()*j;
    }else if(state==1){
      p.vy+=.14;p.vx+=rnd()*.6;p.vy+=rnd()*.6;p.vx*=.985;p.vy*=.985;
      const s=1.8+T/35,m=Math.hypot(p.vx,p.vy);
      if(m>s){p.vx*=s/m;p.vy*=s/m}
    }else{
      const s=3+(T-100)/18;let m=Math.hypot(p.vx,p.vy);
      if(m<.01){p.vx=rnd();p.vy=rnd();m=Math.hypot(p.vx,p.vy)||1}
      const k=1+(s/m-1)*.1;p.vx*=k;p.vy*=k;
    }
    p.x+=p.vx*f;p.y+=p.vy*f;
    if(p.x<l){p.x=l;p.vx=Math.abs(p.vx)}
    if(p.x>r){p.x=r;p.vx=-Math.abs(p.vx)}
    if(p.y<u){p.y=u;p.vy=Math.abs(p.vy)}
    if(p.y>b){p.y=b;p.vy=-Math.abs(p.vy)*.5}
  }
  if(state==1){
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const a=P[i],q=P[j],dx=q.x-a.x,dy=q.y-a.y,d2=dx*dx+dy*dy;
      if(d2<484&&d2>.0001){
        const dd=Math.sqrt(d2),o=(22-dd)/2,nx=dx/dd,ny=dy/dd;
        a.x-=nx*o;a.y-=ny*o;q.x+=nx*o;q.y+=ny*o;
      }
    }
  }
}

/* ---------- drawing helpers ---------- */
function lg(x1,y1,x2,y2,stops){
  const g=c.createLinearGradient(x1,y1,x2,y2);
  stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g;
}
function txt(s,x,y,size,col,al,w){
  c.font=(w||'bold')+' '+size+'px "Trebuchet MS",Arial,sans-serif';
  c.fillStyle=col;c.textAlign=al||'left';c.fillText(s,x,y);
}
function ice(x,y,s,a){
  c.save();c.globalAlpha=a;
  c.fillStyle=lg(x,y,x+s,y+s,['#f0ffff','#9bd8f5','#58b4e6']);
  c.beginPath();c.roundRect(x,y,s,s,s*.14);c.fill();
  c.strokeStyle='#fff';c.lineWidth=2;c.stroke();
  c.fillStyle='rgba(255,255,255,.6)';
  c.beginPath();c.roundRect(x+s*.1,y+s*.1,s*.28,s*.5,s*.08);c.fill();
  c.restore();
}
function table(){
  c.fillStyle=lg(0,430,0,475,['#b8864b','#7a4e22']);
  c.beginPath();c.roundRect(20,430,525,45,[0,0,18,18]);c.fill();
  c.fillStyle='rgba(0,0,0,.12)';
  for(let i=0;i<6;i++)c.fillRect(20,440+i*7,525,1.5);
}
function burner(){
  c.fillStyle=lg(0,430,0,452,['#555','#222']);
  c.beginPath();c.roundRect(150,430,280,22,6);c.fill();
  c.fillStyle=target>T+.5?'#f97316':'#7f1d1d';
  for(let i=0;i<6;i++){c.beginPath();c.arc(185+i*44,441,5,0,7);c.fill()}
  if(target>T+.5){
    c.font='34px sans-serif';c.textAlign='center';
    for(let i=0;i<8;i++)c.fillText('🔥',165+i*36,442-Math.abs(Math.sin(t*9+i))*5);
  }
}
function glass(){
  const gp=()=>{c.beginPath();c.moveTo(190,200);c.lineTo(390,200);c.lineTo(365,430);c.lineTo(215,430);c.closePath()};
  const lv=270;
  c.save();gp();c.clip();
  c.fillStyle=lg(0,lv,0,430,['rgba(80,190,255,.85)','rgba(20,110,210,.9)']);
  c.beginPath();c.moveTo(180,lv);
  for(let x=180;x<=400;x+=10)c.lineTo(x,lv+Math.sin(x*.07+t*3)*(2+Math.max(0,T-60)/12));
  c.lineTo(400,440);c.lineTo(180,440);c.closePath();c.fill();
  if(T<10){
    const s=60*(1-Math.max(T,0)/10)+8;
    ice(255-s/2+Math.sin(t*2)*4,lv-s*.65,s,.92);
  }
  if(T>70){
    c.fillStyle='rgba(255,255,255,.6)';
    for(let i=0;i<10;i++){
      const ph=(t*.6*(1+(T-70)/30)+i*.37)%1;
      c.beginPath();c.arc(285+Math.sin(i*5)*62,430-ph*(430-lv),3+i%3*2,0,7);c.fill();
    }
  }
  c.restore();
  gp();c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=4;c.stroke();
  c.fillStyle='rgba(255,255,255,.28)';
  c.beginPath();c.moveTo(202,210);c.lineTo(222,210);c.lineTo(240,420);c.lineTo(228,420);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=3;
  c.beginPath();c.ellipse(290,200,100,12,0,0,7);c.stroke();
  if(T>70){
    c.fillStyle='rgba(255,255,255,.35)';
    for(let i=0;i<5;i++){
      const ph=(t*.4+i*.2)%1;
      c.beginPath();c.arc(260+i*18+Math.sin(t*2+i)*8,195-ph*90,8+ph*18,0,7);c.fill();
    }
  }
}
function kettle(){
  c.fillStyle=lg(170,0,400,0,['#8b95a5','#e8edf5','#7d8797']);
  c.beginPath();c.roundRect(175,320,220,110,[60,60,28,28]);c.fill();
  c.beginPath();
  c.moveTo(182,365);c.lineTo(128,300);c.lineTo(146,290);c.lineTo(210,340);c.closePath();c.fill();
  c.strokeStyle='#2b3340';c.lineWidth=15;c.lineCap='round';
  c.beginPath();c.arc(398,365,50,-1.25,1.25);c.stroke();
  c.fillStyle=lg(0,290,0,325,['#f1f5f9','#8b95a5']);
  c.beginPath();c.ellipse(285,322,70,26,0,Math.PI,0);c.fill();
  c.fillStyle='#dc2626';c.beginPath();c.arc(285,290,11,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.roundRect(195,340,18,80,9);c.fill();
  const amt=Math.min(1,.4+(T-100)/25);
  for(let i=0;i<16;i++){
    const ph=(t*.45+i/16)%1;
    c.fillStyle='rgba(255,255,255,'+((1-ph)*.65*amt)+')';
    c.beginPath();c.arc(135-ph*70+Math.sin(i*3+t*2)*14,292-ph*210,10+ph*36,0,7);c.fill();
  }
}
function sceneDraw(){
  c.fillStyle=lg(0,55,0,475,['#e6f6ff','#9fd3f2']);
  c.beginPath();c.roundRect(20,55,525,420,20);c.fill();
  table();
  if(state==0){
    c.fillStyle=lg(0,418,0,440,['#f1f5f9','#94a3b8']);
    c.beginPath();c.ellipse(285,428,190,16,0,0,7);c.fill();
    ice(170,330,100,.95);ice(285,330,100,.95);ice(228,228,100,.95);
    c.fillStyle='#fff';
    for(let i=0;i<8;i++){
      const a=.5+.5*Math.sin(t*3+i*2);
      c.globalAlpha=a;c.beginPath();c.arc(185+i*30,250+(i*53)%160,3,0,7);c.fill();
    }
    c.globalAlpha=1;
  }else{burner();state==1?glass():kettle()}
  if(labels){
    txt('Real Object: '+['Ice Cubes','Glass of Water','Kettle with Steam'][state],282,90,24,'#0b3a66','center');
  }
  if(target>T+.5)txt('Heating...',500,500-30,0,'#fff');
  c.font='42px sans-serif';c.textAlign='center';
  if(target>T+.5){c.fillText('🔥',505,110)}
  else if(target<T-.5){c.fillText('❄️',505,110)}
}
function thermo(){
  const x=588,top=110,bot=400,rb=18;
  c.fillStyle='#fff';
  c.beginPath();c.roundRect(x-9,top,18,bot-top+6,9);c.fill();
  c.beginPath();c.arc(x,bot+rb,rb+2,0,7);c.fill();
  const fy=v=>bot-Math.max(-30,Math.min(140,v)+30)/170*(bot-top);
  c.fillStyle=T<0?'#38bdf8':T<100?'#ef4444':'#f97316';
  c.beginPath();c.arc(x,bot+rb,rb-2,0,7);c.fill();
  c.fillRect(x-4,fy(T),8,bot-fy(T)+8);
  c.fillStyle='#fde047';
  [0,100].forEach(v=>{c.fillRect(x+9,fy(v)-1,12,3);txt(v+'°C',x+24,fy(v)+5,13,'#fde047')});
  txt(Math.round(T)+'°C',x,bot+2*rb+26,22,'#fff','center');
}
function boxDraw(){
  const col=INFO[state].col;
  c.fillStyle='rgba(255,255,255,.08)';
  c.beginPath();c.roundRect(BX,BY,BW,BH,16);c.fill();
  c.strokeStyle=col;c.lineWidth=4;c.stroke();
  if(state==0){
    c.strokeStyle='rgba(147,197,253,.55)';c.lineWidth=3;
    const cols=18;
    for(let i=0;i<N;i++){
      const p=P[i];
      if(i%cols<cols-1&&P[i+1]){c.beginPath();c.moveTo(p.x,p.y);c.lineTo(P[i+1].x,P[i+1].y);c.stroke()}
      if(P[i+cols]){c.beginPath();c.moveTo(p.x,p.y);c.lineTo(P[i+cols].x,P[i+cols].y);c.stroke()}
    }
  }
  for(const p of P)c.drawImage(SP[state],p.x-R,p.y-R,2*R,2*R);
  if(labels){
    txt('Particle View (Zoomed In)',BX+BW/2,70,24,'#fde68a','center');
    txt(INFO[state].n,BX+16,BY+34,26,col);
    txt('Each ball = one particle',BX+BW-14,BY+28,15,'#e2e8f0','right','normal');
    const phase=T>=-.5&&T<=.5?'Melting / Freezing point':T>=99.5&&T<=100.5?'Boiling / Condensing point':'';
    if(phase)txt(phase,BX+BW/2,BY+BH+22,17,'#fde047','center');
  }
}
function infoDraw(){
  c.fillStyle='rgba(255,255,255,.1)';
  c.beginPath();c.roundRect(20,492,1160,138,16);c.fill();
  const s=INFO[state];
  c.fillStyle=s.col;c.beginPath();c.roundRect(20,492,10,138,5);c.fill();
  txt(s.n,45,530,30,s.col);
  txt(['Cold: particles hold their places.','Warm: particles slide and flow.','Hot: particles fly everywhere.'][state],45,566,17,'#e2e8f0','left','normal');
  txt('Use the buttons below to heat or cool.',45,594,15,'#94a3b8','left','normal');
  if(labels)s.a.forEach((a,i)=>{
    const [k,v]=a.split(': ');
    const x=470+(i%2)*360,y=526+Math.floor(i/2)*38;
    txt(k+':',x,y,17,s.col);
    txt(v,x+(k.length*10+16),y,17,'#fff','left','normal');
  });
}
function draw(){
  c.fillStyle=lg(0,0,0,H,['#12275e','#0a1330']);c.fillRect(0,0,W,H);
  sceneDraw();thermo();boxDraw();infoDraw();
  if(paused)txt('PAUSED',W/2,H/2,60,'rgba(255,255,255,.4)','center');
}
let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(!paused){t+=dt;step(dt)}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- buttons ---------- */
const setN=n=>{N=Math.max(36,Math.min(180,n));mk(P.slice(0,N))};
const fsEl=document.getElementById('app');
const B=[
 ['❄ Solid','#2563eb',()=>target=-20],
 ['💧 Liquid','#0891b2',()=>target=25],
 ['☁ Gas','#e11d48',()=>target=125],
 ['🔥 Heat +','#ea580c',()=>target=Math.min(140,target+20)],
 ['🧊 Cool −','#0ea5e9',()=>target=Math.max(-30,target-20)],
 ['Melt','#16a34a',()=>target=10],
 ['Freeze','#6366f1',()=>target=-10],
 ['Boil','#dc2626',()=>target=115],
 ['Condense','#0d9488',()=>target=60],
 ['⏸ Pause','#7c3aed',function(){paused=!paused;this.textContent=paused?'▶ Play':'⏸ Pause'}],
 ['🐢 Slow','#ca8a04',()=>spd=Math.max(.25,spd/1.5)],
 ['🐇 Fast','#c026d3',()=>spd=Math.min(4,spd*1.5)],
 ['＋ Particles','#059669',()=>setN(N+18)],
 ['－ Particles','#b45309',()=>setN(N-18)],
 ['🏷 Labels','#db2777',()=>labels=!labels],
 ['↺ Reset','#475569',()=>{T=target=-15;state=0;spd=1;N=90;mk()}],
 ['⛶ Full Screen','#1d4ed8',()=>{document.fullscreenElement?document.exitFullscreen():fsEl.requestFullscreen()}]
];
const ctl=document.getElementById('ctl');
B.forEach(([n,col,fn])=>{
  const b=document.createElement('button');
  b.textContent=n;b.style.background=col;
  b.onclick=function(){fn.call(b)};
  if(n.includes('Full'))b.id='fs';
  ctl.appendChild(b);
});
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('fs').textContent=document.fullscreenElement?'⛶ Exit Full Screen':'⛶ Full Screen';
});
</script>
</body>
</html>
