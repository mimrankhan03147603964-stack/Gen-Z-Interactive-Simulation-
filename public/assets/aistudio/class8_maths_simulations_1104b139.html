<main><section id="stage"></section><aside><h2 id="ttl"></h2><p id="dsc"></p><div class="info" id="inf"></div><div id="ctl"></div></aside></main>
<script>
const $$=s=>document.querySelector(s),R=Math.round,PI=Math.PI;

const B=(t,c,m,...a)=>`<button class="${c.slice(1)}" style="background:${C[c[0]]}" onclick='g("${m}"${a.map(x=>","+JSON.stringify(x)).join('')})'>${t}</button>`;

const fac=n=>{const f=[];for(let p=2;n>1;p++)while(n%p==0){f.push(p);n/=p}return f};
const ps=(a,b,c)=>{let s='';[[a,'x²'],[b,'x'],[c,'']].forEach(([k,t])=>{if(!k)return;const ab=Math.abs(k),co=(ab==1&&t)?'':ab;s+=(s?(k<0?' − ':' + '):(k<0?'−':''))+co+t});return s||'0'};
const eq=(m,c)=>'y = '+(m?(m==1?'x':m==-1?'−x':m+'x')+(c?(c<0?' − ':' + ')+Math.abs(c):''):c);
let cur=0,S={};
const g=(m,...a)=>{if(acts[cur][m](...a)!==0)render()};
const anim=(k,st=.04)=>{const id=setInterval(()=>{if(acts[cur].n!=k){clearInterval(id);return}S.t=Math.min(1,S.t+st);if(S.t>=1){clearInterval(id);acts[cur].end&&acts[cur].end()}render()},40)};
const acts=[
/* 1 REAL NUMBERS */

i(){S={v:0,t:1,hl:-1,q:0,msg:''}},
pk(i){S.v=i;S.t=0;S.q=0;S.msg='';anim('Real Numbers',.06)},hl(l){S.hl=l},
qz(){S.q=1;S.v=rnd(0,13);S.t=1;S.msg='Which is the smallest set that holds this number?'},
an(l){const a=this.V[S.v][1];S.msg=l==a?'✔ Correct! It is a '+this.L[a].toLowerCase()+' number.':'✘ Not quite. Try again.';if(l==a){S.t=0;anim('Real Numbers',.06)}},
v(){const a=this.V[S.v][1],pos=[[235,255],[355,245],[455,235],[560,225],[760,235]][a],t=S.t,tx=450+(pos[0]-450)*t,ty=20+(pos[1]-20)*t;
 const E=[[330,225,290,160,'#dbeafe'],[300,235,210,120,'#bfdbfe'],[270,240,130,80,'#93c5fd'],[235,245,75,45,'#60a5fa']],lb=[[330,85,'Rational'],[300,135,'Integers'],[270,178,'Whole'],[235,222,'Natural']];
 let s=`<rect x="15" y="15" width="870" height="390" rx="30" fill="#eff6ff" stroke="#1e40af" stroke-width="4"/>`+T(450,42,22,'Real numbers','#1e3a8a');
 E.forEach((e,i)=>s+=`<ellipse cx="${e[0]}" cy="${e[1]}" rx="${e[2]}" ry="${e[3]}" fill="${e[4]}" stroke="${S.hl==3-i?'#f59e0b':'#1e40af'}" stroke-width="${S.hl==3-i?7:2}"/>`);
 lb.forEach(l=>s+=T(l[0],l[1],17,l[2],'#1e3a8a'));
 s+=`<ellipse cx="760" cy="215" rx="120" ry="150" fill="#fde68a" stroke="${S.hl==4?'#f59e0b':'#b45309'}" stroke-width="${S.hl==4?7:2}"/>`+T(760,95,17,'Irrational','#78350f');
 s+=`<rect x="${tx-38}" y="${ty-20}" width="76" height="38" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/>`+T(tx,ty+7,22,this.V[S.v][0],'#dc2626');
 const sets=a<4?this.L.slice(a,4).concat(['Real numbers']):['Irrational numbers','Real numbers'];
 return[svg(s),S.q?`<b>Quiz:</b> ${S.msg}`:`<b>${this.V[S.v][0]}</b> belongs to:<br>${sets.join('<br>')}`,
 this.V.map((q,i)=>B(q[0],'bgorpt'[i%6]+'s','pk',i)).join('')+'<div style="width:100%"></div>'+this.L.map((q,i)=>B('Show '+q.split(' ')[0],'bgopk'[i]+'s','hl',i)).join('')+B('Hide','ns','hl',-1)+B('🎯 Quiz me','r','qz')+(S.q?this.L.map((q,i)=>B(q.split(' ')[0],'bgopk'[i]+'s','an',i)).join(''):'')]}},
/* 2 CUBES */
{n:'Cubes',c:'o',t:'Cube and Cube Root 3D Blocks',d:'Stack layers of small cubes to build a big cube. The side length of the big cube is the cube root.',
i(){S={n:3,l:0}},ch(v){S.n=cl(S.n+v,1,6);S.l=0},ns(n){S.n=n;S.l=0},ad(v){S.l=cl(S.l+v,0,S.n)},all(){S.l=S.n},
v(){const{n,l}=S,s=Math.min(30,170/n),cw=s*.866,hh=s*.5,P=(a,b,c)=>[450+(a-b)*cw,215+(a+b)*hh-c*s-(n*hh)+n*hh*0].map(Math.round);let o='';
 for(let q=0;q<=2*n-2;q++)for(let k=0;k<l;k++)for(let i=0;i<n;i++){const j=q-i;if(j<0||j>=n)continue;const h=k*50+20,pl=(...p)=>p.map(z=>P(...z)).join(' ');
  o+=`<polygon points="${pl([i,j,k+1],[i+1,j,k+1],[i+1,j+1,k+1],[i,j+1,k+1])}" fill="hsl(${h},85%,65%)" stroke="#fff" stroke-width="1"/><polygon points="${pl([i+1,j,k],[i+1,j+1,k],[i+1,j+1,k+1],[i+1,j,k+1])}" fill="hsl(${h},80%,42%)" stroke="#fff" stroke-width="1"/><polygon points="${pl([i,j+1,k],[i+1,j+1,k],[i+1,j+1,k+1],[i,j+1,k+1])}" fill="hsl(${h},80%,52%)" stroke="#fff" stroke-width="1"/>`}

 let a=[],b=[];for(let x=0;x<=xm+1e-9;x+=.25){a.push(gx(x)+','+gy(SI(x)));b.push(gx(x)+','+gy(CI(x)))}
 if(a.length>1)s+=`<polygon points="${b.join(' ')} ${a.slice().reverse().join(' ')}" fill="#22c55e44"/><polyline points="${a.join(' ')}" fill="none" stroke="#2563eb" stroke-width="4"/><polyline points="${b.join(' ')}" fill="none" stroke="#dc2626" stroke-width="4"/>`;
 s+=`<circle cx="${gx(xm)}" cy="${gy(SI(xm))}" r="7" fill="#2563eb"/><circle cx="${gx(xm)}" cy="${gy(CI(xm))}" r="7" fill="#dc2626"/>`+T(370,386,16,'Years','#334155')+T(770,110,80,'🐷')+T(770,170,18,'Year '+rd(xm),'#334155')+T(770,215,18,'Simple: $'+R(SI(xm)),'#2563eb')+T(770,245,18,'Compound: $'+R(CI(xm)),'#dc2626')+T(770,285,40,'🪙'.repeat(Math.min(5,1+Math.floor(CI(xm)/p))));

 B('▶ Play','p','pl')+B('Money +1000','g','ch','p',1000)+B('Money −1000','r','ch','p',-1000)+B('Rate +1%','o','ch','r',1)+B('Rate −1%','b','ch','r',-1)+B('Years +1','t','ch','y',1)+B('Years −1','k','ch','y',-1)]}},
/* 4 POLYNOMIALS */
{n:'Polynomials',c:'p',t:'Polynomial Operations with Tiles',d:'Big square = x². Long bar = x. Small square = 1. Red-type tiles are negative. Add, subtract or multiply.',
i(){S={op:'add',P:[2,3,1],Q:[1,-2,3],M:[2,3,1,-2]}},op(o){S.op=o},
nw(){const r=()=>rnd(-3,4);S.P=[r(),r(),r()];S.Q=[r(),r(),r()];S.M=[rnd(1,3),rnd(-4,4)||1,rnd(1,3),rnd(-4,4)||2]},

v(){const{op,P,Q,M}=S;let s='',info;
 const row=(y,c,lb)=>{let o=T(20,y+22,17,lb,'#10243f',700,'start');[[2,130],[1,420],[0,710]].forEach(([d,x0])=>{const k=c[2-d],n=Math.abs(k),ng=k<0,w=d==2?32:d==1?32:12,hh=d==2?32:d==1?12:12,gp=d==2?34:d==1?34:14,col=d==2?(ng?'#ef4444':'#3b82f6'):d==1?(ng?'#f97316':'#22c55e'):(ng?'#a855f7':'#eab308');for(let i=0;i<n;i++)o+=`<rect x="${x0+i*gp}" y="${y+(32-hh)}" width="${w}" height="${hh}" rx="3" fill="${col}" stroke="#fff"/>`});return o};
 if(op!='mul'){const Rr=op=='add'?P.map((p,i)=>p+Q[i]):P.map((p,i)=>p-Q[i]);s=T(130,28,16,'x² tiles','#334155',700,'start')+T(420,28,16,'x tiles','#334155',700,'start')+T(710,28,16,'1 tiles','#334155',700,'start')+row(50,P,'P')+T(20,102,17,ps(...P),'#334155',600,'start')+row(135,Q,'Q')+T(20,187,17,ps(...Q),'#334155',600,'start')+`<line x1="20" x2="880" y1="215" y2="215" stroke="#334155" stroke-width="3"/>`+row(240,Rr,op=='add'?'P+Q':'P−Q')+T(20,300,20,ps(...Rr),'#7c3aed',700,'start');
  info=`P = ${ps(...P)}<br>Q = ${ps(...Q)}<br>${op=='add'?'P + Q':'P − Q'} = <b>${ps(...Rr)}</b><br>${op=='add'?'Add like tiles together.':'Subtract: change the signs of Q, then add like tiles.'}`}
 else{const[a,b,c,d]=M,wa=a*50,wb=Math.abs(b)*18,hc=c*50,hd=Math.abs(d)*18,ox=300,oy=90,cell=(x,y,w,h,col,lb,gx,gy)=>{let o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" stroke="#fff" stroke-width="3"/>`;for(let i=1;i<gx;i++)o+=`<line x1="${x+i*w/gx}" x2="${x+i*w/gx}" y1="${y}" y2="${y+h}" stroke="#fff9"/>`;for(let i=1;i<gy;i++)o+=`<line x1="${x}" x2="${x+w}" y1="${y+i*h/gy}" y2="${y+i*h/gy}" stroke="#fff9"/>`;return o+T(x+w/2,y+h/2+6,Math.min(18,w/3,h/1.5+4),lb,'#fff')};
  s=T(ox+wa/2,oy-12,20,a+'x','#1e3a8a')+T(ox+wa+wb/2,oy-12,20,b,'#1e3a8a')+T(ox-14,oy+hc/2+6,20,c+'x','#1e3a8a',700,'end')+T(ox-14,oy+hc+hd/2+6,20,d,'#1e3a8a',700,'end')+cell(ox,oy,wa,hc,'#3b82f6',a*c+'x²',a,c)+cell(ox+wa,oy,wb,hc,b*c>0?'#22c55e':'#f97316',b*c+'x',Math.abs(b),c)+cell(ox,oy+hc,wa,hd,a*d>0?'#22c55e':'#f97316',a*d+'x',a,Math.abs(d))+cell(ox+wa,oy+hc,wb,hd,b*d>0?'#eab308':'#a855f7',''+b*d,Math.abs(b),Math.abs(d));
  info=`(${ps(0,a,b)}) × (${ps(0,c,d)})<br>= ${a*c}x² + ${a*d}x + ${b*c}x + ${b*d}<br>= <b>${ps(a*c,a*d+b*c,b*d)}</b><br>Each box in the grid is one product.`}
 return[svg(s,'0 0 900 360'),info,B('Add','g','op','add')+B('Subtract','r','op','sub')+B('Multiply','b','op','mul')+B('New problem','k','nw')+(op=='mul'?['a','b','c','d'].map((q,i)=>B(q+' +','os','mm',i,1)+B(q+' −','ps','mm',i,-1)).join(''):'')]}},
/* 5 FACTORIZATION */
{n:'Factorization',c:'k',t:'Factorization of x² + bx + c',d:'Find p and q so that p + q = b and p × q = c. The area model shows the rectangle (x + p)(x + q).',
i(){this.nw()},nw(){S={tp:rnd(1,7),tq:rnd(1,7),p:1,q:1,x:'Choose p and q, then press Check.',sh:0}},
pq(k,v){S[k]=cl(S[k]+v,1,7)},ck(){const b=S.tp+S.tq,c=S.tp*S.tq;S.x=S.p+S.q==b&&S.p*S.q==c?'✔ Correct! Both rules match.':`✘ p+q = ${S.p+S.q} (need ${b}), p×q = ${S.p*S.q} (need ${c}).`},

 for(let i=1,r=0;i<=c;i++)if(c%i==0&&i<=c/i){s+=T(20,110+r*28,17,`${i} × ${c/i} → sum ${i+c/i}${i+c/i==b?' ✔':''}`,i+c/i==b?'#16a34a':'#475569',700,'start');r++}
 const cell=(x,y,w,h,col,lb,gx,gy)=>{let o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" stroke="#fff" stroke-width="3"/>`;for(let i=1;i<gx;i++)o+=`<line x1="${x+i*w/gx}" x2="${x+i*w/gx}" y1="${y}" y2="${y+h}" stroke="#fff9"/>`;for(let i=1;i<gy;i++)o+=`<line x1="${x}" x2="${x+w}" y1="${y+i*h/gy}" y2="${y+i*h/gy}" stroke="#fff9"/>`;return o+T(x+w/2,y+h/2+6,18,lb,'#fff')};
 s+=cell(ox,oy,X,X,'#3b82f6','x²',1,1)+cell(ox+X,oy,q*u,X,'#22c55e',q+'x',q,1)+cell(ox,oy+X,X,p*u,'#22c55e',p+'x',1,p)+cell(ox+X,oy+X,q*u,p*u,'#eab308',''+p*q,q,p)+T(ox+X/2,oy-10,20,'x')+T(ox+X+q*u/2,oy-10,20,q)+T(ox-14,oy+X/2+6,20,'x','#10243f',700,'end')+T(ox-14,oy+X+p*u/2+6,20,p,'#10243f',700,'end');

 B('p +1','g','pq','p',1)+B('p −1','r','pq','p',-1)+B('q +1','b','pq','q',1)+B('q −1','o','pq','q',-1)+B('Check','p','ck')+B('Show answer','a','sw')+B('New quadratic','k','nw')]}},

{n:'Equations',c:'t',t:'Simultaneous Equations: Graphical Solution',d:'Two roads cross where both equations are true. Plot both lines and find the crossing point.',

v(){const{m1,c1,m2,c2,s1,s2,sol}=S,X=q=>300+q*24,Y=q=>270-q*24;
