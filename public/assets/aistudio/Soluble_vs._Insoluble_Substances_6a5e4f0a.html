<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soluble vs. Insoluble Substances</title>
<style>
:root{--bg:#0b2a4a;--ink:#fff;--btn:#12358f;--btn2:#1d4fd8;--ok:#1e9b3a;--no:#d12b2b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Verdana,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;background:radial-gradient(ellipse at center,#14477a 0%,#071b31 100%)}
#view{perspective:1400px;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;width:100%}
#scene{position:relative;width:min(100%,calc((100vh - 84px)*1672/941));aspect-ratio:1672/941;transform-style:preserve-3d;transition:transform .15s ease-out;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.4)}
#scene img,#scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene img{user-select:none;-webkit-user-drag:none}
#bar{display:flex;gap:14px;flex:none}
button{font:700 18px "Segoe UI",Verdana,Arial,sans-serif;color:#fff;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid #ffe94a;outline-offset:3px}
#pour{background:linear-gradient(#2fbf4f,var(--ok))}
#reset{background:linear-gradient(#ee4a4a,var(--no))}
#full{background:linear-gradient(#3b71f0,var(--btn))}
</style></head><body>

  <canvas id="cv"></canvas>
 </div></div>
 <div id="bar">
  <button id="pour">Pour</button>
  <button id="reset">Reset</button>
  <button id="full">Full Screen</button>
 </div>
</div>
<script>
(function(){
var W=1672,H=941,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),scene=document.getElementById('scene');
var G=[
 {tx:195,ty:470,x0:90,x1:340,surf:545,bot:745,sol:1,c:[255,255,255]},
 {tx:625,ty:470,x0:505,x1:755,surf:545,bot:748,sol:1,c:[255,255,255]},
 {tx:1040,ty:485,x0:925,x1:1175,surf:548,bot:765,sol:0,c:[176,128,76]},
 {tx:1470,ty:490,x0:1340,x1:1590,surf:545,bot:765,sol:0,c:[245,247,252]}
];
var BW=4;
G.forEach(function(g){g.n=Math.ceil((g.x1-g.x0)/BW);g.h=new Float32Array(g.n);g.haze=0});
var P=[],pourT=0,last=performance.now(),dpr=1;
function R(a,b){return a+Math.random()*(b-a)}
function size(){dpr=Math.min(window.devicePixelRatio||1,2);var w=scene.clientWidth;cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr)}
function spawn(g){P.push({g:g,x:g.tx+R(-14,14),y:g.ty+R(-4,6),vx:R(-25,25),vy:R(80,170),r:R(1.6,3.8),age:0,life:R(2.2,3.6),ph:R(0,6.28)})}
function step(dt){
 if(pourT>0){pourT-=dt;G.forEach(function(g){var k=Math.round(110*dt+Math.random());for(var i=0;i<k;i++)spawn(g)})}
 for(var i=P.length-1;i>=0;i--){
  var p=P[i],g=p.g,inW=p.y>=g.surf;
  if(!inW){p.vy+=900*dt}
  else{
   var cap=g.sol?75:200;p.vy+=(g.sol?80:420)*dt;if(p.vy>cap)p.vy*=Math.pow(.02,dt);
   p.vx*=Math.pow(.15,dt);p.ph+=dt*4;
   if(g.sol){p.age+=dt;p.vx+=Math.sin(p.ph)*60*dt;p.r+=dt*.5}else{p.vx+=Math.sin(p.ph)*25*dt}
   if(p.x<g.x0+12)p.x=g.x0+12;if(p.x>g.x1-12)p.x=g.x1-12;
  }
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(g.sol&&(p.age>p.life||p.y>g.bot-6)){g.haze=Math.min(1,g.haze+.0035);P.splice(i,1);continue}
  if(!g.sol){
   var b=Math.max(0,Math.min(g.n-1,((p.x-g.x0)/BW)|0));
   if(p.y>=g.bot-g.h[b]-2){
    g.h[b]=Math.min(70,g.h[b]+p.r*.42);
    for(var s=0;s<3;s++)for(var d=-1;d<=1;d+=2){var j=b+d;if(j>=0&&j<g.n&&g.h[b]-g.h[j]>2.5){var m=(g.h[b]-g.h[j])/4;g.h[b]-=m;g.h[j]+=m}}
    P.splice(i,1)
   }
  }
 }
}
function draw(){
 var s=cv.width/W;ctx.setTransform(s,0,0,s,0,0);ctx.clearRect(0,0,W,H);
 G.forEach(function(g){
  if(g.sol&&g.haze>0){var gr=ctx.createLinearGradient(0,g.surf,0,g.bot);gr.addColorStop(0,'rgba(255,255,255,'+g.haze*.1+')');gr.addColorStop(1,'rgba(255,255,255,'+g.haze*.24+')');ctx.fillStyle=gr;ctx.fillRect(g.x0,g.surf,g.x1-g.x0,g.bot-g.surf)}
  if(!g.sol){
   var c=g.c,top=g.bot-70,gr2=ctx.createLinearGradient(0,top,0,g.bot);
   gr2.addColorStop(0,'rgb('+Math.min(255,c[0]+35)+','+Math.min(255,c[1]+35)+','+Math.min(255,c[2]+30)+')');gr2.addColorStop(1,'rgb('+(c[0]*.78|0)+','+(c[1]*.78|0)+','+(c[2]*.8|0)+')');
   ctx.beginPath();ctx.moveTo(g.x0,g.bot);
   for(var i=0;i<g.n;i++)ctx.lineTo(g.x0+i*BW,g.bot-g.h[i]);
   ctx.lineTo(g.x1,g.bot);ctx.closePath();ctx.fillStyle=gr2;ctx.fill();
   ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.2;ctx.beginPath();for(i=0;i<g.n;i++){var yy=g.bot-g.h[i];i?ctx.lineTo(g.x0+i*BW,yy):ctx.moveTo(g.x0,yy)}ctx.stroke()
  }
 });
 for(var i=0;i<P.length;i++){
  var p=P[i],g=p.g,a=g.sol&&p.y>=g.surf?Math.max(0,1-p.age/p.life):1,r=p.r*(g.sol&&p.y>=g.surf?(1-.55*p.age/p.life):1),c=g.c;
  if(a<=0)continue;
  ctx.globalAlpha=a*(g.sol?.9:1);
  ctx.fillStyle='rgb('+(c[0]*.8|0)+','+(c[1]*.8|0)+','+(c[2]*.85|0)+')';
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.fill();
  ctx.fillStyle='rgb('+Math.min(255,c[0]+40)+','+Math.min(255,c[1]+40)+','+Math.min(255,c[2]+40)+')';
  ctx.beginPath();ctx.arc(p.x-r*.25,p.y-r*.3,r*.6,0,6.283);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function loop(t){var dt=Math.min(.05,(t-last)/1000);last=t;step(dt);draw();requestAnimationFrame(loop)}
document.getElementById('pour').onclick=function(){pourT=6};
document.getElementById('reset').onclick=function(){P.length=0;pourT=0;G.forEach(function(g){g.h.fill(0);g.haze=0})};
var full=document.getElementById('full'),app=document.getElementById('app');
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
full.onclick=function(){
 if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
 else{var f=app.requestFullscreen||app.webkitRequestFullscreen;if(f){try{var r=f.call(app);if(r&&r.catch)r.catch(function(){})}catch(e){}}}
};
function fsChange(){full.textContent=isFs()?'Exit Full Screen':'Full Screen';setTimeout(size,60)}
document.addEventListener('fullscreenchange',fsChange);document.addEventListener('webkitfullscreenchange',fsChange);
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
 document.getElementById('view').addEventListener('mousemove',function(e){
  var r=scene.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  scene.style.transform='rotateY('+(x*7).toFixed(2)+'deg) rotateX('+(-y*5).toFixed(2)+'deg)'});
 document.getElementById('view').addEventListener('mouseleave',function(){scene.style.transform=''});
}
window.addEventListener('resize',size);size();requestAnimationFrame(loop);
})();
</script></body></html>
