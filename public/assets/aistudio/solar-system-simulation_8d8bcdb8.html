</section>

 document.querySelectorAll('.card').forEach(k=>{k.onmousemove=ev=>{const r=k.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;k.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(10px)`};k.onmouseleave=()=>k.style.transform=''});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on')});

/* ---------- CONTROLS ---------- */
[[-1,'🌌 Solar System','#6a4cff'],...P.map((p,i)=>[i,(p.sun?'☀️ ':'')+p.n,p.col])].forEach(([i,n,col])=>{const b=document.createElement('button');b.className='b';b.style.setProperty('--c',col);b.textContent=n;b.dataset.i=i;b.onclick=()=>select(i);$('pl').append(b)});
const TG=[['rot','Rotation','#ff9f1c'],['rev','Revolution','#1592e6'],['orbit','Orbit Paths','#2a9d8f'],['axis','Axis & Equator','#e63946'],['labels','Labels','#8338ec'],['dn','Day & Night','#e8590c'],['ang','Tilt Angle','#d6336c']];
TG.forEach(([k,n,col])=>{const b=document.createElement('button');b.className='b';b.style.setProperty('--c',col);b.dataset.k=k;b.dataset.n=n;b.onclick=()=>{S[k]=!S[k];S.ev=n+(S[k]?' turned ON':' turned OFF');sync()};$('tg').append(b)});
function sync(){document.querySelectorAll('[data-k]').forEach(b=>{const on=S[b.dataset.k];b.classList.toggle('off',!on);b.textContent=(on?'✔ ':'✖ ')+b.dataset.n});
 document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===S.sel));
 $('pp').textContent=S.play?'⏸ Pause':'▶ Play';$('sp').value=S.v;$('tl').value=S.tilt*100;$('zm').value=S.zoom*100}
$('sp').oninput=e=>{S.v=+e.target.value;S.ev='Speed changed'};
$('tl').oninput=e=>{S.tilt=e.target.value/100;S.ev='Camera tilt changed'};
$('zm').oninput=e=>{S.zoom=e.target.value/100;S.ev='Zoom changed'};
function select(i){S.sel=i;if(i>=0){S.fi=i;S.b=Math.min(S.b,.3);S.tb=1;S.ev='Zoomed in on '+P[i].n}else{S.tb=0;S.ev='Back to the whole Solar System'}build();sync()}
function A(n){
 if(n=='play'){S.play=!S.play;S.ev=S.play?'Simulation is playing':'Simulation is paused'}
 else if(n=='slow'){S.v=Math.max(1,S.v-4);S.ev='Slower speed'}
 else if(n=='fast'){S.v=Math.min(100,S.v+6);S.ev='Faster speed'}
 else if(n=='reset'){Object.assign(S,{play:1,v:5,rot:1,rev:1,orbit:1,axis:1,labels:1,dn:1,ang:0,tilt:.5,zoom:1});P.forEach((p,i)=>{p.th=i*.9;p.rf=0});select(-1);S.ev='Simulation was reset'}
 else if(n=='top'){S.tilt=.95;S.ev='Top View: looking down from above'}
 else if(n=='ang'){S.tilt=.5;S.ev='Angle View'}
 else if(n=='side'){S.tilt=.15;S.ev='Side View: looking from the side'}
 else if(n=='fs'){document.fullscreenElement?document.exitFullscreen():$('sim').requestFullscreen();S.ev='Full Screen button pressed'}
 sync()}
document.onfullscreenchange=()=>{$('fsb').textContent=document.fullscreenElement?'⛶ Exit Full Screen':'⛶ Full Screen'};
cv.onclick=e=>{const i=hitAt(e);if(i>=0&&i!==S.sel)select(i)};
cv.onmousemove=e=>{const i=hitAt(e);S.hover=i;cv.style.cursor=i>=0&&i!==S.sel?'pointer':'default'};
cv.onmouseleave=()=>S.hover=-1;
function hitAt(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=-1,bd=1e9;hits.forEach(h=>{const d=Math.hypot(h.x-x,h.y-y);if(d<h.r&&d<bd){bd=d;best=h.i}});return best}

/* ---------- DRAWING ---------- */
const ST=Array.from({length:170},()=>[Math.random(),Math.random(),['#fff','#bfe3ff','#ffe9a6','#ffc2e0'][Math.random()*4|0],Math.random()*6,Math.random()*1.6+.6]);
function poly(pts,r,rot,col){c.beginPath();for(let i=0;i<pts.length;i+=2){const lo=pts[i]*Math.PI/180+rot,la=pts[i+1]*Math.PI/180;let x=Math.cos(la)*Math.sin(lo),y=-Math.sin(la);const z=Math.cos(la)*Math.cos(lo);if(z<0){const m=Math.hypot(x,y)||1;x/=m;y/=m}i?c.lineTo(x*r,y*r):c.moveTo(x*r,y*r)}c.closePath();c.fillStyle=col;c.fill()}
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function lab(t,x,y,col,sz=14){const f=sz*K;c.font='600 '+f+'px Fredoka,Arial,sans-serif';const w=c.measureText(t).width+16*K,h=f+10*K;x=Math.max(w/2+4,Math.min(W-w/2-4,x));y=Math.max(h/2+4,Math.min(H-h/2-4,y));c.fillStyle='rgba(5,8,40,.88)';c.strokeStyle=col;c.lineWidth=2.5;rr(x-w/2,y-h/2,w,h,h/2);c.fill();c.stroke();c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y+1)}
function ring(p,r,f){const a0=f?0:Math.PI,a1=f?Math.PI:PI2;p.ring.forEach(q=>{c.strokeStyle=q[2];c.lineWidth=Math.max(1.5,q[1]*r);c.beginPath();c.ellipse(0,0,q[0]*r,q[0]*r*.28,0,a0,a1);c.stroke()})}
function spots(p,r,rot){(p.sp||[]).forEach(s=>{const lo=s[0]*Math.PI/180+rot,la=s[1]*Math.PI/180,z=Math.cos(la)*Math.cos(lo);if(z<.05)return;c.fillStyle=s[3];c.beginPath();c.ellipse(Math.cos(la)*Math.sin(lo)*r,-Math.sin(la)*r,s[2]*r*z+.5,s[2]*r*(s[4]||1),0,0,PI2);c.fill()})}
function body(p,x,y,r,ux,uy,big){
 const rot=p.rf*PI2,a=p.t*Math.PI/180;let g;
 if(p.sun){c.save();c.translate(x,y);g=c.createRadialGradient(0,0,r*.8,0,0,r*2.8);g.addColorStop(0,'rgba(255,190,40,.65)');g.addColorStop(1,'rgba(255,140,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r*2.8,0,PI2);c.fill();
  c.save();c.rotate(TT*.08);c.lineCap='round';for(let i=0;i<32;i++){c.rotate(PI2/32);const L=i%2?1.45:1.85,q=.75+.25*Math.sin(TT*3+i);c.strokeStyle=i%2?'rgba(255,225,90,.85)':'rgba(255,170,30,.9)';c.lineWidth=Math.max(1.5,(i%2?2.5:3.5)*K*Math.min(1,r/38));c.beginPath();c.moveTo(0,-r*1.12);c.lineTo(0,-r*(1.12+(L-1.12)*q));c.stroke()}c.restore();
  c.save();c.beginPath();c.arc(0,0,r,0,PI2);c.clip();g=c.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,p.c[0]);g.addColorStop(.5,'#ffd000');g.addColorStop(1,p.c[1]);c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);spots(p,r,rot);c.restore();c.restore();return}
 c.save();c.translate(x,y);g=c.createRadialGradient(0,0,r*.9,0,0,r*1.4);g.addColorStop(0,p.g);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r*1.4,0,PI2);c.fill();
 c.rotate(-a);if(p.ring)ring(p,r,0);
 c.save();c.beginPath();c.arc(0,0,r,0,PI2);c.clip();
 if(p.bd){const n=p.bd.length,h=2*r/n;p.bd.forEach((col,i)=>{c.fillStyle=col;c.fillRect(-r,-r+i*h,2*r,h+1)})}
 else{g=c.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,p.c[0]);g.addColorStop(1,p.c[1]);c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r)}
 if(p.land)LAND.forEach(l=>poly(l[0],r,rot,l[1]));
 spots(p,r,rot);
 if(p.cap){c.fillStyle='#fff';[-1,1].forEach(q=>{c.beginPath();c.ellipse(0,q*r*.93,r*.4,r*.16,0,0,PI2);c.fill()})}
 g=c.createRadialGradient(-r*.25,-r*.25,r*.3,0,0,r);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.4)');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);
 c.restore();
 if(big&&S.axis){c.strokeStyle='#fff200';c.lineWidth=2.5*K;c.setLineDash([6*K,4*K]);c.beginPath();c.ellipse(0,0,r,r*.22,0,0,Math.PI);c.stroke();c.setLineDash([]);
  c.strokeStyle='#ff2d2d';c.lineWidth=4*K;c.beginPath();c.moveTo(0,-r*1.7);c.lineTo(0,r*1.7);c.stroke();c.fillStyle='#ff2d2d';[-1,1].forEach(q=>{c.beginPath();c.arc(0,q*r*1.7,5*K,0,PI2);c.fill()})}
 if(p.ring)ring(p,r,1);
 c.restore();
 if(S.dn){const m=Math.hypot(ux,uy)||1;ux/=m;uy/=m;c.save();c.translate(x,y);c.beginPath();c.arc(0,0,r,0,PI2);c.clip();g=c.createLinearGradient(ux*r,uy*r,-ux*r,-uy*r);g.addColorStop(0,'rgba(255,240,150,.2)');g.addColorStop(.42,'rgba(0,0,30,0)');g.addColorStop(.58,'rgba(0,0,40,.55)');g.addColorStop(1,'rgba(0,0,25,.9)');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);c.restore()}}
function detail(p,x,y,r,ux,uy){
 const a=p.t*Math.PI/180,sT=Math.sin(a),cT=Math.cos(a),m=Math.hypot(ux,uy)||1;ux/=m;uy/=m;
 if(S.ang&&!p.sun){c.save();c.strokeStyle='#fff';c.lineWidth=2*K;c.setLineDash([5*K,5*K]);c.beginPath();c.moveTo(x,y);c.lineTo(x,y-r*2);c.stroke();c.setLineDash([]);c.strokeStyle='#ffe44d';c.lineWidth=3*K;c.beginPath();c.arc(x,y,r*1.25,-Math.PI/2-a,-Math.PI/2);c.stroke();c.restore();lab(p.tx+' tilt',x-r*1.6,y-r*1.45,'#ffe44d')}
 if(!S.labels)return;
 if(!p.sun){lab('North Pole',x-sT*r*2,y-cT*r*2,'#ff6b6b');lab('South Pole',x+sT*r*2,y+cT*r*2,'#ff6b6b');if(S.axis)lab('Equator',x+r*1.25,y+r*.5,'#fff200',12);
  lab('☀ Day side',x+ux*r*1.55,y+uy*r*1.55,'#ffd60a',12);lab('🌙 Night side',x-ux*r*1.55,y-uy*r*1.55,'#9aa5ff',12);if(p.ring)lab('Rings',x+r*2.15,y-r*.2,p.oc,12)}
 lab(p.n+(S.rot&&S.play?' (spinning)':''),x,y+r*1.95,p.oc,17)}
const spin=p=>Math.sign(p.H)*Math.max(.12,Math.min(2.5,24/Math.abs(p.H)))*.25;
function draw(){
 K=Math.max(.85,Math.min(W/1000,H/560));const z=S.zoom,tl=S.tilt,b=S.b,ez=b*b*(3-2*b);hits=[];
 c.clearRect(0,0,W,H);
 ST.forEach(s=>{c.globalAlpha=.45+.55*Math.abs(Math.sin(TT*1.5+s[3]));c.fillStyle=s[2];c.fillRect(s[0]*W,s[1]*H,s[4]*K,s[4]*K)});c.globalAlpha=1;
 const sc0=Math.min(W/2-56,(H/2-40)/tl)/650*z,fp=P[S.fi],scF=Math.min(H*.19,W*.18)*z/fp.R,sc=Math.exp(Math.log(sc0)*(1-ez)+Math.log(scF)*ez);
 const camx=fp.o*Math.cos(fp.th)*ez,camy=-fp.o*Math.sin(fp.th)*ez,cx=W/2,cy=H/2+4-ez*H*.06;
 const pos=p=>[cx+(p.o*Math.cos(p.th)-camx)*sc,cy+(-p.o*Math.sin(p.th)-camy)*sc*tl];
 const sp0=pos(P[0]);
 if(S.orbit)P.forEach(p=>{if(!p.o)return;c.strokeStyle=p.oc;c.globalAlpha=.6;c.lineWidth=2*K;c.beginPath();c.ellipse(cx-camx*sc,cy-camy*sc*tl,p.o*sc,p.o*sc*tl,0,0,PI2);c.stroke()});c.globalAlpha=1;
 const L=P.map((p,i)=>{const [x,y]=pos(p);return{p,i,x,y,r:Math.max(p.R*sc,7*K),w:-p.o*Math.sin(p.th)}}).sort((a,b)=>a.w-b.w);
 L.forEach(o=>{const{p,i,x,y,r}=o;if(x<-r*3||x>W+r*3||y<-r*3||y>H+r*3)return;
  const big=i===S.fi&&b>.85&&S.tb==1;body(p,x,y,r,sp0[0]-x,sp0[1]-y,big);
  if(b<.5)hits.push({i,x,y,r:Math.max(r*(p.ring?2:1.1),13)});
  if(b<.5&&S.hover===i){c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(x,y,r*(p.ring?1.3:1.25)+4,0,PI2);c.stroke()}
  if(big)detail(p,x,y,r,sp0[0]-x,sp0[1]-y);
  if(b<.35&&S.labels)o.lab=1});
 if(S.labels&&b<.35){c.globalAlpha=1-b*2.5;L.forEach(o=>{if(o.lab)lab(o.p.n,o.x,o.y+o.r*(o.p.ring?1.5:1)+(o.p.sun?0:12*K)+8*K,o.p.oc,12)});c.globalAlpha=1}
 if(b<.3){c.globalAlpha=1-b*3;lab('Click any planet to zoom in  •  Sizes and distances are not to scale',W/2,H-20*K,'#4cc9f0',13);c.globalAlpha=1}
 if(b>.6){c.globalAlpha=(b-.6)/.4;const ot=P.map((p,i)=>i).filter(i=>i!==S.fi),n=ot.length,y0=H-40*K;
  c.fillStyle='rgba(255,255,255,.07)';rr(10,y0-28*K,W-20,70*K,16*K);c.fill();
  if(S.labels)lab('Other planets are still spinning. Click one to zoom in.',W/2,y0-46*K,'#4cc9f0',12);
  ot.forEach((i,k)=>{const x0=W*(k+1)/(n+1),q=P[i];body(q,x0,y0,15*K,-.9,-.4,false);lab(q.n,x0,y0+27*K,q.oc,11);hits.push({i,x:x0,y:y0,r:32*K})});c.globalAlpha=1}}
let hl='';
function hud(){const i=S.sel,p=P[i];let r;
 if(i<0)r=[['Planets','8'],['Star','1 (the Sun)'],['Closest planet','Mercury'],['Farthest planet','Neptune'],['View','Whole Solar System']];
 else{const sp=Math.round(((p.rf%1)+1)%1*360),orb=p.T?Math.round((((p.th%PI2)+PI2)%PI2)/PI2*100)+'%':'—';
  r=[['Name',p.n],['Day (1 spin)',p.day],['Year (1 orbit)',p.sun?'Not a planet':p.yr],['Spin now',sp+'° of 360°'],['Orbit done',orb]]}
 const h=r.map(x=>`<span>${x[0]}</span><b>${x[1]}</b>`).join('');if(h!==hl){$('hud').innerHTML=h;hl=h}}
let lt='';
function status(){const i=S.sel,p=P[i],m=[];
 if(!S.play)m.push('Simulation is PAUSED');else if(i<0){m.push(S.rot?'All planets are ROTATING on their own axes':'Rotation is OFF');m.push(S.rev?'All planets are REVOLVING around the Sun':'Revolution is OFF')}
 else{m.push(S.rot?p.n+' is ROTATING: one spin = '+p.day:'Rotation is OFF');if(!p.sun)m.push(S.rev?p.n+' is REVOLVING around the Sun: one trip = '+p.yr:'Revolution is OFF');m.push('Other planets keep spinning in the bottom bar')}
 m.push(S.dn?'The Sun lights one half of each planet: DAY on the bright side, NIGHT on the dark side':'Day and Night shading is OFF');m.push('Speed: '+(S.v/5).toFixed(1)+'x');
 const t='LAST ACTION: '+S.ev+'   ◆   '+(i<0?'Viewing: Solar System':'Focus: '+p.n)+'   ◆   '+m.join('   ◆   ');if(t!==lt){$('tkt').textContent=t;lt=t}}
let last=0;
function loop(t){const dt=Math.min((t-last)/1000||0,.1);last=t;TT=t/1000;
 if(S.play){const sm=S.v/5;P.forEach(p=>{if(S.rot)p.rf=(p.rf+dt*sm*spin(p))%1;if(S.rev&&p.T)p.th+=dt*sm*PI2/(6*Math.sqrt(p.T/88))})}
 S.b+=(S.tb-S.b)*(1-Math.exp(-dt*5));if(Math.abs(S.tb-S.b)<.002)S.b=S.tb;
 draw();hud();status();requestAnimationFrame(loop)}
build();sync();requestAnimationFrame(loop);
</script></body></html>
