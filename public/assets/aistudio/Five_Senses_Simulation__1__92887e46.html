*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif}
#app{display:flex;height:100vh;background:linear-gradient(135deg,#e3eeff,#fbe8ff)}
#sw{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;background:#fff;border-radius:30px;box-shadow:0 10px 40px rgba(80,40,160,.3)}
.c{position:absolute;background:var(--img) no-repeat;background-size:1536px 1024px}
#fx{position:absolute;left:0;top:0;width:1536px;height:1024px;z-index:6;pointer-events:none}
.g{opacity:0;transition:opacity .4s}.g.on{opacity:1}
.ln{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:6 22;animation:dsh .5s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-28}}
.rg{fill:none;stroke-width:8;transform-box:fill-box;transform-origin:center;animation:rg 1s ease-out infinite}
@keyframes rg{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.fly{position:absolute;z-index:9;font-size:100px;width:100px;height:100px;line-height:100px;text-align:center;pointer-events:none}
#brain{position:absolute;left:728;z-index:9;font-size:80px;opacity:0;pointer-events:none}
.act{animation:var(--an);filter:drop-shadow(0 0 22px var(--col))}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes wig{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-2.5deg) scale(1.06)}75%{transform:rotate(2.5deg) scale(1.06)}}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.5deg) scale(1.01)}70%{transform:rotate(1.5deg) scale(1.01)}}
.nod{transform-origin:50% 100%;animation:nod .6s 4}
.hand{-webkit-mask-image:radial-gradient(ellipse at 50% 55%,#000 52%,transparent 74%);mask-image:radial-gradient(ellipse at 50% 55%,#000 52%,transparent 74%);transform-origin:50% 92%}
.wave{animation:wv .5s ease-in-out infinite}
@keyframes wv{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
.pupil{position:absolute;left:199px;top:168px;width:54px;height:54px;border-radius:50%;background:#000;transition:transform 1s}
#side{width:clamp(340px,26vw,480px);padding:14px;overflow:auto;background:rgba(255,255,255,.75);display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:1.6rem;color:#5b1aa0;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px}
.b{border:0;border-radius:14px;padding:10px 12px;font:700 1rem system-ui,Arial;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);flex:1 1 auto}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.b:disabled{opacity:.45}
.b.sel{outline:4px solid #222}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#oname{font-size:1.35rem;font-weight:800}
#info{margin:6px 0 0;font-size:1rem;line-height:1.4;color:#333}
#msg{min-height:5rem;font-size:1.05rem;font-weight:700;color:#0a6b2d;background:#eaffef;border-radius:14px;padding:10px}
.lab{font-size:13px;font-weight:800;color:#666;margin:2px 0}
#q{font-size:1.2rem;font-weight:800;color:#222;margin-bottom:8px}
html{font-size:clamp(14px,1.05vw,19px)}body{min-width:1000px;overflow:hidden}
</style></head><body>
<div id="app">
 <div id="sw"><div id="stage"><svg id="fx" viewBox="0 0 1536 1024"></svg><div id="brain">🧠</div></div></div>
 <div id="side">
  <h1>Five Senses Lab</h1>
  <div class="lab">1. CHOOSE A SENSE</div>
  <div class="row" id="tabs"></div>
  <div class="card"><div id="learn">
   <div id="oname">Choose a sense</div><p id="info">Tap a button above to meet a sense and its sensory organ.</p>
   <div class="lab">2. TRY SOMETHING</div><div class="row" id="stims"></div></div>
   <div id="quiz" hidden><div id="q"></div><div class="row" id="opts"></div><div class="lab" id="sc"></div></div>
  </div>
  <div class="lab" style="text-align:center">Keyboard: 1-5 = senses, Space = Play All, F = Full Screen</div><div id="msg">Tap a sense, then tap a button to see how it works.</div>
  <div class="row">
   <button class="b" style="background:#7a2bd6" id="bAll">Play All Senses</button>
   <button class="b" style="background:#555" id="bStop">Stop</button>
   <button class="b" style="background:#e0197d" id="bQuiz">Start Quiz</button>
   <button class="b" style="background:#0a8f6a" id="bSnd">Sound: On</button>
   <button class="b" style="background:#1e6bff" id="bFs">Full Screen</button>
  </div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s),wait=t=>new Promise(r=>setTimeout(r,t)),rnd=a=>a[Math.floor(Math.random()*a.length)];
const parts={title:[90,8,1362,100,2],boy:[410,105,715,919,1],sight:[25,125,458,335,3],hearing:[1063,128,458,340,3],smell:[25,488,390,335,3],taste:[1133,503,390,380,3],touch:[558,738,445,280,4]};
const st=$('#stage'),P={};
for(const k in parts){const[x,y,w,h,z]=parts[k],d=document.createElement('div');d.className='c';d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-position:-${x}px -${y}px;z-index:${z}`;st.appendChild(d);P[k]=d}
const hand=document.createElement('div');hand.className='c hand';hand.style.cssText='left:60px;top:350px;width:265px;height:285px;background-position:-470px -455px';P.boy.appendChild(hand);
const pupil=document.createElement('div');pupil.className='pupil';P.sight.appendChild(pupil);
const S={
sight:{n:'Sight',o:'Eyes',c:'#1e6bff',an:'pop .8s infinite',f:'We see with our EYES. Light enters the eye, and the eye sends a message to the brain.',s:[['☀️','Bright Sun','Bright light! The pupil becomes SMALL to protect the eye.',.55],['🌙','Dark Night','It is dark! The pupil becomes BIG to let in more light.',1.6],['🌈','Rainbow','Wow! Our eyes can see many beautiful colours.',1],['🍎','Red Apple','The eyes see a round, red apple.',1]]},
hearing:{n:'Hearing',o:'Ears',c:'#1fa83a',an:'shk .25s infinite',f:'We hear with our EARS. Sound travels as waves into the ear, and the ear tells the brain what it heard.',s:[['🔔','Bell','Ding ding! Sound waves enter the ear.',[[880,.9],[1320,.9,'sine',.08,.05]]],['🥁','Drum','Boom boom! Big vibrations make loud sounds.',[[110,.3,'triangle',.4],[110,.3,'triangle',.4,.3]]],['🐦','Bird','Tweet tweet! Ears can hear soft, high sounds too.',[[2000,.12],[2500,.12,'sine',.12,.16],[2000,.12,'sine',.12,.32]]],['🚗','Horn','Beep beep! Very loud sounds can hurt our ears. Keep them safe!',[[300,.5,'square',.08]]]]},
smell:{n:'Smell',o:'Nose',c:'#8a1fc9',an:'pop .5s infinite',f:'We smell with our NOSE. Tiny smell particles in the air go inside the nose, and the nose tells the brain.',s:[['🌸','Flower','What a sweet smell! Tiny particles go into the nose.'],['🍕','Pizza','Yummy! Food smells make us feel hungry.'],['🍋','Lemon','A fresh, sharp smell!'],['🔥','Smoke','Smoke smells bad. The nose warns us of danger!']]},
taste:{n:'Taste',o:'Tongue',c:'#ff7a00',an:'wig .4s infinite',f:'We taste with our TONGUE. The tongue can taste sweet, sour, salty and bitter foods.',s:[['🍬','Sweet','Sweet! The tongue loves sugar.'],['🍋','Sour','Sour! The face makes a funny shape.'],['🧂','Salty','Salty! Too much salt is not good for us.'],['☕','Bitter','Bitter! Many medicines taste bitter.']]},
touch:{n:'Touch',o:'Skin',c:'#e0197d',an:'hop .45s infinite',f:'We feel with our SKIN. Skin can feel hot, cold, soft, hard and sharp things.',s:[['🔥','Hot','Ouch, hot! The skin tells us to pull our hand away.'],['🧊','Cold','Brrr! Ice feels cold on the skin.'],['🧸','Soft','Soft and cuddly! The skin feels softness.'],['🌵','Sharp','Ouch! Sharp things can hurt. Be careful!']]}};
const K=Object.keys(S);
const A={sight:{l:[480,295,690,325],r:[[700,325],[825,322]]},hearing:{l:[1066,300,945,365],r:[[925,385]]},smell:{l:[410,520,745,388],r:[[765,372]]},taste:{l:[1135,555,825,455],r:[[765,440]]},touch:{l:[640,745,598,640],r:[[590,590]]}};
const SRC={sight:[250,925],smell:[110,925],hearing:[1400,960],taste:[1290,960],touch:[1190,960]};
const fx=$('#fx');
fx.innerHTML=K.map(k=>{const a=A[k],c=S[k].c;return `<g class="g" id="g_${k}"><path class="ln" stroke="${c}" d="M${a.l[0]} ${a.l[1]}L${a.l[2]} ${a.l[3]}"/>`+a.r.map(p=>`<circle class="rg" stroke="${c}" cx="${p[0]}" cy="${p[1]}" r="48"/>`).join('')+`</g>`}).join('');
let AC,snd=1,cur=null,run=0,qm=0;const T={};
function tone(f,t=.3,ty='sine',v=.15,d=0){if(!snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+t)}catch(e){}}
const say=t=>$('#msg').textContent=t;
function react(k,s){
 const el=P[k],c=S[k].c;el.style.setProperty('--an',S[k].an);el.style.setProperty('--col',c);el.classList.add('act');
 $('#g_'+k).classList.add('on');
 if(k==='sight')pupil.style.transform=`scale(${s[3]})`;
 if(k==='touch')hand.classList.add('wave');
 P.boy.classList.remove('nod');void P.boy.offsetWidth;P.boy.classList.add('nod');
 (Array.isArray(s[3])?s[3]:[[450+Math.random()*400,.18,'sine',.1]]).forEach(n=>tone(...n));
 const br=$('#brain'),o=A[k].r[0];br.style.left='728px';br.style.top='60px';
 br.animate([{opacity:0,transform:`translate(${o[0]-728}px,${o[1]-60}px) scale(.3)`},{opacity:1,transform:'scale(1.2)',offset:.6},{opacity:1,transform:'scale(1)',offset:.85},{opacity:0,transform:'scale(1)'}],{duration:2200});
 say(s[1]+': '+s[2]+' The signal goes to the brain!');
 clearTimeout(T[k]);T[k]=setTimeout(()=>{el.classList.remove('act');$('#g_'+k).classList.remove('on');hand.classList.remove('wave');if(k==='sight')pupil.style.transform='scale(1)'},3300);
}
function fly(k,s){
 const[sx,sy]=SRC[k],t=A[k].r[0],dx=t[0]-sx,dy=t[1]-sy,e=document.createElement('div');
 e.className='fly';e.textContent=s[0];e.style.left=sx-50+'px';e.style.top=sy-50+'px';st.appendChild(e);
 say('Look! '+s[1]+' is coming...');
 const a=e.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1.4)',opacity:1,offset:.25},{transform:'scale(1.4)',offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.45)`,opacity:1,offset:.9},{transform:`translate(${dx}px,${dy}px) scale(.1)`,opacity:0}],{duration:2000});
 return a.finished.then(()=>{e.remove();react(k,s)});
}
function sel(k){
 cur=k;qm=0;$('#quiz').hidden=true;$('#learn').hidden=false;
 document.querySelectorAll('#tabs .b').forEach(b=>b.classList.toggle('sel',b.dataset.k===k));
 $('#oname').innerHTML=`<span style="color:${S[k].c}">${S[k].n} → ${S[k].o}</span>`;$('#info').textContent=S[k].f;
 const sb=$('#stims');sb.innerHTML='';
 S[k].s.forEach(s=>{const b=document.createElement('button');b.className='b';b.style.background=S[k].c;b.textContent=s[0]+' '+s[1];b.onclick=()=>{run++;fly(k,s)};sb.appendChild(b)});
 const el=P[k];el.style.setProperty('--an',S[k].an);el.style.setProperty('--col',S[k].c);el.classList.add('act');clearTimeout(T[k]);T[k]=setTimeout(()=>el.classList.remove('act'),1100);
 say(S[k].n+' uses the '+S[k].o+'. Tap a button below to try it!');
}
K.forEach(k=>{const b=document.createElement('button');b.className='b';b.dataset.k=k;b.style.background=S[k].c;b.textContent=S[k].n;b.onclick=()=>{run++;sel(k)};$('#tabs').appendChild(b)});
$('#bAll').onclick=async()=>{const id=++run;for(const k of K){if(id!==run)return;sel(k);await wait(1100);if(id!==run)return;await fly(k,rnd(S[k].s));await wait(3400)}if(id===run)say('Great job! You met all five senses and their organs.')};
$('#bStop').onclick=()=>{run++;say('Stopped. Choose a sense to continue.')};
$('#bSnd').onclick=e=>{snd=!snd;e.target.textContent='Sound: '+(snd?'On':'Off')};
const QZ=[['Which organ helps us SEE a rainbow?','sight'],['Which organ do we use to HEAR a bell?','hearing'],['Which organ SMELLS a flower?','smell'],['Which organ TASTES sweet candy?','taste'],['Which organ feels that ice is COLD?','touch'],['Which organ helps us see colours?','sight'],['Which organ do we use to listen to music?','hearing'],['Which organ tastes a sour lemon?','taste'],['Which organ tells us a stove is HOT?','touch'],['Which organ smells yummy pizza?','smell']];
let qs,qi,score;
function ask(){
 if(qi>=qs.length){$('#q').textContent='Quiz finished! Your score: '+score+' / '+qs.length;$('#opts').innerHTML='';say(score>=8?'Excellent! You are a Senses Star!':'Good try! Play again to learn more.');return}
 $('#q').textContent=(qi+1)+'. '+qs[qi][0];$('#sc').textContent='Score: '+score;const o=$('#opts');o.innerHTML='';
 K.forEach(k=>{const b=document.createElement('button');b.className='b';b.style.background=S[k].c;b.textContent=S[k].o;b.onclick=()=>{
  if(k===qs[qi][1]){score++;o.querySelectorAll('button').forEach(x=>x.disabled=true);react(k,rnd(S[k].s));setTimeout(()=>{qi++;ask()},2600)}
  else{b.disabled=true;say('Not this one. Try again!');tone(200,.3,'square',.08)}};o.appendChild(b)});
}
$('#bQuiz').onclick=()=>{run++;if(qm){qm=0;$('#quiz').hidden=true;$('#learn').hidden=false;$('#bQuiz').textContent='Start Quiz';say('Back to learning.');return}
 qm=1;qs=QZ.slice().sort(()=>Math.random()-.5);qi=0;score=0;$('#learn').hidden=true;$('#quiz').hidden=false;$('#bQuiz').textContent='Exit Quiz';ask()};
const app=$('#app'),fb=$('#bFs');
fb.onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(app.requestFullscreen||app.webkitRequestFullscreen).call(app)};
function fit(){const w=$('#sw'),s=Math.min(w.clientWidth/1536,w.clientHeight/1024);st.style.transform=`translate(${(w.clientWidth-1536*s)/2}px,${(w.clientHeight-1024*s)/2}px) scale(${s})`;fb.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'Exit Full Screen':'Full Screen'}
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='5'){run++;sel(K[e.key-1])}else if(e.key==='f'||e.key==='F')fb.click();else if(e.key===' '){e.preventDefault();$('#bAll').click()}else if(e.key==='Escape')$('#bStop').click()});addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);document.addEventListener('webkitfullscreenchange',fit);fit();
</script></body></html>
