<script>
const $=s=>document.querySelector(s),SUB='₀₁₂₃₄₅₆₇₈₉',sub=s=>String(s).replace(/\d/g,d=>SUB[d]);
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len:a=>Math.hypot(a[0],a[1],a[2]),norm:a=>{const l=V.len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]}};
/* ---------- data ---------- */
const CI={
Alkane:{gf:'CₙH₂ₙ₊₂',bd:'Only single bonds (saturated)',an:'109.5°',sh:'Tetrahedral'},
Alkene:{gf:'CₙH₂ₙ',bd:'One C=C double bond (unsaturated)',an:'120°',sh:'Trigonal planar'},
Alkyne:{gf:'CₙH₂ₙ₋₂',bd:'One C≡C triple bond (unsaturated)',an:'180°',sh:'Linear'},
Alcohol:{gf:'CₙH₂ₙ₊₁OH',bd:'Single bonds with an –OH group',an:'109.5° (O–H: 104.5°)',sh:'Tetrahedral carbon, bent O'},
Aldehyde:{gf:'R–CHO',bd:'C=O at the end of the chain',an:'120° at C=O',sh:'Trigonal planar at C=O'},
Ketone:{gf:'R–CO–R′',bd:'C=O inside the chain',an:'120° at C=O',sh:'Trigonal planar at C=O'},
'Carboxylic acid':{gf:'R–COOH',bd:'C=O and –OH on one carbon',an:'120° at C=O',sh:'Trigonal planar at C=O'}};
const CL=Object.keys(CI);
const M=[
{g:'al',cl:'Alkane',n:'Methane',s:'CH₄',c:1,b:'',u:'Natural gas for cooking and heating',o:'stove',oc:'Methane burns on a gas stove'},
{g:'al',cl:'Alkane',n:'Ethane',s:'CH₃–CH₃',c:2,b:'-',u:'Natural gas; used to make ethene',o:'stove',oc:'Ethane is part of natural gas'},
{g:'al',cl:'Alkane',n:'Propane',s:'CH₃–CH₂–CH₃',c:3,b:'--',u:'LPG gas cylinders',o:'cyl',oc:'Propane fills LPG cylinders'},
{g:'al',cl:'Alkane',n:'Butane',s:'CH₃–CH₂–CH₂–CH₃',c:4,b:'---',u:'Lighters and camping stoves',o:'lighter',oc:'Butane fuels a lighter'},
{g:'al',cl:'Alkane',n:'Pentane',s:'CH₃–(CH₂)₃–CH₃',c:5,b:'----',u:'Part of petrol; solvent',o:'can',oc:'Pentane is found in petrol'},
{g:'ae',cl:'Alkene',n:'Ethene',s:'CH₂=CH₂',c:2,b:'=',u:'Ripens fruit; makes polythene',o:'banana',oc:'Ethene gas ripens bananas',h:1,hn:1},
{g:'ae',cl:'Alkene',n:'Propene',s:'CH₂=CH–CH₃',c:3,b:'=-',u:'Makes polypropylene plastic',o:'plastic',oc:'Propene makes plastic bottles',h:2,hn:1},
{g:'ae',cl:'Alkene',n:'1-Butene',s:'CH₂=CH–CH₂–CH₃',c:4,b:'=--',u:'Plastics and synthetic rubber',o:'plastic',oc:'Butene makes plastic and rubber',h:3,hn:1},
{g:'ay',cl:'Alkyne',n:'Ethyne',s:'CH≡CH',c:2,b:'#',u:'Welding and cutting metal',o:'torch',oc:'Ethyne burns in a welding torch',h:1,hn:2},
{g:'ay',cl:'Alkyne',n:'Propyne',s:'CH≡C–CH₃',c:3,b:'#-',u:'Special fuel; chemical making',o:'torch',oc:'Propyne burns with a very hot flame',h:2,hn:2},
{g:'ay',cl:'Alkyne',n:'1-Butyne',s:'CH≡C–CH₂–CH₃',c:4,b:'#--',u:'Making other chemicals',o:'torch',oc:'Butyne burns with a hot flame',h:3,hn:2},
{g:'fg',cl:'Alcohol',n:'Methanol',s:'CH₃–OH',c:1,b:'',sd:[[0,1,'O']],u:'Antifreeze and fuel (poisonous)',o:'b1',oc:'Methanol is used in antifreeze'},
{g:'fg',cl:'Alcohol',n:'Ethanol',s:'CH₃–CH₂–OH',c:2,b:'-',sd:[[1,1,'O']],u:'Hand sanitizer and fuel',o:'b2',oc:'Ethanol is in hand sanitizer'},
{g:'fg',cl:'Aldehyde',n:'Ethanal',s:'CH₃–CHO',c:2,b:'-',sd:[[1,2,'O']],u:'Making vinegar acid and resins',o:'b3',oc:'Ethanal is a lab chemical'},
{g:'fg',cl:'Ketone',n:'Propanone',s:'CH₃–CO–CH₃',c:3,b:'--',sd:[[1,2,'O']],u:'Nail polish remover, paint thinner',o:'b4',oc:'Propanone removes nail polish'},
{g:'fg',cl:'Carboxylic acid',n:'Ethanoic acid',s:'CH₃–COOH',c:2,b:'-',sd:[[1,2,'O'],[1,1,'O']],u:'Vinegar for cooking and pickles',o:'b5',oc:'Ethanoic acid gives vinegar its sour taste'}];
const GH={al:'Alkanes (single bonds)',ae:'Alkenes (double bond)',ay:'Alkynes (triple bond)',fg:'Functional groups'};
const EL={C:{c:'#4b5563',l:'#9ca3af',d:'#111827',r:.42,R:1,b:'#cbd5e1'},H:{c:'#e5e7eb',l:'#fff',d:'#9ca3af',r:.27,R:.68,b:'#f1f5f9'},O:{c:'#dc2626',l:'#fecaca',d:'#7f1d1d',r:.4,R:.92,b:'#f87171'}};
const VAL={C:4,O:2,H:1},BL={'C-C1':1.54,'C-C2':1.34,'C-C3':1.2,'C-H1':1.09,'C-O1':1.43,'C-O2':1.22,'H-O1':.96};
const bl=(a,b,o)=>BL[[a,b].sort().join('-')+o]||1.4;
/* ---------- 3D molecule builder ---------- */
function build(d){
 const N=[],mk=(el,par,o)=>{const n={el,parent:par,order:o||0,kids:[]};N.push(n);if(par)par.kids.push(n);return n};
 const ch=[];let prev=null;
 for(let i=0;i<d.c;i++){const o=i?{'-':1,'=':2,'#':3}[d.b[i-1]]:0;prev=mk('C',prev,o);ch.push(prev)}
 (d.sd||[]).forEach(s=>mk(s[2],ch[s[0]],s[1]));
 N.slice().forEach(n=>{if(n.el=='H')return;let u=n.order+n.kids.reduce((a,k)=>a+k.order,0);for(;u<VAL[n.el];u++)mk('H',n,1)});
 N.forEach((n,i)=>{n.i=i;const mx=Math.max(n.order,...n.kids.map(k=>k.order));n.hyb=n.el=='C'?(mx==3?'sp':mx==2?'sp2':'sp3'):n.el=='O'?(mx==2?'sp':'bent'):'h'});
 const D=Math.PI/180;
 (function place(n,pos,pd,ref){
  n.pos=pos;if(!n.kids.length)return;
  let a=V.sub(ref,V.mul(pd,V.dot(ref,pd)));
  if(V.len(a)<1e-3){a=Math.abs(pd[1])<.9?[0,1,0]:[1,0,0];a=V.sub(a,V.mul(pd,V.dot(a,pd)))}
  a=V.norm(a);const b=V.cross(pd,a);
  const dir=(th,ph)=>V.add(V.mul(pd,Math.cos(th)),V.mul(V.add(V.mul(a,Math.cos(ph)),V.mul(b,Math.sin(ph))),Math.sin(th)));
  const h=n.hyb;let sl=h=='sp3'?[0,120,240].map(p=>dir(109.47*D,p*D)):h=='sp2'?[0,180].map(p=>dir(120*D,p*D)):h=='sp'?[dir(Math.PI,0)]:[dir(104.5*D,0)];
  if(!n.parent)sl.unshift(pd);
  n.kids.forEach((k,i)=>place(k,V.add(pos,V.mul(sl[i],bl(n.el,k.el,k.order))),V.mul(sl[i],-1),pd));
 })(N[0],[0,0,0],[1,0,0],[0,1,0]);
 const cen=N.reduce((a,n)=>V.add(a,n.pos),[0,0,0]).map(v=>v/N.length);
 N.forEach(n=>n.pos=V.sub(n.pos,cen));
 const bonds=N.filter(n=>n.parent).map(n=>({a:n.parent.i,b:n.i,o:n.order}));
 const adj=N.map(()=>[]);bonds.forEach(b=>{adj[b.a].push(b.b);adj[b.b].push(b.a)});
 let ci=0,best=-1;N.forEach((n,i)=>{if(n.el!='H'&&adj[i].length>best){best=adj[i].length;ci=i}});
 const nb=adj[ci].slice().sort((p,q)=>(N[p].el=='H')-(N[q].el=='H'));
 const u1=V.norm(V.sub(N[nb[0]].pos,N[ci].pos)),u2=V.norm(V.sub(N[nb[1]].pos,N[ci].pos));
 const cnt={C:0,H:0,O:0};N.forEach(n=>cnt[n.el]++);
 return{def:d,atoms:N,bonds,cnt,ext:Math.max(...N.map(n=>V.len(n.pos)))+.8,ang:{c:ci,a:nb[0],b:nb[1],deg:Math.acos(V.dot(u1,u2))/D}};
}
const B=M.map(build);
const fml=n=>'C'+(n.C>1?sub(n.C):'')+'H'+sub(n.H)+(n.O?'O'+(n.O>1?sub(n.O):''):'');
function prod(){const n=B[S.cur].cnt,t=4*n.C+n.H-2*n.O,m=t%4==0?1:t%2==0?2:4;return{m,o2:m*t/4,co2:m*n.C,h2o:m*n.H/2}}
function eq(){const p=prod(),n=B[S.cur].cnt,co=(k,s)=>(k==1?'':k)+s;return co(p.m,fml(n))+' + '+co(p.o2,'O₂')+' → '+co(p.co2,'CO₂')+' + '+co(p.h2o,'H₂O')+' + heat and light'}
/* ---------- state ---------- */
const S={cur:0,rx:.3,ry:-.6,zoom:1,zs:1,mode:'ball',auto:true,labels:true,ang:false,hideH:false,ex:0,exT:0,burn:null,hyd:null,after:false,parts:[],drag:false};
const cv=$('#cv'),cx=cv.getContext('2d'),oc=$('#oc'),ox=oc.getContext('2d');
let W=300,H=300,dpr=1,bt=0;
function fit(){dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
new ResizeObserver(fit).observe(cv);
function banner(t,ms){const b=$('#banner');clearTimeout(bt);if(!t){b.style.display='none';return}b.innerHTML=t;b.style.display='block';if(ms)bt=setTimeout(()=>b.style.display='none',ms)}
/* ---------- sidebar ---------- */
(function(){let h='',g='';M.forEach((m,i)=>{if(m.g!=g){g=m.g;h+='<h3>'+GH[g]+'</h3>'}h+=`<button class="mb ${m.g}" data-m="${i}">${m.n}</button>`});$('#side').innerHTML=h})();
function setMol(i){
 S.cur=i;S.burn=null;S.hyd=null;S.after=false;S.parts=[];S.ex=0;S.exT=0;$('[data-a=exp]').classList.remove('on');banner('');
 const m=M[i],c=CI[m.cl],n=B[i].cnt;
 document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m==i));
 $('#tag').innerHTML=`<b>${m.n}</b><span>${fml(n)}</span>`;
 const rows=[['Structure',m.s],['Family',m.cl],['General formula',c.gf],['Bonding',c.bd],['Bond angle',c.an],['Shape',c.sh],['Atoms',n.C+' C, '+n.H+' H'+(n.O?', '+n.O+' O':'')],['Used in',m.u]];
 $('#info').innerHTML=`<h2>${m.n}</h2><div class="fm">${fml(n)}</div>`+rows.map(r=>`<div class="r"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('');
 $('#oct').textContent=m.oc;newQ();
}
/* ---------- quiz ---------- */
let Q={ok:0,tot:0,done:false,ans:''};
const shuf=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(v=>v[1]);
function newQ(){
 const m=M[S.cur],n=B[S.cur].cnt,r=Math.floor(Math.random()*3);let q,ans,o;
 const nums=a=>{const s=new Set([a]);[1,-1,2,-2,3].forEach(d=>{if(s.size<4&&a+d>0)s.add(a+d)});return shuf([...s])};
 if(r==0){q='How many hydrogen atoms are in '+m.n+'?';ans=n.H;o=nums(ans)}
 else if(r==1){q='How many carbon atoms are in '+m.n+'?';ans=n.C;o=nums(ans)}
 else{q='Which family does '+m.n+' belong to?';ans=m.cl;o=shuf([ans,...shuf(CL.filter(c=>c!=ans)).slice(0,3)])}
 Q.ans=String(ans);Q.done=false;$('#qq').textContent=q;
 const cols=['#2563eb','#15803d','#c2410c','#7c3aed'];
 $('#qo').innerHTML=o.map((v,i)=>`<button data-q="${v}" style="--c:${cols[i]}">${v}</button>`).join('');
 $('#qs').textContent='Score: '+Q.ok+' / '+Q.tot;
}
/* ---------- actions ---------- */
function act(a,btn){
 const vw=['ball','space','stick','wire'];
 if(vw.includes(a)){S.mode=a;document.querySelectorAll('.vw').forEach(b=>b.classList.toggle('on',b.dataset.a==a));return}
 const tg=(k)=>{S[k]=!S[k];btn.classList.toggle('on',S[k])};
 switch(a){
 case'fs':{const e=$('#app');document.fullscreenElement?document.exitFullscreen():e.requestFullscreen&&e.requestFullscreen();break}
 case'auto':tg('auto');break;case'lab':tg('labels');break;case'hh':tg('hideH');break;
 case'ang':tg('ang');if(S.ang)banner('Bond angle: '+CI[M[S.cur].cl].an+' · '+CI[M[S.cur].cl].sh,4500);break;
 case'exp':S.exT=S.exT?0:1.1;btn.classList.toggle('on',!!S.exT);break;
 case'l':S.ry-=.35;break;case'r':S.ry+=.35;break;case'u':S.rx-=.3;break;case'd':S.rx+=.3;break;
 case'zi':S.zoom=Math.min(2.6,S.zoom*1.2);break;case'zo':S.zoom=Math.max(.5,S.zoom/1.2);break;
 case'rs':S.rx=.3;S.ry=-.6;S.zoom=1;setMol(S.cur);break;
 case'prev':setMol((S.cur+M.length-1)%M.length);break;
 case'next':setMol((S.cur+1)%M.length);break;
 case'burn':S.after=false;S.hyd=null;S.parts=[];S.burn={t0:performance.now(),shown:false};banner('');break;
 case'hyd':{const m=M[S.cur];if(!m.h){banner(m.cl=='Alkane'?'Alkanes are already saturated. They have no double or triple bond that can take in hydrogen.':'Adding hydrogen is shown for alkenes and alkynes. Try Ethene or Ethyne.',5000);break}
  S.burn=null;S.after=false;banner('');S.hyd={t0:performance.now()};break}
 }
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.m!==undefined)setMol(+b.dataset.m);
 else if(b.dataset.a)act(b.dataset.a,b);
 else if(b.dataset.q!==undefined&&!Q.done){Q.done=true;Q.tot++;const ok=b.dataset.q==Q.ans;if(ok)Q.ok++;
  $('#qs').textContent=(ok?'Correct! Well done. ':'Not quite. The answer is '+Q.ans+'. ')+'Score: '+Q.ok+' / '+Q.tot;
  setTimeout(()=>{if(Q.done)newQ()},1800)}
});
document.addEventListener('fullscreenchange',()=>$('#fs').textContent=document.fullscreenElement?'Exit Full Screen':'Full Screen');
let lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{S.drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!S.drag)return;S.ry+=(e.clientX-lx)*.01;S.rx=Math.max(-1.5,Math.min(1.5,S.rx+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>{S.drag=false;cv.style.cursor='grab'});
cv.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(.5,Math.min(2.6,S.zoom*(e.deltaY<0?1.1:.9)))},{passive:false});

function ball(x,y,r,el){
