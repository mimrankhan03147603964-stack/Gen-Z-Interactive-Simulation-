<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart &amp; Circulation Lab</title>
<style>
:root{--bg:#06172e;--panel:#0d2849;--line:#1d4a80;--tx:#eaf3ff;--gold:#ffd54a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#12396b,var(--bg) 60%)}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:2px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;container-type:size;margin:8px 14px 0;border-radius:14px;background:#fff;border:3px solid var(--line)}
#frame{position:relative;width:min(100cqw,calc(100cqh*1672/941));aspect-ratio:1672/941;transition:transform .7s ease}
#pic{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;inset:0}
.ring{position:absolute;width:3.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);cursor:pointer;padding:0;transition:opacity .2s}
.ring:hover{background:color-mix(in srgb,var(--c) 50%,transparent)}
.ring.on{border-color:var(--gold);border-width:4px;animation:pulse 1s infinite;z-index:3;background:rgba(255,213,74,.35)}
.ring .tag{display:none;position:absolute;left:50%;bottom:112%;transform:translateX(-50%);white-space:nowrap;background:#0d2849;color:#fff;font:700 13px "Trebuchet MS",sans-serif;padding:4px 9px;border-radius:8px;border:2px solid var(--gold)}
.ring:hover .tag,.ring.on .tag{display:block}
#ov.hide .ring:not(.on){opacity:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,213,74,.9)}50%{box-shadow:0 0 0 14px rgba(255,213,74,0)}}
#hl{position:absolute;border:4px solid var(--gold);border-radius:14px;box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 22px 6px rgba(255,213,74,.8);pointer-events:none;transition:all .5s ease;opacity:0}
#dot{position:absolute;width:2.6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);left:10%;top:45%;opacity:0;pointer-events:none;z-index:4;transition:left 1s ease,top 1s ease,background .5s;background:radial-gradient(circle at 35% 30%,#fff9,var(--d) 55%);border:2px solid #fff;box-shadow:0 0 16px 4px var(--d)}
#beat{position:absolute;left:30%;top:9%;width:26%;height:68%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,60,60,.55),rgba(255,60,60,0) 68%)}
#beat.on{opacity:1;animation:beat var(--bt,.83s) infinite}
@keyframes beat{0%,100%{transform:scale(.9)}15%{transform:scale(1.12)}30%{transform:scale(.97)}45%{transform:scale(1.07)}}
#info{margin:8px 14px 0;padding:8px 14px;background:var(--panel);border:2px solid var(--line);border-radius:12px;display:flex;gap:14px;align-items:center;min-height:58px}
#it{font-size:18px;color:var(--gold);min-width:190px}
#ix{font-size:16px;line-height:1.35}
#dock{display:flex;flex-wrap:wrap;gap:8px 18px;padding:8px 14px 10px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 8px}
.grp>span{font-weight:800;font-size:13px;margin-right:4px;color:#9cc4f5}
.b{background:var(--c);color:#fff;border:0;border-radius:10px;padding:7px 11px;font:800 13px "Trebuchet MS","Segoe UI",sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4);text-shadow:0 1px 1px rgba(0,0,0,.35);transition:transform .08s,filter .15s}
.b:hover{filter:brightness(1.15)}
.b:active{transform:translateY(3px);box-shadow:none}
.b.act{outline:3px solid #fff;outline-offset:1px}
.b:focus-visible,.ring:focus-visible{outline:3px solid #fff;outline-offset:2px}
#fs{font-size:15px;padding:9px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

['Right Atrium',[324,442],[585,395],0,'Blood collects in the upper right chamber of the heart.','ra'],
['Right Ventricle',[468,593],[650,520],0,'The right ventricle pumps the blood toward the lungs.','rv'],
['Pulmonary Artery',[619,757],[845,200],0,'This artery carries the blood to the lungs. It is the only artery that carries oxygen-poor blood.','pa'],
['Lungs',[784,916],[232,290],1,'In the lungs, the blood drops off carbon dioxide and picks up fresh oxygen.'],
['Pulmonary Veins',[944,1077],[885,285],2,'These veins bring the fresh, oxygen-rich blood back to the heart.','pv'],
['Left Atrium',[1104,1204],[835,362],2,'The oxygen-rich blood waits here, then flows down.','la'],
['Left Ventricle',[1228,1337],[845,505],2,'The strongest chamber squeezes and sends the blood out with great force.','lv'],
['Aorta',[1362,1450],[770,145],2,'The aorta sends oxygen-rich blood to the whole body. Then the trip starts again!','ao']
];
const PH=[
['1. Atrial Filling',[1065,72,1350,388],['svc','ivc','ra','pv','la'],'Blood enters the atria from the veins. The heart is relaxed.'],
['2. Atrial Contraction',[1367,72,1650,388],['ra','la'],'The atria contract and push blood into the ventricles.'],
['3. Ventricular Filling',[1065,408,1350,708],['rv','lv'],'The ventricles fill with blood from the atria.'],
['4. Ventricular Contraction',[1367,408,1650,708],['rv','lv','pa','ao'],'The ventricles contract and push blood into the arteries: the pulmonary artery and the aorta.']
];
const ov=$('#ov'),hl=$('#hl'),dot=$('#dot'),beatEl=$('#beat');
let speed=1,soundOn=true,hb=false,bpm=72,hbT=null,step=-1,flowT=null,ph=0,cycT=null,quiz=null,asked=0,right=0,AC=null;
P.forEach(p=>{const r=document.createElement('button');r.className='ring';r.id='r_'+p[0];r.style.cssText=`left:${px(p[3])};top:${py(p[4])};--c:${p[2]}`;r.setAttribute('aria-label',p[1]);r.innerHTML=`<span class="tag">${p[1]}</span>`;r.onclick=()=>choose(p[0]);ov.appendChild(r)});
function say(t,x){$('#it').textContent=t;$('#ix').textContent=x}
function rings(ids){document.querySelectorAll('.ring').forEach(r=>r.classList.remove('on'));(ids||[]).forEach(i=>{const e=$('#r_'+i);e&&e.classList.add('on')})}
function box(x1,y1,x2,y2){Object.assign(hl.style,{left:px(x1),top:py(y1),width:px(x2-x1),height:py(y2-y1),opacity:1})}
function nobox(){hl.style.opacity=0}
function tone(f,t,d,v){if(!soundOn)return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d)}
function lubdub(){tone(70,0,.14,.7);tone(55,.26,.12,.5)}
function ding(){tone(660,0,.15,.25);tone(880,.12,.2,.25)}
function oops(){tone(180,0,.25,.3)}
function choose(id){
 const p=P.find(a=>a[0]===id);
 if(quiz){
  if(id===quiz){right++;say('Correct! ⭐','That is the '+p[1]+'. Score: '+right+' / '+asked);rings([id]);ding();setTimeout(nextQ,1600)}
  else{say('Not quite','That is the '+p[1]+'. Try to find the '+P.find(a=>a[0]===quiz)[1]+'.');oops()}
  return}
 nobox();rings([id]);say(p[1],p[5]);tone(520,0,.12,.2)}
/* Blood flow */
function go(i){
 step=(i+STEPS.length)%STEPS.length;const s=STEPS[step];
 dot.style.left=px(s[2][0]);dot.style.top=py(s[2][1]);dot.style.opacity=1;
 dot.style.setProperty('--d',['#1e63e8','#e91e8c','#e8202a'][s[3]]);
 box(s[1][0],768,s[1][1],828);rings(s[5]?[s[5]]:[]);
 say('Step '+(step+1)+' of 10: '+s[0],s[4]);tone(300+step*40,0,.12,.2)}
function play(){stop();if(step<0)go(0);flowT=setInterval(()=>go(step+1),2800/speed);mark('play')}
function pause(){clearInterval(flowT);flowT=null;mark('')}
function stop(){pause();clearInterval(cycT);cycT=null}
/* Cardiac cycle */
function phase(n){
 ph=(n+4)%4;const c=PH[ph];box(...c[1]);rings(c[2]);dot.style.opacity=0;
 say(c[0],c[3]);beatEl.style.setProperty('--bt','.7s');
 if(ph===1||ph===3)lubdub();else tone(260,0,.2,.15)}
function auto(){stop();phase(ph);cycT=setInterval(()=>phase(ph+1),3000/speed);mark('auto')}
/* Quiz */
function nextQ(){
 const pool=P.filter(a=>a[0]!==quiz&&!['heart','artery','vein'].includes(a[0]));
 quiz=pool[Math.floor(Math.random()*pool.length)][0];asked++;rings([]);nobox();
 say('Quiz time!','Click the '+P.find(a=>a[0]===quiz)[1]+' on the heart picture. Score: '+right+' / '+(asked-1))}
function toggleQuiz(b){
 if(quiz){quiz=null;b.classList.remove('act');say('Quiz finished','You scored '+right+' out of '+(asked)+'. Great work!');return}
 stop();asked=0;right=0;quiz='x';b.classList.add('act');nextQ()}
/* Zoom */
function zoom(cx,cy,s){const h=50/s;cx=Math.min(Math.max(cx,h),100-h);cy=Math.min(Math.max(cy,h),100-h);const f=$('#frame');f.style.transformOrigin=cx+'% '+cy+'%';f.style.transform=s===1?'none':`translate(${50-cx}%,${50-cy}%) scale(${s})`}
/* Heartbeat */
function setHb(on){hb=on;clearInterval(hbT);beatEl.classList.toggle('on',hb);beatEl.style.setProperty('--bt',(60/bpm)+'s');if(hb){lubdub();hbT=setInterval(lubdub,60000/bpm)}}
/* Dock */
const dock=$('#dock');let marks={};
function grp(name){const g=document.createElement('div');g.className='grp';g.innerHTML='<span>'+name+'</span>';dock.appendChild(g);return g}
function btn(g,txt,c,fn,key){const b=document.createElement('button');b.className='b';b.style.setProperty('--c',c);b.textContent=txt;b.onclick=()=>fn(b);g.appendChild(b);if(key)marks[key]=b;return b}
function mark(k){Object.entries(marks).forEach(([n,b])=>b.classList.toggle('act',n===k))}
let g=grp('Parts');P.forEach(p=>btn(g,p[1],p[2],()=>{stop();mark('');choose(p[0])}));
g=grp('Blood flow');
btn(g,'◀ Back','#546e7a',()=>{pause();go(step-1)});
btn(g,'▶ Play','#2e7d32',play,'play');
btn(g,'⏸ Pause','#ef6c00',pause);
btn(g,'Next ▶','#1565c0',()=>{pause();go(step+1)});
btn(g,'⟲ Restart','#c62828',()=>{pause();go(0)});
g=grp('Heart cycle');
PH.forEach((p,i)=>btn(g,'Phase '+(i+1),['#039be5','#43a047','#fb8c00','#8e24aa'][i],()=>{stop();mark('');phase(i)}));
btn(g,'🔁 Auto cycle','#d81b60',auto,'auto');
g=grp('Heartbeat');
btn(g,'❤ Heartbeat','#e53935',b=>{setHb(!hb);b.classList.toggle('act',hb)});
btn(g,'BPM −','#00838f',()=>{bpm=Math.max(40,bpm-10);setHb(hb);say('Heart rate',bpm+' beats per minute')});
btn(g,'BPM +','#f9a825',()=>{bpm=Math.min(180,bpm+10);setHb(hb);say('Heart rate',bpm+' beats per minute')});
btn(g,'🔊 Sound','#6d4c41',b=>{soundOn=!soundOn;b.textContent=soundOn?'🔊 Sound':'🔇 Muted'});
btn(g,'🗣 Read aloud','#3949ab',()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('#it').textContent+'. '+$('#ix').textContent);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)});
g=grp('View');
btn(g,'🔍 Whole view','#455a64',()=>zoom(50,50,1));
btn(g,'🔍 Heart','#00acc1',()=>zoom(42,38,2.1));
btn(g,'🔍 Body','#7cb342',()=>zoom(10.5,43,2));
btn(g,'🔍 Cycle','#ab47bc',()=>zoom(81,40,1.9));
btn(g,'🔍 Blood path','#ff7043',()=>zoom(50,85,1.15));
btn(g,'◎ Hotspots','#5c6bc0',b=>{$('#ov').classList.toggle('hide');b.classList.toggle('act')});
btn(g,'🎯 Quiz','#ffa000',toggleQuiz);
btn(g,'↺ Reset all','#d32f2f',()=>{stop();mark('');quiz=null;step=-1;ph=0;rings([]);nobox();dot.style.opacity=0;zoom(50,50,1);setHb(false);speed=1;speechSynthesis&&speechSynthesis.cancel();say('Welcome!','Click any part of the heart, or press a colored button below to start exploring.')});
g=grp('Speed');
const sp=btn(g,'1×','#00897b',()=>{});sp.style.display='none';
btn(g,'🐢 Slower','#0277bd',()=>{speed=Math.max(.5,speed-.5);re()});
btn(g,'🐇 Faster','#c0ca33',()=>{speed=Math.min(3,speed+.5);re()});
function re(){say('Speed',speed+'× speed');if(flowT)play();if(cycT)auto()}
/* Full screen */
const fsB=document.createElement('button');fsB.className='b';fsB.id='fs';fsB.style.setProperty('--c','#d81b60');fsB.textContent='⛶ Full Screen';
fsB.onclick=()=>{document.fullscreenElement?document.exitFullscreen():$('#app').requestFullscreen&&$('#app').requestFullscreen()};
$('#hdr').appendChild(fsB);
document.addEventListener('fullscreenchange',()=>{fsB.textContent=document.fullscreenElement?'🗗 Exit Full Screen':'⛶ Full Screen'});
</script>
</body>
</html>
