<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photosynthesis Process Simulation</title>
<style>
:root{--bg:#e9f1e4;--panel:#ffffff;--text:#16301c;--muted:#4b6650;--accent:#1f8a3b;--accent2:#176b2e;--line:#c4d8c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1410;--panel:#16231b;--text:#e6f2e8;--muted:#9bb5a0;--accent:#2fb457;--accent2:#25964a;--line:#2a4032}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.app.pseudo{position:fixed;inset:0;z-index:9999}
.scene{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1400px;overflow:hidden}
.stage{position:relative;transform-style:preserve-3d;will-change:transform;border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.25)}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;display:block;user-select:none;-webkit-user-drag:none}
.stage canvas{transform:translateZ(25px) scale(.982);pointer-events:none}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line)}
.info{flex:1;min-width:260px}
.info h2{margin:0 0 2px;font-size:16px}
.info p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:26px;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--accent)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;transition:transform .1s,background .2s}
button.primary{background:var(--accent);color:#fff}
button:hover{transform:translateY(-1px);background:var(--accent2);color:#fff}
button:disabled{opacity:.4;cursor:default;transform:none;background:transparent;color:var(--accent)}
</style>
</head>

  <div class="bar">
    <div class="info">
      <h2 id="ttl">Photosynthesis Process</h2>
      <p id="cap">Press Start to watch how a plant makes its own food.</p>
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div>

    <div class="btns">
      <button class="primary" id="bPlay">Start</button>

<script>
(function(){
var W=1672,H=941;
var app=document.getElementById('app'),scene=document.getElementById('scene'),stage=document.getElementById('stage');
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var bPlay=document.getElementById('bPlay'),bNext=document.getElementById('bNext'),bReset=document.getElementById('bReset'),bFull=document.getElementById('bFull');
var cap=document.getElementById('cap'),ttl=document.getElementById('ttl'),dots=document.querySelectorAll('#dots i');

var STEPS=[
 ['Ready','Press Start to watch how a plant makes its own food.'],
 ['Step 1: Sunlight','The plant captures energy from sunlight with the green pigment chlorophyll in its leaves.'],
 ['Step 2: Carbon Dioxide (CO₂)','Carbon dioxide from the air enters the leaves through tiny pores called stomata.'],
 ['Step 3: Water (H₂O)','Roots absorb water from the soil, and it travels up the stem to the leaves.'],
 ['Step 4: Oxygen (O₂) Released','Inside the leaves, light energy splits water and rebuilds the atoms. Oxygen is released into the air.'],
 ['Step 5: Glucose (C₆H₁₂O₆) Made','The plant stores energy as glucose sugar: 6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂.']
];
var BOX={light:[245,170,225,86],co2:[210,375,260,108],water:[225,583,248,118],oxy:[1445,205,212,126],glu:[1445,433,225,124],eq:[220,810,1205,108]};
var SHOW=[[],['light'],['co2'],['water'],['oxy'],['glu','eq']];

var PATHS={
 light:[[[190,170],[470,150],[640,318]]],
 co2:[[[150,430],[420,380],[650,400]]],
 water:[[[200,640],[560,610],[695,712]],[[695,712],[790,725],[840,640]],[[840,640],[836,520],[840,385]]],
 o2:[[[1030,350],[1060,240],[1250,235]]],
 glu:[[[1030,488],[1130,525],[1235,492]]]
};
function Q(a,b,c,t){var u=1-t;return [u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]];}
function pos(segs,t){var n=segs.length,k=Math.min(n-1,Math.floor(t*n));return Q(segs[k][0],segs[k][1],segs[k][2],t*n-k);}

var cfg={light:{rate:7,sp:.30,min:1},co2:{rate:3.2,sp:.26,min:2},water:{rate:3,sp:.17,min:3},o2:{rate:2.4,sp:.30,min:4},glu:{rate:3.2,sp:.30,min:5}};
var parts=[],acc={light:0,co2:0,water:0,o2:0,glu:0};
var step=0,playing=false,stepT=0,clock=0;

function spawn(k){parts.push({k:k,t:0,sp:cfg[k].sp*(.8+Math.random()*.4),ox:(Math.random()-.5)*24,oy:(Math.random()-.5)*24,ph:Math.random()*6.28,rot:Math.random()*6.28});}

function setStep(s){
 step=s;stepT=0;
 ttl.textContent=STEPS[s][0];cap.textContent=STEPS[s][1];
 dots.forEach(function(d,i){d.className=i<s?'on':'';});
 bNext.disabled=(s>=5);
}
function updBtn(){bPlay.textContent=playing?'Pause':(step===0?'Start':'Resume');}

bPlay.onclick=function(){
 if(step===0){setStep(1);playing=true;}else{playing=!playing;}
 updBtn();
};
bNext.onclick=function(){if(step<5){setStep(step+1);playing=true;updBtn();}};
bReset.onclick=function(){parts=[];for(var k in acc)acc[k]=0;playing=false;setStep(0);updBtn();};

/* Full screen with fallback */
function isFull(){return document.fullscreenElement||document.webkitFullscreenElement||app.classList.contains('pseudo');}
function syncFull(){bFull.textContent=isFull()?'Exit Full Screen':'Full Screen';setTimeout(resize,60);}
bFull.onclick=function(){
 if(app.classList.contains('pseudo')){app.classList.remove('pseudo');syncFull();return;}
 if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
 var f=app.requestFullscreen||app.webkitRequestFullscreen;
 if(f){
  var p;try{p=f.call(app);}catch(e){p=null;}
  if(p&&p.catch){p.catch(function(){app.classList.add('pseudo');syncFull();});}
 }else{app.classList.add('pseudo');syncFull();}
};
document.addEventListener('fullscreenchange',syncFull);
document.addEventListener('webkitfullscreenchange',syncFull);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&app.classList.contains('pseudo')){app.classList.remove('pseudo');syncFull();}});

/* Sizing */
var scale=1;
function resize(){
 var aw=scene.clientWidth*.94,ah=scene.clientHeight*.94;
 var w=Math.max(200,Math.min(aw,ah*W/H)),h=w*H/W,d=window.devicePixelRatio||1;
 stage.style.width=w+'px';stage.style.height=h+'px';
 cv.width=Math.round(w*d);cv.height=Math.round(h*d);
 scale=w*d/W;
}
window.addEventListener('resize',resize);

/* 3D tilt */
var tx=0,ty=0,rx=0,ry=0;
scene.addEventListener('mousemove',function(e){
 var r=scene.getBoundingClientRect();
 var x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
 ty=x*14;tx=-y*10;
});
scene.addEventListener('mouseleave',function(){tx=0;ty=0;});

/* Drawing */
function glowDot(x,y,r,col,blur){ctx.shadowColor=col;ctx.shadowBlur=blur;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.shadowBlur=0;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fade(t){return Math.min(1,t*6,(1-t)*6);}

function drawPart(p){
 var key=p.k==='o2'?'o2':p.k;
 var q=pos(PATHS[key],p.t),x=q[0]+p.ox*Math.sin(p.t*3.14),y=q[1]+p.oy*Math.sin(p.t*3.14);
 ctx.globalAlpha=fade(p.t);
 if(p.k==='light'){
  glowDot(x,y,7,'#ffe45c',22);glowDot(x,y,3,'#ffffff',0);
 }else if(p.k==='co2'){
  var a=p.rot+clock*1.5,dx=Math.cos(a)*11,dy=Math.sin(a)*11;
  glowDot(x-dx,y-dy,6,'#e52424',10);glowDot(x+dx,y+dy,6,'#e52424',10);glowDot(x,y,7,'#2b2b2f',8);
 }else if(p.k==='water'){
  glowDot(x,y,7,'#3fa4ff',16);glowDot(x-2,y-2,2.5,'#ffffff',0);
 }else if(p.k==='o2'){
  var s=.9+p.t*.9,a2=p.rot+clock*2,ex=Math.cos(a2)*8*s,ey=Math.sin(a2)*8*s,yy=y-p.t*20+Math.sin(clock*4+p.ph)*5;
  glowDot(x-ex,yy-ey,7*s,'#e22222',14);glowDot(x+ex,yy+ey,7*s,'#e22222',14);
  glowDot(x-ex-2,yy-ey-2,2*s,'#ffd0d0',0);glowDot(x+ex-2,yy+ey-2,2*s,'#ffd0d0',0);
 }else if(p.k==='glu'){
  ctx.save();ctx.translate(x,y);ctx.rotate(p.rot+clock*2);ctx.shadowColor='#c36bff';ctx.shadowBlur=16;ctx.fillStyle='#ffffff';ctx.fillRect(-4.5,-4.5,9,9);ctx.restore();ctx.shadowBlur=0;
 }
 ctx.globalAlpha=1;
}

function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 ctx.setTransform(scale,0,0,scale,0,0);
 /* sun glow */
 if(step>=1){
  var g=ctx.createRadialGradient(160,140,40,160,140,230+Math.sin(clock*3)*18);
  g.addColorStop(0,'rgba(255,230,90,.35)');g.addColorStop(1,'rgba(255,230,90,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,520,420);
 }
 /* leaf glow while making food */
 if(step>=4){
  var a=.16+.1*Math.sin(clock*3);
  [[700,390,150],[1000,385,130],[960,505,120],[730,550,120]].forEach(function(l){
   var gg=ctx.createRadialGradient(l[0],l[1],10,l[0],l[1],l[2]);
   gg.addColorStop(0,'rgba(150,255,120,'+(a*2)+')');gg.addColorStop(1,'rgba(150,255,120,0)');
   ctx.fillStyle=gg;ctx.beginPath();ctx.arc(l[0],l[1],l[2],0,6.283);ctx.fill();
  });
 }
 /* water up the stem trail */
 if(step>=3){
  ctx.strokeStyle='rgba(70,170,255,'+(.25+.15*Math.sin(clock*4))+')';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(840,650);ctx.lineTo(840,395);ctx.stroke();
 }
 parts.forEach(drawPart);
 /* highlight active labels */
 var pulse=.55+.45*Math.sin(clock*5);
 SHOW[step].forEach(function(n){
  var b=BOX[n];ctx.save();ctx.strokeStyle='rgba(255,255,255,'+(.6+.4*pulse)+')';ctx.lineWidth=6;ctx.shadowColor='#ffee55';ctx.shadowBlur=18+14*pulse;
  rrect(b[0]-4,b[1]-4,b[2]+8,b[3]+8,22);ctx.stroke();ctx.restore();
 });
}

/* Loop */
var last=performance.now();
function loop(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 clock+=dt;
 if(playing){
  stepT+=dt;
  if(step>=1&&step<5&&stepT>5)setStep(step+1);
  for(var k in cfg){
   if(step>=cfg[k].min){acc[k]+=cfg[k].rate*dt;while(acc[k]>=1){acc[k]--;spawn(k);}}
  }
  for(var i=parts.length-1;i>=0;i--){parts[i].t+=parts[i].sp*dt;if(parts[i].t>=1)parts.splice(i,1);}
 }
 rx+=(tx-rx)*.08;ry+=(ty-ry)*.08;
 var fy=Math.sin(clock*.8)*1.2;
 stage.style.transform='rotateX('+(rx+fy*.4).toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
 draw();
 requestAnimationFrame(loop);
}
resize();setStep(0);updBtn();
requestAnimationFrame(loop);
})();
</script>
