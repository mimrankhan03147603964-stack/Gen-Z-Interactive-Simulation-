<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cell-Mediated vs. Humoral Immune Response</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;background:#06122b}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#14346b 0%,#071638 60%,#030a1c 100%);color:#fff}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1500px;padding:10px 14px 4px}
#tilt{transition:transform .25s ease-out;transform-style:preserve-3d}
#view{position:relative;overflow:hidden;border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.65),0 0 0 3px rgba(255,255,255,.18),0 0 40px rgba(60,140,255,.35);background:#000}
#scene{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1s cubic-bezier(.65,0,.25,1)}
#drift{position:absolute;inset:0}
#drift.on{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}33%{transform:translate(.3%,-.3%) rotate(.08deg)}66%{transform:translate(-.3%,.25%) rotate(-.07deg)}100%{transform:translate(.2%,.35%) rotate(.05deg)}}
#im,#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#fx{pointer-events:none}
.hs{position:absolute;border-radius:12px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hs:hover{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 0 22px rgba(255,255,255,.6)}
body.zoomed .hs,body.lens .hs{pointer-events:none}
#spot{position:absolute;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .6s .5s;box-shadow:0 0 0 4000px rgba(0,10,30,.35)}
#spot::after{content:"";position:absolute;inset:0;border-radius:14px;border:calc(4px*var(--inv,1)) solid var(--c,#fff);animation:pulse 1.4s ease-in-out infinite}
#spot.on{opacity:1}
@keyframes pulse{0%,100%{box-shadow:0 0 calc(10px*var(--inv,1)) var(--c);opacity:.7}50%{box-shadow:0 0 calc(34px*var(--inv,1)) var(--c),inset 0 0 calc(24px*var(--inv,1)) var(--c);opacity:1}}
#lens{position:absolute;width:230px;height:230px;border-radius:50%;border:5px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.6),inset 0 0 30px rgba(255,255,255,.25),0 0 0 3px #1e66ff;pointer-events:none;display:none;background-repeat:no-repeat;z-index:5}
body.lens #view{cursor:none}
#panel{padding:4px 14px 10px;display:flex;flex-direction:column;gap:7px;align-items:center}
#cap{min-height:42px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;font-size:clamp(14px,1.4vw,19px);text-align:center;max-width:1300px}
#cap .t{font-weight:800;font-size:1.2em;padding:3px 16px;border-radius:30px;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.35)}
#cap .p{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);padding:4px 14px;border-radius:30px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:700 clamp(12px,1.1vw,16px) "Segoe UI",Arial,sans-serif;color:#fff;cursor:pointer;border:0;border-radius:12px;padding:9px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));border-bottom:5px solid color-mix(in srgb,var(--c) 55%,#000);box-shadow:0 5px 12px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .08s,filter .15s,box-shadow .15s}
button:hover{filter:brightness(1.12);transform:translateY(-2px)}
button:active{transform:translateY(3px);border-bottom-width:2px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
button.act{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 22px var(--c),0 5px 12px rgba(0,0,0,.45)}
</style></head><body>

 ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;
 ctx.lineCap="round";ctx.shadowColor="#fff";ctx.shadowBlur=14;
 ctx.strokeStyle="#1d9bff";ctx.lineWidth=s*.34;
 ctx.beginPath();ctx.moveTo(0,s);ctx.lineTo(0,0);ctx.moveTo(0,0);ctx.lineTo(-s*.8,-s*.9);ctx.moveTo(0,0);ctx.lineTo(s*.8,-s*.9);ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle="rgba(255,255,255,.65)";ctx.lineWidth=s*.1;ctx.stroke();
 ctx.restore();
}
function loop(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 ctx.clearRect(0,0,cv.width,cv.height);ctx.save();ctx.scale(1.5,1.5);
 eff.forEach(function(o){
  var e=o.e;
  if(e.ring){
   for(var i=0;i<2;i++){var ph=((now/1400)+i*.5)%1;
    ctx.globalAlpha=(1-ph)*.9;ctx.lineWidth=7;ctx.strokeStyle=e.ring[3];ctx.shadowColor=e.ring[3];ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(e.ring[0],e.ring[1],e.ring[2]*(.45+.75*ph),0,6.2832);ctx.stroke();}
   ctx.shadowBlur=0;return;
  }
  o.acc+=dt*e.rate;
  while(o.acc>=1){o.acc-=1;parts.push({e:e,t:0,dur:1.5+Math.random()*.6,j:[(Math.random()-.5)*40,(Math.random()-.5)*40],rot:(Math.random()-.5)*.8})}
 });
 parts=parts.filter(function(p){
  p.t+=dt/p.dur;if(p.t>=1)return false;
  var e=p.e,t=p.t,u=1-t;
  var x0=e.f[0]+p.j[0],y0=e.f[1]+p.j[1],x2=e.t[0]+p.j[0]*.4,y2=e.t[1]+p.j[1]*.4;
  var x1=(x0+x2)/2+e.b[0],y1=(y0+y2)/2+e.b[1];
  var x=u*u*x0+2*u*t*x1+t*t*x2,y=u*u*y0+2*u*t*y1+t*t*y2;
  var a=t<.12?t/.12:(t>.8?(1-t)/.2:1);
  if(e.y){Yglyph(x,y,16,a,p.rot+t*2)}
  else{ctx.globalAlpha=a;ctx.fillStyle=e.col;ctx.shadowColor=e.col;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(x,y,e.r,0,6.2832);ctx.fill();ctx.shadowBlur=0;
   ctx.globalAlpha=a*.9;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x-e.r*.25,y-e.r*.25,e.r*.35,0,6.2832);ctx.fill();}
  return true;
 });
 ctx.restore();
 if(eff.length)raf=requestAnimationFrame(loop);else raf=0;
}
function go(k,instant){
 cur=k;var d=D[k],k1=vw/W;
 document.querySelectorAll("#bar button[data-k]").forEach(function(b){b.classList.toggle("act",b.dataset.k===k)});
 if(instant)scene.style.transition="none";
 if(!d.z){scene.style.transform="translate(0,0) scale(1)";spot.classList.remove("on");drift.classList.remove("on");document.body.classList.remove("zoomed");}
 else{
  var z=d.z,rw=z[2]-z[0],rh=z[3]-z[1],s=Math.min(Math.min(W/rw,H/rh)*.96,2.6);
  var tx=vw/2-(z[0]+rw/2)*k1*s,ty=vh/2-(z[1]+rh/2)*k1*s;
  scene.style.transform="translate("+tx+"px,"+ty+"px) scale("+s+")";
  var q=d.q;spot.style.left=q[0]/W*100+"%";spot.style.top=q[1]/H*100+"%";spot.style.width=(q[2]-q[0])/W*100+"%";spot.style.height=(q[3]-q[1])/H*100+"%";
  spot.style.setProperty("--c",d.c);spot.style.setProperty("--inv",1/s);
  spot.classList.add("on");drift.classList.add("on");document.body.classList.add("zoomed");
 }
 if(instant){void scene.offsetWidth;scene.style.transition="";}
 setEff(lensOn?null:d.e);
 var h='<span class="t" style="--c:'+d.c+'">'+d.n+'</span>';
 d.p.forEach(function(t){h+='<span class="p">'+t+'</span>'});
 cap.innerHTML=h;
}
function manual(k){stopTour();if(lensOn)setLens(false);go(k)}
function stopTour(){if(timer){clearInterval(timer);timer=null;$("#tour").innerHTML="&#9654; Auto Tour";$("#tour").classList.remove("act")}}
function startTour(){
 if(lensOn)setLens(false);
 var i=0;go(order[0]);
 $("#tour").innerHTML="&#10074;&#10074; Pause Tour";$("#tour").classList.add("act");
 timer=setInterval(function(){i=(i+1)%order.length;go(order[i])},5000);
}
function setLens(on){
 lensOn=on;document.body.classList.toggle("lens",on);$("#lensBtn").classList.toggle("act",on);
 if(on){stopTour();go("o");setEff(null);cap.innerHTML='<span class="t" style="--c:#0d9488">Magnifier</span><span class="p">Move the mouse over the picture</span><span class="p">Scroll the mouse wheel to change magnification</span>';lens.style.backgroundImage="url("+im.src+")";}
 else{lens.style.display="none";go(cur)}
}
function moveLens(e){
 var r=view.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(x<0||y<0||x>r.width||y>r.height){lens.style.display="none";return}
 var L=230;lens.style.display="block";lens.style.left=(x-L/2)+"px";lens.style.top=(y-L/2)+"px";
 lens.style.backgroundSize=(vw*mag)+"px "+(vh*mag)+"px";
 lens.style.backgroundPosition=(-(x*mag-L/2+5))+"px "+(-(y*mag-L/2+5))+"px";
}
view.addEventListener("mousemove",function(e){
 if(lensOn){moveLens(e);return}
 var r=view.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
 tilt.style.transform="rotateX("+(-py*6)+"deg) rotateY("+(px*8)+"deg)";
});
view.addEventListener("mouseleave",function(){tilt.style.transform="";lens.style.display="none"});
view.addEventListener("wheel",function(e){if(!lensOn)return;e.preventDefault();mag=Math.max(2,Math.min(6,mag+(e.deltaY<0?.4:-.4)));moveLens(e)},{passive:false});
document.querySelectorAll("[data-k]").forEach(function(el){el.addEventListener("click",function(){manual(el.dataset.k)})});
$("#tour").addEventListener("click",function(){timer?stopTour():startTour()});
$("#lensBtn").addEventListener("click",function(){setLens(!lensOn)});
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
function fsLabel(){$("#fs").innerHTML=isFs()?"&#10006; Exit Full Screen":"&#9974; Full Screen";setTimeout(fit,60)}
$("#fs").addEventListener("click",function(){
 if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
 else{(app.requestFullscreen||app.webkitRequestFullscreen).call(app)}
});
document.addEventListener("fullscreenchange",fsLabel);document.addEventListener("webkitfullscreenchange",fsLabel);
window.addEventListener("resize",fit);
document.addEventListener("keydown",function(e){
 var i=navOrder.indexOf(cur),n=navOrder.length;
 if(e.key==="ArrowRight"){manual(navOrder[(i+1)%n])}
 else if(e.key==="ArrowLeft"){manual(navOrder[(i+n-1)%n])}
 else if(e.key==="f"||e.key==="F"){$("#fs").click()}
});
fit();
})();
