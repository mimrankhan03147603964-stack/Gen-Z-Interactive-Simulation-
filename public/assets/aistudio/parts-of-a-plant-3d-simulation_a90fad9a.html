<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts of a Plant and Their Functions - 3D Simulation</title>
<style>
:root{--flower:#f0412b;--leaf:#1e9e2c;--stem:#7b21c8;--roots:#d1620f;--ink:#17324d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#cfeeff}
#app{display:flex;height:100vh;gap:14px;padding:14px}
#stage{position:relative;flex:1;min-width:0;border-radius:26px;overflow:hidden;background:linear-gradient(#8fd6ff 0%,#d9f2ff 55%,#fff 100%);box-shadow:0 12px 40px rgba(20,80,140,.3);cursor:grab;touch-action:none;transition:background 1s}
#stage.cloudy{background:linear-gradient(#9fb3c4 0%,#cfdbe4 60%,#f1f4f6 100%)}
#stage:active{cursor:grabbing}
#world,.g{position:absolute;left:0;top:0;transform-style:preserve-3d}
#world{width:1536px;height:1024px;transform-origin:768px 540px}
.g{width:0;height:0}
.sl{position:absolute;background-size:100% 100%;background-repeat:no-repeat;filter:brightness(var(--b,1));transition:filter .3s,opacity .3s;pointer-events:none}
.sl.dim{opacity:.4}
.sl.sel{filter:brightness(calc(var(--b,1)*1.1)) drop-shadow(0 0 10px var(--gl)) drop-shadow(0 0 26px var(--gl))}
[data-part=flower]{--gl:#ffe14d}[data-part=leaf]{--gl:#8dff6a}[data-part=stem]{--gl:#e2b3ff}[data-part=roots]{--gl:#ffb24d}
.lab{pointer-events:auto;cursor:pointer;filter:brightness(var(--b,1)) drop-shadow(0 12px 8px rgba(0,0,0,.28))}
.lab.sel{filter:brightness(1.08) drop-shadow(0 0 10px var(--gl)) drop-shadow(0 0 26px var(--gl))}
#fx{position:absolute;left:0;top:0;width:1536px;height:1024px;pointer-events:none}
.hs{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #fff;background:var(--c);display:grid;place-items:center;font-size:22px;cursor:pointer;animation:pulse 1.8s infinite;box-shadow:0 4px 10px rgba(0,0,0,.3)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c),0 4px 10px rgba(0,0,0,.3)}70%{box-shadow:0 0 0 18px transparent,0 4px 10px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 0 transparent,0 4px 10px rgba(0,0,0,.3)}}
.sun{position:absolute;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;background:radial-gradient(circle,#fffbd0 0 30%,#ffe14d 31% 52%,rgba(255,200,40,.0) 70%);transition:opacity 1s}
.sun::before{content:"";position:absolute;inset:-60px;border-radius:50%;background:repeating-conic-gradient(rgba(255,225,80,.55) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 72%);mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 72%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl{position:absolute;animation:drift 36s ease-in-out infinite alternate}
.cl i{position:absolute;display:block;background:#fff;border-radius:50%;opacity:.9}
@keyframes drift{to{transform:translateX(260px)}}
#panel{width:370px;flex:none;overflow:auto;background:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 40px rgba(20,80,140,.22)}
h1{margin:0;font-size:28px;line-height:1.1}
.sub{margin:6px 0 14px;font-size:15px;color:#4b6178}
#parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pb{border:3px solid var(--c);background:#fff;border-radius:16px;padding:8px 10px;text-align:left;font:inherit;cursor:pointer;color:var(--ink);transition:transform .15s,background .2s}
.pb:hover{transform:translateY(-2px) scale(1.03)}
.pb.on{background:var(--c);color:#fff}
.pb b{display:block;font-size:18px}.pb span{font-size:13px;opacity:.85}
#info{margin:14px 0;border-radius:18px;padding:14px;background:#f3faff;border:2px solid #d4ebfa;min-height:190px}
#info h2{margin:0 0 4px;font-size:22px}
#info .fn{display:inline-block;color:#fff;border-radius:99px;padding:2px 12px;font-size:15px;margin-bottom:8px}
#info ul{margin:6px 0;padding-left:20px;font-size:15px;line-height:1.35}
#info .try{margin-top:8px;font-size:14px;background:#fff7d6;border-radius:12px;padding:8px 10px}
#ctl{display:grid;gap:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.sw u{position:absolute;inset:0;border-radius:99px;background:#c3d2de;transition:.2s}
.sw u::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+u{background:#26b04a}.sw input:checked+u::after{left:23px}
.sw input:focus-visible+u{outline:3px solid #4aa3ff}
input[type=range]{width:150px;accent-color:#26b04a}
.btns{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;border:0;border-radius:14px;padding:10px;font:inherit;font-size:15px;color:#fff;background:#2f7de1;cursor:pointer}
.btn.q{background:#f08a1c}.btn:hover{filter:brightness(1.08)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:10px;color:#4b6178}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#hint{position:absolute;left:16px;bottom:12px;font-size:14px;background:rgba(255,255,255,.8);border-radius:99px;padding:4px 14px;pointer-events:none}
@media (max-width:900px){#app{flex-direction:column;height:auto}#stage{height:70vw;flex:none}#panel{width:auto}}
</style>
</head>
<body>
<div id="app">
 <div id="stage"><div id="world"></div><div id="hint">Drag to turn the plant. Scroll to zoom.</div></div>
 <aside id="panel">
  <h1>Parts of a Plant</h1>
  <p class="sub">Tap a part to see what it does.</p>
  <div id="parts"></div>
  <div id="info"></div>
  <div id="ctl">
   <label class="row">Wind <input type="range" id="wind" min="0" max="2" step="0.05" value="1"></label>
   <label class="row">Sunlight<span class="sw"><input type="checkbox" id="tSun" checked><u></u></span></label>
   <label class="row">Water and food flow<span class="sw"><input type="checkbox" id="tWater" checked><u></u></span></label>
   <label class="row">Falling seeds<span class="sw"><input type="checkbox" id="tSeeds"><u></u></span></label>
   <label class="row">Turn automatically<span class="sw"><input type="checkbox" id="tAuto" checked><u></u></span></label>
   <label class="row">Exploded 3D view<span class="sw"><input type="checkbox" id="tExp"><u></u></span></label>
   <div class="btns"><button class="btn" id="reset">Reset view</button><button class="btn q" id="quiz">Start quiz</button></div>
  </div>
  <div class="legend"><span><i style="background:#2fb4ff"></i>Water goes up</span><span><i style="background:#ffc400"></i>Food goes down</span><span><i style="background:#ffe14d"></i>Sunlight</span></div>
 </aside>
</div>

 leaf:{name:'Leaf',emoji:'🍃',c:'#1e9e2c',fn:'Makes food',facts:['Leaves catch sunlight with a green material called chlorophyll.','They take in air and use water to make sugar. This is called photosynthesis.','Leaves also give out fresh oxygen for us to breathe.'],tip:'Turn Sunlight on and off. Watch the sunlight dots reach the leaves.'},
 stem:{name:'Stem',emoji:'🌿',c:'#7b21c8',fn:'Supports the plant',facts:['The stem holds the leaves and flower up in the light.','It has tiny tubes inside, like straws.','Water goes up the tubes. Food comes down the tubes.'],tip:'Watch the blue drops go up and the gold drops come down.'},
 roots:{name:'Roots',emoji:'🌱',c:'#d1620f',fn:'Absorbs water and minerals',facts:['Roots hold the plant firmly in the soil.','Tiny root hairs soak up water and minerals.','The water is sent up to the stem and leaves.'],tip:'Watch the blue drops move from the roots into the stem.'}
};
const order=['flower','leaf','stem','roots'];
const S={wind:1,sun:true,water:true,seeds:false,auto:true,exp:false};
let sel=null,quiz=null,ex=0,exT=0,uRY=0,uRX=8,zoom=1,fit=1,sw=1000,sh=700,moved=0;
if(matchMedia('(prefers-reduced-motion: reduce)').matches){S.wind=.2;S.auto=false;$('#tAuto').checked=false;$('#wind').value=.2}
/* ---------- build scene ---------- */
const ALL=[];
function mk(cls,par){const d=document.createElement('div');if(cls)d.className=cls;par.appendChild(d);return d}
function grp(par,ox,oy){const g=mk('g',par);g.style.transformOrigin=ox+'px '+oy+'px';return g}
function layer(key,par,o){const m=M[key],e=mk('sl'+(o.cls?' '+o.cls:''),par);
 Object.assign(e.style,{left:m.x+'px',top:m.y+'px',width:m.w+'px',height:m.h+'px',backgroundImage:'url('+U[key]+')'});
 if(o.b!=null)e.style.setProperty('--b',o.b);
 if(o.part)e.dataset.part=o.part;
 const r={e,z:o.z||0,exz:o.exz||0,sx:o.sx||1,sy:o.sy||1,ex:o.extra||null,part:o.part,last:null};ALL.push(r);return r}
function el(par,css,cls){const d=mk(cls||'',par);Object.assign(d.style,css);return d}
// sky decor (far back)
const SUN=[150,270];
const sunEl=el(world,{left:SUN[0]+'px',top:SUN[1]+'px',transform:'translateZ(-260px)'},'sun');
[[1000,170,1],[300,120,.8],[1250,430,.9]].forEach((c,i)=>{const w=el(world,{left:c[0]+'px',top:c[1]+'px',transform:'translateZ('+(-200-i*30)+'px) scale('+c[2]+')'});const k=mk('cl',w);k.style.animationDelay=(-i*9)+'s';
 [[0,30,120,60],[40,0,90,80],[100,20,110,70],[150,35,90,50]].forEach(a=>el(k,{left:a[0]+'px',top:a[1]+'px',width:a[2]+'px',height:a[3]+'px'}).style.cssText+=';position:absolute;background:#fff;border-radius:50%;opacity:.92')});
layer('banner',world,{z:-140,exz:-200});
for(let i=0;i<12;i++)layer('soil',world,{z:-4-i*9,exz:-60,b:i?Math.max(.5,.96-i*.045):1});
const rootG=grp(world,770,750);
layer('roots',rootG,{z:3,exz:110,part:'roots'});
const plantG=grp(world,770,760);
for(let i=0;i<5;i++){const t=(i-2)/2;layer('stem',plantG,{z:t*7,exz:0,part:'stem',sx:1-Math.abs(t)*.16,b:.88+.12*(1-Math.abs(t))})}
const leafG=[],PIV=[770,760],piv=[];
for(let i=0;i<4;i++){const m=M['leaf'+i];piv[i]=[m.px,m.py];const g=grp(plantG,m.px,m.py);leafG.push(g);
 for(let s=0;s<3;s++)layer('leaf'+i,g,{z:22+(i%2)*10+s*4,exz:140,part:'leaf',b:.8+.1*s})}
const FB=[768,392],fg=grp(plantG,FB[0],FB[1]);
for(let i=0;i<8;i++)layer('flower',fg,{z:58+i*4,exz:300,part:'flower',sx:1-(7-i)*.004,sy:1-(7-i)*.004,b:.74+.26*i/7});
// canvas for particles
const fx=document.createElement('canvas');fx.id='fx';fx.width=1536;fx.height=1024;fx.style.transform='translateZ(125px)';world.appendChild(fx);
const ctx=fx.getContext('2d');
// labels
const wob=(a,s)=>t=>' rotateY('+(3.5*Math.sin(t*1.1+s))+'deg) translateZ('+(a*Math.sin(t*1.3+s))+'px)';
const labs={};
[['flower','lab_flower',0],['leaf','lab_leaf',1.5],['stem','lab_stem',3],['roots','lab_roots',4.5]].forEach(a=>{
 labs[a[0]]=layer(a[1],world,{z:150,exz:150,part:a[0],cls:'lab',extra:wob(10,a[2])});labs[a[0]].e.addEventListener('click',()=>{if(moved<6)pick(a[0])})});
layer('arrow_roots',world,{z:140,exz:140,part:'roots',extra:wob(8,4.5)});
// hotspots
const hsList=[];
function hot(par,x,y,part,z){const h=mk('hs',par);h.style.left=x+'px';h.style.top=y+'px';h.style.setProperty('--c',P[part].c);h.textContent=P[part].emoji;h.title=P[part].name;h.setAttribute('role','button');
 h.addEventListener('click',()=>{if(moved<6)pick(part)});hsList.push({h,z});}
hot(fg,FB[0]-20,260,'flower',190);hot(leafG[1],560,500,'leaf',190);hot(plantG,772,470,'stem',190);hot(rootG,770,905,'roots',190);
/* ---------- panel ---------- */
const partsEl=$('#parts');
order.forEach(k=>{const b=document.createElement('button');b.className='pb';b.style.setProperty('--c',P[k].c);b.dataset.k=k;b.innerHTML='<b>'+P[k].emoji+' '+P[k].name+'</b><span>'+P[k].fn+'</span>';b.onclick=()=>pick(k);partsEl.appendChild(b)});
function showInfo(){const i=$('#info');
 if(quiz){i.innerHTML=quiz.html;return}
 if(!sel){i.innerHTML='<h2>Meet the plant</h2><p>This sunflower has four main parts. Each part has its own job.</p><ul><li>The flower makes seeds.</li><li>The leaves make food.</li><li>The stem holds the plant up.</li><li>The roots drink water from the soil.</li></ul>';return}
 const p=P[sel];i.style.borderColor=p.c;i.innerHTML='<h2>'+p.emoji+' '+p.name+'</h2><span class="fn" style="background:'+p.c+'">'+p.fn+'</span><ul>'+p.facts.map(f=>'<li>'+f+'</li>').join('')+'</ul><div class="try">Try this: '+p.tip+'</div>'}
function applySel(){ALL.forEach(r=>{if(!r.part)return;r.e.classList.toggle('sel',r.part===sel);r.e.classList.toggle('dim',!!sel&&r.part!==sel)});
 document.querySelectorAll('.pb').forEach(b=>b.classList.toggle('on',b.dataset.k===sel))}
function pick(k){
 if(quiz&&quiz.q){const ok=k===quiz.q.a;quiz.n++;if(ok)quiz.s++;
  quiz.html='<h2>'+(ok?'Great job! ✅':'Not quite ❌')+'</h2><p>'+(ok?'Yes, the '+P[k].name.toLowerCase()+' '+P[k].fn.toLowerCase()+'.':'That was the '+P[k].name.toLowerCase()+'. The answer is the '+P[quiz.q.a].name.toLowerCase()+'.')+'</p><p><b>Score: '+quiz.s+' / '+quiz.n+'</b></p>';
  sel=quiz.q.a;quiz.q=null;applySel();showInfo();setTimeout(nextQ,2200);burst(sel);return}
 sel=(sel===k&&!quiz)?null:k;applySel();showInfo();if(sel)burst(sel)}
const QS=[['Which part makes food for the plant?','leaf'],['Which part produces seeds?','flower'],['Which part absorbs water and minerals?','roots'],['Which part supports the plant?','stem'],['Which part is in the soil?','roots'],['Which part holds the plant up in the sunlight?','stem'],['Which part catches sunlight?','leaf'],['Which bright part attracts bees?','flower']];
function nextQ(){if(!quiz)return;if(quiz.n>=6){quiz.html='<h2>Quiz finished! 🎉</h2><p><b>Your score: '+quiz.s+' / '+quiz.n+'</b></p><p>Press "Stop quiz" and explore again.</p>';quiz.q=null;showInfo();return}
 const q=QS[Math.floor(Math.random()*QS.length)];quiz.q={t:q[0],a:q[1]};sel=null;applySel();quiz.html='<h2>Quiz time! 🧠</h2><p style="font-size:18px"><b>'+q[0]+'</b></p><p>Tap a part on the plant or in the list.</p><p>Score: '+quiz.s+' / '+quiz.n+'</p>';showInfo()}
$('#quiz').onclick=function(){if(quiz){quiz=null;this.textContent='Start quiz';showInfo();return}quiz={s:0,n:0,q:null,html:''};this.textContent='Stop quiz';nextQ()};
['wind','tSun','tWater','tSeeds','tAuto','tExp'].forEach(id=>{const e=$('#'+id);e.oninput=()=>{S.wind=+$('#wind').value;S.sun=$('#tSun').checked;S.water=$('#tWater').checked;S.seeds=$('#tSeeds').checked;S.auto=$('#tAuto').checked;S.exp=$('#tExp').checked;exT=S.exp?1:0;sunEl.style.opacity=S.sun?1:.12;stage.classList.toggle('cloudy',!S.sun)}});
$('#reset').onclick=()=>{uRY=0;uRX=8;zoom=1;$('#tExp').checked=false;S.exp=false;exT=0};
/* ---------- view control ---------- */
function resize(){const r=stage.getBoundingClientRect();sw=r.width;sh=r.height;fit=Math.min(sw/1536,sh/1024)*.97}
new ResizeObserver(resize).observe(stage);resize();
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ry:uRY,rx:uRX};moved=0});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));uRY=Math.max(-60,Math.min(60,drag.ry+dx*.3));uRX=Math.max(-12,Math.min(30,drag.rx-dy*.2))});
addEventListener('pointerup',()=>{drag=null;setTimeout(()=>moved=0,0)});
stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.9,zoom*(e.deltaY<0?1.08:.93)))},{passive:false});
/* ---------- particles ---------- */
function sprite(sz,stops){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),g=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,sz,sz);return c}
const spW=sprite(40,[[0,'#fff'],[.25,'#8fdcff'],[.55,'rgba(47,180,255,.9)'],[1,'rgba(47,180,255,0)']]);
const spF=sprite(40,[[0,'#fffbe0'],[.3,'#ffd84a'],[.6,'rgba(255,180,0,.9)'],[1,'rgba(255,180,0,0)']]);
const spP=sprite(36,[[0,'#fff'],[.3,'#fff3a0'],[1,'rgba(255,225,80,0)']]);
const seedSp=(()=>{const c=document.createElement('canvas');c.width=18;c.height=32;const x=c.getContext('2d');x.translate(9,16);x.fillStyle='#3a2a22';x.beginPath();x.ellipse(0,0,7,14,0,0,7);x.fill();x.fillStyle='#f3efe6';for(const dx of[-3.5,0,3.5]){x.fillRect(dx-.8,-11,1.6,22)}x.globalCompositeOperation='destination-in';x.beginPath();x.ellipse(0,0,7,14,0,0,7);x.fill();return c})();
const parts_=[],rings=[],seeds=[];
let th=0,phi=[0,0,0,0],nod=0;
function rot(p,c,d){const a=d*Math.PI/180,s=Math.sin(a),co=Math.cos(a),dx=p[0]-c[0],dy=p[1]-c[1];return[c[0]+dx*co-dy*s,c[1]+dx*s+dy*co]}
function tf(fr,p){if(fr==='r')return p;if(fr==='s')return rot(p,PIV,th);if(fr==='f')return rot(rot(p,FB,nod),PIV,th);const i=+fr.slice(1);return rot(rot(p,piv[i],phi[i]),PIV,th)}
const lc=i=>{const m=M['leaf'+i];return[m.x+m.w*.5,m.y+m.h*.55]};
const rp=()=>M.rootpts[Math.floor(Math.random()*M.rootpts.length)];
function mkPath(nodes,speed,sp,sz){let c=[0],L=0;for(let i=1;i<nodes.length;i++){L+=Math.hypot(nodes[i][0][0]-nodes[i-1][0][0],nodes[i][0][1]-nodes[i-1][0][1]);c.push(L)}
 if(parts_.length<260)parts_.push({n:nodes,c,L,d:0,v:speed*(.85+Math.random()*.3),sp,sz})}
function water(dest){const p0=rp();const d=dest!=null?dest:(Math.random()<.22?-1:Math.floor(Math.random()*4));
 const n=[[p0,'r'],[[770,800],'r'],[[770,762],'s']];
 if(d<0){n.push([[770,402],'s'],[M.fcenter,'f'])}else{n.push([[770,piv[d][1]],'s'],[piv[d],'l'+d],[lc(d),'l'+d])}
 mkPath(n,150,spW,24);rings.push({x:p0[0],y:p0[1],r:2,life:.7,col:'47,180,255'})}
function food(i){const d=i!=null?i:Math.floor(Math.random()*4);mkPath([[lc(d),'l'+d],[piv[d],'l'+d],[[770,piv[d][1]],'s'],[[770,762],'s'],[[770,800],'r'],[rp(),'r']],130,spF,22)}
function photon(i){const d=i!=null?i:Math.floor(Math.random()*4);mkPath([[SUN,'r'],[lc(d),'l'+d]],650,spP,26);parts_[parts_.length-1]&&(parts_[parts_.length-1].spark=d)}
function seed(){const fc=rot(rot(M.fcenter,FB,nod),PIV,th),a=Math.random()*6.28,r=Math.random()*80;
 if(seeds.length<60)seeds.push({x:fc[0]+Math.cos(a)*r,y:fc[1]+Math.sin(a)*r*.8,vx:(Math.random()-.5)*110,vy:-60-Math.random()*130,rt:Math.random()*6,vr:(Math.random()-.5)*7,life:0,hit:0})}
function burst(k){if(k==='flower')for(let i=0;i<14;i++)seed();if(k==='roots')for(let i=0;i<14;i++)water();if(k==='leaf'){for(let i=0;i<4;i++){photon(i);food(i)}}if(k==='stem'){for(let i=0;i<8;i++){water();food()}}}
let acc={w:0,f:0,p:0,s:0};
function fxStep(dt,t){
 ctx.clearRect(0,0,1536,1024);
 if(S.water){acc.w+=dt*7;while(acc.w>1){acc.w--;water()}acc.f+=dt*(S.sun?3:0);while(acc.f>1){acc.f--;food()}}
 if(S.sun){acc.p+=dt*8;while(acc.p>1){acc.p--;photon()}
  for(let i=0;i<4;i++){const e=tf('l'+i,lc(i)),g=ctx.createLinearGradient(SUN[0],SUN[1],e[0],e[1]);g.addColorStop(0,'rgba(255,230,90,.28)');g.addColorStop(1,'rgba(255,230,90,.02)');ctx.strokeStyle=g;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(SUN[0],SUN[1]);ctx.lineTo(e[0],e[1]);ctx.stroke()}}
 if(S.seeds){acc.s+=dt*1.6;while(acc.s>1){acc.s--;seed()}}
 for(let i=parts_.length-1;i>=0;i--){const p=parts_[i];p.d+=p.v*dt;if(p.d>=p.L){if(p.spark!=null){const e=tf('l'+p.spark,lc(p.spark));rings.push({x:e[0],y:e[1],r:4,life:.6,col:'255,235,90'})}parts_.splice(i,1);continue}
  let k=1;while(k<p.c.length-1&&p.c[k]<p.d)k++;const a=p.n[k-1],b=p.n[k],f=(p.d-p.c[k-1])/Math.max(1e-6,p.c[k]-p.c[k-1]),A=tf(a[1],a[0]),B=tf(b[1],b[0]);
  const x=A[0]+(B[0]-A[0])*f,y=A[1]+(B[1]-A[1])*f;ctx.globalAlpha=Math.min(1,p.d/30,(p.L-p.d)/40);ctx.drawImage(p.sp,x-p.sz/2,y-p.sz/2,p.sz,p.sz)}
 ctx.globalAlpha=1;
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;r.r+=dt*70;if(r.life<=0){rings.splice(i,1);continue}ctx.strokeStyle='rgba('+r.col+','+Math.min(1,r.life*1.5)+')';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.45,0,0,6.3);ctx.stroke()}
 for(let i=seeds.length-1;i>=0;i--){const s=seeds[i];s.life+=dt;if(!s.hit){s.vy+=420*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rt+=s.vr*dt;if(s.y>770&&s.vy>0){if(s.hit===0&&Math.abs(s.vy)>120){s.vy*=-.3;s.vx*=.5;s.hit=-1}else{s.hit=1;s.y=770}}}else s.life+=dt;
  if(s.hit===-1&&s.y>770&&s.vy>0)s.hit=1;
  if(s.life>7){seeds.splice(i,1);continue}ctx.save();ctx.globalAlpha=s.life>5?Math.max(0,(7-s.life)/2):1;ctx.translate(s.x,s.y);ctx.rotate(s.rt);ctx.drawImage(seedSp,-9,-16,18,32);ctx.restore()}
}
/* ---------- main loop ---------- */
let last=performance.now(),t0=last,lastEx=-1;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
 ex+=(exT-ex)*Math.min(1,dt*4);
 const ry=uRY+(S.auto?16*Math.sin(t*.45):0),rx=uRX+(S.auto?3*Math.sin(t*.3):0);
 world.style.transform='translate('+(sw-1536)/2+'px,'+(sh-1024)/2+'px) perspective(2800px) rotateX('+rx+'deg) rotateY('+ry+'deg) scale3d('+fit*zoom+','+fit*zoom+','+fit*zoom+')';
 const w=S.wind;th=w*(1.8*Math.sin(t*.9)+.8*Math.sin(t*1.9+1))+.25*Math.sin(t*.7);
 plantG.style.transform='rotateZ('+th+'deg) rotateY('+th*.7+'deg)';
 for(let i=0;i<4;i++){phi[i]=w*(3.5*Math.sin(t*2.2+i*1.7)+1.5*Math.sin(t*3.1+i))+1.2*Math.sin(t*1.1+i*2);const fl=w*10*Math.sin(t*1.8+i)+4*Math.sin(t*.9+i);leafG[i].style.transform='rotateZ('+phi[i]+'deg) rotateY('+fl+'deg)'}
 nod=th*.8+2*Math.sin(t*.8);fg.style.transform='rotateZ('+nod+'deg) rotateY('+(14*Math.sin(t*.5))+'deg)';
 rootG.style.transform='rotateZ('+th*.25+'deg) scale(1,'+(1+.012*Math.sin(t*1.4))+')';
 const exch=Math.abs(ex-lastEx)>1e-4;lastEx=ex;
 for(const r of ALL){if(!exch&&!r.ex&&r.last!==null)continue;r.last=1;r.e.style.transform='translateZ('+(r.z+ex*r.exz)+'px)'+(r.sx!==1||r.sy!==1?' scale('+r.sx+','+r.sy+')':'')+(r.ex?r.ex(t):'')}
 fx.style.transform='translateZ('+(125+ex*200)+'px)';
 for(const h of hsList)h.h.style.transform='translateZ('+(h.z+ex*250)+'px) rotateX('+-rx+'deg) rotateY('+-ry+'deg)';
 fxStep(dt,t);requestAnimationFrame(frame)}
showInfo();applySel();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
