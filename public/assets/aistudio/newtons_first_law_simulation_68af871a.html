<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Arial,sans-serif}

.scene{perspective:1400px;width:min(96vw,calc((100vh - 110px)*1.5))}

button:hover{filter:brightness(1.12)}button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#bPlay{background:#16a34a}#bForce{background:#ea580c}#bReset{background:#2563eb}#bFull{background:#7c3aed}
#info{color:#cbd5e1;font-size:15px;min-width:300px;text-align:center}

 <div class="bar">
  <button id="bPlay">▶ Start</button>
  <button id="bForce">Apply Force</button>
  <button id="bReset">↺ Reset</button>
  <button id="bFull">⛶ Full Screen</button>
  <span id="info">Left ball: 0.0 m/s &nbsp;|&nbsp; Right ball: 2.2 m/s</span>

</div>
<script>
(function(){
var W=1536,H=1024,R=120,CY=717,GY=842;
var $=function(i){return document.getElementById(i)};
var bg=$('bg'),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),scene=$('scene'),wrap=$('wrap');
var bPlay=$('bPlay'),info=$('info'),bFull=$('bFull');
var active=false,run=false,force=0,k=1,last=0,lastTxt='';
var balls;
function init(){balls=[{x:399,sx:399,v:0,rot:0,c0:70,c1:728,lx:402},{x:1145,sx:1145,v:220,rot:0,c0:770,c1:1278,lx:1107}];force=0;}
init();
function size(){var d=Math.min(window.devicePixelRatio||1,2),w=stage.clientWidth;cv.width=Math.round(w*d);cv.height=Math.round(w*d*H/W);k=cv.width/W;if(active)draw();}
if(window.ResizeObserver)new ResizeObserver(size).observe(stage);window.addEventListener('resize',size);size();

function tiles(c0,c1){for(var x=c0;x<c1;x+=160)ctx.drawImage(bg,1300,822,160,68,x,822,160,68);}
function arrow(x1,x2,y,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x1,y-13);ctx.lineTo(x2-30,y-13);ctx.lineTo(x2-30,y-32);ctx.lineTo(x2,y);ctx.lineTo(x2-30,y+32);ctx.lineTo(x2-30,y+13);ctx.lineTo(x1,y+13);ctx.closePath();ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(k,0,0,k,0,0);
 balls.forEach(function(b){
  /* label while force is applied */
  if(force>0){
   ctx.fillStyle='#fff';ctx.fillRect(b.lx-125,470,250,124);
   rr(b.lx-115,475,230,65,20);ctx.fillStyle='#ffe8d1';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#ea580c';ctx.stroke();
   ctx.fillStyle='#7c2d12';ctx.font='bold 46px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Net Force',b.lx,509);
   ctx.fillStyle='#e11d1d';ctx.beginPath();ctx.moveTo(b.lx-8,540);ctx.lineTo(b.lx+8,540);ctx.lineTo(b.lx+8,562);ctx.lineTo(b.lx+22,562);ctx.lineTo(b.lx,592);ctx.lineTo(b.lx-22,562);ctx.lineTo(b.lx-8,562);ctx.fill();
  }
  ctx.save();ctx.beginPath();ctx.rect(b.c0,593,b.c1-b.c0,297);ctx.clip();
  ctx.fillStyle='#fff';ctx.fillRect(b.c0,593,b.c1-b.c0,231);tiles(b.c0,b.c1);
  /* 3D ground shadow */
  ctx.save();ctx.translate(b.x,GY);ctx.scale(1,.13);var g=ctx.createRadialGradient(0,0,10,0,0,112);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,112,0,7);ctx.fill();ctx.restore();
  /* motion trails */
  if(Math.abs(b.v)>40){var len=Math.min(Math.abs(b.v)*.4,300);for(var i=0;i<6;i++){var y=630+i*32,x2=b.x-R*.8,x1=x2-len*(1-Math.abs(i-2.5)*.1);var gr=ctx.createLinearGradient(x1,0,x2,0);gr.addColorStop(0,'rgba(80,80,80,0)');gr.addColorStop(1,'rgba(80,80,80,.55)');ctx.strokeStyle=gr;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();}}
  /* ball (rolling) */
  ctx.save();ctx.translate(b.x,CY);ctx.beginPath();ctx.arc(0,0,R-1,0,7);ctx.clip();
  ctx.save();ctx.rotate(b.rot);ctx.drawImage(bg,b.sx-R,CY-R,2*R,2*R,-R,-R,2*R,2*R);ctx.restore();
  var h=ctx.createRadialGradient(-38,-46,5,-20,-20,R*1.25);h.addColorStop(0,'rgba(255,255,255,.28)');h.addColorStop(.5,'rgba(255,255,255,0)');h.addColorStop(1,'rgba(0,0,0,.22)');ctx.fillStyle=h;ctx.fillRect(-R,-R,2*R,2*R);
  ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle='#1a1a1a';ctx.beginPath();ctx.arc(b.x,CY,R-1.5,0,7);ctx.stroke();
  /* force arrow */
  if(force>0){arrow(b.x-R-125,b.x-R-8,CY,'#ea580c');}
  ctx.restore();
 });
}
function step(t){
 var dt=Math.min((t-last)/1000||0,.05);last=t;
 if(active&&run){
  balls.forEach(function(b){
   if(force>0)b.v+=520*dt;
   b.x+=b.v*dt;b.rot+=b.v*dt/R;
   if(b.x-R>b.c1)b.x=b.c0-R;
  });
  if(force>0)force=Math.max(0,force-dt);
  draw();
  var s='Left ball: '+(balls[0].v/100).toFixed(1)+' m/s  |  Right ball: '+(balls[1].v/100).toFixed(1)+' m/s'+(force>0?'  |  Net force acting':'  |  Net force = 0');
  if(s!==lastTxt){info.textContent=s;lastTxt=s;}
 }
 requestAnimationFrame(step);
}
function setRun(r){run=r;bPlay.textContent=r?'❚❚ Pause':'▶ Start';bPlay.style.background=r?'#d97706':'#16a34a';}
function begin(){if(!active){active=true;draw();}}
bPlay.onclick=function(){begin();setRun(!run);};
$('bForce').onclick=function(){begin();force=.8;setRun(true);};
$('bReset').onclick=function(){active=false;setRun(false);init();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);lastTxt='';info.textContent='Left ball: 0.0 m/s  |  Right ball: 2.2 m/s';};
bFull.onclick=function(){var d=document;
 if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
 else{(wrap.requestFullscreen||wrap.webkitRequestFullscreen).call(wrap);}};
function fs(){var on=document.fullscreenElement||document.webkitFullscreenElement;bFull.textContent=on?'✕ Exit Full Screen':'⛶ Full Screen';setTimeout(size,100);}
document.addEventListener('fullscreenchange',fs);document.addEventListener('webkitfullscreenchange',fs);
/* subtle 3D tilt */
scene.addEventListener('mousemove',function(e){var r=scene.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;stage.style.transform='rotateY('+(px*7)+'deg) rotateX('+(-py*5)+'deg)';});
scene.addEventListener('mouseleave',function(){stage.style.transform='';});
requestAnimationFrame(step);
})();
