<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push and Pull Forces</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:#fff;font-family:"Segoe UI",Verdana,Arial,sans-serif;overflow:hidden;background:#0b2a4a}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;background:radial-gradient(ellipse at center,#14477a 0%,#071b31 100%)}
#view{perspective:1500px;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;width:100%}
#scene{position:relative;width:min(100%,calc((100vh - 92px)*1536/1024));aspect-ratio:1536/1024;transition:transform .15s ease-out;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.4)}
#scene img,#scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene img{user-select:none;-webkit-user-drag:none}
#bar{display:flex;gap:10px;flex:none;flex-wrap:wrap;justify-content:center}
button{font:700 16px "Segoe UI",Verdana,Arial,sans-serif;color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid #ffe94a;outline-offset:3px}
.r{background:linear-gradient(#ee4a4a,#c42020)}.g{background:linear-gradient(#2fbf4f,#1a8a34)}.b{background:linear-gradient(#3b71f0,#1238a0)}.o{background:linear-gradient(#ff9a3c,#d9650a)}.p{background:linear-gradient(#9a4fe0,#5b21a8)}.k{background:linear-gradient(#6b7a90,#3b475a)}
</style></head><body>
