<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertebrates and Invertebrates – Interactive Simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b1e3a;font-family:Segoe UI,Arial,sans-serif;color:#fff;overflow:hidden}
#app{display:flex;height:100vh;background:linear-gradient(135deg,#0b1e3a,#16407a)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#box{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #0008;background:#fff}
#fit{width:1536px;height:1024px;transform-origin:0 0;position:absolute;left:0;top:0}
#cv{width:1536px;height:1024px;display:block}
#cap{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#000c;padding:9px 22px;border-radius:22px;font-size:17px;font-weight:600;text-align:center;display:none;border:2px solid #ffd93d;z-index:3}
#load{position:absolute;color:#fff;font-size:18px}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#0006}
button{font:600 14px Segoe UI,Arial;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;color:#fff;background:#2e6bd6;transition:.15s}
button:hover{filter:brightness(1.2);transform:translateY(-1px)}
button.on{background:#e8a800;color:#222}
#bar .g{background:#1f9d55}#bar .r{background:#c0392b}#bar .p{background:#8e44ad}
#bar label{font-size:13px;display:flex;align-items:center;gap:6px}
#panel{width:300px;background:#f4f8ff;color:#1b2a41;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
#panel h2{font-size:18px;color:#0b3d91}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button{background:#fff;color:#1b2a41;border:2px solid #ffd93d;font-size:13px;padding:7px 4px}
.grid button.v{border-color:#1f9d55}.grid button.i{border-color:#8e44ad}
.grid button.on{background:#ffd93d}
#info{background:#fff;border-radius:10px;padding:12px;border-left:6px solid #e8a800;flex:1;min-height:120px;box-shadow:0 2px 8px #0002}
#info b{font-size:20px;display:block;margin-bottom:4px}
#info span{font-size:12px;color:#fff;border-radius:10px;padding:2px 8px}
#info p{margin-top:8px;font-size:15px;line-height:1.45}
#key{font-size:13px;background:#fff3c4;border-radius:8px;padding:8px;border:1px solid #e8a800}
@media(max-width:900px){#panel{width:220px}}
</style></head><body>
<div id="app">
 <div id="main">
  <div id="stage"><div id="load">Loading…</div><div id="box"><div id="fit"><canvas id="cv" width="1536" height="1024"></canvas></div></div><div id="cap"></div></div>
  <div id="bar">
   <button id="bPlay" class="g">⏸ Pause</button>
   <button data-m="all" class="on">🌍 Show All</button>
   <button data-m="vert">🦁 Vertebrates</button>
   <button data-m="inv">🦋 Invertebrates</button>
   <button data-m="cmp">🔍 Backbone Check</button>
   <button id="bQuiz" class="p">❓ Quiz</button>
   <button id="bReset" class="r">↺ Reset</button>
   <label>Speed <input id="spd" type="range" min="0.25" max="3" step="0.25" value="1"> <b id="spv">1x</b></label>
   <button id="bFull">⛶ Full Screen</button>
  </div>
 </div>
 <div id="panel">
  <h2>🐾 Explore the Animals</h2>
  <div class="grid" id="list"></div>
  <div id="info"><b>Welcome!</b><p>Click any animal (or a button) to see it come alive and learn about it. Try <i>Backbone Check</i> or the <i>Quiz</i>.</p></div>
  <div id="key"><b>Key Difference:</b> Vertebrates have a backbone, while invertebrates do not.</div>
 </div>
</div>

const TURN={lion:1,bird:1,fish:1,frog:1,lizard:1,shark:1,snail:1};
let A=[],bg,lbl,T=0,paused=false,speed=1,focus='all',selA=null,hov=null,parts=[],bt=0,quiz=null,msgT=0;
function init(){
 const src=$('src'),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);
 const id=x.getImageData(0,0,W,H),d=id.data,fg=new Uint8Array(W*H);
 for(let y=310;y<800;y++)for(let xx=0;xx<W;xx++){if(xx>768&&xx<782)continue;const i=(y*W+xx)*4,r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(!(mn>222&&mx-mn<30))fg[y*W+xx]=1}
 LB.forEach(l=>{for(let y=l[2];y<l[3];y++)for(let xx=l[0];xx<l[1];xx++)fg[y*W+xx]=0});
 const lab=new Int32Array(W*H),box=[0],st=[];let n=0;
 for(let s=0;s<W*H;s++){if(fg[s]&&!lab[s]){n++;let x0=W,x1=0,y0=H,y1=0,a=0;st.push(s);lab[s]=n;
  while(st.length){const p=st.pop(),px=p%W,py=(p-px)/W;a++;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const qx=px+dx,qy=py+dy;if(qx<0||qy<0||qx>=W||qy>=H)continue;const q=qy*W+qx;if(fg[q]&&!lab[q]){lab[q]=n;st.push(q)}}}

  if(!bn)return;const[x0,y0,x1,y1]=box[bn],w=x1-x0,h=y1-y0,m=new Uint8Array(w*h),rc=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)m[y*w+xx]=lab[(y+y0)*W+xx+x0]===bn?1:0;

  for(let xx=0;xx<w;xx++){push(xx,0);push(xx,h-1)}for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
  while(q.length){const k=q.pop(),px=k%w,py=(k-px)/w;if(px>0)push(px-1,py);if(px<w-1)push(px+1,py);if(py>0)push(px,py-1);if(py<h-1)push(px,py+1)}
  for(let k=0;k<w*h;k++)if(!rc[k])m[k]=1;
  const dil=(src,r)=>{const t1=new Uint8Array(w*h),t2=new Uint8Array(w*h);
   for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){if(src[y*w+xx]){for(let k=-r;k<=r;k++){const X=xx+k;if(X>=0&&X<w)t1[y*w+X]=1}}}
   for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){if(t1[y*w+xx]){for(let k=-r;k<=r;k++){const Y=y+k;if(Y>=0&&Y<h)t2[Y*w+xx]=1}}}return t2};
  const d1=dil(m,1),d3=dil(m,4),sp=document.createElement('canvas');sp.width=w;sp.height=h;const sx=sp.getContext('2d'),sd=sx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const k=y*w+xx,i=((y+y0)*W+xx+x0)*4,o=k*4;if(d1[k]){sd.data[o]=d[i];sd.data[o+1]=d[i+1];sd.data[o+2]=d[i+2];sd.data[o+3]=255}if(d3[k]&&(y+y0<800))er[(y+y0)*W+xx+x0]=1}
  sx.putImageData(sd,0,0);
  A.push({k:df[0],cls:df[1],v:df[2],ax:df[3],ay:df[4],f:df[5],pv:df[6],fact:df[7],sp,w,h,x0,y0,cx:x0+w/2,cy:y0+h/2,act:0,shk:0,px:x0+w/2,py:y0+h/2,dir:1})});
 // inpaint background
 for(let y=310;y<800;y++){let xx=0;while(xx<W){if(!er[y*W+xx]){xx++;continue}let s=xx;while(xx<W&&er[y*W+xx])xx++;
  const l=Math.max(0,s-1),r=Math.min(W-1,xx),li=(y*W+l)*4,ri=(y*W+r)*4,L=xx-s+1;
  for(let k=s;k<xx;k++){const u=(k-s+1)/L,i=(y*W+k)*4;for(let c3=0;c3<3;c3++)d[i+c3]=d[li+c3]*(1-u)+d[ri+c3]*u}}}
 bg=document.createElement('canvas');bg.width=W;bg.height=H;bg.getContext('2d').putImageData(id,0,0);
 lbl=document.createElement('canvas');lbl.width=W;lbl.height=H;const lx=lbl.getContext('2d');
 LB.forEach(l=>{lx.save();lx.beginPath();if(lx.roundRect)lx.roundRect(l[0],l[2]+1,l[1]-l[0],l[3]-l[2]-2,24);else lx.rect(l[0],l[2],l[1]-l[0],l[3]-l[2]);lx.clip();lx.drawImage(src,0,0);lx.restore()});
 const L=$('list');A.forEach(a=>{const b=document.createElement('button');b.textContent=a.cls+(a.k==='shark'?' (Shark)':a.k==='fish'?' (Clownfish)':'');b.className=a.v?'v':'i';b.onclick=()=>pick(a);a.btn=b;L.appendChild(b)});
 $('load').remove();requestAnimationFrame(frame)}
function pick(a){if(quiz)return;selA=a;a.act=2.6;A.forEach(o=>o.btn.classList.toggle('on',o===a));
 $('info').innerHTML='<b>'+a.cls+'</b><span style="background:'+(a.v?'#1f9d55':'#8e44ad')+'">'+(a.v?'Vertebrate – has a backbone':'Invertebrate – no backbone')+'</span><p>'+a.fact+'</p>';
 for(let i=0;i<25;i++)parts.push({x:a.px,y:a.py,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,l:.9,c:a.v?'#2ecc71':'#b57bff',s:1})}
function hit(e){let b=null,bd=1e9;A.forEach(a=>{const dx=e.offsetX-a.px,dy=e.offsetY-a.py;if(AB(dx)<a.w*.5&&AB(dy)<a.h*.5){const d=dx*dx+dy*dy;if(d<bd){bd=d;b=a}}});return b}
cv.addEventListener('mousemove',e=>{hov=hit(e);cv.style.cursor=hov?'pointer':'default'});
cv.addEventListener('click',e=>{const a=hit(e);if(!a)return;if(quiz)answer(a);else pick(a)});
function setMode(m){focus=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 const t={all:'',vert:'Vertebrates: animals WITH a backbone',inv:'Invertebrates: animals WITHOUT a backbone',cmp:'Backbone Check: who has a backbone?'}[m];if(!quiz)cap(t)}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(quiz)endQuiz();setMode(b.dataset.m)});
function cap(t){const c=$('cap');c.style.display=t?'block':'none';c.textContent=t}
const CL=['Mammal','Bird','Fish','Amphibian','Reptile','Insect','Arachnid','Mollusk','Annelid','Crustacean','Echinoderm'];
function nextQ(){const r=Math.random();quiz.prev=quiz.t;
 if(r<.5){const c=CL[Math.random()*CL.length|0];quiz.type='cls';quiz.t=c;quiz.txt='Click the animal that is a '+c}
 else{const v=Math.random()<.5;quiz.type='v';quiz.t=v;quiz.txt=v?'Click an animal WITH a backbone':'Click an animal WITHOUT a backbone'}
 cap(quiz.txt+'   |   Score: '+quiz.score)}
function answer(a){const ok=quiz.type==='cls'?a.cls===quiz.t:!!a.v===quiz.t;
 if(ok){quiz.score++;a.act=2;for(let i=0;i<40;i++)parts.push({x:a.px,y:a.py,vx:(Math.random()-.5)*320,vy:(Math.random()-.5)*320,l:1.1,c:['#ffd93d','#2ecc71','#ff7675','#74b9ff'][i%4],s:1});cap('✅ Correct!   Score: '+quiz.score);setTimeout(()=>quiz&&nextQ(),1100)}
 else{a.shk=.6;cap('❌ Not quite – try again!   Score: '+quiz.score);setTimeout(()=>quiz&&cap(quiz.txt+'   |   Score: '+quiz.score),1200)}}
function endQuiz(){quiz=null;$('bQuiz').classList.remove('on');cap('')}
$('bQuiz').onclick=()=>{if(quiz){endQuiz();setMode(focus);return}quiz={score:0};selA=null;setMode('all');cap('');$('bQuiz').classList.add('on');nextQ()};
$('bPlay').onclick=()=>{paused=!paused;$('bPlay').textContent=paused?'▶ Play':'⏸ Pause';$('bPlay').className=paused?'':'g'};
$('bReset').onclick=()=>{endQuiz();setMode('all');selA=null;A.forEach(a=>{a.act=0;a.btn.classList.remove('on')});parts=[];$('info').innerHTML='<b>Welcome!</b><p>Click any animal (or a button) to see it come alive and learn about it.</p>'};
$('spd').oninput=e=>{speed=+e.target.value;$('spv').textContent=speed+'x'};
const isFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFS(){const a=$('app');if(isFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(a.requestFullscreen||a.webkitRequestFullscreen).call(a)}
$('bFull').onclick=toggleFS;
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFS();if(e.key===' '){e.preventDefault();$('bPlay').click()}});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('bFull').textContent=isFS()?'🗗 Exit Full Screen':'⛶ Full Screen';setTimeout(fit,60)}));
function fit(){const s=$('stage'),k=Math.min((s.clientWidth-20)/W,(s.clientHeight-20)/H);$('box').style.width=W*k+'px';$('box').style.height=H*k+'px';$('fit').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
function pill(txt,x,y,col){ctx.font='bold 22px Segoe UI,Arial';const w=ctx.measureText(txt).width+24;ctx.fillStyle=col;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-w/2,y-17,w,34,17);else ctx.rect(x-w/2,y-17,w,34);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+1)}
function isFocus(a){return focus==='all'||focus==='cmp'||(focus==='vert'&&a.v)||(focus==='inv'&&!a.v)}
function frame(now){const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;const d=paused?0:dt*speed;T+=d;bt+=d;
 for(const p of parts){p.x+=p.vx*d;p.y+=p.vy*d;if(p.s)p.vy+=200*d;else p.vx+=S(T*3+p.y*.05)*20*d;p.l-=d}parts=parts.filter(p=>p.l>0);
 ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0);
 if(focus==='vert'||focus==='inv'){ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(focus==='vert'?770:0,310,focus==='vert'?W-770:770,550)}
 for(const a of A){a.act=Math.max(0,a.act-d);a.shk=Math.max(0,a.shk-d);
  const foc=isFocus(a),e=(foc&&(focus==='vert'||focus==='inv')?1.4:1)+1.6*Math.min(1,a.act),m=Object.assign({dx:0,dy:0,rot:0,sx:1,sy:1},M[a.k](T,e)),m2=M[a.k](T+.05,e);
  let sg=1;if(TURN[a.k]){const vx=((m2.dx||0)-m.dx)/.05;sg=a.f*Math.tanh(vx*1.2)}

  const glow=(focus==='vert'||focus==='inv'||focus==='cmp')&&foc?(a.v?'#27ae60':'#9b59b6'):(a===selA||a===hov?'#ffd93d':null);
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=22+8*S(T*5)}
  ctx.translate(ox,oy);ctx.rotate(m.rot);ctx.scale(m.sx*sg,m.sy);
  if(m.wave){const wv=m.wave;for(let X=0;X<a.w;X+=3){const xn=X/a.w,f=wv.tail<0?1-xn:wv.tail>0?xn:1,yy=S(X*wv.k+T*wv.s)*wv.amp*(wv.tail?f*f:1);ctx.drawImage(a.sp,X,0,3,a.h,X-a.w/2,yo+yy,4,a.h)}}
  else ctx.drawImage(a.sp,-a.w/2,yo);
  ctx.restore();
  if((a.k==='fish'||a.k==='shark')&&!paused&&Math.random()<.04)parts.push({x:a.px+a.dir*a.f*a.w*.45,y:a.py-4,vx:0,vy:-45-Math.random()*30,l:2.2,b:1,r:3+Math.random()*5})}

 // tags
 for(const a of A){if(focus==='cmp'||((focus==='vert'||focus==='inv')&&isFocus(a))){const ty=Math.max(326,a.py-a.h/2-14+S(T*3+a.ax)*4);pill(a.v?'✔ Backbone':'✘ No backbone',a.px,ty,a.v?'#1f9d55':'#c0392b')}}
 if(selA&&!quiz){const a=selA,ty=Math.max(326,a.py-a.h/2-14+S(T*4)*5);pill(a.cls,a.px,ty,a.v?'#1f9d55':'#8e44ad')}
 for(const p of parts){ctx.globalAlpha=Math.min(1,p.l);if(p.b){ctx.strokeStyle='#5aa9e6';ctx.lineWidth=2;ctx.fillStyle='rgba(180,220,255,.4)';ctx.beginPath();ctx.arc(p.x+S(T*4+p.y*.1)*4,p.y,p.r,0,7);ctx.fill();ctx.stroke()}
  else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill()}}ctx.globalAlpha=1;
