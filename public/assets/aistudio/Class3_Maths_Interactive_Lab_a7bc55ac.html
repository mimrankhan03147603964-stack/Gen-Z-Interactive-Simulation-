<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 3 Maths Interactive Lab</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{margin:0}
#app{min-height:100vh;overflow:auto;display:flex;flex-direction:column;background:radial-gradient(circle at 80% 0,#db2777,#312e81 50%,#0f766e)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;color:#fff}
h1{margin:0;font-size:30px;letter-spacing:1px;text-shadow:0 2px 0 #f59e0b,0 5px 0 #b45309,0 9px 14px #000a}
h1 small{display:block;font-size:12px;letter-spacing:3px;color:#fde68a;text-shadow:none}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:0 28px 12px}
.b{border:0;border-radius:12px;padding:10px 15px;font-weight:700;font-size:15px;color:#fff;background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.25);cursor:pointer;transition:.1s}
.b:hover{filter:brightness(1.12);transform:translateY(-2px)}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tab.on{outline:3px solid #fde68a;transform:scale(1.06)}
main{flex:1;margin:0 28px;background:#fffdf7;border-radius:22px;padding:16px 26px;box-shadow:0 12px 30px #0008;color:#1f2937;display:flex;flex-direction:column;align-items:center}
#stage{width:100%;display:flex;flex-direction:column;align-items:center}
h2{margin:0 0 6px;color:#4c1d95;font-size:26px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:8px 0}
.big{font-size:22px;font-weight:700;margin:6px 0;text-align:center}
.msg{background:#fef3c7;border:2px dashed #f59e0b;border-radius:12px;padding:8px 18px;font-weight:600;min-height:40px;text-align:center;font-size:17px;margin:4px 0}
.vis{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;background:#ecfeff;border-radius:16px;padding:14px;margin:6px 0}
footer{color:#c7d2fe;text-align:center;padding:10px;font-size:13px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:.8em;line-height:1}
.fr b{border-bottom:3px solid #1f2937;padding:0 6px 2px}.fr i{font-style:normal;padding-top:2px}
.gr{display:flex}.cl{width:46px;height:36px;margin:2px;border-radius:7px;background:#e5e7eb;color:#6b7280;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.cl.on{color:#fff;box-shadow:0 3px 0 #0004}
.kid{background:#fff;border:3px solid;border-radius:16px;padding:8px;width:150px;min-height:150px;text-align:center}
.kid .it{font-size:26px;line-height:1.15}
.plate{font-size:15px;font-weight:700}
.tg{position:relative;display:inline-block;font-size:26px;letter-spacing:4px;margin-right:14px;font-weight:700;color:#1e3a8a}
.tg.f::after{content:'';position:absolute;left:-4px;right:-2px;top:50%;height:3px;background:#dc2626;transform:rotate(-22deg)}
.nt{display:inline-flex;width:92px;height:46px;border-radius:6px;color:#fff;font-weight:800;align-items:center;justify-content:center;border:2px solid #fff8;box-shadow:0 3px 6px #0006;cursor:pointer;margin:3px;background:var(--c);font-size:16px}
.cn{display:inline-flex;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fef9c3,#ca8a04 70%);border:3px solid #a16207;align-items:center;justify-content:center;font-weight:800;color:#422006;cursor:pointer;margin:3px;box-shadow:0 3px 5px #0006}
.card{background:#fff;border:3px solid #c4b5fd;border-radius:14px;padding:8px 12px;text-align:center;cursor:pointer;font-weight:700;box-shadow:0 4px 0 #c4b5fd}
.card:hover{transform:translateY(-3px)}.card span{font-size:34px;display:block}
input{width:70px;font-size:18px;padding:4px;border-radius:8px;border:2px solid #7c3aed}
</style></head><body>
<div id="app">
<header><h1>CLASS 3 MATHS INTERACTIVE LAB<small>GEN Z EDTECH INTERACTIVE SIMULATIONS</small></h1>
<button class="b" id="fb" style="--c:#ea580c" onclick="fs()">⛶ Full Screen</button></header>
<nav id="nav"></nav>
<main><div id="stage"></div></main>
<footer>Developed by MUHAMMAD IMRAN KHAN, MSc Computer Science &nbsp;|&nbsp; GEN Z EDTECH INTERACTIVE</footer>
</div>
<script>
const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),P=Math.PI,gcd=(a,b)=>b?gcd(b,a%b):a;
const btn=(t,c,f)=>`<button class="b" style="--c:${c}" onclick="${f}">${t}</button>`;
const fr=(a,b)=>`<span class="fr"><b>${a}</b><i>${b}</i></span>`;
let cur=0,S={},T=null;
const ref=()=>sims[cur][1]();
function fs(){document.fullscreenElement?document.exitFullscreen():$('#app').requestFullscreen()}
document.onfullscreenchange=()=>$('#fb').textContent=document.fullscreenElement?'⛶ Exit Full Screen':'⛶ Full Screen';

/* 1 TIMES TABLES */
function tt(){const{r,c}=S;let g='';
for(let i=1;i<=10;i++){g+='<div class="gr">';for(let j=1;j<=10;j++){const on=i<=r&&j<=c;g+=`<div class="cl${on?' on':''}" style="${on?`background:hsl(${i*34} 80% 52%)`:''}" onclick="S.r=${i};S.c=${j};tt()">${i*j}</div>`}g+='</div>'}
let list='';for(let i=1;i<=r;i++)list+=`<div style="font-size:19px;font-weight:700;color:hsl(${i*34} 80% 38%)">${i} × ${c} = ${i*c}</div>`;
$('#stage').innerHTML=`<h2>Multiplication Array Grid & Times Tables</h2><div class="vis"><div>${g}</div><div style="min-width:170px"><div class="big" style="color:#7c3aed">Table of ${c}</div>${list}</div></div><div class="msg">${r} rows of ${c} = ${Array(r).fill(c).join(' + ')} = <b>${r*c}</b> &nbsp;→&nbsp; ${r} × ${c} = ${r*c}</div><div class="bar">${[2,3,4,5,6,7,8,9,10].map(n=>btn('×'+n,`hsl(${n*34} 75% 45%)`,`clearInterval(T);S.c=${n};S.r=1;tt()`)).join('')}</div><div class="bar">${btn('▶ Next Row','#16a34a','S.r=Math.min(10,S.r+1);tt()')}${btn('◀ Back Row','#dc2626','S.r=Math.max(1,S.r-1);tt()')}${btn('⏯ Auto Build','#2563eb',"clearInterval(T);S.r=1;tt();T=setInterval(()=>{if(S.r<10){S.r++;tt()}else clearInterval(T)},600)")}${btn('🎲 Random','#f59e0b','S.r=1+R(10);S.c=1+R(10);tt()')}${btn('↺ Clear','#64748b','S.r=0;S.c=1;tt()')}</div>`}

/* 2 SHARING */
const KD=['👧','🧒','👦','👩','🧑','👨'],KC=['#ef4444','#2563eb','#16a34a','#f59e0b','#9333ea','#0d9488'];
function sh(){const{n,k,e,d}=S,q=Math.floor(n/k),max=q*k,rem=n-max;let kids='';
for(let i=0;i<k;i++){const m=Math.floor(d/k)+(i<d%k?1:0);kids+=`<div class="kid" style="border-color:${KC[i]}"><div style="font-size:42px">${KD[i]}</div><div class="plate" style="color:${KC[i]}">Child ${i+1}: ${m}</div><div class="it">${e.repeat(m)}</div></div>`}
$('#stage').innerHTML=`<h2>Sharing Equally: Division with Remainder</h2><div class="vis" style="flex-direction:column"><div class="plate" style="font-size:19px">Tray (not shared yet): <span style="font-size:30px">${e.repeat(n-d)||'—'}</span></div><div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">${kids}</div></div><div class="big">${n} ÷ ${k} ${d==max?`= ${q}${rem?` remainder ${rem}`:''}`:'= ?'}</div><div class="msg">${d<max?`Shared ${d} of ${max}. Each child gets one item at a time.`:rem?`Each child gets ${q}. ${rem} ${rem>1?'items are':'item is'} left over, so the remainder is ${rem}.`:`Each child gets ${q}. Nothing is left over!`}</div><div class="bar">${btn('Give 1 Item','#16a34a','S.d=Math.min(S.d+1,max())+0;sh()')}${btn('Give 1 Round','#2563eb','S.d=Math.min(S.d+S.k,max());sh()')}${btn('Share All','#9333ea','S.d=max();sh()')}${btn('↺ Reset','#64748b','S.d=0;sh()')}</div><div class="bar">${btn('＋ Item','#ea580c','shC("n",1)')}${btn('－ Item','#dc2626','shC("n",-1)')}${btn('＋ Child','#0d9488','shC("k",1)')}${btn('－ Child','#a16207','shC("k",-1)')}${['🍬','🍎','🍪','🍫'].map(x=>btn(x,'#db2777',`S.e='${x}';sh()`)).join('')}</div>`}
const max=()=>Math.floor(S.n/S.k)*S.k;
function shC(a,d){S[a]=Math.max(a=='k'?2:1,Math.min(a=='k'?6:30,S[a]+d));S.d=0;sh()}

/* 3 FRACTION WALL */
const DN=[1,2,3,4,5,6,8,10,12],CL=['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#64748b'];
function fw(){let h='',tot=0;
DN.forEach((d,r)=>{let s='';for(let i=0;i<d;i++){const on=S.sel.includes(d+':'+i);if(on)tot+=120/d;s+=`<div onclick="fwT('${d}:${i}')" style="flex:1;height:38px;background:${CL[r]};margin:0 1px;border-radius:5px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:${d>8?12:15}px;cursor:pointer;${on?'outline:4px solid #111;filter:brightness(1.3)':'opacity:.8'}">${S.lab?(d==1?'1 whole':'1/'+d):''}</div>`}h+=`<div style="display:flex;margin:3px 0">${s}</div>`});
const gg=gcd(tot,120),eq=S.t?DN.filter(d=>(S.t[0]*d)%S.t[1]==0).map(d=>S.t[0]*d/S.t[1]+'/'+d).join(' = '):'';
$('#stage').innerHTML=`<h2>Fraction Wall: Equivalent Fractions</h2><div style="width:min(820px,100%);background:#f5f3ff;padding:10px;border-radius:14px">${h}</div><div class="msg">${tot?`Selected strips cover ${fr(tot/gg,120/gg)} of the whole.`:'Click strips to select them, or press a fraction button to find equivalents.'}${eq?`<br>Equivalent fractions: ${eq}`:''}</div><div class="bar"><b>Find equal to:</b>${[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5]].map((f,i)=>btn(f[0]+'/'+f[1],CL[i],`fwE(${f[0]},${f[1]})`)).join('')}</div><div class="bar">${btn('🏷 Labels On/Off','#2563eb','S.lab=!S.lab;fw()')}${btn('↺ Clear','#64748b','S.sel=[];S.t=0;fw()')}</div>`}
function fwT(k){const i=S.sel.indexOf(k);i<0?S.sel.push(k):S.sel.splice(i,1);S.t=0;fw()}
function fwE(a,b){S.sel=[];S.t=[a,b];DN.forEach(d=>{if((a*d)%b==0)for(let i=0;i<a*d/b;i++)S.sel.push(d+':'+i)});fw()}

/* 4 ELAPSED TIME */
const nm=t=>((t%1440)+1440)%1440,fmt=t=>{t=nm(t);const h=Math.floor(t/60);return`${h%12||12}:${String(t%60).padStart(2,'0')} ${h<12?'AM':'PM'}`};
function cs(t,c){t=nm(t);const h=Math.floor(t/60)%12,m=t%60;let k='';
for(let i=0;i<60;i++){const a=i*P/30,r=i%5?100:94;k+=`<line x1="${110+r*Math.sin(a)}" y1="${110-r*Math.cos(a)}" x2="${110+104*Math.sin(a)}" y2="${110-104*Math.cos(a)}" stroke="#374151" stroke-width="${i%5?1:3}"/>`}
for(let i=1;i<=12;i++){const a=i*P/6;k+=`<text x="${110+80*Math.sin(a)}" y="${110-80*Math.cos(a)+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#b91c1c">${i}</text>`}
return`<svg viewBox="0 0 220 220" width="250" height="250"><circle cx="110" cy="110" r="108" fill="${c}"/><circle cx="110" cy="110" r="102" fill="#fffbeb"/>${k}<line x1="110" y1="110" x2="110" y2="60" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" transform="rotate(${h*30+m/2} 110 110)"/><line x1="110" y1="110" x2="110" y2="26" stroke="#dc2626" stroke-width="4" stroke-linecap="round" transform="rotate(${m*6} 110 110)"/><circle cx="110" cy="110" r="7" fill="#111"/></svg>`}
function el(){const{s,d}=S,e=s+d,hr=Math.floor(d/60),mi=d%60,sm=nm(s)%60,sh_=Math.floor(nm(s)/60)%12||12;
$('#stage').innerHTML=`<h2>Time to the Minute & Elapsed Time</h2><div class="vis"><div style="text-align:center"><div class="big" style="color:#16a34a">START</div>${cs(s,'#16a34a')}<div class="big" style="font-family:monospace;background:#111;color:#4ade80;padding:2px 16px;border-radius:8px">${fmt(s)}</div></div><div style="font-size:60px">➜</div><div style="text-align:center"><div class="big" style="color:#dc2626">END</div>${cs(e,'#dc2626')}<div class="big" style="font-family:monospace;background:#111;color:#f87171;padding:2px 16px;border-radius:8px">${fmt(e)}</div></div></div><div class="msg">Start: the minute hand is on ${sm/5}${sm%5?' (+'+sm%5+')':''}, so it is ${sm} minutes past ${sh_}.<br>Elapsed time = <b>${hr?hr+(hr>1?' hours ':' hour '):''}${mi?mi+' minutes':hr?'':'0 minutes'}</b> (${d} minutes in all)</div><div class="bar"><b>Start:</b>${btn('＋1 h','#16a34a','S.s+=60;el()')}${btn('－1 h','#15803d','S.s-=60;el()')}${btn('＋5 min','#0d9488','S.s+=5;el()')}${btn('－5 min','#0f766e','S.s-=5;el()')}${btn('＋1 min','#65a30d','S.s+=1;el()')}</div><div class="bar"><b>Duration:</b>${btn('＋5 min','#dc2626','S.d+=5;el()')}${btn('＋15 min','#ea580c','S.d+=15;el()')}${btn('＋1 h','#db2777','S.d+=60;el()')}${btn('－5 min','#9333ea','S.d=Math.max(0,S.d-5);el()')}${btn('－1 h','#7c3aed','S.d=Math.max(0,S.d-60);el()')}${btn('🎲 Random','#f59e0b','S.s=R(288)*5;S.d=5+R(30)*5;el()')}</div>`}

/* 5 RULER */
const OB=[['Pencil',155],['Crayon',93],['Eraser',46],['Pencil Box',196],['Key',62]];
function objSvg(i,x,L){const y=48;
if(i==0)return`<rect x="${x}" y="${y}" width="${L-24}" height="26" fill="#fbbf24" stroke="#92400e"/><rect x="${x}" y="${y}" width="14" height="26" fill="#f472b6" stroke="#92400e"/><rect x="${x+14}" y="${y}" width="10" height="26" fill="#94a3b8"/><polygon points="${x+L-24},${y} ${x+L},${y+13} ${x+L-24},${y+26}" fill="#fde68a" stroke="#92400e"/><polygon points="${x+L-9},${y+9} ${x+L},${y+13} ${x+L-9},${y+17}" fill="#111"/>`;
if(i==1)return`<rect x="${x}" y="${y}" width="${L-22}" height="26" rx="3" fill="#ef4444" stroke="#7f1d1d"/><rect x="${x+30}" y="${y}" width="${L-90}" height="26" fill="#fff" opacity=".35"/><polygon points="${x+L-22},${y} ${x+L},${y+13} ${x+L-22},${y+26}" fill="#b91c1c" stroke="#7f1d1d"/>`;
if(i==2)return`<rect x="${x}" y="${y}" width="${L}" height="30" rx="6" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="${x+L*.35}" y="${y}" width="${L*.65}" height="30" rx="6" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>`;
if(i==3)return`<rect x="${x}" y="${y-6}" width="${L}" height="44" rx="10" fill="#8b5cf6" stroke="#4c1d95" stroke-width="3"/><line x1="${x+10}" y1="${y+16}" x2="${x+L-10}" y2="${y+16}" stroke="#fde047" stroke-width="4" stroke-dasharray="6 4"/><rect x="${x+L/2-14}" y="${y+8}" width="28" height="16" rx="4" fill="#fde047"/>`;
return`<circle cx="${x+14}" cy="${y+14}" r="14" fill="none" stroke="#ca8a04" stroke-width="8"/><rect x="${x+26}" y="${y+10}" width="${L-26}" height="9" fill="#eab308" stroke="#854d0e"/><rect x="${x+L-10}" y="${y+19}" width="8" height="14" fill="#eab308" stroke="#854d0e"/><rect x="${x+L-24}" y="${y+19}" width="8" height="10" fill="#eab308" stroke="#854d0e"/>`}
function rl(){const L=OB[S.o][1],x0=30,sx=x0+S.sh*4;let t='';
for(let i=0;i<=220;i++){const x=x0+i*4,l=i%10==0?30:i%5==0?22:13;t+=`<line x1="${x}" y1="130" x2="${x}" y2="${130+l}" stroke="#451a03" stroke-width="${i%10?1:2}"/>`;if(i%10==0)t+=`<text x="${x}" y="${130+l+16}" text-anchor="middle" font-size="15" font-weight="700" fill="#451a03">${i/10}</text>`}
const ex=sx+L*4,cm=Math.floor((L)/10),mm=L%10;
$('#stage').innerHTML=`<h2>Interactive Ruler: Centimetres & Millimetres</h2><div style="width:100%;overflow-x:auto"><svg viewBox="0 0 940 210" width="940" height="210"><rect x="14" y="125" width="910" height="70" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="890" y="190" font-size="15" font-weight="800" fill="#92400e">cm</text>${t}${objSvg(S.o,sx,L*4)}${S.rev?`<line x1="${sx}" y1="30" x2="${sx}" y2="130" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/><line x1="${ex}" y1="30" x2="${ex}" y2="130" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>`:''}</svg></div><div class="msg">${S.rev?`Starts at ${S.sh} cm, ends at ${(S.sh*10+L)/10} cm. Length = ${(L/10).toFixed(1)} cm = <b>${cm} cm ${mm} mm</b> (${L} mm)`:'Look at where the object ends. Each small line is 1 millimetre (mm). 10 mm = 1 cm.'}${S.q?'<br>'+S.q:''}</div><div class="bar"><b>Measure:</b>${OB.map((o,i)=>btn(o[0],CL[i],`S.o=${i};S.sh=0;S.rev=0;S.q='';rl()`)).join('')}</div><div class="bar">${btn('◀ Move 1 cm','#64748b','S.sh=Math.max(0,S.sh-1);rl()')}${btn('Move 1 cm ▶','#475569','if((S.sh+1)*10+OB[S.o][1]<=220)S.sh++;rl()')}${btn('👁 Show / Hide Length','#9333ea','S.rev=!S.rev;rl()')}<b>My answer:</b><input id="qc" type="number" placeholder="cm"> cm <input id="qm" type="number" placeholder="mm"> mm ${btn('✔ Check','#16a34a','rlC()')}</div>`}
function rlC(){const L=OB[S.o][1],c=+$('#qc').value,m=+$('#qm').value;S.q=c*10+m==L?'🎉 Correct! Well done!':'❌ Not yet. Look at the end of the object again.';rl()}

/* 6 BAR GRAPH */
const FN=[['🍎','Apple','#ef4444'],['🍌','Banana','#eab308'],['🍊','Orange','#f97316'],['🥭','Mango','#16a34a'],['🍇','Grapes','#9333ea']];
function bg(){const v=S.v,mx=Math.max(10,...v),H=260,u=H/mx;let ord=v.map((x,i)=>i);if(S.sort)ord.sort((a,b)=>v[b]-v[a]);let g='';
for(let y=0;y<=mx;y+=mx>10?2:1)g+=`<line x1="50" y1="${290-y*u}" x2="540" y2="${290-y*u}" stroke="#d1d5db"/><text x="42" y="${294-y*u}" text-anchor="end" font-size="13">${y}</text>`;
ord.forEach((i,p)=>{const x=70+p*96;g+=`<rect x="${x}" y="${290-v[i]*u}" width="66" height="${v[i]*u}" rx="5" fill="${FN[i][2]}" stroke="#0004"/><text x="${x+33}" y="${282-v[i]*u}" text-anchor="middle" font-size="16" font-weight="800">${v[i]}</text><text x="${x+33}" y="312" text-anchor="middle" font-size="22">${FN[i][0]}</text>`});
const tl=FN.map((f,i)=>`<tr><td style="font-size:22px">${f[0]} ${f[1]}</td><td style="text-align:left;min-width:190px">${'<span class="tg f">||||</span>'.repeat(Math.floor(v[i]/5))}${v[i]%5?`<span class="tg">${'|'.repeat(v[i]%5)}</span>`:''}</td><td><b>${v[i]}</b></td></tr>`).join('');
const mxi=v.indexOf(Math.max(...v)),mni=v.indexOf(Math.min(...v));
$('#stage').innerHTML=`<h2>Bar Graph & Tally Chart Creator</h2><div class="vis"><svg viewBox="0 0 560 330" width="560" height="330"><text x="300" y="18" text-anchor="middle" font-size="18" font-weight="800" fill="#4c1d95">Our Favourite Fruits</text><line x1="50" y1="30" x2="50" y2="290" stroke="#111" stroke-width="2"/><line x1="50" y1="290" x2="540" y2="290" stroke="#111" stroke-width="2"/>${g}</svg><table><tr><th>Fruit</th><th>Tally</th><th>Total</th></tr>${tl}</table></div><div class="msg">Total votes: ${v.reduce((a,b)=>a+b,0)} &nbsp;|&nbsp; Most popular: ${FN[mxi][1]} (${v[mxi]}) &nbsp;|&nbsp; Least popular: ${FN[mni][1]} (${v[mni]})</div><div class="bar">${FN.map((f,i)=>`<span style="display:flex;gap:4px;align-items:center"><b>${f[0]}</b>${btn('＋',f[2],`bgA(${i},1)`)}${btn('－','#475569',`bgA(${i},-1)`)}</span>`).join('')}</div><div class="bar">${btn('🎲 Random Data','#f59e0b','S.v=FN.map(()=>R(15));bg()')}${btn('📊 Sort Bars','#2563eb','S.sort=!S.sort;bg()')}${btn('↺ Reset','#64748b','S.v=[0,0,0,0,0];bg()')}</div>`}
function bgA(i,d){S.v[i]=Math.max(0,Math.min(20,S.v[i]+d));bg()}

/* 7 MONEY SHOP */
const IT=[['✏️','Pencil',15],['📒','Notebook',60],['🧽','Eraser',10],['🧃','Juice',45],['🍪','Biscuits',25],['⚽','Ball',120]],NC={500:'#0d9488',100:'#dc2626',50:'#9333ea',20:'#ea580c',10:'#16a34a'};
const chip=d=>d>=10?`<span class="nt" style="--c:${NC[d]}">Rs ${d}</span>`:`<span class="cn">${d}</span>`;
function ms(){const tot=S.b.reduce((s,i)=>s+IT[i][2],0),pd=S.p.reduce((a,b)=>a+b,0),ch=pd-tot;let r=ch,cg='';
if(S.g&&ch>0)[500,100,50,20,10,5,2,1].forEach(d=>{while(r>=d){cg+=chip(d);r-=d}});
$('#stage').innerHTML=`<h2>Money Shop & Currency Register (Rupees)</h2><div class="bar">${IT.map((x,i)=>`<div class="card" onclick="S.b.push(${i});S.g=0;ms()"><span>${x[0]}</span>${x[1]}<br>Rs ${x[2]}</div>`).join('')}</div><div class="vis" style="align-items:flex-start"><div style="min-width:230px"><div class="big" style="color:#7c3aed">🛒 Basket</div>${S.b.map(i=>`<div style="font-weight:700">${IT[i][0]} ${IT[i][1]} — Rs ${IT[i][2]}</div>`).join('')||'<i>Empty. Click items to buy.</i>'}<div class="big">Total: Rs ${tot}</div></div><div style="min-width:260px"><div class="big" style="color:#16a34a">💵 Customer pays</div>${S.p.map(chip).join('')||'<i>Click notes and coins below.</i>'}<div class="big">Paid: Rs ${pd}</div></div><div style="min-width:240px"><div class="big" style="color:#dc2626">🧾 Change</div>${S.g&&ch>0?cg:''}<div class="big">${tot==0?'':ch<0?`Need Rs ${-ch} more`:ch==0?'Exact money! No change.':`Change = ${pd} − ${tot} = Rs ${ch}`}</div></div></div><div class="bar">${[500,100,50,20,10].map(d=>`<span onclick="S.p.push(${d});S.g=0;ms()">${chip(d)}</span>`).join('')}${[5,2,1].map(d=>`<span onclick="S.p.push(${d});S.g=0;ms()">${chip(d)}</span>`).join('')}</div><div class="bar">${btn('💰 Give Change','#16a34a','S.g=1;ms()')}${btn('↩ Remove Last Item','#f59e0b','S.b.pop();S.g=0;ms()')}${btn('🗑 Clear Basket','#dc2626','S.b=[];S.g=0;ms()')}${btn('✖ Clear Money','#9333ea','S.p=[];S.g=0;ms()')}${btn('💯 Pay Exact','#2563eb','S.p=[];let t=S.b.reduce((s,i)=>s+IT[i][2],0);[500,100,50,20,10,5,2,1].forEach(d=>{while(t>=d){S.p.push(d);t-=d}});S.g=0;ms()')}</div>`}

/* 8 PERIMETER */
const PS={L:[[0,0],[5,0],[5,2],[2,2],[2,5],[0,5]],T:[[0,0],[6,0],[6,2],[4,2],[4,5],[2,5],[2,2],[0,2]]};
const inside=(x,y,V)=>{let c=false;for(let i=0,j=V.length-1;i<V.length;j=i++){const a=V[i],b=V[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c};
function pm(){const V=S.sp=='rect'?[[0,0],[S.w,0],[S.w,S.h],[0,S.h]]:S.sp=='sq'?[[0,0],[S.w,0],[S.w,S.w],[0,S.w]]:PS[S.sp],n=V.length,u=44,mx=Math.max(...V.map(p=>p[0])),my=Math.max(...V.map(p=>p[1])),W=mx*u+80,H=my*u+80,X=p=>40+p*u;
const ln=V.map((a,i)=>{const b=V[(i+1)%n];return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])});let s='',gr='',fl='';
for(let i=0;i<=mx;i++)gr+=`<line x1="${X(i)}" y1="40" x2="${X(i)}" y2="${40+my*u}" stroke="#16a34a55"/>`;for(let j=0;j<=my;j++)gr+=`<line x1="40" y1="${X(j)}" x2="${40+mx*u}" y2="${X(j)}" stroke="#16a34a55"/>`;
for(let i=0;i<mx;i++)for(let j=0;j<my;j++)if(inside(i+.5,j+.5,V)&&(i*7+j*3)%4==0)fl+=`<text x="${X(i+.5)}" y="${X(j+.5)+8}" text-anchor="middle" font-size="22">${['🌷','🌻','🌼'][(i+j)%3]}</text>`;
V.forEach((a,i)=>{const b=V[(i+1)%n],on=i<S.k;s+=`<line x1="${X(a[0])}" y1="${X(a[1])}" x2="${X(b[0])}" y2="${X(b[1])}" stroke="${on?'#92400e':'#9ca3af'}" stroke-width="${on?9:3}" stroke-linecap="round" ${on?'':'stroke-dasharray="6 6"'}/>`;if(on)s+=`<line x1="${X(a[0])}" y1="${X(a[1])}" x2="${X(b[0])}" y2="${X(b[1])}" stroke="#d97706" stroke-width="4" stroke-dasharray="3 9"/><circle cx="${X(a[0])}" cy="${X(a[1])}" r="7" fill="#78350f"/>`;
s+=`<g><rect x="${(X(a[0])+X(b[0]))/2-17}" y="${(X(a[1])+X(b[1]))/2-12}" width="34" height="24" rx="8" fill="#fff" stroke="${on?'#92400e':'#6b7280'}"/><text x="${(X(a[0])+X(b[0]))/2}" y="${(X(a[1])+X(b[1]))/2+6}" text-anchor="middle" font-size="16" font-weight="800">${ln[i]}</text></g>`});
const sum=ln.slice(0,S.k).reduce((a,b)=>a+b,0),all=ln.reduce((a,b)=>a+b,0);
$('#stage').innerHTML=`<h2>Perimeter of Polygons: Fence the Garden</h2><div class="vis"><svg viewBox="0 0 ${W} ${H}" style="max-width:100%;height:${Math.min(430,H)}px"><polygon points="${V.map(p=>X(p[0])+','+X(p[1])).join(' ')}" fill="#bbf7d0" stroke="none"/>${gr}${fl}${s}</svg></div><div class="msg">${S.k?`Fence: ${ln.slice(0,S.k).join(' + ')} = <b>${sum} m</b>`:'Press FENCE NEXT SIDE to build the fence around the garden (1 square = 1 metre).'}${S.k==n?`<br>🎉 Perimeter = ${all} metres (the distance all the way round).`:''}</div><div class="bar">${btn('🔨 Fence Next Side','#16a34a','S.k=Math.min(S.k+1,'+n+');pm()')}${btn('🏗 Fence All','#2563eb','S.k='+n+';pm()')}${btn('↺ Remove Fence','#64748b','S.k=0;pm()')}</div><div class="bar">${btn('▭ Rectangle','#ea580c',"pmS('rect')")}${btn('■ Square','#9333ea',"pmS('sq')")}${btn('L Shape','#0d9488',"pmS('L')")}${btn('T Shape','#db2777',"pmS('T')")}${btn('＋ Width','#f59e0b','pmD("w",1)')}${btn('－ Width','#a16207','pmD("w",-1)')}${btn('＋ Height','#0891b2','pmD("h",1)')}${btn('－ Height','#0e7490','pmD("h",-1)')}</div>`}
function pmS(k){S.sp=k;S.k=0;pm()}
function pmD(a,d){S[a]=Math.max(2,Math.min(10,S[a]+d));if(S.sp=='sq'&&a=='h')S.w=S.h;S.k=0;pm()}

const sims=[['✖ Times Tables',tt,()=>({r:3,c:4})],['🍬 Sharing Equally',sh,()=>({n:13,k:4,e:'🍬',d:0})],['🧱 Fraction Wall',fw,()=>({sel:[],lab:1,t:0})],['🕒 Elapsed Time',el,()=>({s:9*60+15,d:50})],['📏 Ruler',rl,()=>({o:0,sh:0,rev:0,q:''})],['📊 Bar Graph & Tally',bg,()=>({v:[5,3,7,2,4],sort:0})],['💰 Money Shop',ms,()=>({b:[],p:[],g:0})],['🌷 Perimeter',pm,()=>({sp:'rect',w:6,h:4,k:0})]];
const cols=['#ef4444','#f97316','#ca8a04','#16a34a','#0891b2','#2563eb','#9333ea','#db2777'];
$('#nav').innerHTML=sims.map((s,i)=>`<button class="b tab" style="--c:${cols[i]}" onclick="go(${i})">${s[0]}</button>`).join('');
function go(i){clearInterval(T);cur=i;S=sims[i][2]();document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',j==i));sims[i][1]()}
go(0);
</script></body></html>
