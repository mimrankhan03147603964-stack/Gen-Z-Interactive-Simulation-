<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Structure of the Human Ear – Interactive (Original Picture)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:#0b2a6b;color:#14213d}
#app{display:flex;flex-direction:column;height:100vh;min-height:600px;background:linear-gradient(160deg,#f4f9ff,#d6e7f9)}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#stage{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 8px 24px rgba(11,42,107,.35);background:#fff}
#zoomer{position:absolute;inset:0;transition:transform .7s ease}
#zoomer img,#zoomer svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cap{display:flex;align-items:center;gap:14px;margin:0 14px 6px;background:#fff;border-radius:14px;padding:8px 16px;border-left:10px solid var(--ic,#2e7d32);box-shadow:0 4px 12px rgba(11,42,107,.2);min-height:58px}
#cap h2{font-size:20px;color:var(--ic,#2e7d32);white-space:nowrap}#cap p{font-size:16px;flex:1}
#ft{font-size:14px;background:#fff8d6;border-radius:10px;padding:6px 10px;max-width:340px}
#ctrl{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 14px 8px;background:#fff;margin:0 14px 6px;border-radius:14px;box-shadow:0 4px 12px rgba(11,42,107,.2);justify-content:center}
.grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border-right:2px dashed #cdd8e6;padding-right:12px}.grp:last-child{border:0}
.grp small{font-weight:700;color:#4a5b78;width:100%;font-size:11px}
.b{border:0;background:var(--c);color:#fff;font:700 13px "Trebuchet MS",Arial;padding:7px 10px;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.b:hover{filter:brightness(1.12)}.b:active,.b.act{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}.b.act{outline:3px solid #ffe600}
footer{text-align:center;font-size:11px;color:#4a5b78;padding-bottom:4px}
.hs{fill:transparent;stroke:transparent;stroke-width:6;cursor:pointer;transition:fill .2s}
.hs:hover{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.7)}
.show .hs{stroke:var(--sc);stroke-dasharray:14 10}
.hs.hl{fill:var(--sc);fill-opacity:.28;stroke:#ffe600;stroke-width:9;stroke-dasharray:none;animation:gl .9s infinite alternate;filter:drop-shadow(0 0 14px #ffe600)}
@keyframes gl{from{fill-opacity:.12}to{fill-opacity:.45}}
#card{fill:none;stroke:#ff9800;stroke-width:9;rx:16;filter:drop-shadow(0 0 10px #ff9800);display:none}
#pulse{transition:transform var(--d,1.6s) ease-in-out}
.rp{fill:none;stroke:#ff5722;stroke-width:6;transform-box:fill-box;transform-origin:center;animation:rp 1s infinite}
@keyframes rp{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.opt{display:block;margin:4px 6px 4px 0;display:inline-block}
</style></head><body>

<div id="cap"><h2 id="it">Ready to listen?</h2><p id="ip">Press Play All to follow a sound from the air to the brain, or click any part of the picture.</p><div id="ft">💡 Your ear also helps you keep your balance!</div></div>

<script>
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const G="#1b7a2f",P="#7b1fa2",R="#d0112b",O="#ef6c00",B="#1565c0";
const parts={
waves:{n:"Sound Waves",c:B,e:[150,520,115,100,0],px:150,py:520,t:"Sound waves are vibrations that travel through the air to your ear."},
pinna:{n:"Pinna",c:G,e:[345,470,100,215,0],px:330,py:470,t:"The pinna is the visible part of the outer ear. It works like a funnel and collects sound waves."},
canal:{n:"Ear Canal",c:G,e:[590,500,150,55,-4],px:600,py:500,t:"The ear canal is a short tube that carries sound waves to the eardrum."},
drum:{n:"Eardrum",c:P,e:[757,500,28,65,12],px:757,py:500,t:"The eardrum is a thin skin that vibrates when sound waves hit it."},
ossicles:{n:"Ossicles",c:P,e:[855,455,85,50,25],px:850,py:455,t:"The ossicles are three tiny bones. They pass the vibrations to the inner ear."},
cochlea:{n:"Cochlea",c:R,e:[1040,500,105,100,0],px:1050,py:500,t:"The cochlea is a snail-shaped tube. It changes vibrations into nerve signals."},
nerve:{n:"Auditory Nerve",c:R,e:[1265,445,150,45,-12],px:1265,py:445,t:"The auditory nerve carries the signals from the ear to the brain."},
brain:{n:"Brain",c:R,e:[1510,385,150,130,0],px:1510,py:390,t:"The brain reads the signals and tells you what the sound is."}};
const steps=[
{t:"1. Sound waves",p:"Sound waves enter through the pinna and ear canal.",h:["waves","pinna","canal"],card:[25,258],x:480,y:500,c:G},
{t:"2. Eardrum",p:"The eardrum vibrates with the sound waves.",h:["drum"],card:[320,245],x:757,y:500,c:P},
{t:"3. Ossicles",p:"The ossicles transmit the vibrations to the inner ear.",h:["ossicles"],card:[601,237],x:850,y:455,c:P},
{t:"4. Cochlea",p:"The cochlea converts vibrations into nerve signals.",h:["cochlea"],card:[873,220],x:1050,y:500,c:R},
{t:"5. Auditory nerve",p:"The auditory nerve carries the signals to the brain.",h:["nerve"],card:[1134,233],x:1265,y:445,c:O},
{t:"6. Brain",p:"The brain interprets the signals as sound.",h:["brain"],card:[1407,248],x:1500,y:390,c:B}];
const facts=["Your ear also helps you keep your balance!","The stapes is the smallest bone in the body.","The cochlea has about 15,000 tiny hair cells.","Sound travels through air at about 343 metres per second.","Very loud noise can damage the hair cells in the cochlea.","The eardrum is only about 0.1 mm thick."];
const srcs={Bell:["🔔",880,"sine"],Drum:["🥁",110,"triangle"],Trumpet:["🎺",440,"sawtooth"],Phone:["📞",1200,"square"],Guitar:["🎸",330,"triangle"]};
let cur=-1,tok=0,speed=1,soundOn=true,loud=true,zoom=false,cs="Bell",ac,hints=false;
const HS={};
Object.entries(parts).forEach(([k,p])=>{const e=document.createElementNS(NS,"ellipse");e.setAttribute("class","hs");e.setAttribute("cx",p.e[0]);e.setAttribute("cy",p.e[1]);e.setAttribute("rx",p.e[2]);e.setAttribute("ry",p.e[3]);e.setAttribute("transform",`rotate(${p.e[4]} ${p.e[0]} ${p.e[1]})`);e.style.setProperty("--sc",p.c);e.onclick=()=>select(k);const t=document.createElementNS(NS,"title");t.textContent=p.n;e.appendChild(t);$("hsg").appendChild(e);HS[k]=e});
function fit(){const a=$("area"),w=a.clientWidth-16,h=a.clientHeight-16,r=1672/941;let W=w,H=w/r;if(H>h){H=h;W=h*r}$("stage").style.width=W+"px";$("stage").style.height=H+"px"}
addEventListener("resize",fit);document.addEventListener("fullscreenchange",()=>setTimeout(fit,100));
function hl(ids){Object.values(HS).forEach(e=>e.classList.remove("hl"));ids.forEach(i=>HS[i].classList.add("hl"))}
function show(t,p,c){$("it").textContent=t;$("ip").textContent=p;$("cap").style.setProperty("--ic",c||G)}
function setPulse(x,y){$("pulse").style.setProperty("--d",(1.6/speed)+"s");$("pulse").style.transform=`translate(${x}px,${y}px)`}
function beep(f,type,d){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=loud?.22:.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function ring(){const s=srcs[cs];beep(s[1],s[2],.7);setTimeout(()=>beep(s[1]*1.5,s[2],.5),250)}
function go(i){cur=Math.max(0,Math.min(5,i));const s=steps[cur];hl(s.h);show(s.t,s.p,s.c);setPulse(s.x,s.y);const c=$("card");c.style.display="block";c.setAttribute("x",s.card[0]);c.setAttribute("width",s.card[1]);document.querySelectorAll(".sb").forEach((b,j)=>b.classList.toggle("act",j==cur));if(cur==0)ring();else beep(300+cur*120,"sine",.25)}
function select(k){stop();const p=parts[k];hl([k]);$("card").style.display="none";show(p.n,p.t,p.c);setPulse(p.px,p.py);beep(500,"sine",.2)}
async function play(from){stop();const my=++tok;$("bplay").classList.add("act");for(let i=from??0;i<6&&my==tok;i++){go(i);await new Promise(r=>setTimeout(r,3000/speed))}
if(my==tok){$("bplay").classList.remove("act");show("Great job!","You followed sound all the way from the air to the brain. Try another sound source!","#2e7d32")}}
function stop(){tok++;$("bplay").classList.remove("act")}
function reset(){stop();cur=-1;hl([]);$("card").style.display="none";setPulse(150,520);show("Ready to listen?","Press Play All, or click any part of the picture.");document.querySelectorAll(".sb").forEach(b=>b.classList.remove("act"))}
const qs=[["Which part collects sound waves?",["Pinna","Cochlea","Brain"],0],["What vibrates when sound waves hit it?",["Nerve","Eardrum","Pinna"],1],["How many ossicles are there?",["Three","One","Six"],0],["Which part looks like a snail?",["Ossicles","Ear Canal","Cochlea"],2],["What carries signals to the brain?",["Auditory Nerve","Eardrum","Pinna"],0],["Which part understands the sound?",["Cochlea","Brain","Ossicles"],1]];
let qi=0,sc=0;
function quiz(){stop();hl([]);qi=0;sc=0;ask()}
function ask(){if(qi>=qs.length){show("Quiz finished!","You scored "+sc+" out of "+qs.length+(sc>=5?". Excellent work!":". Keep practising!"),"#6a1b9a");return}
const q=qs[qi];show("Question "+(qi+1)+" of "+qs.length,q[0],"#6a1b9a");
q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="b opt";b.style.setProperty("--c",["#e91e63","#009688","#ff9800"][i]);b.textContent=o;b.onclick=()=>{const ok=i==q[2];if(ok)sc++;b.style.setProperty("--c",ok?"#2e7d32":"#b71c1c");b.textContent=(ok?"✔ ":"✘ ")+o;beep(ok?880:200,ok?"sine":"square",.3);setTimeout(()=>{qi++;ask()},900)};$("ip").appendChild(b)})}
const pc={waves:"#1e88e5",pinna:"#43a047",canal:"#00897b",drum:"#7e57c2",ossicles:"#8e24aa",cochlea:"#e53935",nerve:"#fb8c00",brain:"#d81b60"};
const groups=[
["Playback",[["▶ Play All","#2e7d32",()=>play(0),"bplay"],["⏸ Pause","#ef6c00",stop],["⏮ Previous","#00838f",()=>{stop();go(cur<1?0:cur-1)}],["⏭ Next","#1565c0",()=>{stop();go(cur+1)}],["🔁 Replay","#6a1b9a",()=>play(0)],["⟲ Reset","#c62828",reset]]],
["Steps",steps.map((s,i)=>[""+(i+1)+" "+s.t.split(". ")[1],["#43a047","#7e57c2","#8e24aa","#e53935","#fb8c00","#1e88e5"][i],()=>{stop();go(i)},"sb"])],
["Parts",Object.entries(parts).map(([k,p])=>[p.n,pc[k],()=>select(k)])],
["Sound source",Object.entries(srcs).map(([n,v],i)=>[v[0]+" "+n,["#d81b60","#5e35b1","#00897b","#f4511e","#3949ab"][i],()=>{cs=n;ring()}])],
["View & Learn",[["🏷 Show Hotspots","#0288d1",()=>$("hsg").classList.toggle("show")],["🔍 Zoom Inner Ear","#00695c",()=>{zoom=!zoom;const z=$("zoomer");z.style.transformOrigin="62% 52%";z.style.transform=zoom?"scale(2.1)":"none"}],["🐢 Speed","#7cb342",function(){speed=speed==1?.5:speed==.5?2:1;this.textContent=speed==.5?"🐢 Slow":speed==2?"🐇 Fast":"⏱ Normal"}],["🔊 Sound On","#455a64",function(){soundOn=!soundOn;this.textContent=soundOn?"🔊 Sound On":"🔇 Sound Off"}],["📢 Loud","#ad1457",function(){loud=!loud;this.textContent=loud?"📢 Loud":"🤫 Soft";ring()}],["💡 Fun Fact","#f9a825",()=>{$("ft").textContent="💡 "+facts[Math.floor(Math.random()*facts.length)]}],["❓ Quiz","#6a1b9a",quiz],["⛶ Full Screen","#212121",()=>{document.fullscreenElement?document.exitFullscreen():$("app").requestFullscreen()}]]]];
groups.forEach(([t,bs])=>{const g=document.createElement("div");g.className="grp";g.innerHTML="<small>"+t+"</small>";bs.forEach(([l,c,f,k])=>{const b=document.createElement("button");b.className="b"+(k=="sb"?" sb":"");if(k=="bplay")b.id="bplay";b.style.setProperty("--c",c);b.textContent=l;b.onclick=function(){f.call(this)};g.appendChild(b)});$("ctrl").appendChild(g)});
fit();setTimeout(fit,200);
</script></body></html>
