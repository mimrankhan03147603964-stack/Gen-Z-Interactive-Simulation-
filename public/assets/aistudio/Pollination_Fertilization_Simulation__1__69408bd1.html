<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Plant Reproduction: Pollination and Fertilization - Interactive Simulation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff;min-width:1100px;min-height:600px}
#app{height:100vh;display:grid;grid-template-rows:50px 1fr;background:radial-gradient(circle at 15% 0%,#2c55a8 0,#10204a 55%,#070d22 100%)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(90deg,#7b2cbf,#1e4fa3 55%,#10a37f);box-shadow:0 4px 16px #0009;z-index:5}
header h1{font-size:20px;letter-spacing:.3px;text-shadow:0 2px 0 #0006}
.hint{font-size:11.5px;color:#e6efff;margin-right:14px;opacity:.9}
.hr{display:flex;align-items:center}
main{display:grid;grid-template-columns:1fr 350px;gap:12px;padding:10px 12px;min-height:0}
#left{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
#wrap{flex:1;min-height:0;position:relative}
#stage{position:absolute;overflow:hidden;border-radius:16px;border:3px solid #ffffff55;box-shadow:0 18px 40px #000a,0 0 0 4px #7b2cbf55,inset 0 0 30px #0004;background:#000}
#zoomer{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
#zoomer img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;left:0;top:0;width:100%;height:100%}
.hs{cursor:pointer}
.lb{fill:transparent;stroke:transparent;stroke-width:4}
.hs:hover .lb{stroke:#ffe14d;fill:#ffe14d33}
.rg{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:7 6;transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite;filter:drop-shadow(0 0 3px #000)}
.dt{fill:#ffe14d;stroke:#d00;stroke-width:2.5}
#ov.nohs .rg,#ov.nohs .dt{display:none}
#ov.pl .rg,#ov.pl .dt{opacity:.2}
.hs.sel .rg{stroke:#ffe14d;stroke-width:6;animation:spin 3s linear infinite,pulse .9s ease-in-out infinite;opacity:1!important}
.hs.sel .lb{stroke:#ffe14d;fill:#ffe14d44}
.hs.ok .lb,.hs.ok .rg{stroke:#2ee66b;fill:#2ee66b44}
.hs.bad .lb,.hs.bad .rg{stroke:#ff4d4d;fill:#ff4d4d44}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{stroke-width:11}}
#cap{background:linear-gradient(90deg,#ffffff1f,#ffffff0d);border:1px solid #ffffff40;border-radius:12px;padding:7px 12px;display:flex;align-items:center;gap:12px;min-height:58px;position:relative;overflow:hidden}
#cap b{display:block;font-size:15px;color:#ffe14d}
#cap span{font-size:13.5px;line-height:1.3}
#prog{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#2ee66b,#ffe14d);width:0}
#pills{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.pill{width:26px;height:26px;border-radius:50%;border:2px solid #fff8;background:#ffffff22;color:#fff;font-weight:800;font-size:12px;cursor:pointer}
.pill.on{background:#ffe14d;color:#222;border-color:#fff;transform:scale(1.18)}
.pill.done{background:#2ee66b;color:#052}
#ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.grp{display:flex;gap:5px;align-items:center;background:#0004;border-radius:12px;padding:4px 6px;border:1px solid #ffffff22}
.grp small{font-size:10px;font-weight:800;letter-spacing:1px;color:#cfe0ff;margin:0 3px}
button.b{font:700 13px "Segoe UI",Arial,sans-serif;color:#fff;border:0;border-radius:10px;padding:7px 11px;cursor:pointer;background:var(--c,#1e4fa3);box-shadow:0 4px 0 color-mix(in srgb,var(--c,#1e4fa3) 55%,#000),0 6px 10px #0006;transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
button.b:hover{filter:brightness(1.18)}
button.b:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c,#1e4fa3) 55%,#000)}
button.b.act{outline:3px solid #ffe14d;filter:brightness(1.15)}
button.em{font-size:17px;padding:4px 9px}
.g{--c:#1fa35a}.bl{--c:#2563eb}.o{--c:#ea7a0c}.p{--c:#8b2fc9}.pk{--c:#d6307f}.t{--c:#0e9aa7}.r{--c:#d63b3b}.y{--c:#c99700}
#panel{display:flex;flex-direction:column;gap:8px;min-height:0}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#info{background:#fff;color:#1a2250;border-radius:14px;padding:11px 13px;border-left:8px solid #1e4fa3;box-shadow:0 8px 20px #0007;min-height:132px;max-height:36%;overflow:auto}
#info h3{font-size:17px;margin-bottom:3px}
#info .tag{display:inline-block;font-size:10px;font-weight:800;color:#fff;border-radius:8px;padding:2px 8px;margin-bottom:5px;letter-spacing:.5px}
#info p{font-size:13.5px;line-height:1.38}
#info .fun{margin-top:6px;background:#fff6c9;border-radius:8px;padding:5px 8px;font-size:12.5px}
#tc{flex:1;min-height:0;overflow:auto;background:#ffffff14;border:1px solid #ffffff30;border-radius:14px;padding:10px}
#tc::-webkit-scrollbar,#info::-webkit-scrollbar{width:8px}#tc::-webkit-scrollbar-thumb,#info::-webkit-scrollbar-thumb{background:#8aa;border-radius:6px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.list.one{grid-template-columns:1fr}
.list button.b{text-align:left;width:100%;white-space:normal}
h4{font-size:12px;letter-spacing:1px;color:#ffe14d;margin:8px 0 6px}
h4:first-child{margin-top:0}
.qq{font-size:15px;font-weight:700;line-height:1.35;margin:6px 0 10px;background:#0004;padding:9px;border-radius:10px}
#fb{margin-top:8px;font-weight:800;font-size:14px;min-height:20px}
.box{background:#0004;border-radius:10px;padding:9px;font-size:13px;line-height:1.4;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{border:1px solid #fff5;padding:5px 6px;text-align:left;vertical-align:top}
th{background:#ffffff26}
</style></head>

const P=[
{id:'bee',n:'Bee',s:'P',cx:107,cy:376,w:120,h:58,tx:150,ty:262,q:'Which visitor carries pollen from flower to flower?',d:'The bee is a pollinator. It visits flowers to drink sweet nectar, and pollen sticks to its fuzzy body. When it visits the next flower, some pollen rubs off.',f:'One bee can visit hundreds of flowers in a single day.'},
{id:'pollen',n:'Pollen Grains',s:'P',cx:515,cy:262,w:150,h:92,tx:345,ty:325,q:'Which tiny yellow grains contain the male cells?',d:'Pollen grains are tiny yellow grains made in the stamen. Each grain holds the male cells (sperm nuclei) of the plant.',f:'Pollen grains are so small that you need a microscope to see their shapes.'},
{id:'stamen',n:'Stamen',s:'P',cx:215,cy:498,w:158,h:58,tx:437,ty:455,q:'Which male part of the flower makes pollen?',d:'The stamen is the male part of the flower. It has a thin stalk (filament) with a pollen-making top (anther).',f:'A flower can have just a few stamens or hundreds of them.'},
{id:'stigma',n:'Stigma',s:'P',cx:715,cy:368,w:155,h:58,tx:487,ty:402,q:'Which sticky part at the top catches pollen?',d:'The stigma is the sticky top of the female part (carpel). It catches pollen grains brought by insects, wind or water.',f:'The stigma is sticky so pollen grains cannot fall off easily.'},

  Object.keys(F).forEach((k,i)=>{const b=document.createElement('button');b.className='b '+['g','o','y','t','bl','pk'][i];b.textContent=k;b.onclick=()=>{$('#fbx').innerHTML='<b>'+k+':</b> '+F[k]};$('#lf').append(b)})}}
$$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
/* ---------- quiz ---------- */
let Q={on:false,locked:true};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function quizView(){const c=$('#tc');
 if(!Q.on){c.innerHTML=`<h4>&#127919; TEST YOURSELF</h4><div class="box">10 questions. Some ask you to <b>click the part on the picture</b>, some ask you to <b>choose the right name</b>.${Q.done?'<br><br><b style="color:#ffe14d">Last score: '+Q.score+' / 10</b>':''}</div><button class="b g" id="qs" style="width:100%;padding:12px">&#9654; Start Quiz</button>`;$('#qs').onclick=quizStart;return}
 const o=byId[Q.ans];let h=`<h4>QUESTION ${Q.i+1} OF 10 &nbsp;|&nbsp; SCORE: ${Q.score}</h4>`;
 if(Q.type=='find')h+=`<div class="qq">&#128073; Click on the <span style="color:#ffe14d">${o.n}</span> in the picture.</div>`;
 else h+=`<div class="qq">${o.q}</div><div class="list one" id="qo"></div>`;
 h+=`<div id="fb"></div><button class="b bl" id="qn" style="width:100%;margin-top:8px;display:none">Next Question &#10140;</button><button class="b r" id="qk" style="width:100%;margin-top:8px">Skip</button>`;
 c.innerHTML=h;
 if(Q.type=='mcq')Q.opts.forEach((id,i)=>{const b=document.createElement('button');b.className='b '+['bl','p','t','o'][i];b.textContent=byId[id].n;b.onclick=()=>answer(id==Q.ans,id,b);$('#qo').append(b)});
 $('#qn').onclick=()=>nextQ();$('#qk').onclick=()=>{Q.locked=true;Q.i++;nextQ(true)}}
function quizStart(){Q={on:true,done:false,list:shuf(P.map(x=>x.id)).slice(0,10),i:0,score:0,locked:true};select(null);nextQ(true)}
function nextQ(skip){if(!skip)Q.i++;
 if(Q.i>=10){Q.on=false;Q.done=true;$$('.hs').forEach(g=>g.classList.remove('ok','bad'));quizView();$('#info').innerHTML=`<span class="tag" style="background:#1fa35a">QUIZ FINISHED</span><h3>Your score: ${Q.score} / 10</h3><p>${Q.score>=8?'Excellent work! You know plant reproduction well.':Q.score>=5?'Good job! Practise once more to improve.':'Keep learning: try the Steps tab, then take the quiz again.'}</p>`;return}
 $$('.hs').forEach(g=>g.classList.remove('ok','bad','sel'));
 Q.ans=Q.list[Q.i];Q.type=Math.random()<.5?'find':'mcq';Q.locked=false;
 Q.opts=shuf([Q.ans,...shuf(P.map(x=>x.id).filter(x=>x!=Q.ans)).slice(0,3)]);quizView()}
function answer(ok,id,btn){if(Q.locked)return;Q.locked=true;if(ok)Q.score++;
 $(`.hs[data-id="${Q.ans}"]`).classList.add('ok');if(!ok&&Q.type=='find')$(`.hs[data-id="${id}"]`).classList.add('bad');
 if(btn)btn.style.outline='4px solid '+(ok?'#2ee66b':'#ff4d4d');
 const o=byId[Q.ans];$('#fb').innerHTML=ok?'<span style="color:#2ee66b">&#10004; Correct! Well done.</span>':`<span style="color:#ff8a8a">&#10008; Not quite. The answer is <b>${o.n}</b>.</span>`;
 $('#qn').style.display='';$('#qk').style.display='none';$('#qn').textContent=Q.i==9?'See Result \u279E':'Next Question \u279E';
 $('#info').innerHTML=`<span class="tag" style="background:${o.s=='P'?PC:FC}">${o.s=='P'?'POLLINATION':'FERTILIZATION'}</span><h3>${o.n}</h3><p>${o.d}</p>`;
 $$('#qo .b').forEach(b=>{if(b.textContent==o.n)b.style.outline='4px solid #2ee66b'})}
/* ---------- fullscreen & keys ---------- */
function fs(){const e=document.documentElement;if(!document.fullscreenElement&&!document.webkitFullscreenElement)(e.requestFullscreen||e.webkitRequestFullscreen).call(e);else(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
$('#fsBtn').onclick=fs;
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('#fsBtn').innerHTML=(document.fullscreenElement||document.webkitFullscreenElement)?'&#10006; Exit Full Screen':'&#9974; Full Screen';setTimeout(fit,150)}));
document.addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();$('#bPlay').click()}else if(e.key=='ArrowRight')$('#bNext').click();else if(e.key=='ArrowLeft')$('#bPrev').click();else if(e.key=='f'||e.key=='F')fs()});
fit();select(null);showTab('parts');ui();requestAnimationFrame(loop);
</script></body></html>
