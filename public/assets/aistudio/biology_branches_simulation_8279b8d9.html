<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Introduction to Biology and Branches – Interactive Simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b1e3a;font-family:Segoe UI,Arial,sans-serif;color:#fff;overflow:hidden}
#app{display:flex;height:100vh;background:linear-gradient(135deg,#0b1e3a,#16407a)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#box{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #0008;background:#fff}
#fit{width:1536px;height:1024px;transform-origin:0 0;position:absolute;left:0;top:0}
#cv{width:1536px;height:1024px;display:block}
#cap{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000d;padding:8px 22px;border-radius:22px;font-size:17px;font-weight:600;text-align:center;display:none;border:2px solid #ffd93d;z-index:3;max-width:90%}
#load{position:absolute;font-size:18px}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#0006}
button{font:600 14px Segoe UI,Arial;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;color:#fff;background:#2e6bd6;transition:.15s}
button:hover{filter:brightness(1.2);transform:translateY(-1px)}
button.on{background:#e8a800;color:#222}
#bar .g{background:#1f9d55}#bar .r{background:#c0392b}#bar .p{background:#8e44ad}
#bar label{font-size:13px;display:flex;align-items:center;gap:6px}
#panel{width:300px;background:#f4f8ff;color:#1b2a41;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
#panel h2{font-size:18px;color:#0b3d91}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button{background:#fff;color:#1b2a41;border:2px solid #ffd93d;font-size:13px;padding:7px 4px}
.grid button.on{background:#ffd93d}.grid .w{grid-column:span 2}
#info{background:#fff;border-radius:10px;padding:12px;border-left:6px solid #e8a800;flex:1;min-height:120px;box-shadow:0 2px 8px #0002}
#info b{font-size:20px;display:block;margin-bottom:4px}
#info p{margin-top:8px;font-size:15px;line-height:1.45}
@media(max-width:900px){#panel{width:220px}}
</style></head><body>
<div id="app">
 <div id="main">
  <div id="stage"><div id="load">Loading…</div><div id="box"><div id="fit"><canvas id="cv" width="1536" height="1024"></canvas></div></div><div id="cap"></div></div>
  <div id="bar">
   <button id="bPlay" class="g">⏸ Pause</button>
   <button id="bTour" class="p">🎓 Guided Tour</button>
   <button id="bLion" class="p">🦁 Classify the Lion</button>
   <button id="bQuiz" class="p">❓ Quiz</button>
   <button id="bReset" class="r">↺ Reset</button>
   <label>Speed <input id="spd" type="range" min="0.25" max="3" step="0.25" value="1"> <b id="spv">1x</b></label>
   <button id="bFull">⛶ Full Screen</button>
  </div>
 </div>
 <div id="panel">
  <h2>🔬 Explore Biology</h2>
  <div class="grid" id="list"></div>
  <div id="info"><b>Welcome!</b><p>Click any part of the chart, or use the buttons, to explore it. Try the <i>Guided Tour</i>, <i>Classify the Lion</i> or the <i>Quiz</i>.</p></div>
 </div>

$('bLion').onclick=()=>{const on=mode==='lion';stop();if(on){select(null);return}mode='lion';mi=0;mt=0;$('bLion').classList.add('on');select('lion',0);cap('Classifying the lion: Kingdom → Species')};
const QS=SECT.filter(s=>s.q);
function nextQ(){quiz.t=QS[Math.random()*QS.length|0];cap('Which branch studies '+quiz.t.q+'?   Score: '+quiz.score)}
$('bQuiz').onclick=()=>{const on=!!quiz;stop();if(on)return;select(null);quiz={score:0};$('bQuiz').classList.add('on');nextQ()};
$('bPlay').onclick=()=>{paused=!paused;$('bPlay').textContent=paused?'▶ Play':'⏸ Pause';$('bPlay').className=paused?'':'g'};
$('bReset').onclick=()=>{stop();select(null);parts=[];setInfo('Welcome!','Click any part of the chart, or use the buttons, to explore it.')};
$('spd').oninput=e=>{speed=+e.target.value;$('spv').textContent=speed+'x'};
const isFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFS(){const a=$('app');if(isFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(a.requestFullscreen||a.webkitRequestFullscreen).call(a)}
$('bFull').onclick=toggleFS;
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFS();if(e.key===' '){e.preventDefault();$('bPlay').click()}});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('bFull').textContent=isFS()?'🗗 Exit Full Screen':'⛶ Full Screen';setTimeout(fit,60)}));
function fit(){const s=$('stage'),k=Math.min((s.clientWidth-20)/W,(s.clientHeight-20)/H);$('box').style.width=W*k+'px';$('box').style.height=H*k+'px';$('fit').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
const LY=i=>{const y0=698+i*43.6,y1=y0+43.6,h0=86+.528*(y0-698),h1=86+.528*(y1-698);return[[1286-h0,y0],[1286+h0,y0],[1286+h1,y1],[1286-h1,y1]]};
function hit(mx,my){if(my>698&&my<1003){const i=Math.min(6,(my-698)/43.6|0),h=86+.528*(my-698);if(AB(mx-1286)<h)return{id:'classif',lv:i}}
 const order=['lion',...SECT.filter(s=>s.card).map(s=>s.id),'biodiv','classif','biology'];
 for(const k of order){const r=D[k].r;if(mx>=r[0]&&mx<=r[2]&&my>=r[1]&&my<=r[3]){return k==='classif'&&my>465?{id:'classif'}:{id:k}}}return null}
cv.addEventListener('mousemove',e=>{hov=hit(e.offsetX,e.offsetY);cv.style.cursor=hov?'pointer':'default'});
cv.addEventListener('click',e=>{const h=hit(e.offsetX,e.offsetY);if(!h)return;
 if(quiz){const ok=h.id===quiz.t.id;if(ok){quiz.score++;select(h.id);cap('✅ Correct! '+D[h.id].n+'   Score: '+quiz.score);const q=quiz;setTimeout(()=>quiz===q&&nextQ(),1500)}
  else{cap('❌ Try again!   Score: '+quiz.score);const q=quiz;setTimeout(()=>quiz===q&&cap('Which branch studies '+quiz.t.q+'?   Score: '+quiz.score),1100)}return}
 stop();select(h.id,h.lv)});
const rr=(r,s)=>{const cx=(r[0]+r[2])/2,cy=(r[1]+r[3])/2,w=(r[2]-r[0])*s,h=(r[3]-r[1])*s;ctx.beginPath();ctx.roundRect?ctx.roundRect(cx-w/2,cy-h/2,w,h,24*s):ctx.rect(cx-w/2,cy-h/2,w,h)};
function drawAct(a,e){const t=T,mo=Object.assign({dx:0,dy:0,rot:0,sx:1,sy:1},MO[a.k]?MO[a.k](t,a.ph,e):{});
 let ox=a.x0+a.w/2,oy=a.pv==='b'?a.y0+a.h:a.y0+a.h/2;
 if(a.k==='butter'){const f=u=>({x:1330+S(u*.5)*150,y:330+S(u)*50+C(u*.37)*30}),p=f(t),p2=f(t+.1);ox=p.x;oy=p.y;mo.rot=Math.max(-.4,Math.min(.4,(p2.x-p.x)*.8));mo.sx=.45+.55*AB(C(t*9));mo.sy=1+.05*S(t*9)}
 ctx.save();ctx.translate(ox+mo.dx,oy+mo.dy);ctx.rotate(mo.rot);ctx.scale(mo.sx,mo.sy);ctx.drawImage(a.sp,-a.w/2,a.pv==='b'?-a.h:-a.h/2);ctx.restore()}
function pill(txt,x,y,col){ctx.font='bold 22px Segoe UI,Arial';const w=ctx.measureText(txt).width+26;ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(x-w/2,y-17,w,34,17):ctx.rect(x-w/2,y-17,w,34);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+1)}
function frame(now){const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;const d=paused?0:dt*speed;T+=d;
 if(mode==='tour'){mt+=d;if(mt>4.8){mt=0;mi=(mi+1)%TOUR.length;select(TOUR[mi])}}
 if(mode==='lion'){mt+=d;const i=Math.min(7,mt/2.6|0);if(i!==mi&&i<7){mi=i;select('lion',i)}if(i>=7&&mi!==7){mi=7;cap('🦁 Panthera leo – the African lion!');sel={id:'lion'};setInfo('The Lion','Kingdom Animalia → Phylum Chordata → Class Mammalia → Order Carnivora → Family Felidae → Genus Panthera → Species Panthera leo');lionAct=2.5}}
 lionAct=Math.max(0,lionAct-d);
 for(const p of parts){p.x+=p.vx*d;if(p.g)p.vy+=p.g*d;p.y+=p.vy*d;p.l-=d;if(p.w)p.vx+=S(T*4+p.y*.05)*30*d}parts=parts.filter(p=>p.l>0);
 if(!paused){if(Math.random()<.35){const y=770-Math.random()*125;parts.push({x:62+S(y*.08)*20,y,vx:0,vy:-30,l:1.2,c:'#7dd3ff',r:3,sp:1})}
  if(Math.random()<.08)parts.push({x:625+Math.random()*50,y:975,vx:0,vy:-50,l:1.1,b:1,r:3+Math.random()*3,w:1})
  if(Math.random()<.15)parts.push({x:1190+Math.random()*320,y:430-Math.random()*200,vx:(Math.random()-.5)*20,vy:-10-Math.random()*14,l:2.5,c:'#fff7a8',r:3,sp:1,w:1})}
 ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0);
 // cards with breathing / pop
 SECT.forEach((s,i)=>{if(!s.card)return;const isSel=sel&&sel.id===s.id&&!sel.lv,tg=isSel?1.1:(s.id==='hub'?1.003+.04*(.5+.5*S(T*3)):1.003+.02*(.5+.5*S(T*1.8-i*.8)));pop[s.id]=(pop[s.id]||1)+(tg-(pop[s.id]||1))*Math.min(1,dt*8);
  const sc=pop[s.id],cx=(s.r[0]+s.r[2])/2,cy=(s.r[1]+s.r[3])/2;ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);rr(s.r,1);
  if(sc>1.05){ctx.shadowColor='#ffd93d';ctx.shadowBlur=30;ctx.fillStyle='#fff';ctx.fill()}ctx.save();ctx.clip();ctx.drawImage(bg,0,0);
  acts.forEach(a=>{if(a.card===s.id)drawAct(a,0)});ctx.restore();if(sc>1.05){rr(s.r,1);ctx.strokeStyle='#ffd93d';ctx.lineWidth=5;ctx.stroke()}ctx.restore()});
 // globe
 ctx.save();ctx.beginPath();ctx.arc(690,285,80,0,7);ctx.clip();ctx.translate(690,285);ctx.rotate(T*.4);ctx.drawImage(gcv,-85,-85);ctx.restore();
 acts.forEach((a,i)=>{if(!a.card)drawAct(a,a.k==='lion'?lionAct:0)});
 // arrow flow
 ARR.forEach((a,i)=>{for(let k=0;k<3;k++){const u=(T*.45+k/3+i*.11)%1,x=a[0]+(a[2]-a[0])*u,y=a[1]+(a[3]-a[1])*u;ctx.fillStyle='rgba(255,236,120,'+(S(u*PI)*.95)+')';ctx.shadowColor='#ffd93d';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill()}});ctx.shadowBlur=0;
 // spotlight
 if(sel){const s=D[sel.id];ctx.save();ctx.fillStyle='rgba(8,18,40,.5)';ctx.beginPath();ctx.rect(0,0,W,H);
  if(sel.lv!=null||(mode==='lion'&&sel.lv!=null)){const p=LY(sel.lv);ctx.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.closePath()}
  else if(s.card){const sc=pop[s.id]||1,cx=(s.r[0]+s.r[2])/2,cy=(s.r[1]+s.r[3])/2,w=(s.r[2]-s.r[0])*sc,h=(s.r[3]-s.r[1])*sc;ctx.roundRect?ctx.roundRect(cx-w/2,cy-h/2,w,h,24):ctx.rect(cx-w/2,cy-h/2,w,h)}
  else{ctx.roundRect?ctx.roundRect(s.r[0],s.r[1],s.r[2]-s.r[0],s.r[3]-s.r[1],22):ctx.rect(s.r[0],s.r[1],s.r[2]-s.r[0],s.r[3]-s.r[1])}
  ctx.fill('evenodd');ctx.restore();
  if(!s.card){ctx.save();ctx.strokeStyle='#ffd93d';ctx.lineWidth=5;ctx.setLineDash([16,10]);ctx.lineDashOffset=-T*40;ctx.shadowColor='#ffd93d';ctx.shadowBlur=14;ctx.beginPath();
   if(sel.lv!=null){const p=LY(sel.lv);ctx.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.closePath()}else ctx.roundRect?ctx.roundRect(s.r[0],s.r[1],s.r[2]-s.r[0],s.r[3]-s.r[1],22):ctx.rect(s.r[0],s.r[1],s.r[2]-s.r[0],s.r[3]-s.r[1]);ctx.stroke();ctx.restore()}
  if(sel.lv!=null){const p=LY(sel.lv),l=LV[sel.lv];pill(l[0]+': '+l[1],p[0][0]-130,(p[0][1]+p[3][1])/2+S(T*4)*3,'#c0392b');
   ctx.strokeStyle='#ffd93d';ctx.lineWidth=4;ctx.setLineDash([8,8]);ctx.lineDashOffset=-T*40;ctx.beginPath();ctx.moveTo(1010,850);ctx.quadraticCurveTo(1060,(p[0][1]+p[3][1])/2+60,p[0][0]-10,(p[0][1]+p[3][1])/2);ctx.stroke();ctx.setLineDash([])}}
 else if(hov&&!quiz){const r=D[hov.id].r;if(hov.lv!=null){const p=LY(hov.lv);ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.fill()}else{ctx.strokeStyle='rgba(255,217,61,.9)';ctx.lineWidth=4;rr(r,1);ctx.stroke()}}
 // particles
 for(const p of parts){ctx.globalAlpha=Math.min(1,p.l);if(p.b){ctx.strokeStyle='#5aa9e6';ctx.lineWidth=2;ctx.fillStyle='rgba(180,220,255,.5)';ctx.beginPath();ctx.arc(p.x+S(T*5+p.y*.1)*4,p.y,p.r,0,7);ctx.fill();ctx.stroke()}
  else{ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=p.sp?8:0;ctx.beginPath();ctx.arc(p.x,p.y,p.r||5,0,7);ctx.fill()}}ctx.globalAlpha=1;ctx.shadowBlur=0;
 requestAnimationFrame(frame)}
const si=$('src');if(si.complete)init();else si.onload=init;
