<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Arial,sans-serif}
#wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,#24344f 0%,#0b1220 75%)}

button:hover{filter:brightness(1.12)}button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#bPlay{background:#16a34a}#bReset{background:#2563eb}#bFull{background:#7c3aed}
#info{color:#cbd5e1;font-size:15px;text-align:center}

function mk(v){var c=document.createElement('canvas');c.width=v.w;c.height=v.h;var x=c.getContext('2d');x.drawImage(bg,v.x0,v.y0,v.w,v.h,0,0,v.w,v.h);x.globalCompositeOperation='destination-in';x.drawImage($(v.mid),0,0);v.spr=c;}
function load(){var n=0,ims=[bg,$('mCar'),$('mTruck')];ims.forEach(function(i){var f=function(){if(++n===3){V.forEach(mk);ready=true;}};if(i.complete&&i.naturalWidth)f();else i.addEventListener('load',f);});}
load();
function size(){var d=Math.min(window.devicePixelRatio||1,2),w=stage.clientWidth;cv.width=Math.round(w*d);cv.height=Math.round(w*d*H/W);k=cv.width/W;if(active)draw();}
if(window.ResizeObserver)new ResizeObserver(size).observe(stage);window.addEventListener('resize',size);size();
function dx(v){return .5*v.a*t*t*S;}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(k,0,0,k,0,0);
 V.forEach(function(v){
  var d=dx(v),sp=v.a*t;
  ctx.save();ctx.beginPath();ctx.rect(v.p0,503,v.p1-v.p0,343);ctx.clip();
  ctx.fillStyle='#fff';ctx.fillRect(v.p0,503,v.p1-v.p0,309);
  for(var x=v.p0;x<v.p1;x+=80)ctx.drawImage(bg,v.road,812,80,34,x,812,80,34);
  ctx.drawImage(bg,v.lab[0],v.lab[1],v.lab[2],v.lab[3],v.lab[0],v.lab[1],v.lab[2],v.lab[3]);
  ctx.drawImage(bg,v.arr[0],v.arr[1],v.arr[2],v.arr[3],v.arr[0],v.arr[1],v.arr[2],v.arr[3]);
  /* 3D ground shadow */
  var cx=v.x0+v.w*.5+d;ctx.save();ctx.translate(cx,836);ctx.scale(1,.07);var g=ctx.createRadialGradient(0,0,10,0,0,v.w*.52);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,v.w*.52,0,7);ctx.fill();ctx.restore();
  /* speed streaks */
  var len=Math.min(sp*18,300);
  if(len>6){ctx.lineCap='round';ctx.lineWidth=v.tw;v.ty.forEach(function(y,i){var x2=v.tx+d+6-(i%2)*10,x1=x2-len*(1-i*.1);var gr=ctx.createLinearGradient(x1,0,x2,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,v.tc);ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();});}
  /* vehicle + force box with lift shadow */
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=14*k;ctx.shadowOffsetY=7*k;
  ctx.drawImage(v.spr,v.x0+d,v.y0);
  ctx.restore();
 });
}
function msg(){
 var s='t = '+t.toFixed(2)+' s   |   Net force = 100 N   |   Car: a = 5 m/s², v = '+(5*t).toFixed(1)+' m/s   |   Truck: a = 1 m/s², v = '+(1*t).toFixed(1)+' m/s';
 if(done)s+='   |   Finished';
 if(s!==txt){info.textContent=s;txt=s;}
}
function step(ts){
 var dt=Math.min((ts-last)/1000||0,.05);last=ts;
 if(active&&run&&ready){
  t+=dt;
  if(dx(V[0])>V[0].p1-V[0].x0){t=Math.sqrt(2*(V[0].p1-V[0].x0)/(V[0].a*S));done=true;setRun(false);bPlay.textContent='↺ Replay';}
  draw();msg();
 }
 requestAnimationFrame(step);
}
function setRun(r){run=r;bPlay.textContent=r?'❚❚ Pause':'▶ Start';bPlay.style.background=r?'#d97706':'#16a34a';}
bPlay.onclick=function(){
 if(!ready)return;
 if(done){t=0;done=false;}
 active=true;setRun(!run);draw();msg();
};
$('bReset').onclick=function(){active=false;done=false;t=0;setRun(false);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);txt='';info.textContent='Press Start: a net force of 100 N acts on both vehicles';};
bFull.onclick=function(){var d=document;
 if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
 else{(wrap.requestFullscreen||wrap.webkitRequestFullscreen).call(wrap);}};
function fs(){var on=document.fullscreenElement||document.webkitFullscreenElement;bFull.textContent=on?'✕ Exit Full Screen':'⛶ Full Screen';setTimeout(size,100);}
document.addEventListener('fullscreenchange',fs);document.addEventListener('webkitfullscreenchange',fs);
scene.addEventListener('mousemove',function(e){var r=scene.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;stage.style.transform='rotateY('+(px*7)+'deg) rotateX('+(-py*5)+'deg)';});
scene.addEventListener('mouseleave',function(){stage.style.transform='';});
requestAnimationFrame(step);
})();
</script></body></html>
