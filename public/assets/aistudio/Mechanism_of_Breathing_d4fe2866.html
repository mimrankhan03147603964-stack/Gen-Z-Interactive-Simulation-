<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mechanism of Breathing – Interactive Simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:#0b2a6b;color:#14213d}
#app{display:flex;flex-direction:column;height:100vh;min-height:620px;background:linear-gradient(160deg,#f4f9ff,#d6e7f9)}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#stage{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 8px 24px rgba(11,42,107,.35);background:#fff}
#zoomer{position:absolute;inset:0;transition:transform .7s ease}
#zoomer>*{position:absolute;display:block}
#base{inset:0;width:100%;height:100%}
.cv{pointer-events:none}.hv{cursor:pointer}
.hv{filter:drop-shadow(0 0 7px #ffe600);animation:gl 1s ease-in-out infinite alternate}@keyframes gl{from{opacity:.6}to{opacity:1}}
#ov{inset:0;width:100%;height:100%;pointer-events:none}
#cap{display:flex;align-items:center;gap:14px;margin:0 14px 6px;background:#fff;border-radius:14px;padding:8px 16px;border-left:10px solid var(--ic,#2e7d32);box-shadow:0 4px 12px rgba(11,42,107,.2);min-height:58px}
#cap h2{font-size:20px;color:var(--ic,#2e7d32);white-space:nowrap}#cap p{font-size:16px;flex:1}
#ft{font-size:14px;background:#fff8d6;border-radius:10px;padding:6px 10px;max-width:340px}
#ctrl{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 14px 8px;background:#fff;margin:0 14px 6px;border-radius:14px;box-shadow:0 4px 12px rgba(11,42,107,.2);justify-content:center}
.grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border-right:2px dashed #cdd8e6;padding-right:12px}.grp:last-child{border:0}
.grp small{font-weight:700;color:#4a5b78;width:100%;font-size:11px}
.b{border:0;background:var(--c);color:#fff;font:700 13px "Trebuchet MS",Arial;padding:7px 10px;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.b:hover{filter:brightness(1.12)}.b:active,.b.act{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}.b.act{outline:3px solid #ffe600}
.opt{display:inline-block;margin:4px 6px 4px 0}
#sl{width:200px;accent-color:#d81b60}
footer{text-align:center;font-size:11px;color:#4a5b78;padding-bottom:4px}
.fr{fill:none;stroke:#ff9800;stroke-width:9;filter:drop-shadow(0 0 10px #ff9800);display:none}
.rp{fill:none;stroke:#ff5722;stroke-width:6;transform-box:fill-box;transform-origin:center;animation:rp 1s infinite}
@keyframes rp{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.ar{transition:opacity .3s}.nudge{animation:nd .9s ease-in-out infinite alternate}@keyframes nd{to{transform:translate(var(--nx,0),var(--ny,-12px))}}
.chip{font:700 17px "Trebuchet MS",Arial;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.bt{font:800 22px "Trebuchet MS",Arial}.bs{font:700 14px "Trebuchet MS",Arial;fill:#14213d}.lg{font:700 16px "Trebuchet MS",Arial}
.mt{font:800 12px "Trebuchet MS",Arial;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:2px;pointer-events:none}
.xt{font:800 26px "Trebuchet MS",Arial}.xs{font:700 17px "Trebuchet MS",Arial}.xw{font:800 16px "Trebuchet MS",Arial;fill:#fff}
#gx{display:none;position:absolute;inset:3% 4%;background:rgba(255,255,255,.97);border:5px solid #1e88e5;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5;flex-direction:column;padding:6px 12px}
#gh{display:flex;justify-content:space-between;align-items:center;gap:10px}#gt{font-size:clamp(13px,1.9vw,24px);color:#0b2a6b}
#gb2{flex:1;min-height:0}#gb2 svg{width:100%;height:100%}
</style></head><body>
