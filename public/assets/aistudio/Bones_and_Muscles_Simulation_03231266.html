all:{n:'Bones and Muscles',c:'#0ea5e9',t:'Bones give the body shape and support. Muscles pull on the bones to move us. Click a part on the picture or press a button to look closer.',sh:[]},
skull:{n:'Skull',c:'#f97316',t:'The skull is a strong bony helmet. It protects the brain and is made of 22 bones joined together.',sh:[[345,135,92,108,0]],l:'skull'},
spine:{n:'Spine (backbone)',c:'#d97706',t:'The spine is a stack of small bones called vertebrae. It holds the body upright, lets us bend and protects the spinal cord.',sh:[[340,490,32,185,0]],l:'bones'},
ribs:{n:'Ribs',c:'#ef4444',t:'We have 12 pairs of ribs. They form a cage that protects the heart and lungs. Watch the ribs move out when we breathe in.',sh:[[340,445,150,150,0]],l:'ribs'},
pelvis:{n:'Pelvis',c:'#a855f7',t:'The pelvis is a bowl-shaped bone at the hips. It supports the upper body and joins the spine to the legs.',sh:[[345,705,150,92,0]],l:'pelvis'},
arms:{n:'Arm and hand bones',c:'#14b8a6',t:'Long arm bones work like levers. Each hand has 27 small bones, so we can write, throw and catch.',sh:[[143,455,40,135,.23],[532,455,40,135,-.2],[85,710,36,135,.25],[572,710,36,130,-.14]],l:'bones'},
bone:{n:'Inside a bone',c:'#3b82f6',t:'Bone is hard outside and spongy inside. Soft marrow in the middle makes new blood cells. Watch the red cells flow.',sh:[[783,325,205,205,0]],l:'bone'},
muscles:{n:'Muscles',c:'#e11d48',t:'Muscles are joined to bones by tendons. The brain sends a signal, the muscle contracts and pulls the bone. We have over 600 muscles.',sh:[[1280,515,135,120,0],[1150,700,85,215,.17],[1352,735,52,115,0],[1335,355,45,62,-.3]],l:'muscles'},
