<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Ecosystem and Environment Simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0d2318;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;background:#0d2318}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 8px 0}
canvas{display:block;border-radius:12px;box-shadow:0 0 28px #000a}
#bar{padding:8px 10px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#08170f}
#info{width:100%;text-align:center;font-size:16px;min-height:22px;color:#ffe9a8}
button{font:700 14px "Trebuchet MS",Verdana,sans-serif;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;color:#fff;box-shadow:0 3px 0 #0006;transition:transform .1s,opacity .2s}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #fff}
button.off{opacity:.4}
.sun{background:#e0a800;color:#2a1c00}.photo{background:#2e9e3e}.food{background:#e0701a}.decomp{background:#8a5a2b}.water{background:#1e88e5}.env{background:#7b3fb5}
.all{background:#c2185b}.ctl{background:#37474f}.fs{background:#00897b}
#bar label{font-size:14px;display:flex;align-items:center;gap:6px;color:#cfe8d6}
input[type=range]{width:110px;accent-color:#ffd23a}
</style></head><body>
<div id="app">
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
<div id="info"></div>
<button class="sun" data-m="sun">Sunlight</button>
<button class="photo" data-m="photo">Photosynthesis</button>
<button class="food" data-m="food">Food Chain</button>
<button class="decomp" data-m="decomp">Decomposers</button>
<button class="water" data-m="water">Water</button>
<button class="env" data-m="env">Environment</button>
<button class="all" id="all">Show All</button>
<button class="ctl" id="pp">Pause</button>
<label>Speed <input type="range" id="sp" min="0.3" max="2.5" step="0.1" value="1"></label>
<button class="ctl" id="rs">Reset</button>
<button class="fs" id="fs">Full Screen</button>
</div></div>
