<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Energy Forms and Changes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",Arial,sans-serif}
body{background:#020617}
#app{height:100vh;display:flex;flex-direction:column;gap:6px;padding:8px 12px;color:#fff;background:linear-gradient(160deg,#0b3a8a,#082a63 55%,#061a45)}
h1{text-align:center;font-size:25px;background:linear-gradient(90deg,#38bdf8,#fde047,#fb923c);-webkit-background-clip:text;color:transparent}
#stage{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;border:3px solid #38bdf8}
canvas{position:absolute;inset:0;width:100%;height:100%}
.box{position:absolute;background:#eef2ffee;color:#0f172a;border:2px solid #475569;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700}
#legend{right:10px;top:10px}#legend div{margin:3px 0;display:flex;align-items:center;gap:8px}#legend i{width:17px;height:17px;border-radius:4px;border:2px solid #0004;display:inline-block}
#cloudbox{left:10px;bottom:70px;display:none;width:170px}#cloudbox input{width:100%}#cloudbox span{display:flex;justify-content:space-between}
#hint{font-size:16px;font-weight:700;text-align:center;background:#0008;border:2px solid #38bdf8;border-radius:30px;padding:6px 18px;min-height:34px}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:#0b1e5b;border-radius:16px;padding:6px 8px}
.bar b{font-size:13px;padding:0 4px;color:#fde047}
button{border:none;border-radius:12px;padding:8px 11px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0007;transition:.1s}
button:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
button.on{outline:3px solid #fff}button:disabled{opacity:.35;cursor:not-allowed}
.i{font-size:15px}
.a1{background:#16a34a}.a2{background:#0891b2}.a3{background:#ca8a04}.a4{background:#dc2626}.b1{background:#2563eb}.b2{background:#4f46e5}
.d1{background:#0d9488}.d2{background:#ea580c}.d3{background:#9333ea}.d4{background:#db2777}
.c1{background:#475569}.c2{background:#15803d}.c3{background:#be123c}.c4{background:#0369a1}.c5{background:#b45309}

</style></head><body>
<div id="app">
<h1>Energy Forms and Changes</h1>
<div id="stage"><canvas id="c"></canvas>
<div class="box" id="legend"><div style="font-size:14px">Forms of Energy</div><div><i style="background:#d1d5db"></i>Mechanical</div><div><i style="background:#38bdf8"></i>Electrical</div><div><i style="background:#ef4444"></i>Thermal</div><div><i style="background:#facc15"></i>Light</div><div><i style="background:#22c55e"></i>Chemical</div></div>
<div class="box" id="cloudbox">Clouds<span><small>None</small><small>Lots</small></span><input type="range" id="cld" min="0" max="100" value="0"><div style="margin-top:6px">Panel Angle</div><input type="range" id="pa" min="0" max="100" value="44"></div></div>
<div id="hint"></div>
<div class="bar"><b>1. SOURCE</b>
<button class="a1" data-k="src" data-v="bike"><span class="i">&#128690;</span> Bicycle</button><button class="a2" data-k="src" data-v="faucet"><span class="i">&#128688;</span> Faucet</button><button class="a3" data-k="src" data-v="sun"><span class="i">&#9728;&#65039;</span> Sun</button><button class="a4" data-k="src" data-v="kettle"><span class="i">&#129754;</span> Tea Kettle</button>
<b>2. CONVERTER (auto)</b><button class="b1" data-k="conv" data-v="belt">&#9881;&#65039; Belt &amp; Pulley Generator</button><button class="b1" data-k="conv" data-v="wheel">&#9881;&#65039; Water Wheel &amp; Generator</button><button class="b2" data-k="conv" data-v="solar">&#128261; Solar Panel</button>
<b>3. USER</b><button class="d1" data-k="usr" data-v="water">&#129514; Water Beaker</button><button class="d2" data-k="usr" data-v="bulb">&#128161; Light Bulb</button><button class="d3" data-k="usr" data-v="cfl">&#127744; Fluorescent Bulb</button><button class="d4" data-k="usr" data-v="fan">&#127744; Fan</button></div>
<div class="bar">
<button class="c2" id="bOn" onclick="onoff()">START</button>
<button class="a2" onclick="clouds(.25)">Add Clouds</button><button class="a3" onclick="clouds(-.25)">Clear Sky</button><button class="c4" onclick="faceSun()">Face the Sun</button><label>Source Level <input type="range" id="lvl" min="10" max="100" value="60"></label>
<button class="a1" onclick="stp(1)">1 Source</button><button class="b1" onclick="stp(2)">2 Converter</button><button class="a3" onclick="stp(3)">3 Wire</button><button class="d3" onclick="stp(4)">4 User</button><button class="a4" onclick="stp(5)">5 Output</button>
<button class="c4" id="bDemo" onclick="demo()">Guided Demo</button><button class="c1 on" id="bSym" onclick="tg('sym',this)">Energy Symbols</button><button class="c5 on" id="bLab" onclick="tg('lab',this)">Labels</button>
<button class="c4" id="bSp" onclick="spd(this)">Speed: Normal</button><button class="c3" onclick="reset()">Reset</button><button class="c1" onclick="full()">Full Screen</button></div>
</div>
<script>
const $=s=>$s(s),$s=s=>document.querySelector(s),cv=$s('#c'),g=cv.getContext('2d'),R=Math.random;
const S={src:'bike',conv:'wheel',usr:'water',lvl:.6,cld:0,on:false,sym:true,lab:true,spd:1,t:0,syms:[],acc:0,T:20,uf:0,cf:0,pw:0,sa:0,cs:0,fa:0,pa:-1.084,fx:[],puffs:[],hl:-1,demo:null,cnt:{}};
const FC={mech:'#d1d5db',elec:'#38bdf8',therm:'#ef4444',light:'#facc15',chem:'#22c55e'},FN={mech:'Mechanical',elec:'Electrical',therm:'Thermal',light:'Light',chem:'Chemical'};
const SRC={bike:{n:'Bicycle Rider',f:'mech',c:'belt',nodes:[[188,398,'chem'],[152,488,'mech']]},faucet:{n:'Faucet',f:'mech',c:'wheel',nodes:[[250,225,'mech'],[320,340,'mech']]},sun:{n:'Sun',f:'light',c:'solar',nodes:[[100,115,'light']]},kettle:{n:'Tea Kettle',f:'mech',c:'wheel',nodes:[[140,522,'chem'],[140,472,'therm'],[205,432,'therm'],[335,418,'therm']]}};
const CONV={belt:{n:'Belt & Pulley Generator',nodes:[[405,470,'mech'],[460,450,'elec',.2]]},wheel:{n:'Water Wheel & Generator',nodes:[[370,405,'mech'],[460,450,'elec',.2]]},solar:{n:'Solar Panel',nodes:[[380,275,'light'],[460,450,'elec',.25]]}};
const USR={water:{n:'Water Beaker',eff:0,out:'therm',node:[800,470]},bulb:{n:'Incandescent Bulb',eff:.1,out:'light',node:[800,405]},cfl:{n:'Fluorescent Bulb',eff:.75,out:'light',node:[800,405]},fan:{n:'Desk Fan',eff:.8,out:'mech',node:[800,410]}};
const rate=()=>S.on?S.lvl*8:0;
function mkFree(x,y,f,v0,life){const a=f=='light'||f=='mech'?R()*6.28:-1.57+(R()-.5)*1.2,v=v0||(f=='light'?110:f=='mech'?80:50);S.syms.push({x,y,f,m:'free',vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life||(f=='light'?4.5:3),age:0})}
const CP=[440,300],SUN=[92,115];
function pn(){return[Math.sin(S.pa),-Math.cos(S.pa)]}
function face(){const n=pn();return[CP[0]+n[0]*16,CP[1]+n[1]*16]}
function emit(){const s=SRC[S.src],c=CONV[S.conv],u=USR[S.usr],st=s.nodes[0];let cn=c.nodes,blk=false,bn=null;
 if(S.src=='sun'){const f=face(),n=pn(),d=[SUN[0]-CP[0],SUN[1]-CP[1]],l=Math.hypot(d[0],d[1]),al=Math.max(0,(n[0]*d[0]+n[1]*d[1])/l);cn=[[f[0],f[1],'light'],c.nodes[1]];
  if(R()<S.cld){blk=true;const t=.25+R()*.4;bn=[SUN[0]+(f[0]-SUN[0])*t+(R()-.5)*20,SUN[1]+(f[1]-SUN[1])*t+(R()-.5)*20]}
  else if(R()>al*al){blk=true;bn=f}}
 S.syms.push({x:st[0],y:st[1],f:st[2],p:blk?[[bn[0],bn[1],'light']]:[...s.nodes.slice(1),...cn,[500,470,'elec'],[710,470,'elec'],[790,470,'elec'],[...u.node,'elec']],i:0,m:'path',blk});
 if(S.src=='sun')for(let k=0;k<2;k++)mkFree(92,115,'light',60+R()*70,10)}
function arrive(q){const n=q.p[q.i];q.x=n[0];q.y=n[1];if(n[2]&&n[2]!=q.f)S.fx.push({x:n[0],y:n[1],c:FC[n[2]],a:0});if(n[2])q.f=n[2];
 if(n[3]!==undefined){S.cf++;if(R()<n[3]){q.f='therm';q.m='free';q.x=460+(R()-.5)*40;q.y=408;q.vx=0;q.vy=-50;q.life=3;q.age=0;return}}
 q.i++;if(q.i>=q.p.length)fin(q)}
function fin(q){const u=USR[S.usr];if(q.blk){q.m='free';q.vx=(R()-.5)*60;q.vy=-30;q.life=.8;q.age=0;return}S.uf++;
 if(S.usr=='water'){q.f='therm';q.m='store';q.tx=752+R()*92;q.ty=435+R()*55;q.life=6;q.age=0;S.T+=.55;return}
 q.m='dead';const o=R()<u.eff?u.out:'therm';
 if(S.usr=='fan'){if(o=='mech')mkFree(800,405,'mech',90,2.5);else mkTherm(800,455)}else{if(o=='light')mkFree(800,390,'light',130,4.5);else mkTherm(800,345+R()*10)}}
function mkTherm(x,y){S.syms.push({x:x+(R()-.5)*14,y,f:'therm',m:'free',vx:0,vy:-45,life:3,age:0})}
function reset(){S.syms=[];S.T=20;S.uf=S.cf=0;S.on=false;S.demo&&clearInterval(S.demo);S.demo=null;S.hl=-1;ui()}
function onoff(){S.on=!S.on;ui();msg()}
function ui(){$s('#bOn').textContent=S.on?'STOP':'START';$s('#bOn').className=S.on?'c3':'c2';$s('#bDemo').classList.toggle('on',!!S.demo)}
function tg(k,b){S[k]=!S[k];b.classList.toggle('on',S[k])}
function spd(b){S.spd=S.spd==1?2:S.spd==2?.5:1;b.textContent='Speed: '+(S.spd==1?'Normal':S.spd>1?'Fast':'Slow')}
function full(){document.fullscreenElement?document.exitFullscreen():$s('#app').requestFullscreen()}
function stp(n){S.hl=n;const s=SRC[S.src],c=CONV[S.conv],u=USR[S.usr];if(!S.on){S.on=true;ui()}
 $s('#hint').textContent=['',
 'Step 1: '+(S.src=='kettle'?'The gas flame burns. Chemical energy becomes Thermal energy and makes steam.':S.src=='sun'?'The Sun sends out Light energy in all directions.':S.src=='faucet'?'Falling water has Mechanical energy (moving energy).':'The rider\u2019s muscles use Chemical energy to make Mechanical energy.'),
 'Step 2: The '+c.n+' changes '+FN[s.f=='mech'?'mech':'light']+' energy into Electrical energy. Some energy is lost as heat.',
 'Step 3: Electrical energy travels along the wire to the '+u.n+'.',
 'Step 4: The '+u.n+' receives the Electrical energy and puts it to use.',
 'Step 5: '+({water:'Thermal energy heats the water. The thermometer goes up!',bulb:'Only a little becomes Light. Most becomes Thermal energy (heat).',cfl:'Most becomes Light, only a little is wasted as heat. It is more efficient!',fan:'The blades spin (Mechanical energy) and a little heat is made.'})[S.usr]][n]}
function demo(){if(S.demo){clearInterval(S.demo);S.demo=null;S.hl=-1;ui();return}let n=1;stp(1);S.demo=setInterval(()=>{n=n%5+1;stp(n)},4200);ui()}
function msg(){const s=SRC[S.src],c=CONV[S.conv],u=USR[S.usr];$s('#hint').textContent=(S.on?'Running: ':'Ready. Press START. ')+s.n+' \u2192 '+c.n+' \u2192 '+u.n+'.'}
document.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='conv')return;S[k]=b.dataset.v;if(k=='src')S.conv=SRC[S.src].c;S.syms=[];S.T=20;sel();msg()});
$s('#lvl').oninput=e=>S.lvl=e.target.value/100;$s('#cld').oninput=e=>{S.cld=e.target.value/100;cldMsg()};
$s('#pa').oninput=e=>{S.pa=-1.7+e.target.value/100*1.4;$s('#hint').textContent=Math.abs(S.pa+1.084)>.35?'The panel is turned away from the sun, so the light bounces off. Press Face the Sun!':'The panel is facing the sun, so it collects light.'};
function cldMsg(){$s('#hint').textContent=S.src!='sun'?'Choose the Sun as the source to use clouds and the solar panel.':S.cld>.6?'Thick clouds block the sunlight, so almost no light reaches the solar panel.':S.cld>0?'Some sunlight is blocked by the clouds, so the solar panel gets less energy.':'Clear sky: all the sunlight reaches the solar panel.'}
function clouds(d){S.cld=Math.max(0,Math.min(1,S.cld+d));$s('#cld').value=Math.round(S.cld*100);cldMsg()}
function faceSun(){S.pa=-1.084;$s('#pa').value=44;$s('#hint').textContent=S.src=='sun'?'The solar panel now faces the sun, so it collects the most light.':'Choose the Sun as the source to use the solar panel.'}
function sel(){document.querySelectorAll('button[data-k]').forEach(b=>{const k=b.dataset.k;b.classList.toggle('on',S[k]==b.dataset.v);if(k=='conv')b.disabled=S.conv!=b.dataset.v});$s('#cloudbox').style.display=S.src=='sun'?'block':'none'}
sel();msg();
function rr(x,y,w,h,r,f,s,lw){g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.lineWidth=lw||2;g.stroke()}}
function lg(x1,y1,x2,y2,...st){const q=g.createLinearGradient(x1,y1,x2,y2);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q}
function rg(x,y,r0,r1,...st){const q=g.createRadialGradient(x,y,r0,x,y,r1);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q}
function sh(x,y,w,h){g.fillStyle='rgba(60,30,0,.28)';g.beginPath();g.ellipse(x,y,w,h,0,0,7);g.fill()}
function pipe(pts,w,c){g.lineCap='round';g.lineJoin='round';g.strokeStyle='#334155';g.lineWidth=w+4;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.strokeStyle=c;g.lineWidth=w;g.stroke();g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=w*.22;g.translate(0,-w*.2);g.stroke();g.translate(0,w*.2)}
function lab(t,x,y){if(!S.lab)return;g.font='bold 15px Segoe UI';g.textAlign='center';const w=g.measureText(t).width+16;rr(x-w/2,y-14,w,24,8,'rgba(15,23,42,.85)');g.fillStyle='#fde047';g.fillText(t,x,y+3)}
function cloud(x,y,s,a,col){g.fillStyle=col||'rgba(255,255,255,'+a+')';g.beginPath();g.arc(x,y,24*s,0,7);g.arc(x+26*s,y+4*s,20*s,0,7);g.arc(x-26*s,y+6*s,18*s,0,7);g.arc(x+8*s,y-14*s,19*s,0,7);g.fill()}
function leg(hx,hy,px,py,c){const L=44,d=Math.min(Math.hypot(px-hx,py-hy),2*L-1),a=Math.atan2(py-hy,px-hx),b=Math.acos(d/(2*L)),kx=hx+Math.cos(a-b)*L,ky=hy+Math.sin(a-b)*L;g.strokeStyle=c;g.lineWidth=11;g.lineCap='round';g.beginPath();g.moveTo(hx,hy);g.lineTo(kx,ky);g.lineTo(px,py);g.stroke()}
function drawSrc(){const a=S.sa;
 if(S.src=='bike'){sh(160,538,110,10);for(const x of[100,222]){g.strokeStyle='#111827';g.lineWidth=8;g.beginPath();g.arc(x,498,38,0,7);g.stroke();g.strokeStyle='#cbd5e1';g.lineWidth=2;g.beginPath();g.arc(x,498,32,0,7);g.stroke();g.lineWidth=1;g.strokeStyle='#e2e8f0';for(let k=0;k<12;k++){const t=a+k*.52;g.beginPath();g.moveTo(x,498);g.lineTo(x+Math.cos(t)*32,498+Math.sin(t)*32);g.stroke()}g.fillStyle='#475569';g.beginPath();g.arc(x,498,5,0,7);g.fill()}
  g.fillStyle='#4b5563';g.beginPath();g.moveTo(100,498);g.lineTo(78,545);g.lineTo(126,545);g.fill();g.save();g.translate(222,498);g.rotate(a);g.fillStyle=lg(-22,0,22,0,'#9ca3af','#f3f4f6','#6b7280');g.beginPath();g.arc(0,0,22,0,7);g.fill();g.strokeStyle='#374151';g.lineWidth=3;g.stroke();for(let k=0;k<6;k++){g.rotate(1.047);g.beginPath();g.moveTo(5,0);g.lineTo(17,0);g.stroke()}g.restore();
  g.strokeStyle='#dc2626';g.lineWidth=6;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(100,498);g.lineTo(148,495);g.lineTo(140,445);g.lineTo(205,438);g.lineTo(148,495);g.moveTo(100,498);g.lineTo(140,445);g.moveTo(205,438);g.lineTo(222,498);g.stroke();
  g.strokeStyle='#1f2937';g.lineWidth=7;g.beginPath();g.moveTo(130,440);g.lineTo(152,440);g.moveTo(205,438);g.lineTo(212,420);g.lineTo(226,420);g.stroke();
  g.strokeStyle='#94a3b8';g.lineWidth=3;g.beginPath();g.arc(148,495,13,0,7);g.stroke();g.beginPath();g.arc(100,498,7,0,7);g.stroke();
  const p1=[148+Math.cos(a)*24,495+Math.sin(a)*24],p2=[148-Math.cos(a)*24,495-Math.sin(a)*24];leg(158,428,p2[0],p2[1],'#1e3a8a');g.strokeStyle='#475569';g.lineWidth=4;g.beginPath();g.moveTo(...p1);g.lineTo(...p2);g.stroke();
  g.strokeStyle='#f97316';g.lineWidth=20;g.beginPath();g.moveTo(158,430);g.lineTo(186,385);g.stroke();g.strokeStyle='#f1c27d';g.lineWidth=7;g.beginPath();g.moveTo(186,390);g.lineTo(214,420);g.stroke();
  g.fillStyle='#f1c27d';g.beginPath();g.arc(194,368,12,0,7);g.fill();g.fillStyle='#2563eb';g.beginPath();g.arc(194,365,14,3.2,6.3);g.fill();leg(158,428,p1[0],p1[1],'#1d4ed8');g.fillStyle='#111';g.fillRect(p1[0]-8,p1[1]-2,16,5)}
 if(S.src=='faucet'){pipe([[20,175],[240,175],[240,205]],28,'#cbd5e1');rr(228,203,26,12,3,'#94a3b8','#475569');g.fillStyle='#dc2626';g.fillRect(120,140,8,22);g.beginPath();g.arc(124,138,13,0,7);g.fill();
  if(S.on){g.strokeStyle='rgba(56,189,248,.9)';g.lineWidth=7+6*S.lvl;g.lineCap='round';g.beginPath();g.moveTo(241,215);g.quadraticCurveTo(252,310,345,380);g.stroke();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;g.setLineDash([12,10]);g.lineDashOffset=-S.t*90;g.stroke();g.setLineDash([])}}
 if(S.src=='sun'){g.fillStyle=rg(90,115,5,110,'rgba(255,255,255,1)','rgba(253,224,71,.8)','rgba(253,224,71,0)');g.beginPath();g.arc(90,115,110,0,7);g.fill();g.fillStyle=rg(90,115,3,42,'#fff','#fde047','#f59e0b');g.beginPath();g.arc(90,115,42,0,7);g.fill();
}
 if(S.src=='kettle'){sh(140,560,90,10);rr(80,520,120,34,8,lg(0,520,0,554,'#e5e7eb','#6b7280'),'#374151');g.fillStyle='#111';g.beginPath();g.ellipse(140,521,46,8,0,0,7);g.fill();
  if(S.on)for(let k=0;k<12;k++){const t=k*.52+S.t*2,h=14+16*S.lvl*(.7+.3*Math.sin(S.t*16+k*3));g.fillStyle=k%2?'#2563eb':'#38bdf8';g.beginPath();g.ellipse(140+Math.cos(t)*34,519,5,h,0,0,7);g.globalAlpha=.8;g.fill();g.globalAlpha=1}
  g.fillStyle=lg(90,470,190,470,'#fca5a5','#dc2626','#7f1d1d');g.beginPath();g.moveTo(92,505);g.bezierCurveTo(88,455,192,455,188,505);g.lineTo(92,505);g.fill();g.fillStyle='#9ca3af';g.beginPath();g.ellipse(140,466,22,7,0,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(140,457,6,0,7);g.fill();
  g.strokeStyle='#dc2626';g.lineWidth=9;g.beginPath();g.moveTo(180,495);g.quadraticCurveTo(212,480,200,438);g.stroke();g.strokeStyle='#111';g.lineWidth=8;g.beginPath();g.arc(140,470,52,3.7,5.7);g.stroke();
  if(S.on)for(let k=0;k<7;k++){const u=(S.t*.5+k/7)%1;g.fillStyle='rgba(255,255,255,'+(.8-u*.7)+')';g.beginPath();g.arc(200+u*130,436-u*14+Math.sin(u*9+k)*6,6+u*12,0,7);g.fill()}}
