*{box-sizing:border-box}
html{font-size:clamp(13px,.95vw,18px)}
body{margin:0;min-width:1000px;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif}
#app{display:flex;height:100vh;background:linear-gradient(135deg,#dff7e0,#e6e0ff)}
#sw{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 10px 40px rgba(60,40,140,.35)}
#world{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;transition:transform .9s ease;background:var(--img) no-repeat;background-size:1672px 941px}
.o{position:absolute;background:var(--img) no-repeat;background-size:1672px 941px;-webkit-mask-image:radial-gradient(closest-side,#000 80%,transparent 100%);mask-image:radial-gradient(closest-side,#000 80%,transparent 100%);animation:dr var(--d) ease-in-out var(--dl) infinite}
@keyframes dr{0%,100%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(var(--sc))}}
.o.hl{animation-duration:.6s;--sc:1.15!important;--dx:calc(var(--dx0)*2)!important}
#fx{position:absolute;left:0;top:0;width:1672px;height:941px;z-index:10;pointer-events:none}
.g{opacity:0;transition:opacity .4s}.g.on{opacity:1}
.rg{fill:none;stroke-width:7;transform-box:fill-box;transform-origin:center;animation:rg 1s ease-out infinite}
@keyframes rg{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.4);opacity:0}}
.veil{position:absolute;top:0;width:836px;height:941px;background:rgba(255,255,255,.78);opacity:0;transition:opacity .6s;z-index:8;pointer-events:none}
.pt{position:absolute;z-index:20;font-size:54px;width:60px;height:60px;line-height:60px;text-align:center;pointer-events:none}
#side{width:clamp(360px,28vw,500px);padding:12px;overflow:auto;background:rgba(255,255,255,.78);display:flex;flex-direction:column;gap:7px}
h1{margin:0;font-size:1.45rem;color:#4b2a9a;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:6px}
.b{border:0;border-radius:12px;padding:8px 9px;font:700 .92rem system-ui,Arial;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:1 1 auto}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.b:disabled{opacity:.4}.b.sel{outline:3px solid #222}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#nm{font-size:1.25rem;font-weight:800}#fn{margin:4px 0;font-size:.98rem;line-height:1.4;color:#333}#pr{font-weight:800;font-size:.95rem}
#msg{min-height:4.2rem;font-size:1rem;font-weight:700;color:#0a5f2d;background:#eaffef;border-radius:12px;padding:9px}
.lab{font-size:.78rem;font-weight:800;color:#666}
#q{font-size:1.1rem;font-weight:800;margin-bottom:6px}
</style></head><body>
<div id="app">
 <div id="sw"><div id="stage"><div id="world"><svg id="fx" viewBox="0 0 1672 941"></svg></div></div></div>
 <div id="side">
  <h1>Plant Cell vs Animal Cell</h1>
  <div class="lab">1. VIEW</div>
  <div class="row"><button class="b" style="background:#555" id="vB">Both Cells</button><button class="b" style="background:#1c8a1c" id="vP">Plant Cell</button><button class="b" style="background:#6a2bd6" id="vA">Animal Cell</button></div>
  <div class="lab">2. ORGANELLES (tap to see them move)</div>
  <div class="row" id="tabs"></div>
  <div class="card"><div id="learn"><div id="nm">Choose an organelle</div><p id="fn">Tap a button to find it in both cells.</p><div id="pr"></div></div>
   <div id="quiz" hidden><div id="q"></div><div class="row" id="opts"></div><div class="lab" id="sc"></div></div></div>
  <div class="lab">3. LIFE PROCESSES</div>
  <div class="row" id="procs"></div>
  <div class="lab">4. COMPARE</div>
  <div class="row"><button class="b" style="background:#1c8a1c" id="cP">Only Plant</button><button class="b" style="background:#6a2bd6" id="cA">Only Animal</button><button class="b" style="background:#0a7ec2" id="cB">In Both</button><button class="b" style="background:#777" id="cR">Reset</button></div>
  <div id="msg">Tap any button to start exploring the two cells.</div>
  <div class="row"><button class="b" style="background:#7a2bd6" id="bAll">Play Tour</button><button class="b" style="background:#555" id="bStop">Stop</button><button class="b" style="background:#e0197d" id="bQuiz">Start Quiz</button><button class="b" style="background:#0a8f6a" id="bSnd">Sound: On</button><button class="b" style="background:#1e6bff" id="bFs">Full Screen</button></div>
  <div class="lab" style="text-align:center">Keys: 1 Both, 2 Plant, 3 Animal, Space = Tour, F = Full Screen, Esc = Stop</div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s),wait=t=>new Promise(r=>setTimeout(r,t)),rnd=a=>a[Math.floor(Math.random()*a.length)];
const W=$('#world'),F=$('#fx');
const T={
wall:{n:'Cell Wall',c:'#1c8a1c',p:1,a:0,f:'A hard outer layer. It gives the plant cell a fixed shape and keeps it safe.'},
mem:{n:'Cell Membrane',c:'#d4a000',p:1,a:1,f:'A thin skin around the cell. It decides what can go in and out.'},
cyto:{n:'Cytoplasm',c:'#00a38c',p:1,a:1,f:'A jelly-like liquid inside the cell. All the organelles float in it.'},
nucleus:{n:'Nucleus',c:'#8a1fc9',p:1,a:1,f:'The control centre (the brain) of the cell. It keeps the DNA.'},
chloro:{n:'Chloroplast',c:'#1fa83a',p:1,a:0,f:'Makes food for the plant using sunlight. It has green chlorophyll.'},
vacuole:{n:'Central Vacuole',c:'#1e9bff',p:1,a:0,f:'A big bag that stores water and food. It keeps the plant cell firm.'},
mito:{n:'Mitochondrion',c:'#ff7a00',p:1,a:1,f:'The powerhouse of the cell. It gives energy by using food.'},
rer:{n:'Rough ER',c:'#0a7ec2',p:1,a:1,f:'Has tiny dots called ribosomes. It makes proteins.'},
ser:{n:'Smooth ER',c:'#00a0b0',p:0,a:1,f:'Has no dots. It makes fats and removes harmful things. (This picture shows it in the animal cell.)'},
golgi:{n:'Golgi Apparatus',c:'#e0197d',p:1,a:1,f:'Packs proteins and sends them out, like a post office.'},
lyso:{n:'Lysosome',c:'#7a2bd6',p:0,a:1,f:'The clean-up crew. It breaks down waste and germs.'}};
const K=Object.keys(T);
const M={wall:[[183,606],[400,268]],mem:[[232,665],[1415,780]],cyto:[[347,731],[1228,765]]};
const OB=[['chloro','p',255,290,95,60],['chloro','p',322,308,85,60],['chloro','p',212,360,85,60],['vacuole','p',215,392,312,310],['rer','p',412,345,215,165],['nucleus','p',465,308,130,120],['mito','p',548,555,85,75],['mito','p',503,635,95,70],['golgi','p',412,695,150,100],
['nucleus','a',1100,325,160,150],['rer','a',1262,315,160,150],['ser','a',1318,435,160,125],['mito','a',1045,445,75,90],['mito','a',1105,525,85,85],['mito','a',1058,605,85,70],['golgi','a',1265,585,165,125],['lyso','a',1075,675,100,85]];
const PR={chloro:[8,-6,10,1.04,4],mito:[7,5,12,1.05,3],golgi:[5,-4,3,1.03,5],lyso:[10,-8,0,1.1,3.5],rer:[3,3,2,1.02,6],ser:[4,3,3,1.04,5],nucleus:[0,0,0,1.04,4],vacuole:[0,0,0,1.03,6]};
const inst=OB.map((o,i)=>{const[k,s,x,y,w,h]=o,p=PR[k],d=document.createElement('div');d.className='o';
 d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-position:-${x}px -${y}px;z-index:${k==='vacuole'?4:k==='nucleus'?6:5};--dx:${p[0]}px;--dx0:${p[0]}px;--dy:${p[1]}px;--rt:${p[2]}deg;--sc:${p[3]};--d:${p[4]+Math.random()}s;--dl:-${Math.random()*3}s`;
 W.insertBefore(d,F);return{k,s,x,y,w,h,d,c:[x+w/2,y+h/2]}});
F.innerHTML=inst.map((o,i)=>`<g class="g" id="r${i}"><circle class="rg" stroke="${T[o.k].c}" cx="${o.c[0]}" cy="${o.c[1]}" r="${Math.max(o.w,o.h)/2*.85}"/></g>`).join('')+Object.keys(M).map(k=>M[k].map((p,j)=>`<g class="g" id="m${k}${j}"><circle class="rg" stroke="${T[k].c}" cx="${p[0]}" cy="${p[1]}" r="45"/></g>`).join('')).join('');
const vl=[0,836].map(x=>{const d=document.createElement('div');d.className='veil';d.style.left=x+'px';W.insertBefore(d,F);return d});
let AC,snd=1,run=0,qm=0,ht;
function tone(f,t=.25,ty='sine',v=.1,d=0){if(!snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+t)}catch(e){}}
const say=t=>$('#msg').textContent=t;
function clr(){clearTimeout(ht);inst.forEach((o,i)=>{o.d.classList.remove('hl');$('#r'+i).classList.remove('on')});document.querySelectorAll('[id^=m]').forEach(g=>g.classList.remove('on'))}
function hi(fn,ms=4500){clr();inst.forEach((o,i)=>{if(fn(o)){o.d.classList.add('hl');$('#r'+i).classList.add('on')}});return ms}
function mk(k){(M[k]||[]).forEach((p,j)=>$('#m'+k+j).classList.add('on'))}
function auto(ms){clearTimeout(ht);ht=setTimeout(clr,ms)}
function zoom(cx,cy,s){W.style.transform=`translate(${836-cx*s}px,${470-cy*s}px) scale(${s})`}
function view(v){run++;$('#vB').classList.toggle('sel',v==='b');$('#vP').classList.toggle('sel',v==='p');$('#vA').classList.toggle('sel',v==='a');
 vl[1].style.opacity=v==='p'?1:0;vl[0].style.opacity=v==='a'?1:0;
 if(v==='p')zoom(380,560,1.55);else if(v==='a')zoom(1290,560,1.55);else zoom(836,470,1);
 say(v==='b'?'Showing both cells side by side.':v==='p'?'This is the Plant Cell. It has a wall, chloroplasts and a big vacuole.':'This is the Animal Cell. It has a round shape and lysosomes.');tone(500,.15)}
function sel(k,keep){
 document.querySelectorAll('#tabs .b').forEach(b=>b.classList.toggle('sel',b.dataset.k===k));
 const t=T[k];qm=0;$('#quiz').hidden=true;$('#learn').hidden=false;
 $('#nm').innerHTML=`<span style="color:${t.c}">${t.n}</span>`;$('#fn').textContent=t.f;
 $('#pr').textContent=`Plant Cell: ${t.p?'✔ Yes':'✘ No'}    Animal Cell: ${t.a?'✔ Yes':'✘ No'}`;
 const ms=hi(o=>o.k===k);if(M[k])['wall','mem','cyto'].includes(k)&&mk(k);
 if(!keep)auto(ms);say(t.n+': '+t.f);tone(400+K.indexOf(k)*60,.2)}
K.forEach(k=>{const b=document.createElement('button');b.className='b';b.dataset.k=k;b.style.background=T[k].c;b.textContent=T[k].n;b.onclick=()=>{run++;sel(k)};$('#tabs').appendChild(b)});
function fly(e,a,b,d=1400,sz){const p=document.createElement('div');p.className='pt';p.textContent=e;p.style.left=a[0]-30+'px';p.style.top=a[1]-30+'px';if(sz)p.style.fontSize=sz+'px';W.appendChild(p);
 const x=b[0]-a[0],y=b[1]-a[1];return p.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1.2)',opacity:1,offset:.15},{transform:`translate(${x}px,${y}px) scale(.8)`,opacity:1,offset:.9},{transform:`translate(${x}px,${y}px) scale(.2)`,opacity:0}],{duration:d}).finished.then(()=>p.remove())}
const of=(k,s)=>inst.filter(o=>o.k===k&&(!s||o.s===s));
const PRC=[
['☀️ Photosynthesis','#1fa83a',async()=>{view('p');hi(o=>o.k==='chloro');say('Photosynthesis: chloroplasts use sunlight, water and air to make food and oxygen.');await Promise.all(of('chloro').map((o,i)=>wait(i*350).then(()=>fly('☀️',[o.c[0]-20,230],o.c,1500,70))));tone(700,.3);await Promise.all(of('chloro').map((o,i)=>fly('🫧',o.c,[o.c[0]-30,o.c[1]-230],1800)));say('Food (glucose) is made. Oxygen goes out. Chloroplasts are only in plant cells!');auto(2500)}],
['⚡ Energy (Respiration)','#ff7a00',async()=>{view('b');hi(o=>o.k==='mito');say('Mitochondria use food to release energy for the cell.');await Promise.all(of('mito').map((o,i)=>wait(i*250).then(()=>fly('🍬',[o.c[0],o.c[1]-120],o.c,1300))));tone(900,.2);await Promise.all(of('mito').map((o,i)=>fly('⚡',o.c,[o.c[0]+(o.s==='p'?-70:70),o.c[1]+90],1400)));say('Energy released! Both plant and animal cells have mitochondria.');auto(2500)}],
['🔵 Make Proteins','#0a7ec2',async()=>{view('b');hi(o=>o.k==='rer'||o.k==='golgi');say('Rough ER makes proteins. Golgi packs them and sends them out.');for(const s of['p','a']){const r=of('rer',s)[0].c,g=of('golgi',s)[0].c,e=s==='p'?[690,780]:[1490,700];fly('🔵',r,g,1500).then(()=>fly('📦',g,e,1500))}await wait(3300);tone(600,.2);say('Proteins are sent out of the cell in small packages.');auto(2500)}],
['💧 Store Water','#1e9bff',async()=>{view('p');hi(o=>o.k==='vacuole');const v=of('vacuole')[0].c;say('The central vacuole fills with water and keeps the plant cell firm.');await Promise.all([0,1,2,3].map(i=>wait(i*300).then(()=>fly('💧',[v[0]-200+i*90,v[1]-220],v,1400))));say('Full of water, the vacuole pushes against the wall. The plant stands up straight!');auto(2500)}],
['🦠 Clean Up (Digest)','#7a2bd6',async()=>{view('a');hi(o=>o.k==='lyso');const l=of('lyso')[0].c;say('Lysosomes break down waste and germs.');await Promise.all([0,1].map(i=>wait(i*400).then(()=>fly('🦠',[l[0]+160+i*60,l[1]-150],l,1500))));tone(250,.3,'square',.05);say('The germs are broken down. The cell stays clean and safe.');auto(2500)}]];
PRC.forEach(p=>{const b=document.createElement('button');b.className='b';b.style.background=p[1];b.textContent=p[0];b.onclick=()=>{run++;p[2]()};$('#procs').appendChild(b)});
$('#vB').onclick=()=>{view('b')};$('#vP').onclick=()=>view('p');$('#vA').onclick=()=>view('a');
const cmp=(f,m,c)=>{run++;view('b');const ks=K.filter(f);hi(o=>ks.includes(o.k));ks.forEach(mk);auto(6000);say(m);tone(c,.3)};
$('#cP').onclick=()=>cmp(k=>T[k].p&&!T[k].a,'Only in the plant cell: Cell Wall, Chloroplasts and the big Central Vacuole.',700);
$('#cA').onclick=()=>cmp(k=>T[k].a&&!T[k].p,'Only in the animal cell (in this picture): Lysosomes and Smooth ER.',500);
$('#cB').onclick=()=>cmp(k=>T[k].a&&T[k].p,'In both cells: Cell Membrane, Cytoplasm, Nucleus, Mitochondria, Rough ER and Golgi.',600);
$('#cR').onclick=()=>{run++;clr();view('b');say('Reset. Tap any button to explore.')};
$('#bAll').onclick=async()=>{const id=++run;view('b');for(const k of K){if(id!==run)return;sel(k,1);await wait(3800)}if(id!==run)return;clr();for(const p of PRC){if(id!==run)return;await p[2]();await wait(1800)}if(id===run){view('b');say('Great job! You toured both cells.')}};
$('#bStop').onclick=()=>{run++;clr();say('Stopped. Choose something to explore.')};
$('#bSnd').onclick=e=>{snd=!snd;e.target.textContent='Sound: '+(snd?'On':'Off')};
const ON=['Nucleus','Mitochondrion','Golgi Apparatus','Lysosome','Chloroplast','Cell Wall','Cell Membrane','Cytoplasm'];
const QZ=[['Which organelle is the control centre of the cell?',['Lysosome','Nucleus','Golgi Apparatus','Mitochondrion'],1,'nucleus'],['Which organelle makes food using sunlight?',['Chloroplast','Mitochondrion','Nucleus','Lysosome'],0,'chloro'],['Which organelle is called the powerhouse?',['Golgi Apparatus','Nucleus','Mitochondrion','Rough ER'],2,'mito'],['Which part gives a plant cell a fixed shape?',['Cell Membrane','Cytoplasm','Nucleus','Cell Wall'],3,'wall'],['Which cell has a big central vacuole?',['Animal Cell','Plant Cell','Both','None'],1,'vacuole'],['Which cell has chloroplasts?',['Plant Cell','Animal Cell','Both','None'],0,'chloro'],['Which organelle breaks down waste and germs?',['Lysosome','Chloroplast','Cell Wall','Nucleus'],0,'lyso'],['Which organelle packs and sends out proteins?',['Mitochondrion','Golgi Apparatus','Lysosome','Cytoplasm'],1,'golgi'],['Which cell has a cell wall?',['Animal Cell','Both','Plant Cell','None'],2,'wall'],['Which organelle has tiny dots and makes proteins?',['Smooth ER','Vacuole','Lysosome','Rough ER'],3,'rer']];
let qs,qi,score;
function ask(){const o=$('#opts');o.innerHTML='';if(qi>=qs.length){$('#q').textContent='Quiz finished! Score: '+score+' / '+qs.length;say(score>=8?'Excellent! You are a Cell Expert!':'Good try! Play again to learn more.');return}
 const q=qs[qi];$('#q').textContent=(qi+1)+'. '+q[0];$('#sc').textContent='Score: '+score;
 q[1].forEach((t,i)=>{const b=document.createElement('button');b.className='b';b.style.background='#5b3fd0';b.textContent=t;b.onclick=()=>{
  if(i===q[2]){score++;o.querySelectorAll('button').forEach(x=>x.disabled=true);const ms=hi(x=>x.k===q[3]);mk(q[3]);auto(ms);say('Correct! '+T[q[3]].n+': '+T[q[3]].f);tone(880,.2);tone(1100,.3,'sine',.1,.15);setTimeout(()=>{qi++;ask()},3200)}
  else{b.disabled=true;say('Not this one. Try again!');tone(200,.3,'square',.06)}};o.appendChild(b)})}
$('#bQuiz').onclick=()=>{run++;clr();if(qm){qm=0;$('#quiz').hidden=true;$('#learn').hidden=false;$('#bQuiz').textContent='Start Quiz';say('Back to learning.');return}
 qm=1;qs=QZ.slice().sort(()=>Math.random()-.5);qi=0;score=0;$('#learn').hidden=true;$('#quiz').hidden=false;$('#bQuiz').textContent='Exit Quiz';ask()};
const app=$('#app'),fb=$('#bFs');
fb.onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(app.requestFullscreen||app.webkitRequestFullscreen).call(app)};
function fit(){const w=$('#sw'),s=Math.min(w.clientWidth/1672,w.clientHeight/941),st=$('#stage');st.style.transform=`translate(${(w.clientWidth-1672*s)/2}px,${(w.clientHeight-941*s)/2}px) scale(${s})`;fb.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'Exit Full Screen':'Full Screen'}
addEventListener('keydown',e=>{if(e.key==='1')$('#vB').click();else if(e.key==='2')$('#vP').click();else if(e.key==='3')$('#vA').click();else if(e.key==='f'||e.key==='F')fb.click();else if(e.key===' '){e.preventDefault();$('#bAll').click()}else if(e.key==='Escape')$('#bStop').click()});
addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);document.addEventListener('webkitfullscreenchange',fit);fit();view('b');say('Tap any button to start exploring the two cells.');
</script></body></html>
