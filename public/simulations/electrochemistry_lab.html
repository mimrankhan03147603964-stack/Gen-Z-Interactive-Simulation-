<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electrochemistry Lab – Unit 7</title>
<style>
:root{--panel:#16303f;--ink:#eaf4f7}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Nunito","Trebuchet MS",Verdana,sans-serif;background:#0f2230;color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 25% 0,#1f4a63,#0f2230 70%)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
h1{font-size:23px;margin:0 auto 0 0}h1 small{font-weight:600;color:#9fb8c4;font-size:14px;margin-left:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
main{flex:1;min-height:0;display:flex;gap:14px;padding:0 18px 16px}
#stage{flex:1;min-width:0;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);background:#cfe3ea}
svg{width:100%;height:100%;display:block}
aside{width:350px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.card{background:var(--panel);border-radius:14px;padding:12px 14px}
.card h2{font-size:17px;margin:0 0 6px}.card p{margin:0;font-size:14px;line-height:1.5;color:#d3e4ea}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;border:0;border-radius:12px;padding:11px 8px;background:var(--c);color:var(--t,#fff);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button.on,button.active,button:focus-visible{outline:3px solid #fff}
.tab{font-size:15px;padding:10px 14px}
.ox{display:none}.showox .ox{display:inline}
.noion .ion{display:none}
.hlox .zn{filter:drop-shadow(0 0 9px #ff1744)}.hlre .cu{filter:drop-shadow(0 0 9px #2979ff)}
</style></head><body>
<div id="app">
<header><h1>Electrochemistry Lab<small>Unit 7</small></h1><div class="row" id="tabs"></div>
<div class="row"><button id="spd" style="--c:#8338ec">Speed ×1</button><button id="pz" style="--c:#fb5607">Pause</button><button id="fsb" style="--c:#06d6a0">Full Screen</button></div></header>
<main>
<div id="stage"><svg id="svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f3f7"/><stop offset="1" stop-color="#b7d4df"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9854f"/><stop offset="1" stop-color="#7a4f2a"/></linearGradient>
<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".3" stop-color="#fff" stop-opacity=".06"/><stop offset=".8" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient>
<linearGradient id="zinc" x1="0" x2="1"><stop offset="0" stop-color="#8e9aa3"/><stop offset=".45" stop-color="#eaf0f3"/><stop offset="1" stop-color="#97a3ac"/></linearGradient>
<linearGradient id="copper" x1="0" x2="1"><stop offset="0" stop-color="#8a4a22"/><stop offset=".45" stop-color="#f0a06a"/><stop offset="1" stop-color="#a8582a"/></linearGradient>
<linearGradient id="iron" x1="0" x2="1"><stop offset="0" stop-color="#3b4148"/><stop offset=".45" stop-color="#99a1a8"/><stop offset="1" stop-color="#3a4046"/></linearGradient>
<linearGradient id="graph" x1="0" x2="1"><stop offset="0" stop-color="#1e1e1e"/><stop offset=".5" stop-color="#6b6b6b"/><stop offset="1" stop-color="#1e1e1e"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff6a0"/><stop offset="1" stop-color="#ffd60a" stop-opacity="0"/></radialGradient>
<clipPath id="nc"><path d="M391 162H409V418L400 440L391 418Z"/></clipPath>
</defs>
<rect width="800" height="470" fill="url(#wall)"/><rect y="470" width="800" height="50" fill="url(#wood)"/><rect y="470" width="800" height="5" fill="#d9a56b"/>
<g id="LB"></g><g id="LP"></g><g id="LF"></g>
</svg></div>
<aside>
<div class="card"><div class="btns" id="btns"></div></div>
<div class="card"><h2 id="ttl"></h2><p id="inf"></p></div>
<div class="card"><h2>Lab note</h2><p id="msg"></p></div>
</aside></main></div>
<script>
const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),svg=$('#svg'),LB=$('#LB'),LP=$('#LP'),LF=$('#LF');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const rnd=(a,b)=>a+Math.random()*(b-a),say=m=>$('#msg').textContent=m,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let cur,S,tasks=[],speed=1,paused=false,last=0;
const T=(x,y,s,t,f='#0f2230',a='middle')=>`<text x="${x}" y="${y}" font-size="${s}" fill="${f}" text-anchor="${a}" font-weight="800">${t}</text>`;
const glass=(x,y,w,h)=>`<path d="M${x} ${y}V${y+h-16}Q${x} ${y+h} ${x+16} ${y+h}H${x+w-16}Q${x+w} ${y+h} ${x+w} ${y+h-16}V${y}" fill="url(#glass)" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M${x+12} ${y+24}V${y+h-44}" stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round"/>`+[1,2,3].map(i=>`<path d="M${x+w-4} ${y+h-i*50}h-22" stroke="#fff" stroke-width="2" opacity=".7"/>`).join('');
function ion(x,y,r,fill,txt,ox,cls,par){const g=el('g',{class:'ion '+(cls||'')},par||LP);el('circle',{r,fill,stroke:'#fff','stroke-width':1.5},g);
 const t=el('text',{'text-anchor':'middle',y:r*.3,'font-size':r*.75,fill:'#fff','font-weight':800},g);t.textContent=txt;
 if(ox!=null){const b=el('text',{class:'ox','text-anchor':'middle',y:-r-3,'font-size':12,fill:'#b3002d','font-weight':900},g);b.textContent=ox}
 const o={g,t,x,y,vx:rnd(-20,20),vy:rnd(-20,20),set(a,b){o.x=a;o.y=b;g.setAttribute('transform',`translate(${a},${b})`)}};o.set(x,y);return o}
function jig(o,dt,b){o.vx+=rnd(-60,60)*dt;o.vy+=rnd(-60,60)*dt;const m=Math.hypot(o.vx,o.vy);if(m>30){o.vx*=30/m;o.vy*=30/m}
 let x=o.x+o.vx*dt,y=o.y+o.vy*dt;if(x<b[0]||x>b[2]){o.vx*=-1;x=o.x}if(y<b[1]||y>b[3]){o.vy*=-1;y=o.y}o.set(x,y)}
function pop(x,y,txt,col){const e=el('text',{x,y,'text-anchor':'middle','font-size':15,'font-weight':900,fill:col||'#ffd60a',stroke:'#7a5c00','stroke-width':.6},LP);e.textContent=txt;let l=1,Y=y;
 tasks.push(dt=>{Y-=35*dt;l-=dt*.8;e.setAttribute('y',Y);e.setAttribute('opacity',l);if(l<=0){e.remove();return 0}return 1})}
function bubble(x,y,c,top=262){const e=el('circle',{r:rnd(4,7),fill:c,'fill-opacity':.85,stroke:'#fff'},LP);let X=x+rnd(-8,8),Y=y,ph=rnd(0,6);
 tasks.push(dt=>{Y-=70*dt;X+=Math.sin(ph+Y/15)*20*dt;e.setAttribute('transform',`translate(${X},${Y})`);if(Y<top){e.remove();return 0}return 1})}
function along(p,s){let L=0;const l=[];for(let i=1;i<p.length;i++){l.push(Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));L+=l[i-1]}s=((s%L)+L)%L;
 for(let i=0;i<l.length;i++){if(s<=l[i]){const f=s/l[i];return[p[i][0]+(p[i+1][0]-p[i][0])*f,p[i][1]+(p[i+1][1]-p[i][1])*f]}s-=l[i]}return p[0]}
function eDots(par,w,p,n,sp){for(let i=0;i<n;i++)S.dots.push({w,p,s:i*sp,e:el('circle',{r:5,fill:'#ffd60a',stroke:'#b8860b'},par)})}
const tg=(b,k,f)=>{S[k]=!S[k];b.classList.toggle('on',!!S[k]);f&&f()};
const scenes={};

/* ---------- 1. REDOX ---------- */
function react(o){o.k='atom';o.fix=1;o.g.firstChild.setAttribute('fill','url(#copper)');o.t.textContent='Cu';o.g.querySelector('.ox').textContent='0';
 pop(o.x,o.y-18,'2e⁻');S.n++;const z=ion(o.x,o.y,13,'#7d8a96','Zn²⁺','+2','zn');z.k='zn';z.tg={x:o.x+(o.x<400?-1:1)*rnd(20,70),y:o.y+rnd(-40,40),done(){}};S.ions.push(z);
 $('#liq').setAttribute('opacity',.75-S.n*.035);$('#zr').setAttribute('height',200-S.n*3);
 say(S.n+' copper ions have gained electrons and plated onto the zinc. Each Zn atom lost 2 electrons.')}
scenes.redox={tab:['1. Redox','#ef476f'],ttl:'Oxidation and Reduction',
inf:'Zn → Zn²⁺ + 2e⁻ (oxidation: electrons lost, oxidation number rises 0 → +2). Cu²⁺ + 2e⁻ → Cu (reduction: electrons gained, +2 → 0). OIL RIG: Oxidation Is Loss, Reduction Is Gain.',
hint:'Press “Dip Zinc Strip” to lower the zinc into the blue copper sulfate solution.',
build(){S={ty:0,tyT:0,go:0,t:0,n:0,ions:[]};
 LB.innerHTML=`<rect id="liq" x="253" y="250" width="294" height="207" rx="10" fill="#2f8fe8" opacity=".75"/>
 <g id="strip"><line x1="400" y1="-200" x2="400" y2="0" stroke="#555" stroke-width="3"/><rect class="zn" id="zr" x="385" y="0" width="30" height="200" fill="url(#zinc)" stroke="#6b7680"/>${T(450,175,14,'Zn = 0','#b3002d','start').replace('<text','<text class="ox"')}</g>`;
 LF.innerHTML=glass(250,190,300,270)+T(150,300,15,'Copper sulfate','#0f2230')+T(150,320,15,'solution (Cu²⁺ blue)')+T(150,110,15,'Zinc strip')+'<path d="M200 115L370 100" stroke="#0f2230" stroke-width="2"/>'+T(650,330,15,'Beaker (glass)')+T(650,260,15,'Cu²⁺ ions','#1b5fb5')+T(650,284,13,'(oxidation number +2)','#1b5fb5');
 for(let i=0;i<12;i++){let x;do x=rnd(280,520);while(Math.abs(x-400)<40);const o=ion(x,rnd(285,435),13,'#1b5fb5','Cu²⁺','+2','cu');o.k='cu';S.ions.push(o)}},
tick(dt){S.ty+=(S.tyT-S.ty)*Math.min(1,dt*3);$('#strip').setAttribute('transform',`translate(0,${S.ty})`);
 S.ions.forEach(o=>{if(o.tg){const dx=o.tg.x-o.x,dy=o.tg.y-o.y,d=Math.hypot(dx,dy);if(d<5){const f=o.tg.done;o.tg=null;f(o)}else o.set(o.x+dx/d*140*dt,o.y+dy/d*140*dt)}else if(!o.fix)jig(o,dt,[272,282,528,440])});
 if(S.go&&S.ty>100){S.t+=dt;if(S.t>.8){S.t=0;const f=S.ions.filter(o=>o.k=='cu'&&!o.tg);if(f.length){const o=f[0|rnd(0,f.length)];o.tg={x:400+(Math.random()<.5?-1:1)*30,y:rnd(290,420),done:react}}}}},
btns:[['Dip Zinc Strip','#ff9f1c',()=>{S.tyT=130;say('The zinc strip is now in the solution. Next, start the electron transfer.')}],
['Lift Strip','#8d99ae',()=>{S.tyT=0;S.go=0;say('Strip lifted. Nothing happens in the air.')}],
['Start Electron Transfer','#06d6a0',()=>{if(S.ty<100)return say('Dip the zinc strip first!');S.go=1;say('Electrons jump from zinc atoms to copper ions. Watch the blue color fade.')}],
['Show Oxidation Numbers','#7b2cbf',b=>{svg.classList.toggle('showox');b.classList.toggle('on')}],
['Spotlight Oxidation','#e63946',b=>{svg.classList.toggle('hlox');b.classList.toggle('on');say('Red glow: zinc is OXIDISED (loses electrons). It is the reducing agent.')}],
['Spotlight Reduction','#3a86ff',b=>{svg.classList.toggle('hlre');b.classList.toggle('on');say('Blue glow: Cu²⁺ is REDUCED (gains electrons). It is the oxidising agent.')}],
['OIL RIG Tip','#ffbe0b',()=>say('OIL RIG: Oxidation Is Loss of electrons, Reduction Is Gain of electrons. Zinc = loss, copper = gain.'),'#222'],
['Reset Scene','#d00000',()=>load('redox')]]};

/* ---------- 2. ELECTROLYSIS ---------- */
const P0=[[352,100],[352,130],[300,130],[300,152]],P1=[[448,100],[448,130],[500,130],[500,152]];
function mkIons(){S.ions.forEach(o=>o.g.remove());S.ions=[];LP.querySelectorAll('.bead').forEach(e=>e.remove());
 const add=(n,r,f,t,ox,k)=>{for(let i=0;i<n;i++){const o=ion(rnd(250,550),rnd(300,430),r,f,t,ox,k);o.k=k;S.ions.push(o)}};
 add(9,11,'#8e5bd6','Na⁺','+1','na');add(9,13,'#2fa84f','Cl⁻','−1','cl');if(!S.mol)add(6,10,'#5ec8e5','H₂O',null,'w');
 S.c={na:0,h2:0,cl:0};$('#pink').setAttribute('opacity',0)}
function refreshE(){const m=S.mol,c=S.pol?0:1,a=1-c,q=(i,k,v)=>$(i).setAttribute(k,v);
 q('#liq','fill',m?'#ff8a1f':'#bde8f5');q('#liq','opacity',m?.9:.65);
 q('#w'+c,'stroke','#1b1b1b');q('#w'+a,'stroke','#d62828');q('#tm'+c,'fill','#1b1b1b');q('#tm'+a,'fill','#d62828');
 $('#s'+c).textContent='−';$('#s'+a).textContent='+';$('#lc'+c).textContent='Cathode (−)';$('#lc'+a).textContent='Anode (+)';
 $('#ra'+c).textContent=S.showR?(m?'Na⁺ + e⁻ → Na':'2H₂O + 2e⁻ → H₂ + 2OH⁻'):'';$('#ra'+a).textContent=S.showR?'2Cl⁻ → Cl₂ + 2e⁻':'';
 q('#pink','cx',c?500:300);$('#cell').textContent=m?'Molten NaCl (about 800 °C)':'Salt water (brine)'}
scenes.elec={tab:['2. Electrolysis','#3a86ff'],ttl:'Electrolytic Cell',
inf:'Electricity forces a non-spontaneous reaction. The battery pushes electrons to the cathode (−) where reduction happens, and pulls them from the anode (+) where oxidation happens. Molten NaCl gives sodium + chlorine; salt water gives hydrogen + chlorine + NaOH.',
hint:'Switch the power on and watch the ions march to the electrodes.',
build(){S={on:0,mol:1,pol:1,tc:0,ions:[],dots:[],showE:0,showR:0,c:{na:0,h2:0,cl:0}};
 LB.innerHTML=`<rect id="liq" x="223" y="262" width="354" height="195" rx="10"/><ellipse id="pink" cx="300" cy="360" rx="75" ry="90" fill="#ff4fa3" opacity="0"/><rect x="288" y="150" width="24" height="260" rx="4" fill="url(#graph)"/><rect x="488" y="150" width="24" height="260" rx="4" fill="url(#graph)"/>`;
 LF.innerHTML=glass(220,210,360,250)+`<path id="w0" d="M352 100V130H300V152" fill="none" stroke-width="5"/><path id="w1" d="M448 100V130H500V152" fill="none" stroke-width="5"/>
 <rect x="325" y="28" width="150" height="82" rx="10" fill="#2b3a46" stroke="#111" stroke-width="2"/><rect x="335" y="36" width="130" height="24" rx="4" fill="#0b1a14"/>${T(390,53,13,'DC SUPPLY 6 V','#5dff8f')}<circle id="led" cx="450" cy="48" r="4" fill="#444"/>
 <circle id="tm0" cx="352" cy="100" r="7" stroke="#fff"/><circle id="tm1" cx="448" cy="100" r="7" stroke="#fff"/><text id="s0" x="352" y="86" font-size="16" fill="#fff" text-anchor="middle" font-weight="900"></text><text id="s1" x="448" y="86" font-size="16" fill="#fff" text-anchor="middle" font-weight="900"></text>
 <text id="lc0" x="300" y="196" font-size="14" fill="#0f2230" text-anchor="middle" font-weight="800"></text><text id="lc1" x="500" y="196" font-size="14" fill="#0f2230" text-anchor="middle" font-weight="800"></text>
 <text id="ra0" x="300" y="248" font-size="12" fill="#7a0030" text-anchor="middle" font-weight="800"></text><text id="ra1" x="500" y="248" font-size="12" fill="#00502b" text-anchor="middle" font-weight="800"></text>
 <rect x="590" y="124" width="200" height="86" rx="10" fill="#fff" opacity=".88"/><text id="cell" x="600" y="146" font-size="12" fill="#0f2230" font-weight="800"></text><text id="r0" x="600" y="168" font-size="13" fill="#0f2230" font-weight="800"></text><text id="r1" x="600" y="186" font-size="13" fill="#0f2230" font-weight="800"></text><text id="r2" x="600" y="204" font-size="13" fill="#0f2230" font-weight="800"></text>
 ${T(150,330,14,'Graphite electrode')}<path d="M205 322L286 330" stroke="#0f2230" stroke-width="2"/>`;
 eDots(LF,0,P0,5,21);eDots(LF,1,P1,5,21);mkIons();refreshE()},
tick(dt){const c=S.pol?0:1,cx=c?500:300,ax=c?300:500,m=S.mol;
 S.ions.forEach(o=>{if(S.on&&(o.k=='na'||o.k=='cl')){const t=o.k=='na'?cx:ax,dx=t-o.x;
  if(Math.abs(dx)<26){if(o.k=='cl'){S.c.cl++;bubble(ax,o.y,'#c6e377');o.set(rnd(250,550),rnd(300,430))}
   else if(m){S.c.na++;el('circle',{class:'bead',cx:cx+rnd(-14,14),cy:rnd(300,400),r:4.5,fill:'#e3e8ec',stroke:'#8d99a6'},LP);if(LP.querySelectorAll('.bead').length>40)LP.querySelector('.bead').remove();o.set(rnd(250,550),rnd(300,430))}
   else o.set(o.x,cl(o.y+rnd(-20,20)*dt,290,440))}
  else o.set(o.x+Math.sign(dx)*75*dt,cl(o.y+rnd(-20,20)*dt,285,440))}else jig(o,dt,[235,285,565,445])});
 if(S.on&&!m){S.tc+=dt;if(S.tc>.55){S.tc=0;S.c.h2++;bubble(cx,rnd(300,400),'#fff');const p=$('#pink');p.setAttribute('opacity',Math.min(.35,+p.getAttribute('opacity')+.012))}}
 $('#led').setAttribute('fill',S.on?'#3cff72':'#444');
 S.dots.forEach(d=>{const q=along(d.p,d.s+=(d.w==c?1:-1)*dt*80);d.e.setAttribute('cx',q[0]);d.e.setAttribute('cy',q[1]);d.e.style.display=S.on&&S.showE?'':'none'});
 $('#r0').textContent=m?'Sodium (Na) formed: '+S.c.na:'Hydrogen (H₂) bubbles: '+S.c.h2;$('#r1').textContent='Chlorine (Cl₂) bubbles: '+S.c.cl;$('#r2').textContent=m?'':'Pink area = NaOH (base)'},
btns:[['Power ON','#06d6a0',b=>{S.on=!S.on;b.textContent=S.on?'Power OFF':'Power ON';say(S.on?'Current flows. Positive ions go to the cathode, negative ions to the anode.':'Power off. Ions just wander randomly.')}],
['Molten NaCl','#ff6b35',()=>{S.mol=1;mkIons();refreshE();say('Molten NaCl: only Na⁺ and Cl⁻ ions are present. Na metal forms at the cathode, Cl₂ gas at the anode.')}],
['Salt Water','#3a86ff',()=>{S.mol=0;mkIons();refreshE();say('Salt water also contains water. Water is easier to reduce than Na⁺, so H₂ gas forms at the cathode instead of sodium.')}],
['Reverse Polarity','#ef476f',()=>{S.pol=!S.pol;mkIons();refreshE();say('Battery reversed! The electrode roles swap: the right electrode is now the cathode (−).')}],
['Show Half-Reactions','#9d4edd',b=>tg(b,'showR',refreshE)],
['Show Electron Flow','#ffbe0b',b=>tg(b,'showE'),'#222'],
['Hide Ions','#00b4d8',b=>{tg(b,'noion',()=>svg.classList.toggle('noion',!!S.noion));b.textContent=S.noion?'Show Ions':'Hide Ions'}],
['Product Report','#2a9d8f',()=>say(S.mol?'Cathode: sodium metal (silver beads). Anode: chlorine gas (pale green). Overall: 2NaCl → 2Na + Cl₂':'Cathode: hydrogen gas. Anode: chlorine gas. Solution left: NaOH. Overall: 2NaCl + 2H₂O → H₂ + Cl₂ + 2NaOH')],
['Reset Scene','#d00000',()=>load('elec')]]};

/* ---------- 3. GALVANIC ---------- */
const BP=[[270,330],[270,282],[284,268],[516,268],[530,282],[530,330]],EP=[[215,190],[215,88],[585,88],[585,190]];
scenes.gal={tab:['3. Galvanic Cell','#06d6a0'],ttl:'Zinc–Copper Daniell Cell',
inf:'A galvanic cell turns chemical energy into electricity. Zinc (anode, −) oxidises: Zn → Zn²⁺ + 2e⁻. Electrons travel through the wire to copper (cathode, +): Cu²⁺ + 2e⁻ → Cu. The salt bridge keeps both beakers electrically neutral. Cell notation: Zn | Zn²⁺ || Cu²⁺ | Cu.',
hint:'Close the switch to light the bulb. Then try removing the salt bridge!',
build(){S={closed:0,bridge:1,showE:0,showR:0,ff:0,prog:0,v:0,by:0,t:0,lit:0,ions:[],dots:[],bd:[],done:0};
 LB.innerHTML=`<rect x="103" y="300" width="224" height="157" rx="10" fill="#d6ecf2" opacity=".7"/><rect x="473" y="300" width="224" height="157" rx="10" fill="#2f8fe8" opacity=".75"/>
 <rect id="zE" x="200" y="190" width="30" height="240" fill="url(#zinc)" stroke="#6b7680"/><rect id="cR" x="570" y="190" width="30" height="240" fill="url(#copper)" stroke="#7a3b18"/>`;

 for(let i=0;i<4;i++){S.bd.push({o:ion(0,0,8,'#8e5bd6','K⁺',null,'',bg),s:i*50,d:1},{o:ion(0,0,8,'#2fa84f','NO₃⁻',null,'',bg),s:i*50+25,d:-1})}

/* ---------- ENGINE ---------- */
function load(k){cur=scenes[k];cur.key=k;tasks=[];LB.innerHTML=LP.innerHTML=LF.innerHTML='';svg.setAttribute('class','');cur.build();
 const B=$('#btns');B.innerHTML='';cur.btns.forEach(([l,c,f,t])=>{const b=document.createElement('button');b.textContent=l;b.style.setProperty('--c',c);t&&b.style.setProperty('--t',t);b.onclick=()=>f(b);B.appendChild(b)});
 $('#ttl').textContent=cur.ttl;$('#inf').textContent=cur.inf;say(cur.hint);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.k==k))}
Object.keys(scenes).forEach(k=>{const b=document.createElement('button');b.className='tab';b.dataset.k=k;b.textContent=scenes[k].tab[0];b.style.setProperty('--c',scenes[k].tab[1]);b.onclick=()=>load(k);$('#tabs').appendChild(b)});
function loop(t){const dt=Math.min(.05,(t-last)/1000)*speed;last=t;if(!paused){cur.tick&&cur.tick(dt);const old=tasks;tasks=[];for(const f of old)if(f(dt))tasks.push(f)}requestAnimationFrame(loop)}
$('#spd').onclick=e=>{speed=speed==1?2:speed==2?.5:1;e.target.textContent='Speed ×'+speed};
$('#pz').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
$('#fsb').onclick=()=>{const a=$('#app');if(!document.fullscreenElement)(a.requestFullscreen||a.webkitRequestFullscreen).call(a);else document.exitFullscreen()};
document.addEventListener('fullscreenchange',()=>$('#fsb').textContent=document.fullscreenElement?'Exit Full Screen':'Full Screen');
load('redox');requestAnimationFrame(loop);
