<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Life Cycle of a Butterfly, Frog and Chicken - Simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b1d33;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;background:#0b1d33}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 8px 0}
canvas{display:block;border-radius:12px;box-shadow:0 0 28px #000a;cursor:pointer}
#bar{padding:8px 10px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#07142a}
#cards{width:100%;display:flex;gap:8px;justify-content:center}
.cd{flex:1;max-width:480px;border-left:6px solid;border-radius:8px;background:#12284a;padding:6px 10px;font-size:14px;line-height:1.3;min-height:56px;transition:opacity .2s}
.cd b{font-size:15px}
button{font:700 14px "Trebuchet MS",Verdana,sans-serif;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;color:#fff;box-shadow:0 3px 0 #0006;transition:transform .1s,opacity .2s}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #fff}
button.off{opacity:.4}
.bf{background:#8e44c9}.fr{background:#2e9e3e}.ck{background:#e0701a}.all{background:#c2185b}.ctl{background:#37474f}.fs{background:#00897b}
#bar label{font-size:14px;display:flex;align-items:center;gap:6px;color:#cfe0f5}
input[type=range]{width:110px;accent-color:#ffd23a}
</style></head><body>
<div id="app">
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
<div id="cards"><div class="cd" id="cd0"></div><div class="cd" id="cd1"></div><div class="cd" id="cd2"></div></div>
<button class="bf" data-k="0">Butterfly</button>
<button class="fr" data-k="1">Frog</button>
<button class="ck" data-k="2">Chicken</button>
<button class="all" id="all">Show All</button>
<button class="ctl" id="prev">&#9664; Previous Stage</button>
<button class="ctl" id="pp">Pause</button>
<button class="ctl" id="next">Next Stage &#9654;</button>
<label>Speed <input type="range" id="sp" min="0.3" max="2.5" step="0.1" value="1"></label>
<button class="ctl" id="rs">Reset</button>
<button class="fs" id="fs">Full Screen</button>
</div></div>
