<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Kingdom & Habitats Safari for Early Learners</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 20%, #ffedd5 0%, #fed7aa 100%);
      color: #0f172a;
      font-family: 'Comic Sans MS', 'Outfit', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    header {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid #fb923c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.1);
    }
    .title-box { display: flex; align-items: center; gap: 10px; }
    .badge {
      background: #ea580c;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 17px; font-weight: 900; color: #9a3412; }
    .main-stage {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    .animal-card-dock {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 250px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 3px solid #fb923c;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      pointer-events: none;
    }
    .dock {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-top: 2px solid #fb923c;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 9999px;
      border: 2px solid #ea580c;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3);
    }
    .btn:hover { transform: scale(1.06); filter: brightness(1.1); }
    .btn:active { transform: scale(0.96); }
    .btn-habitat {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
      box-shadow: none;
    }
    .btn-habitat.active {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
  </style>
</head>
<body>
  <header>
    <div class="title-box">
      <span class="badge">LAB 49</span>
      <h1>🦁 Animal Kingdom & Safari Discovery</h1>
    </div>
    <div style="font-size: 12px; font-weight: 800; color: #ea580c;">
      <span>Tap any animal to hear its cheerful greeting! 🎈</span>
    </div>
  </header>

  <div class="main-stage">
    <canvas id="simCanvas"></canvas>
    
    <div class="animal-card-dock" id="infoDock">
      <div style="font-size: 34px;" id="dispEmoji">🦁</div>
      <div style="font-size: 18px; font-weight: 900; color: #ea580c; margin-top: 4px;" id="dispName">Leo the Lion</div>
      <div style="font-size: 12px; font-weight: 800; color: #0284c7; margin-top: 2px;" id="dispSound">"ROAAAR! I am king of the savannah!"</div>
      <div style="font-size: 11px; font-weight: 600; color: #475569; margin-top: 6px; line-height: 1.4;" id="dispFact">
        Lions live together in groups called prides and love taking sunny catnaps under acacia trees!
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="btn btn-habitat active" id="btnSavannah">🌾 Savannah</button>
    <button class="btn btn-habitat" id="btnJungle">🌴 Jungle</button>
    <button class="btn btn-habitat" id="btnOcean">🌊 Ocean</button>
    <button class="btn btn-habitat" id="btnArctic">❄️ Arctic</button>
    <button class="btn" id="btnBalloons">🎈 Pop Confetti!</button>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let currentBiome = 'savannah';

    const biomes = {
      savannah: {
        bgTop: '#fed7aa',
        bgBottom: '#fcd34d',
        ground: '#f59e0b',
        animals: [
          { emoji: '🦁', name: 'Leo the Lion', sound: 'ROAAAR! 🦁', fact: 'Lions love sleeping in warm shade and have mighty roaring voices!', x: 0.25, y: 0.65, scale: 1 },
          { emoji: '🦒', name: 'Gerry the Giraffe', sound: 'MUNCH! 🌿', fact: 'Giraffes have super tall necks that reach the juiciest leaves at the tops of tall trees!', x: 0.50, y: 0.55, scale: 1.3 },
          { emoji: '🐘', name: 'Ellie the Elephant', sound: 'TOOT-TOOT! 🎺', fact: 'Elephants use their long trunks like flexible noses to drink, shower, and greet friends!', x: 0.75, y: 0.62, scale: 1.2 }
        ]
      },
      jungle: {
        bgTop: '#bbf7d0',
        bgBottom: '#86efac',
        ground: '#15803d',
        animals: [
          { emoji: '🐒', name: 'Milo the Monkey', sound: 'OOH-OOH-AAH! 🍌', fact: 'Monkeys swing from vine to vine with their playful tails and love eating ripe sweet fruit!', x: 0.25, y: 0.58, scale: 1 },
          { emoji: '🦜', name: 'Toby the Toucan', sound: 'SQUAWK-SQUAWK! 🌈', fact: 'Toucans have giant rainbow beaks that help them pick fresh berries and stay cool!', x: 0.50, y: 0.50, scale: 1 },
          { emoji: '🐯', name: 'Tara the Tiger', sound: 'GRRR! 🐾', fact: 'Tigers have beautiful orange and black stripes and are extraordinary strong swimmers!', x: 0.75, y: 0.65, scale: 1.1 }
        ]
      },
      ocean: {
        bgTop: '#bae6fd',
        bgBottom: '#38bdf8',
        ground: '#0284c7',
        animals: [
          { emoji: '🐬', name: 'Danny the Dolphin', sound: 'CLICK-WHISTLE! 🐬', fact: 'Dolphins leap high into the sunshine and chatter with playful whistles!', x: 0.25, y: 0.55, scale: 1 },
          { emoji: '🐢', name: 'Sammy the Sea Turtle', sound: 'SPLASH! 🌊', fact: 'Sea turtles have strong flipper paddles and glide smoothly over colorful coral reefs!', x: 0.50, y: 0.65, scale: 1 },
          { emoji: '🐳', name: 'Wanda the Whale', sound: 'WHOOOSH! 🐳', fact: 'Blue whales are the gentlest, biggest creatures on Earth and spout giant water fountains!', x: 0.75, y: 0.55, scale: 1.4 }
        ]
      },
      arctic: {
        bgTop: '#e0f2fe',
        bgBottom: '#bae6fd',
        ground: '#f0f9ff',
        animals: [
          { emoji: '🐧', name: 'Pip the Penguin', sound: 'HONK-WADDLE! 🐟', fact: 'Penguins waddle cutely on icy snow and belly-slide like natural toboggans!', x: 0.25, y: 0.65, scale: 1 },
          { emoji: '🐻‍❄️', name: 'Barnaby Polar Bear', sound: 'GROWL-SNIFF! ❄️', fact: 'Polar bears have thick warm white fur coats that keep them toasty even in blizzard snow!', x: 0.52, y: 0.60, scale: 1.3 },
          { emoji: '🦭', name: 'Sallie the Seal', sound: 'BARK-BARK! 🐾', fact: 'Seals love clapping their flippers, sunbathing on icebergs, and diving for silvery fish!', x: 0.78, y: 0.65, scale: 1 }
        ]
      }
    };

    const confetti = [];

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Habitat buttons
    const habBtns = [
      { id: 'btnSavannah', name: 'savannah' },
      { id: 'btnJungle', name: 'jungle' },
      { id: 'btnOcean', name: 'ocean' },
      { id: 'btnArctic', name: 'arctic' }
    ];

    habBtns.forEach(h => {
      document.getElementById(h.id).addEventListener('click', () => {
        currentBiome = h.name;
        habBtns.forEach(other => {
          document.getElementById(other.id).className = `btn btn-habitat ${other.name === currentBiome ? 'active' : ''}`;
        });
        showAnimalInfo(biomes[currentBiome].animals[0]);
        spawnConfettiBurst();
      });
    });

    document.getElementById('btnBalloons').addEventListener('click', () => {
      spawnConfettiBurst();
    });

    function showAnimalInfo(a) {
      document.getElementById('dispEmoji').textContent = a.emoji;
      document.getElementById('dispName').textContent = a.name;
      document.getElementById('dispSound').textContent = `"${a.sound}"`;
      document.getElementById('dispFact').textContent = a.fact;
    }

    // Audio chime synthesis
    function playChime(freq = 523.25) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch {}
    }

    // Pointer click on animal
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const current = biomes[currentBiome];
      current.animals.forEach((a, idx) => {
        const ax = canvas.width * a.x;
        const ay = canvas.height * a.y;
        if (Math.hypot(mx - ax, my - ay) < 70) {
          showAnimalInfo(a);
          playChime(400 + idx * 150);
          spawnConfettiBurst(ax, ay);
        }
      });
    });

    function spawnConfettiBurst(x = canvas.width / 2, y = canvas.height / 2) {
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#a855f7'];
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 8;
        confetti.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 6 + Math.random() * 8,
          life: 1.0
        });
      }
    }

    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Render
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const biome = biomes[currentBiome];

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.7);
      skyGrad.addColorStop(0, biome.bgTop);
      skyGrad.addColorStop(1, biome.bgBottom);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sun or Ice Moon
      ctx.beginPath();
      ctx.arc(canvas.width * 0.12, canvas.height * 0.18, 45, 0, Math.PI * 2);
      ctx.fillStyle = currentBiome === 'arctic' ? '#ffffff' : '#facc15';
      ctx.fill();

      // Ground Landscape
      ctx.beginPath();
      ctx.ellipse(canvas.width * 0.5, canvas.height * 0.95, canvas.width * 0.7, canvas.height * 0.35, 0, 0, Math.PI * 2);
      ctx.fillStyle = biome.ground;
      ctx.fill();

      // Draw Animated Animals
      biome.animals.forEach((a, idx) => {
        const bounce = Math.sin(now * 0.004 + idx * 2) * 8;
        const ax = canvas.width * a.x;
        const ay = canvas.height * a.y + bounce;

        ctx.font = `${Math.round(65 * a.scale)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(a.emoji, ax, ay);

        // Friendly Name Badge
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText(a.name, ax, ay + 45);
        ctx.fillText(a.name, ax, ay + 45);
      });

      // Update & Draw Confetti
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.2; // gravity
        c.life -= 0.02;

        if (c.life <= 0) {
          confetti.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size * c.life, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.fill();
      }

      requestAnimationFrame(loop);
    }

    showAnimalInfo(biomes.savannah.animals[0]);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
