<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prep Fun Lab (Age 5–6)</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;font-family:"Segoe UI","Comic Sans MS","Trebuchet MS",sans-serif}
body{background:linear-gradient(135deg,#bfe9ff,#d7f5c4 50%,#ffe0b2)}
#app{height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:9px}
#top{display:flex;align-items:center;gap:12px}
h1{margin:0;flex:1;font-size:26px;color:#0d5c63;text-shadow:2px 2px 0 #fff;display:flex;align-items:center;gap:10px;font-weight:900}
#nav,#ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#nav .b{padding:7px 13px;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.3);display:inline-flex;align-items:center;gap:6px}
.b{--c:#e53935;border:0;border-radius:14px;padding:10px 16px;font-family:inherit;font-weight:bold;font-size:16px;color:#fff;background:linear-gradient(rgba(255,255,255,.3),rgba(0,0,0,.08)),var(--c);box-shadow:0 6px 0 rgba(0,0,0,.3),0 9px 12px rgba(0,0,0,.2);cursor:pointer;text-shadow:1px 1px 2px rgba(0,0,0,.45);transition:transform .08s,filter .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b:hover{filter:brightness(1.1);transform:translateY(-2px)}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.b.on{outline:4px solid #fff;outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:24px;border:6px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 40px rgba(255,255,255,.4);background:linear-gradient(#bde8ff,#f2fbff)}
.msg{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 28px;border-radius:30px;font-size:22px;font-weight:bold;color:#0d5c63;box-shadow:0 5px 0 #0002;z-index:20;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tray{position:absolute;top:62px;left:0;right:0;height:40%;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;padding:0 20px}
.item{cursor:pointer;transition:.2s;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25));display:flex;align-items:center;justify-content:center;background:#ffffff33;border-radius:20px;padding:6px}
.item:hover{transform:scale(1.08)}
.item.sel{transform:scale(1.22) rotate(-6deg);filter:drop-shadow(0 0 20px #ffd700);background:#ffffffaa}
.baskets{position:absolute;bottom:14px;left:0;right:0;height:44%;display:flex;gap:20px;justify-content:center;padding:0 20px}
.basket{flex:1;max-width:400px;border-radius:20px 20px 50px 50px;box-shadow:0 8px 0 rgba(0,0,0,.3),0 14px 20px rgba(0,0,0,.2);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:8px 12px;overflow:hidden;transition:transform .12s}
.basket:hover{filter:brightness(1.04);transform:translateY(-2px)}
.bt{color:#fff;font-weight:bold;font-size:20px;text-shadow:2px 2px rgba(0,0,0,.6);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-bottom:6px}
.bin{flex:1;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;min-height:55px}
.bin .item{background:rgba(255,255,255,.8);border-radius:14px;padding:4px}
.hint{animation:pu .5s 4}@keyframes pu{50%{transform:scale(1.25)}}
.slot{min-width:145px;min-height:125px;border:5px dashed #78909c;border-radius:20px;background:#ffffffcc;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:8px;line-height:1.1;transition:.2s}
.slot.sm{min-width:260px;min-height:85px;flex-direction:row;gap:14px}
.slot.ok{border-style:solid;border-color:#43a047;background:#e8f5e9}.slot.soil.ok{background:#bcaaa4}
.tl{font-size:20px;font-weight:bold;color:#37474f;margin-top:4px}
/* Magnet */
.mi{position:absolute;line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));pointer-events:none;display:flex;align-items:center;justify-content:center}
.mg{position:absolute;z-index:10;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));width:90px;height:90px;display:flex;align-items:center;justify-content:center}
/* Traffic */
.rd{position:absolute;left:0;right:0;background:#455a64;box-shadow:0 0 0 12px #b0bec5}
.rd::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:6px dashed #ffeb3b}
.zb{position:absolute;width:130px;background:repeating-linear-gradient(#fff 0 18px,transparent 18px 36px);opacity:.9}
.car{position:absolute;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35));line-height:1}
.pole{position:absolute;width:76px;padding:8px;background:#263238;border-radius:16px;z-index:3;box-shadow:0 8px 14px rgba(0,0,0,.4)}
.lt{width:50px;height:50px;border-radius:50%;margin:6px auto;background:#37474f;opacity:.35;transition:.2s}
#lr{color:#e53935}#ly{color:#fdd835}#lg{color:#43a047}
.lt.on{opacity:1;background:currentColor;box-shadow:0 0 30px 8px currentColor}
/* Weather */
.wx{position:absolute;inset:0;background:linear-gradient(#8ecbff,#d8f0ff);transition:1s;overflow:hidden}
.wx.rain{background:linear-gradient(#78909c,#b0bec5)}.wx.sun{background:linear-gradient(#4fc3f7,#fff9c4)}.wx.sun.rain{background:linear-gradient(#90a4ae,#ffe9a8)}
.wx>div{position:absolute;line-height:1}
.cl{transition:1s}.wx.rain .cl{filter:brightness(.65);transform:scale(1.15)}
.sunw{left:8%;top:5%;width:130px;height:130px;opacity:0;transform:scale(.3);transition:1s;filter:drop-shadow(0 0 25px #ffd700)}.wx.sun .sunw{opacity:1;transform:scale(1)}
.rbw{right:10%;top:8%;width:260px;height:140px;opacity:0;transition:1.5s}.wx.sun.rain .rbw{opacity:1}
.gr{bottom:0;left:0;right:0;height:30%;background:linear-gradient(#7cb342,#558b2f);transition:1s}.wx.rain .gr{filter:saturate(1.4) brightness(.85)}
.pud{bottom:6%;left:30%;width:0;height:0;border-radius:50%;background:#4fc3f7aa;transition:2s}.wx.rain .pud{width:260px;height:50px}
.hs{bottom:22%;left:54%;width:130px;height:130px}.tr{left:72%;bottom:20%;width:150px;height:190px;transform-origin:bottom}
.wx.wind .tr{animation:sway .5s infinite alternate}@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.fl{left:25%;bottom:14%;width:65px;height:75px;transition:2s;transform-origin:bottom}.wx.sun .fl,.wx.rain .fl{transform:scale(1.5)}.wx.sun.rain .fl{transform:scale(2)}
.kt{left:38%;bottom:28%;width:80px;height:100px;transition:2s}.wx.wind .kt{bottom:62%;transform:rotate(-20deg)}
.lf{width:40px;height:40px;animation:fly 3s linear forwards}@keyframes fly{from{left:-5%}to{left:105%}}
.rn{top:-10%;width:24px;height:32px;animation:fall 1.1s linear forwards}@keyframes fall{to{top:100%;opacity:.2}}
/* Tank */
.tub{position:absolute;bottom:0;left:14%;right:14%;height:48%;border-radius:0 0 90px 90px;background:linear-gradient(rgba(64,170,255,.55),rgba(0,90,200,.75));border:8px solid #fff;border-top:0;z-index:6;pointer-events:none;box-shadow:inset 0 10px 20px #fff6}
.drop{position:absolute;z-index:5;line-height:1;transform:translateX(-50%)}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{margin-top:-10px}}
.dr{position:absolute;z-index:7;animation:spl .8s forwards;pointer-events:none}
@keyframes spl{40%{transform:translate(calc(var(--dx)*.6),-110px)}100%{transform:translate(var(--dx),40px);opacity:0}}
.art-box{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tab-ic{width:22px;height:22px;vertical-align:middle;display:inline-flex;align-items:center;justify-content:center}
</style>

  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = ty; o.frequency.value = f; g.gain.value = .15;
    o.connect(g); g.connect(ac.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.stop(ac.currentTime + d);
  } catch(e){}
};
const btn = (l, c, fn, p = ct) => {
  const b = document.createElement('button');
  b.className = 'b';
  b.style.setProperty('--c', c);
  b.innerHTML = l;
  b.onclick = fn;
  p.appendChild(b);
  return b;
};

  const d = document.createElement('div');
  d.className = cls || '';
  d.innerHTML = h || '';
  if (s) Object.assign(d.style, s);
  p.appendChild(d);
  return d;
};

// Render function: returns SVG HTML if available, otherwise high-res Noto/Twemoji color image
function renderArt(name, emoji, sz = 72) {
  if (name && SVGS[name]) {
    return `<span class="art-box" style="width:${sz}px;height:${sz}px">${SVGS[name]}</span>`;
  }
  if (emoji) {
    const cp = [...emoji].map(c => c.codePointAt(0).toString(16)).filter(x => x !== 'fe0f');
    const noto = 'https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/png/512/emoji_u' + cp.join('_') + '.png';
    const tw = 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.0.3/assets/svg/' + cp.join('-') + '.svg';
    return `<img width="${sz}" height="${sz}" style="display:inline-block;vertical-align:middle;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.2))" alt="${name || emoji}" src="${noto}" onerror="if(this.dataset.f){this.outerHTML='<span style=\\'font-size:${sz}px\\'>${emoji}</span>'}else{this.dataset.f=1;this.src='${tw}'}">`;
  }
  return '';
}

/* ---------------- GAME 1: SORTING INTO BASKETS ---------------- */
function sortG(bins, per, sz) {
  let sel = null, left, tray = el('', 'tray'), bk = el('', 'baskets');
  const drop = (d, n) => {
    if (!sel) { M('Tap a picture first!'); say('Tap a picture first'); return; }
    if (sel.k == n) {
      const i = sel;
      i.onclick = null;
      i.classList.remove('sel');
      i.style.width = '52px';
      i.style.height = '52px';
      i.innerHTML = renderArt(i.nm, null, 48);
      d.querySelector('.bin').appendChild(i);
      sel = null;
      tone(700, .2);
      const binName = bins[n][4] || bins[n][0];
      say(i.nm + ' goes in ' + binName);
      M(--left ? 'Yes! ' + i.nm + ' goes here!' : 'Great job! All sorted!');
    } else {
      bad('Oops! Try another box!');
    }
  };

  const bn = bins.map((b, n) => {
    const iconHtml = b[5] && SVGS[b[5]] ? `<span style="width:26px;height:26px;display:inline-flex">${SVGS[b[5]]}</span>` : '';
    const d = el('<div class=bt>' + iconHtml + ' ' + b[0] + '</div><div class=bin></div>', 'basket', {
      background: 'linear-gradient(rgba(255,255,255,.25),rgba(0,0,0,.15)),' + b[1]
    }, bk);
    d.onclick = () => drop(d, n);
    return d;
  });

  const start = () => {
    tray.innerHTML = '';
    bn.forEach(d => d.querySelector('.bin').innerHTML = '');
    sel = null;
    M('Tap a picture, then tap its box!');
    const all = [];
    bins.forEach((b, k) => sh(b[2]).slice(0, per).forEach(x => all.push([x, k])));
    left = all.length;
    sh(all).forEach(a => {
      const visual = renderArt(a[0][1], a[0][0], sz);
      const i = el(visual, 'item', { width: sz + 'px', height: sz + 'px' }, tray);
      i.nm = a[0][1];
      i.k = a[1];
      i.onclick = () => {
        clr();
        sel = i;
        i.classList.add('sel');
        say(i.nm);
        tone(400, .1);
      };
    });
  };

  start();
  bins.forEach((b, n) => btn('Learn: ' + b[4], b[1], () => { say(b[3]); M(b[3]); }));
  btn('New Set', '#8e24aa', start);
}

/* ---------------- GAME 2: PLACE INTO TARGET BOXES ---------------- */
function placeG(o) {
  let sel = null, left;
  const tg = el('', 'tray', o.tg), it = el('', 'tray', o.it);
  const qMark = '<span style="display:inline-flex;width:44px;height:44px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#cfd8dc" stroke="#90a4ae" stroke-width="4"/><text x="50" y="68" font-size="52" font-weight="900" fill="#546e7a" text-anchor="middle">?</text></svg></span>';
  const arrowSvg = '<span style="display:inline-flex;width:38px;height:38px"><svg viewBox="0 0 100 100"><path d="M20 50h50M50 30l20 20-20 20" fill="none" stroke="#e53935" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  const start = () => {
    tg.innerHTML = it.innerHTML = '';
    sel = null;
    left = o.items.length;
    M(o.msg);
    o.targets.forEach((t, n) => {
      if (o.arrow && n) el(arrowSvg, '', { display: 'flex', alignItems: 'center' }, tg);
      const targetIcon = t[1] === '❓' ? qMark : (SVGS[t[1]] ? `<span style="display:inline-flex;width:52px;height:52px">${SVGS[t[1]]}</span>` : renderArt(t[1], t[1], 52));
      const d = el(targetIcon + '<div class=tl>' + t[2] + '</div>', 'slot' + (o.sm ? ' sm' : '') + (t[3] ? ' ' + t[3] : ''), null, tg);
      d.onclick = () => {
        if (!sel) { M('Tap a picture first!'); say('Tap a picture first'); return; }
        if (sel.k == t[0]) {
          const placedContent = (o.keep ? targetIcon : '') + sel.h;
          d.innerHTML = placedContent + '<div class=tl>' + t[2] + '</div>';
          d.classList.add('ok');
          d.onclick = null;
          tone(700, .2);
          say(sel.nm);
          M(--left ? 'Yes! ' + sel.nm + '!' : o.done);
          if (!left) say(o.done);
          sel.remove();
          sel = null;
        } else {
          bad('Oops! Try another box!');
        }
      };
    });

    sh(o.items).forEach(x => {
      const i = el(x[1], 'item', { width: '76px', height: '76px' }, it);
      i.k = x[0];
      i.nm = x[2];
      i.h = x[1];
      i.onclick = () => {
        clr();
        sel = i;
        i.classList.add('sel');
        say(x[2]);
        tone(400, .1);
      };
    });
  };

  start();
  o.learn.forEach((l, i) => btn(l[0], P[i % 8], () => { say(l[1]); M(l[1]); }));
  btn('Shuffle', '#8e24aa', start);
}

/* ---------------- GAME 3: MAGNET WAND ---------------- */
function magnet() {
  const W = st.clientWidth, H = st.clientHeight;
  let mx = W / 2, my = H / 2, on = 1, ln = 0, I = [];
  const D = [
    ['Bolt', 1], ['Paper clip', 1], ['Key', 1], ['Wrench', 1], ['Hammer', 1],
    ['Wood block', 0], ['Plastic toy', 0], ['Puzzle piece', 0], ['Apple', 0], ['Book', 0]
  ];
  M('Move the magnet with your mouse!');
  const mg = el(SVGS['Magnet'], 'mg');

  D.forEach(d => {
    const itemSvg = renderArt(d[0], null, 54);
    I.push({
      name: d[0],
      m: d[1],
      x: 60 + Math.random() * (W - 200),
      y: 100 + Math.random() * (H - 240),
      el: el(itemSvg, 'mi')
    });
  });

  st.onpointermove = e => {
    const r = st.getBoundingClientRect();
    mx = e.clientX - r.left;
    my = e.clientY - r.top;
  };

  T.push(setInterval(() => {
    mg.style.left = (mx - 45) + 'px';
    mg.style.top = (my - 45) + 'px';
    let n = 0;
    I.forEach(o => {
      const dx = mx - (o.x + 27), dy = my - (o.y + 27), d = Math.hypot(dx, dy) || 1;
      if (o.s) {
        if (!on) o.s = 0;
        else { o.x = mx + o.ox - 27; o.y = my + o.oy - 27; n++; }
      } else if (on && o.m && d < 230) {
        const v = Math.max(3, (230 - d) / 12);
        o.x += dx / d * v; o.y += dy / d * v;
        if (d < 60) {
          o.s = 1;
          o.ox = Math.random() * 60 - 30;
          o.oy = Math.random() * 50 - 5;
          tone(900, .08);
        }
      } else if (on && !o.m && d < 75 && !o.w) {
        o.w = 1;
        o.el.classList.add('hint');
        M(o.name + ' is NOT magnetic!');
        say(o.name + ' is not magnetic');
        setTimeout(() => { o.w = 0; o.el.classList.remove('hint'); }, 1500);
      }
      o.el.style.left = o.x + 'px';
      o.el.style.top = o.y + 'px';
    });
    if (n != ln) {
      ln = n;
      if (n) M('The magnet picked up ' + n + ' iron object' + (n > 1 ? 's' : '') + '!');
    }
  }, 30));

  const b = btn('Magnet: ON', '#43a047', () => {
    on = !on;
    b.textContent = 'Magnet: ' + (on ? 'ON' : 'OFF');
    b.style.setProperty('--c', on ? '#43a047' : '#e53935');
    M(on ? 'Magnet is ON!' : 'Magnet is OFF. Things drop!');
  });
  const show = m => {
    I.forEach(o => {
      o.el.classList.remove('hint');
      if (o.m == m) { void o.el.offsetWidth; o.el.classList.add('hint'); }
    });
  };
  btn('Show Iron Objects', '#1e88e5', () => { show(1); say('Iron objects stick to a magnet'); });
  btn('Show Non-Magnetic', '#fb8c00', () => { show(0); say('Wood, plastic and paper do not stick'); });
  btn('Shake Table', '#8e24aa', () => I.forEach(o => { o.s = 0; o.x = 60 + Math.random() * (W - 200); o.y = 100 + Math.random() * (H - 240); }));
  btn('Reset', '#546e7a', () => load(cur));
}

/* ---------------- GAME 4: TRAFFIC LIGHTS ---------------- */
function traffic() {
  const W = st.clientWidth, H = st.clientHeight, rt = H * .46, rh = 150, zx = W * .45, stop = zx + 150, py0 = rt - 80, py1 = rt + rh + 5;
  el('', 'rd', { top: rt + 'px', height: rh + 'px' });
  el('', 'zb', { left: zx + 'px', top: rt + 'px', height: rh + 'px' });
  el('<div class=lt id=lr></div><div class=lt id=ly></div><div class=lt id=lg></div>', 'pole', { left: (zx + 175) + 'px', top: (rt - 215) + 'px' });

  let ls = 'red', tm = 0, auto = 0, py = py0, ped = { w: 0, d: 1, done: 0 }, cars = [];
  const ped_ = el(SVGS['Pedestrian'], 'car', { left: (zx + 35) + 'px', top: py + 'px', width: '50px', height: '80px' });
  const E = [SVGS['CarRed'], SVGS['CarYellow'], SVGS['CarBus'], SVGS['CarBlue'], SVGS['CarPolice']];

  const addCar = () => {
    if (cars.length > 5) return;
    const cEl = el(E[cars.length % 5], 'car', { top: (rt + 45) + 'px', width: '100px', height: '60px' });
    cars.push({ x: Math.max(W, ...cars.map(c => c.x + 130)), el: cEl });
  };

  const set = l => {
    ls = l; tm = 0; ped.done = 0;
    $('#lr').classList.toggle('on', l == 'red');
    $('#ly').classList.toggle('on', l == 'yellow');
    $('#lg').classList.toggle('on', l == 'green');
    const m = {
      red: 'RED = STOP! Cars wait. People can cross.',
      yellow: 'YELLOW = GET READY!',
      green: 'GREEN = GO! Cars can go.'
    }[l];
    M(m);
    say(m.split('!')[0].replace('=', 'means'));
  };

  addCar(); addCar();
  cars[0].x = W - 200; cars[1].x = W + 60;
  set('red');

  T.push(setInterval(() => {
    tm++;
    if (auto && tm > ({ red: 200, green: 200, yellow: 70 }[ls])) {
      set(ls == 'red' ? 'green' : ls == 'green' ? 'yellow' : 'red');
    }
    if (!ped.w && !ped.done && ls == 'red' && tm > 40) { ped.w = 1; ped.done = 1; }
    if (ped.w) {
      py += ped.d * 2.5;
      if ((ped.d > 0 && py >= py1) || (ped.d < 0 && py <= py0)) {
        py = ped.d > 0 ? py1 : py0; ped.d *= -1; ped.w = 0;
      }
    }
    ped_.style.top = py + 'px';
    cars.sort((a, b) => a.x - b.x);
    cars.forEach((c, i) => {
      const v = ls == 'yellow' ? 4 : 7, nx = c.x - v, ah = cars[i - 1];
      const stopNow = ls == 'red' || ped.w || (ls == 'yellow' && c.x - stop > 90);
      let x = c.x - v;
      if (stopNow && c.x >= stop && nx < stop) x = c.x;
      if (ah && x < ah.x + 120) x = c.x;
      c.x = x;
      if (c.x < -130) c.x = Math.max(W + 20, ...cars.map(a => a.x + 130));
      c.el.style.left = c.x + 'px';
    });
  }, 30));

  btn('RED = Stop', '#e53935', () => set('red'));
  btn('YELLOW = Get Ready', '#f9a825', () => set('yellow'));
  btn('GREEN = Go', '#43a047', () => set('green'));
  const a = btn('Auto Lights: OFF', '#1e88e5', () => {
    auto = !auto;
    a.textContent = 'Auto Lights: ' + (auto ? 'ON' : 'OFF');
  });
  btn('Add Car', '#8e24aa', addCar);
  btn('Remove Car', '#546e7a', () => { const c = cars.pop(); if (c) c.el.remove(); });
}

/* ---------------- GAME 5: WEATHER MAKER ---------------- */

const kiteSvg = '<svg viewBox="0 0 100 120" width="100%" height="100%"><polygon points="50,10 82,46 50,86 18,46" fill="#ffeb3b" stroke="#f57f17" stroke-width="2"/><polygon points="50,10 82,46 50,46" fill="#e53935"/><polygon points="18,46 50,46 50,86" fill="#1e88e5"/><polygon points="50,46 82,46 50,86" fill="#43a047"/><path d="M50 86q12 14 6 24" fill="none" stroke="#795548" stroke-width="2"/><polygon points="54,102 60,100 58,106" fill="#ff4081"/><polygon points="56,112 62,110 60,116" fill="#ffeb3b"/></svg>';
const rainDropSvg = '<svg viewBox="0 0 100 140" width="100%" height="100%"><path d="M50 0C50 0 10 70 10 100a40 40 0 0080 0C90 70 50 0 50 0z" fill="#42a5f5"/></svg>';
const windLeafSvg = '<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M15 85 C15 40 45 15 85 15 C85 55 55 85 15 85 Z" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/></svg>';

function weather() {
  const wx = el(`
    <div class="cl" style="left:8%;top:12%;width:130px;height:85px">${cloudSvg}</div>
    <div class="cl" style="left:45%;top:5%;width:180px;height:115px">${cloudSvg}</div>
    <div class="cl" style="left:72%;top:16%;width:140px;height:90px">${cloudSvg}</div>
    <div class="sunw">${sunSvg}</div>
    <div class="rbw">${rainbowSvg}</div>
    <div class="gr"></div>
    <div class="pud"></div>
    <div class="hs">${houseSvg}</div>
    <div class="tr">${treeSvg}</div>
    <div class="fl">${flowerTulipSvg}</div>
    <div class="kt">${kiteSvg}</div>
  `, 'wx');

  const f = { sun: 0, rain: 0, wind: 0 };
  const txt = () => {
    const s = f.sun, r = f.rain, w = f.wind;
    return s && r ? 'Sun and rain make a rainbow!' :
           r ? 'Rain fills the puddles and helps flowers grow!' :
           s ? 'The sun is warm. Flowers love sunshine!' :
           w ? 'The wind blows the kite and the tree!' :
           'A calm, cloudy day.';
  };
  M(txt());

  T.push(
    setInterval(() => {
      if (f.rain) {
        const d = el(rainDropSvg, 'rn', { left: Math.random() * 100 + '%' }, wx);
        setTimeout(() => d.remove(), 1200);
      }
    }, 70),
    setInterval(() => {
      if (f.wind) {
        const d = el(windLeafSvg, 'lf', { top: 20 + Math.random() * 55 + '%' }, wx);
        setTimeout(() => d.remove(), 3100);
      }
    }, 350)
  );

  const tg = (k, l, c) => {
    const b = btn(l + ': OFF', c, () => {
      f[k] = !f[k];
      b.textContent = l + ': ' + (f[k] ? 'ON' : 'OFF');
      wx.classList.toggle(k, !!f[k]);
      M(txt());
      say(txt());
      tone(300 + (f[k] ? 200 : 0), .2);
    });
  };

  tg('sun', 'Sunshine', '#f9a825');
  tg('rain', 'Rain Cloud', '#1e88e5');
  tg('wind', 'Strong Wind', '#00acc1');
  btn('Clear Sky', '#546e7a', () => load(cur));
}

/* ---------------- GAME 6: SINK OR FLOAT ---------------- */
function sinkfloat() {
  M('Pick an item, then guess!');
  el('', 'tub');
  let pend = null, sc = 0, tot = 0;
  const I = [
    ['Wood', 1], ['Stone', 0], ['Pencil', 1], ['Coin', 0],
    ['Apple', 1], ['Key', 0], ['Rubber duck', 1], ['Spoon', 0]
  ];

  const go = g => {
    if (!pend) { M('Pick an item first!'); say('Pick an item first'); return; }
    const it = pend; pend = null; tot++;
    const H = st.clientHeight, W = st.clientWidth, sf = H * .52, x = W * .25 + Math.random() * W * .5;
    const old = st.querySelectorAll('.drop');
    if (old.length > 9) old[0].remove();

    const i = el(renderArt(it[0], null, 64), 'drop', { left: x + 'px', top: '-100px' });
    void i.offsetWidth;
    i.style.transition = 'top .7s cubic-bezier(.5,0,1,.6)';
    i.style.top = (sf - 60) + 'px';
    tone(400, .1);

    setTimeout(() => {
      tone(200, .3, 'triangle');
      for (let k = 0; k < 10; k++) {
        el(rainDropSvg, 'dr', {
          left: x + 'px',
          top: sf + 'px',
          width: '24px',
          height: '24px',
          '--dx': (Math.random() * 180 - 90) + 'px'
        }).addEventListener('animationend', e => e.target.remove());
      }
      if (it[1]) {
        i.style.transition = 'top .6s ease-out';
        i.style.top = (sf - 45) + 'px';
        i.classList.add('bob');
      } else {
        i.style.transition = 'top 1.6s ease-in';
        i.style.top = (H - 95) + 'px';
      }
      const ok = g == it[1];
      if (ok) sc++;
      const m = (ok ? 'You are right! ' : 'Not this time. ') + it[0] + (it[1] ? ' floats!' : ' sinks!') + '  Score: ' + sc + '/' + tot;
      M(m);
      say(m);
    }, 700);
  };

  I.forEach((it, k) => {
    const itemBtnIcon = `<span style="width:20px;height:20px;display:inline-flex">${SVGS[it[0]] || ''}</span>`;
    btn(itemBtnIcon + ' ' + it[0], P[k], () => {
      pend = it;
      M('Will the ' + it[0] + ' sink or float?');
      say('Will the ' + it[0] + ' sink or float?');
    });
  });

  btn('I think: FLOAT ⬆', '#00897b', () => go(1));
  btn('I think: SINK ⬇', '#c62828', () => go(0));
  btn('Empty Tank', '#546e7a', () => {
    st.querySelectorAll('.drop').forEach(d => d.remove());
    M('The tank is empty. Pick an item!');
  });
}

/* ---------------- TABS AND INITIALIZATION ---------------- */
const S = [parts, homes, seasons, magnet, butterfly, senses, traffic, weather, sinkfloat, clean];
const TABS_CONFIG = [
  { name: 'Plant Parts', icon: 'PlantTab' },
  { name: 'Animal Homes', icon: 'AnimalTab' },
  { name: 'Four Seasons', icon: 'SeasonTab' },
  { name: 'Magnet Wand', icon: 'MagnetTab' },
  { name: 'Butterfly Cycle', icon: 'ButterflyTab' },
  { name: 'Five Senses', icon: 'SenseTab' },
  { name: 'Traffic Lights', icon: 'TrafficTab' },
  { name: 'Weather Maker', icon: 'WeatherTab' },
  { name: 'Sink or Float', icon: 'SinkTab' },
  { name: 'Green Earth Bin', icon: 'BinTab' }
];

const tabs = TABS_CONFIG.map((tab, i) => {
  const iconHtml = `<span class="tab-ic">${SVGS[tab.icon] || ''}</span>`;
  return btn(iconHtml + ' ' + tab.name, P[i % 8], () => load(i), nav);
});

function load(i) {
  T.forEach(x => { clearTimeout(x); clearInterval(x); });
  T = [];
  st.onpointermove = null;
  try { speechSynthesis.cancel(); } catch(e){}
  cur = i;
  st.innerHTML = '<div class="msg" id="msg"></div>';
  ct.innerHTML = '';
  tabs.forEach((t, k) => t.classList.toggle('on', k == i));
  S[i]();
}

$('#fs').onclick = () => {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
};
document.onfullscreenchange = () => {
  $('#fs').textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
  setTimeout(() => load(cur), 250);
};

load(0);
