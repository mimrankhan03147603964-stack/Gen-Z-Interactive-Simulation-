<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prep Fun Lab (Age 5–6)</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Comic Sans MS","Trebuchet MS",sans-serif}
body{background:linear-gradient(135deg,#bfe9ff,#d7f5c4 50%,#ffe0b2)}
#app{height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:9px}
#top{display:flex;align-items:center;gap:12px}
h1{margin:0;flex:1;font-size:28px;color:#0d5c63;text-shadow:2px 2px 0 #fff;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Comic Sans MS",sans-serif}
#nav,#ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#nav .b{padding:7px 11px;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.b{--c:#e53935;border:0;border-radius:14px;padding:10px 16px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",inherit;font-weight:bold;font-size:17px;color:#fff;background:linear-gradient(rgba(255,255,255,.3),rgba(0,0,0,.08)),var(--c);box-shadow:0 6px 0 rgba(0,0,0,.3),0 9px 12px rgba(0,0,0,.2);cursor:pointer;text-shadow:1px 1px 2px rgba(0,0,0,.45);transition:transform .08s}
.b:hover{filter:brightness(1.1);transform:translateY(-2px)}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.b.on{outline:4px solid #fff;outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:24px;border:6px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 40px rgba(255,255,255,.4);background:linear-gradient(#bde8ff,#f2fbff)}
.msg{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;padding:6px 26px;border-radius:30px;font-size:24px;font-weight:bold;color:#0d5c63;box-shadow:0 5px 0 #0002;z-index:20;pointer-events:none;white-space:nowrap;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.tray{position:absolute;top:66px;left:0;right:0;height:38%;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.item{cursor:pointer;transition:.2s;filter:drop-shadow(0 8px 6px #0004);line-height:1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.item.sel{transform:scale(1.2) rotate(-8deg);filter:drop-shadow(0 0 16px gold)}
.baskets{position:absolute;bottom:14px;left:0;right:0;height:44%;display:flex;gap:26px;justify-content:center;padding:0 24px}
.basket{flex:1;max-width:420px;border-radius:20px 20px 60px 60px;box-shadow:0 8px 0 #0004,0 14px 20px #0004;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:8px;overflow:hidden}
.bt{color:#fff;font-weight:bold;font-size:22px;text-shadow:2px 2px #0007;text-align:center;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.bin{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.hint{animation:pu .5s 4}@keyframes pu{50%{transform:scale(1.2)}}
.slot{min-width:150px;min-height:130px;border:5px dashed #78909c;border-radius:20px;background:#ffffffaa;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:54px;cursor:pointer;padding:6px;line-height:1.1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.slot.sm{min-width:270px;min-height:88px;flex-direction:row;gap:14px;font-size:50px}
.slot.ok{border-style:solid;border-color:#43a047;background:#e8f5e9}.slot.soil.ok{background:#bcaaa4}
.tl{font-size:22px;font-weight:bold;color:#37474f}
/* magnet */
.mi{position:absolute;font-size:58px;line-height:1;filter:drop-shadow(0 6px 4px #0004);pointer-events:none;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.mg{position:absolute;font-size:90px;line-height:1;z-index:10;pointer-events:none;filter:drop-shadow(0 8px 8px #0006);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
/* traffic */
.rd{position:absolute;left:0;right:0;background:#455a64;box-shadow:0 0 0 12px #b0bec5}
.rd::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:6px dashed #ffeb3b}
.zb{position:absolute;width:130px;background:repeating-linear-gradient(#fff 0 18px,transparent 18px 36px);opacity:.9}
.car{position:absolute;font-size:70px;line-height:1;filter:drop-shadow(0 6px 4px #0005);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.pole{position:absolute;width:76px;padding:6px;background:#263238;border-radius:16px;z-index:3;box-shadow:0 8px 14px #0005}
.lt{width:50px;height:50px;border-radius:50%;margin:6px auto;background:#37474f;opacity:.35;transition:.2s}
#lr{color:#e53935}#ly{color:#fdd835}#lg{color:#43a047}
.lt.on{opacity:1;background:currentColor;box-shadow:0 0 30px 8px currentColor}
/* weather */
.wx{position:absolute;inset:0;background:linear-gradient(#8ecbff,#d8f0ff);transition:1s;overflow:hidden}
.wx.rain{background:linear-gradient(#78909c,#b0bec5)}.wx.sun{background:linear-gradient(#4fc3f7,#fff9c4)}.wx.sun.rain{background:linear-gradient(#90a4ae,#ffe9a8)}
.wx>div{position:absolute;line-height:1}
.cl{width:130px;height:85px;transition:1s}.wx.rain .cl{filter:brightness(.65);scale:1.2}
.sunw{left:10%;top:6%;width:130px;height:130px;opacity:0;scale:.3;transition:1s;filter:drop-shadow(0 0 25px gold)}.wx.sun .sunw{opacity:1;scale:1}
.rbw{right:12%;top:10%;width:240px;height:130px;opacity:0;transition:1.5s}.wx.sun.rain .rbw{opacity:1}
.gr{bottom:0;left:0;right:0;height:30%;background:linear-gradient(#7cb342,#558b2f);transition:1s}.wx.rain .gr{filter:saturate(1.4) brightness(.85)}
.pud{bottom:6%;left:30%;width:0;height:0;border-radius:50%;background:#4fc3f7aa;transition:2s}.wx.rain .pud{width:260px;height:50px}
.hs{bottom:22%;left:54%;width:130px;height:130px}.tr{left:72%;bottom:20%;width:150px;height:190px;transform-origin:bottom}
.wx.wind .tr{animation:sway .5s infinite alternate}@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.fl{left:25%;bottom:14%;width:55px;height:65px;transition:2s;transform-origin:bottom}.wx.sun .fl,.wx.rain .fl{scale:1.6}.wx.sun.rain .fl{scale:2.2}
.kt{left:38%;bottom:28%;width:75px;height:95px;transition:2s}.wx.wind .kt{bottom:62%;rotate:-20deg}
.lf{width:36px;height:36px;animation:fly 3s linear forwards}@keyframes fly{from{left:-5%}to{left:105%}}
.rn{top:-10%;width:22px;height:30px;animation:fall 1.1s linear forwards}@keyframes fall{to{top:100%;opacity:.2}}
/* tank */
.tub{position:absolute;bottom:0;left:14%;right:14%;height:48%;border-radius:0 0 90px 90px;background:linear-gradient(rgba(64,170,255,.55),rgba(0,90,200,.75));border:8px solid #fff;border-top:0;z-index:6;pointer-events:none;box-shadow:inset 0 10px 20px #fff6}
.drop{position:absolute;z-index:5;line-height:1;transform:translateX(-50%);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{margin-top:-10px}}
.dr{position:absolute;z-index:7;animation:spl .8s forwards;pointer-events:none;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
@keyframes spl{40%{transform:translate(calc(var(--dx)*.6),-110px)}100%{transform:translate(var(--dx),40px);opacity:0}}
</style></head>
<body><div id="app">
<div id="top"><h1>🚀 Prep Fun Lab (Age 5–6)</h1><button class="b" id="fs" style="--c:#7b1fa2">Full Screen</button></div>
<div id="nav"></div><div id="stage"></div><div id="ctrl"></div>
</div>
<script>
const $=s=>document.querySelector(s),st=$('#stage'),ct=$('#ctrl'),nav=$('#nav');
const P=['#e53935','#1e88e5','#f9a825','#43a047','#8e24aa','#00acc1','#fb8c00','#d81b60'];
let T=[],cur=0,ac;
const M=t=>{const m=$('#msg');if(m)m.textContent=t};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.8;u.pitch=1.3;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}};
const tone=(f=600,d=.15,ty='sine')=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}};
const btn=(l,c,fn,p=ct)=>{const b=document.createElement('button');b.className='b';b.style.setProperty('--c',c);b.textContent=l;b.onclick=fn;p.appendChild(b);return b};
const el=(h,cls,s,p=st)=>{const d=document.createElement('div');d.className=cls||'';d.innerHTML=h||'';if(s)Object.assign(d.style,s);p.appendChild(d);return d};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const clr=()=>st.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
const bad=m=>{tone(150,.3,'square');M(m);say('Try again')};

/* pick a picture, then tap its box (many boxes) */
function sortG(bins,per,sz){
 let sel=null,left,tray=el('','tray'),bk=el('','baskets');
 const drop=(d,n)=>{if(!sel){M('Tap a thing first!');say('Tap a thing first');return}
  if(sel.k==n){const i=sel;i.onclick=null;i.classList.remove('sel');i.style.fontSize='40px';d.querySelector('.bin').appendChild(i);sel=null;tone(700,.2);say(i.nm+' goes in '+bins[n][0]);M(--left?'Yes! '+i.nm+' goes here!':'Great job! All sorted!')}else bad('Oops! Try another box!')};
 const bn=bins.map((b,n)=>{const d=el('<div class=bt>'+b[0]+'</div><div class=bin></div>','basket',{background:'linear-gradient(rgba(255,255,255,.25),rgba(0,0,0,.15)),'+b[1]},bk);d.onclick=()=>drop(d,n);return d});
 const start=()=>{tray.innerHTML='';bn.forEach(d=>d.querySelector('.bin').innerHTML='');sel=null;M('Tap a picture, then tap its box!');
  const all=[];bins.forEach((b,k)=>sh(b[2]).slice(0,per).forEach(x=>all.push([x,k])));left=all.length;
  sh(all).forEach(a=>{const i=el(a[0][0],'item',{fontSize:sz+'px'},tray);i.nm=a[0][1];i.k=a[1];i.onclick=()=>{clr();sel=i;i.classList.add('sel');say(i.nm);tone(400,.1)}})};
 start();bins.forEach((b,n)=>btn('Learn: '+b[4],b[1],()=>{say(b[3]);M(b[3])}));btn('New Set','#8e24aa',start);
}
const homes=()=>sortG([['FOREST 🌲','#2e7d32',[['🦌','Deer'],['🐻','Bear'],['🦊','Fox'],['🐿️','Squirrel']],'Deer, bears and foxes live in the forest.','Forest'],['OCEAN 🌊','#1e88e5',[['🐠','Fish'],['🐋','Whale'],['🐙','Octopus'],['🦀','Crab']],'Fish, whales and crabs live in the ocean.','Ocean'],['DESERT 🏜️','#d79a2b',[['🐪','Camel'],['🦂','Scorpion'],['🦎','Lizard'],['🐍','Snake']],'Camels and lizards live in the hot desert.','Desert'],['BIRD NEST 🐦','#8d5524',[['🐦','Sparrow'],['🦉','Owl'],['🦜','Parrot'],['🐥','Chick']],'Birds live in nests high up in trees.','Nest']],2,76);
const seasons=()=>sortG([['SUMMER ☀️','#f9a825',[['👕','T-shirt'],['🕶️','Sunglasses'],['🧢','Cap'],['👒','Sun hat']],'In summer it is hot. We wear light clothes.','Summer'],['WINTER ❄️','#1e88e5',[['🧥','Coat'],['🧣','Scarf'],['🧤','Gloves'],['🧦','Warm socks']],'In winter it is cold. We wear warm clothes.','Winter'],['RAINY ☔','#546e7a',[['☂️','Umbrella'],['🥾','Rain boots'],['🌂','Closed umbrella'],['👢','Boots']],'In the rainy season we use umbrellas and boots.','Rainy'],['SPRING 🌸','#d81b60',[['👗','Light dress'],['👟','Sneakers'],['🧺','Picnic basket'],['🌸','Flower crown']],'In spring flowers bloom. The weather is nice.','Spring']],2,76);
const clean=()=>sortG([['DRY BIN 🗑️','#fb8c00',[['🍂','Dry leaves'],['🧦','Old sock'],['🪥','Old toothbrush'],['🎈','Balloon'],['🖍️','Broken crayon']],'Dry waste is dry things we cannot reuse.','Dry'],['WET BIN 🍌','#43a047',[['🍌','Banana peel'],['🍎','Apple core'],['🥚','Egg shell'],['🍞','Old bread'],['🥕','Carrot peels']],'Wet waste is food waste. It makes compost.','Wet'],['RECYCLE ♻️','#1e88e5',[['🥤','Plastic bottle'],['🥫','Tin can'],['📰','Newspaper'],['📦','Paper box'],['🍾','Glass bottle']],'We can recycle paper, plastic, glass and tin.','Recycle']],3,76);

/* pick a picture, then tap the one box it belongs to */
function placeG(o){
 let sel=null,left;const tg=el('','tray',o.tg),it=el('','tray',o.it);
 const start=()=>{tg.innerHTML=it.innerHTML='';sel=null;left=o.items.length;M(o.msg);
  o.targets.forEach((t,n)=>{if(o.arrow&&n)el('➡️','',{fontSize:'44px'},tg);
   const d=el(t[1]+'<div class=tl>'+t[2]+'</div>','slot'+(o.sm?' sm':'')+(t[3]?' '+t[3]:''),null,tg);
   d.onclick=()=>{if(!sel){M('Tap a picture first!');say('Tap a picture first');return}
    if(sel.k==t[0]){d.innerHTML=(o.keep?t[1]:'')+sel.h+'<div class=tl>'+t[2]+'</div>';d.classList.add('ok');d.onclick=null;tone(700,.2);say(sel.nm);M(--left?'Yes! '+sel.nm+'!':o.done);if(!left)say(o.done);sel.remove();sel=null}else bad('Oops! Try another box!')}});
  sh(o.items).forEach(x=>{const i=el(x[1],'item',{fontSize:'70px'},it);i.k=x[0];i.nm=x[2];i.h=x[1];i.onclick=()=>{clr();sel=i;i.classList.add('sel');say(x[2]);tone(400,.1)}})};
 start();o.learn.forEach((l,i)=>btn(l[0],P[i%8],()=>{say(l[1]);M(l[1])}));btn('Shuffle','#8e24aa',start);
}
const cloudSvg='<svg viewBox="0 0 100 65" width="100%" height="100%"><defs><linearGradient id="cldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cfe2ee"/></linearGradient></defs><path d="M22 55h56a16 16 0 005-31 22 22 0 00-40-7 18 18 0 00-24 16 14 14 0 003 22z" fill="url(#cldG)" stroke="#90b4ce" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/></svg>';

const rainbowSvg='<svg viewBox="0 0 200 110" width="100%" height="100%"><ellipse cx="100" cy="110" rx="90" ry="90" fill="none" stroke="#e53935" stroke-width="8"/><ellipse cx="100" cy="110" rx="82" ry="82" fill="none" stroke="#ff9800" stroke-width="8"/><ellipse cx="100" cy="110" rx="74" ry="74" fill="none" stroke="#ffeb3b" stroke-width="8"/><ellipse cx="100" cy="110" rx="66" ry="66" fill="none" stroke="#43a047" stroke-width="8"/><ellipse cx="100" cy="110" rx="58" ry="58" fill="none" stroke="#00acc1" stroke-width="8"/><ellipse cx="100" cy="110" rx="50" ry="50" fill="none" stroke="#1e88e5" stroke-width="8"/><ellipse cx="100" cy="110" rx="42" ry="42" fill="none" stroke="#8e24aa" stroke-width="8"/></svg>';

const treeSvg='<svg viewBox="0 0 100 120" width="100%" height="100%"><rect x="42" y="68" width="16" height="48" rx="4" fill="#795548" stroke="#4e342e" stroke-width="2.5"/><circle cx="50" cy="46" r="34" fill="#43a047" stroke="#2e7d32" stroke-width="3"/><circle cx="34" cy="40" r="22" fill="#66bb6a"/><circle cx="66" cy="40" r="22" fill="#66bb6a"/><circle cx="50" cy="24" r="22" fill="#81c784"/><circle cx="38" cy="44" r="4.5" fill="#e53935"/><circle cx="62" cy="48" r="4.5" fill="#e53935"/><circle cx="50" cy="34" r="4.5" fill="#e53935"/></svg>';

const kiteSvg='<svg viewBox="0 0 100 120" width="100%" height="100%"><polygon points="50,10 82,46 50,86 18,46" fill="#ffeb3b" stroke="#f57f17" stroke-width="2"/><polygon points="50,10 82,46 50,46" fill="#e53935"/><polygon points="18,46 50,46 50,86" fill="#1e88e5"/><polygon points="50,46 82,46 50,86" fill="#43a047"/><path d="M50 86q12 14 6 24" fill="none" stroke="#795548" stroke-width="2"/><polygon points="54,102 60,100 58,106" fill="#ff4081"/><polygon points="56,112 62,110 60,116" fill="#ffeb3b"/></svg>';
const rainDropSvg='<svg viewBox="0 0 100 140" width="100%" height="100%"><path d="M50 0C50 0 10 70 10 100a40 40 0 0080 0C90 70 50 0 50 0z" fill="#42a5f5"/></svg>';
const windLeafSvg='<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M15 85 C15 40 45 15 85 15 C85 55 55 85 15 85 Z" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/></svg>';

const PREP_SVGS = {
  'Deer': '<svg viewBox="0 0 100 100" width="72" height="72"><ellipse cx="50" cy="55" rx="26" ry="18" fill="#a0522d"/><circle cx="68" cy="40" r="14" fill="#a0522d"/><polygon points="76,32 82,18 78,34" fill="#6d4c41"/><polygon points="80,24 88,22 82,27" fill="#6d4c41"/><polygon points="72,30 74,16 70,32" fill="#6d4c41"/><circle cx="73" cy="38" r="2.5" fill="#111"/><ellipse cx="79" cy="42" rx="4" ry="3" fill="#3e2723"/><rect x="36" y="68" width="6" height="24" rx="2" fill="#8d4024"/><rect x="58" y="68" width="6" height="24" rx="2" fill="#8d4024"/></svg>',

function magnet(){
 const W=st.clientWidth,H=st.clientHeight;let mx=W/2,my=H/2,on=1,ln=0,I=[];
 const D=[['🔩','Bolt',1],['📎','Paper clip',1],['🔑','Key',1],['🔧','Wrench',1],['🔨','Hammer',1],['🪵','Wood block',0],['🧸','Plastic toy',0],['🧩','Puzzle piece',0],['🍎','Apple',0],['📕','Book',0]];
 M('Move the magnet with your mouse!');const mg=el('🧲','mg');
 D.forEach(d=>I.push({e:d[0],name:d[1],m:d[2],x:60+Math.random()*(W-200),y:100+Math.random()*(H-240),el:el(d[0],'mi')}));
 st.onpointermove=e=>{const r=st.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top};
 T.push(setInterval(()=>{mg.style.left=mx-45+'px';mg.style.top=my-45+'px';let n=0;
  I.forEach(o=>{const dx=mx-(o.x+29),dy=my-(o.y+29),d=Math.hypot(dx,dy)||1;
   if(o.s){if(!on)o.s=0;else{o.x=mx+o.ox-29;o.y=my+o.oy-29;n++}}
   else if(on&&o.m&&d<230){const v=Math.max(3,(230-d)/12);o.x+=dx/d*v;o.y+=dy/d*v;if(d<60){o.s=1;o.ox=Math.random()*70-35;o.oy=Math.random()*60-10;tone(900,.08)}}
   else if(on&&!o.m&&d<75&&!o.w){o.w=1;o.el.classList.add('hint');M(o.name+' is NOT magnetic!');say(o.name+' is not magnetic');setTimeout(()=>{o.w=0;o.el.classList.remove('hint')},1500)}
   o.el.style.left=o.x+'px';o.el.style.top=o.y+'px'});
  if(n!=ln){ln=n;if(n)M('The magnet picked up '+n+' iron thing'+(n>1?'s':'')+'!')}},30));
 const b=btn('Magnet: ON','#43a047',()=>{on=!on;b.textContent='Magnet: '+(on?'ON':'OFF');b.style.setProperty('--c',on?'#43a047':'#e53935');M(on?'Magnet is ON!':'Magnet is OFF. Things drop!')});
 const show=m=>{I.forEach(o=>{o.el.classList.remove('hint');if(o.m==m){void o.el.offsetWidth;o.el.classList.add('hint')}})};
 btn('Show Iron Things','#1e88e5',()=>{show(1);say('Iron things stick to a magnet')});btn('Show Non-Magnetic','#fb8c00',()=>{show(0);say('Wood, plastic and paper do not stick')});

}

function traffic(){
 const W=st.clientWidth,H=st.clientHeight,rt=H*.46,rh=150,zx=W*.45,stop=zx+150,py0=rt-80,py1=rt+rh+5;
 el('','rd',{top:rt+'px',height:rh+'px'});el('','zb',{left:zx+'px',top:rt+'px',height:rh+'px'});
 el('<div class=lt id=lr></div><div class=lt id=ly></div><div class=lt id=lg></div>','pole',{left:zx+175+'px',top:rt-215+'px'});
 let ls='red',tm=0,auto=0,py=py0,ped={w:0,d:1,done:0},cars=[];
 const ped_=el('🚶','car',{left:zx+35+'px',top:py+'px'});
 const E=['🚗','🚕','🚌','🚙','🚓'];
 const addCar=()=>{if(cars.length>5)return;cars.push({x:Math.max(W,...cars.map(c=>c.x+130)),el:el(E[cars.length%5],'car',{top:rt+45+'px'})})};
 const set=l=>{ls=l;tm=0;ped.done=0;$('#lr').classList.toggle('on',l=='red');$('#ly').classList.toggle('on',l=='yellow');$('#lg').classList.toggle('on',l=='green');
  const m={red:'RED = STOP! Cars wait. People can cross.',yellow:'YELLOW = GET READY!',green:'GREEN = GO! Cars can go.'}[l];M(m);say(m.split('!')[0].replace('=','means'))};
 addCar();addCar();for(let i=0;i<2;i++)cars[i].x=W-150+i*0;cars[0].x=W-200;cars[1].x=W+60;set('red');
 T.push(setInterval(()=>{tm++;if(auto&&tm>({red:200,green:200,yellow:70}[ls]))set(ls=='red'?'green':ls=='green'?'yellow':'red');
  if(!ped.w&&!ped.done&&ls=='red'&&tm>40){ped.w=1;ped.done=1}
  if(ped.w){py+=ped.d*2.5;if((ped.d>0&&py>=py1)||(ped.d<0&&py<=py0)){py=ped.d>0?py1:py0;ped.d*=-1;ped.w=0}}
  ped_.style.top=py+'px';
  cars.sort((a,b)=>a.x-b.x);
  cars.forEach((c,i)=>{const v=ls=='yellow'?4:7,nx=c.x-v,ah=cars[i-1];
   const stopNow=ls=='red'||ped.w||(ls=='yellow'&&c.x-stop>90);
   let x=c.x-v;if(stopNow&&c.x>=stop&&nx<stop)x=c.x;
   if(ah&&x<ah.x+110)x=c.x;
   c.x=x;if(c.x<-120)c.x=Math.max(W+20,...cars.map(a=>a.x+130));c.el.style.left=c.x+'px'})},30));

function sinkfloat(){
 M('Pick an item, then guess!');el('','tub');let pend=null,sc=0,tot=0;
 const I=[['🪵','Wood',1],['🪨','Stone',0],['✏️','Pencil',1],['🪙','Coin',0],['🍎','Apple',1],['🔑','Key',0],['🦆','Rubber duck',1],['🥄','Spoon',0]];
 const go=g=>{if(!pend){M('Pick an item first!');say('Pick an item first');return}const it=pend;pend=null;tot++;
  const H=st.clientHeight,W=st.clientWidth,sf=H*.52,x=W*.25+Math.random()*W*.5;const old=st.querySelectorAll('.drop');if(old.length>9)old[0].remove();
  const i=el(it[0],'drop',{left:x+'px',top:'-100px',fontSize:'64px'});void i.offsetWidth;i.style.transition='top .7s cubic-bezier(.5,0,1,.6)';i.style.top=(sf-60)+'px';tone(400,.1);
  setTimeout(()=>{tone(200,.3,'triangle');for(let k=0;k<10;k++)el('💧','dr',{left:x+'px',top:sf+'px',fontSize:'24px','--dx':(Math.random()*180-90)+'px'}).addEventListener('animationend',e=>e.target.remove());
   if(it[2]){i.style.transition='top .6s ease-out';i.style.top=(sf-45)+'px';i.classList.add('bob')}else{i.style.transition='top 1.6s ease-in';i.style.top=(H-95)+'px'}
   const ok=g==it[2];if(ok)sc++;const m=(ok?'You are right! ':'Not this time. ')+it[1]+(it[2]?' floats!':' sinks!')+'  Score: '+sc+'/'+tot;M(m);say(m)},700)};
 I.forEach((it,k)=>btn(it[0]+' '+it[1],P[k],()=>{pend=it;M('Will the '+it[1]+' sink or float?');say('Will the '+it[1]+' sink or float?')}));
 btn('I think: FLOAT ⬆️','#00897b',()=>go(1));btn('I think: SINK ⬇️','#c62828',()=>go(0));
 btn('Empty Tank','#546e7a',()=>{st.querySelectorAll('.drop').forEach(d=>d.remove());M('The tank is empty. Pick an item!')});
}
