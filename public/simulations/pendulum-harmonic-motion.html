<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Harmonic Motion & Pendulum Energy Conservation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 20%, #071330 0%, #030712 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    header {
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .title-box { display: flex; align-items: center; gap: 10px; }
    .badge {
      background: #0284c7;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 16px; font-weight: 800; color: #e0f2fe; }
    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 11px;
      font-family: monospace;
      color: #94a3b8;
    }
    .stats-bar span b { color: #38bdf8; }
    .main-stage {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .side-metrics {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 220px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .energy-bar-wrap {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
    }
    .ebar-label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; margin-bottom: 2px; }
    .ebar-bg { height: 7px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
    .ebar-fill { height: 100%; border-radius: 4px; transition: width 0.05s linear; }
    .dock {
      padding: 10px 16px;
      background: rgba(10, 18, 38, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.7);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      font-weight: 700;
    }
    .ctrl-group label { color: #94a3b8; font-size: 11px; }
    input[type="range"] {
      width: 80px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.15); }
    .btn:active { transform: translateY(1px); }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      box-shadow: none;
    }
    select {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
  </style>




<!-- ================= FULLSCREEN ENGINE STYLES ================= -->
<style id="genz-simulation-fullscreen-styles">
  :fullscreen, ::backdrop {
    background-color: #0b0f19 !important;
  }
  .simulation-wrapper:fullscreen {
    width: 100vw !important;
    height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    background-color: #0b0f19 !important;
    position: fixed !important;
    inset: 0 !important;
    z-index: 999999 !important;
    margin: 0 !important;
    padding: 8px 16px !important;
    box-sizing: border-box !important;
  }
  .simulation-wrapper:fullscreen canvas,
  .simulation-wrapper:fullscreen iframe,
  .simulation-wrapper:fullscreen svg {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    flex: 1 1 0 !important;
    min-height: 0 !important;
    margin: 0 auto !important;
  }
  /* Preserve Overlay Controls and Interactive State with high z-index (50+) */
  .simulation-wrapper:fullscreen .ctl,
  .simulation-wrapper:fullscreen .controls,
  .simulation-wrapper:fullscreen .sim-controls,
  .simulation-wrapper:fullscreen .sim-readout,
  .simulation-wrapper:fullscreen .preset-chips,
  .simulation-wrapper:fullscreen .row,
  .simulation-wrapper:fullscreen .fs-bar,
  .simulation-wrapper:fullscreen .floating-controls,
  .simulation-wrapper:fullscreen .btn,
  .simulation-wrapper:fullscreen .fs-topbar,
  .simulation-wrapper:fullscreen .fullscreen-overlay-controls,
  .simulation-wrapper:fullscreen .topic-header,
  .simulation-wrapper:fullscreen .control-panel,
  .simulation-wrapper:fullscreen .controls-bar,
  .simulation-wrapper:fullscreen .dashboard {
    position: relative !important;
    z-index: 50 !important;
    flex-shrink: 0 !important;
    max-width: 100% !important;
  }
  /* Neutralize legacy empty overlay divs that blank out the page */
  .fs-overlay {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
</style>

</head>
<body>
  <header>
    <div class="title-box">
      <span class="badge">LAB 42</span>
      <h1>Simple Harmonic Motion & Pendulum Conservation</h1>
    </div>
    <div class="stats-bar">
      <span>θ: <b id="statAngle">0.0°</b></span>
      <span>ω: <b id="statOmega">0.00 rad/s</b></span>
      <span>Period (T): <b id="statPeriod">1.42 s</b></span>
      <span>Total E: <b id="statEnergy">14.7 J</b></span>
    </div>
  </header>

  <div class="main-stage">
    <canvas id="simCanvas"></canvas>
    
    <div class="side-metrics">
      <div style="font-size: 11px; font-weight: 800; color: #38bdf8; margin-bottom: 8px; text-transform: uppercase;">
        ⚡ Live Energy Monitor
      </div>
      <div class="energy-bar-wrap">
        <div class="ebar-label"><span style="color: #4ade80;">Kinetic (Ek)</span><span id="txtEk">0.0 J</span></div>
        <div class="ebar-bg"><div class="ebar-fill" id="barEk" style="background: #22c55e; width: 0%;"></div></div>

        <div class="ebar-label"><span style="color: #60a5fa;">Potential (Ep)</span><span id="txtEp">0.0 J</span></div>
        <div class="ebar-bg"><div class="ebar-fill" id="barEp" style="background: #3b82f6; width: 0%;"></div></div>

        <div class="ebar-label"><span style="color: #facc15;">Mechanical (Et)</span><span id="txtEt">0.0 J</span></div>
        <div class="ebar-bg"><div class="ebar-fill" id="barEt" style="background: #eab308; width: 100%;"></div></div>
      </div>
      <div style="margin-top: 10px; font-size: 10px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px;">
        💡 Click and drag the glowing bob to release at any angle!
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" id="btnPlayPause">⏸ Pause</button>
    <button class="btn btn-secondary" id="btnReset">⟳ Reset Angle</button>

    <div class="ctrl-group">
      <label>Length (L):</label>
      <input type="range" id="rngLength" min="0.5" max="2.0" step="0.1" value="1.2">
      <span id="lblLength" style="color:#38bdf8;">1.2m</span>
    </div>

    <div class="ctrl-group">
      <label>Mass (m):</label>
      <input type="range" id="rngMass" min="0.5" max="5.0" step="0.5" value="1.5">
      <span id="lblMass" style="color:#38bdf8;">1.5kg</span>
    </div>

    <div class="ctrl-group">
      <label>Gravity:</label>
      <select id="selGravity">
        <option value="9.8">Earth (9.8 m/s²)</option>
        <option value="1.62">Moon (1.62 m/s²)</option>
        <option value="3.71">Mars (3.71 m/s²)</option>
        <option value="24.79">Jupiter (24.79 m/s²)</option>
        <option value="0">Zero-G (0.0 m/s²)</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Friction:</label>
      <input type="range" id="rngDamping" min="0" max="0.15" step="0.01" value="0.01">
      <span id="lblDamping" style="color:#38bdf8;">Low</span>
    </div>

    <button class="btn btn-secondary" id="btnVectors">Vectors: ON</button>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = true;
    let showVectors = true;
    let lengthMeters = 1.2;
    let massKg = 1.5;
    let gravity = 9.8;
    let damping = 0.01;

    let angle = Math.PI / 4; // 45 deg
    let angularVel = 0;
    let angularAcc = 0;

    let isDragging = false;
    let originX = 0;
    let originY = 60;
    let pixelScale = 160;

    const trail = [];

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      originX = canvas.width / 2;
      originY = Math.max(50, canvas.height * 0.12);
      pixelScale = Math.min(canvas.width, canvas.height) * 0.38;
    }
    window.addEventListener('resize', resize);
    resize();

    function getBobPos() {
      const armLength = lengthMeters * pixelScale;
      return {
        x: originX + armLength * Math.sin(angle),
        y: originY + armLength * Math.cos(angle)
      };
    }

    // Pointer events for dragging
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const bob = getBobPos();
      const dist = Math.hypot(mx - bob.x, my - bob.y);
      if (dist < 35) {
        isDragging = true;
        angularVel = 0;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      angle = Math.atan2(mx - originX, my - originY);
      angularVel = 0;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    // Controls
    document.getElementById('btnPlayPause').addEventListener('click', () => {
      isPlaying = !isPlaying;
      document.getElementById('btnPlayPause').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      angle = Math.PI / 4;
      angularVel = 0;
      angularAcc = 0;
      trail.length = 0;
    });

    document.getElementById('rngLength').addEventListener('input', (e) => {
      lengthMeters = parseFloat(e.target.value);
      document.getElementById('lblLength').textContent = lengthMeters.toFixed(1) + 'm';
    });

    document.getElementById('rngMass').addEventListener('input', (e) => {
      massKg = parseFloat(e.target.value);
      document.getElementById('lblMass').textContent = massKg.toFixed(1) + 'kg';
    });

    document.getElementById('selGravity').addEventListener('change', (e) => {
      gravity = parseFloat(e.target.value);
    });

    document.getElementById('rngDamping').addEventListener('input', (e) => {
      damping = parseFloat(e.target.value);
      document.getElementById('lblDamping').textContent = damping === 0 ? 'None' : (damping > 0.06 ? 'High' : 'Low');
    });

    document.getElementById('btnVectors').addEventListener('click', () => {
      showVectors = !showVectors;
      document.getElementById('btnVectors').textContent = showVectors ? 'Vectors: ON' : 'Vectors: OFF';
    });

    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (isPlaying && !isDragging) {
        // Physics integration (Euler-Cromer)
        angularAcc = -(gravity / lengthMeters) * Math.sin(angle) - damping * angularVel;
        angularVel += angularAcc * dt;
        angle += angularVel * dt;
      }

      const bob = getBobPos();

      // Energy calculations
      const armLength = lengthMeters;
      const h = armLength * (1 - Math.cos(angle));
      const v = armLength * angularVel;
      const Ep = massKg * gravity * h;
      const Ek = 0.5 * massKg * v * v;
      const Et = Ep + Ek;

      // Update UI stats
      document.getElementById('statAngle').textContent = (angle * 180 / Math.PI).toFixed(1) + '°';
      document.getElementById('statOmega').textContent = angularVel.toFixed(2) + ' rad/s';
      const period = gravity > 0 ? (2 * Math.PI * Math.sqrt(lengthMeters / gravity)).toFixed(2) + ' s' : '∞';
      document.getElementById('statPeriod').textContent = period;
      document.getElementById('statEnergy').textContent = Et.toFixed(1) + ' J';

      document.getElementById('txtEk').textContent = Ek.toFixed(1) + ' J';
      document.getElementById('txtEp').textContent = Ep.toFixed(1) + ' J';
      document.getElementById('txtEt').textContent = Et.toFixed(1) + ' J';

      const maxE = Math.max(Et, 10);
      document.getElementById('barEk').style.width = Math.min(100, (Ek / maxE) * 100) + '%';
      document.getElementById('barEp').style.width = Math.min(100, (Ep / maxE) * 100) + '%';

      // Record trail
      trail.push({ x: bob.x, y: bob.y, age: 1.0 });
      if (trail.length > 50) trail.shift();
      trail.forEach(t => t.age -= 0.02);

      // Render
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw subtle background grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw equilibrium vertical guide
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(originX, originY + lengthMeters * pixelScale + 30);
      ctx.stroke();
      ctx.restore();

      // Draw Angle Arc
      if (Math.abs(angle) > 0.05) {
        ctx.beginPath();
        const arcRadius = 50;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.arc(originX, originY, arcRadius, Math.PI / 2, Math.PI / 2 + angle, angle < 0);
        ctx.stroke();
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(`${(angle * 180 / Math.PI).toFixed(0)}°`, originX + (angle > 0 ? 25 : -40), originY + 60);
      }

      // Draw Trail
      ctx.beginPath();
      for (let i = 0; i < trail.length; i++) {
        const pt = trail[i];
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw Pendulum Rod
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(bob.x, bob.y);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw Pivot Mount
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(originX, originY, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Draw Bob Glow
      const bobRadius = 14 + massKg * 3.5;
      const grad = ctx.createRadialGradient(bob.x, bob.y, 2, bob.x, bob.y, bobRadius);
      grad.addColorStop(0, '#67e8f9');
      grad.addColorStop(0.4, '#0284c7');
      grad.addColorStop(1, '#0c4a6e');

      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(bob.x, bob.y, bobRadius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // Vectors (Force and Velocity)
      if (showVectors) {
        // Velocity Vector (Green)
        const vScale = 22;
        const vx = -Math.cos(angle) * (v * vScale);
        const vy = Math.sin(angle) * (v * vScale);
        drawArrow(bob.x, bob.y, bob.x + vx, bob.y + vy, '#22c55e', 'v');

        // Gravity Force mg (Red)
        const gScale = 3.5;
        drawArrow(bob.x, bob.y, bob.x, bob.y + gravity * gScale, '#ef4444', 'mg');

        // Tension Force T (Cyan)
        const tensionMag = (massKg * gravity * Math.cos(angle) + massKg * (v * v) / lengthMeters) * 1.5;
        const tx = -Math.sin(angle) * tensionMag;
        const ty = -Math.cos(angle) * tensionMag;
        drawArrow(bob.x, bob.y, bob.x + tx, bob.y + ty, '#38bdf8', 'T');
      }

      requestAnimationFrame(loop);
    }

    function drawArrow(x1, y1, x2, y2, color, label) {
      const headLen = 8;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 5) return;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      if (label) {
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(label, x2 + 6, y2 + 4);
      }
      ctx.restore();
    }

    requestAnimationFrame(loop);
  </script>




<!-- ================= FULLSCREEN ENGINE CONTROLLER ================= -->
<script id="genz-simulation-fullscreen-engine">
(function() {
  function findSimulationRootContainer(el) {
    if (el) {
      if (typeof el === "string") {
        var cleanId = el.replace(/^fs-?/, "");
        var byId = document.getElementById(cleanId) || document.getElementById(el) || document.getElementById(cleanId + "SimBox");
        if (byId) {
          byId.classList.add("simulation-wrapper");
          return byId;
        }
      }
      if (el.nodeType === 1) {
        if (el.dataset && el.dataset.fs) {
          var targetByFs = document.getElementById(el.dataset.fs);
          if (targetByFs) {
            targetByFs.classList.add("simulation-wrapper");
            return targetByFs;
          }
        }
        if (el.dataset && el.dataset.target) {
          var cleanTargetId = el.dataset.target.replace(/^fs-?/, "");
          var targetByData = document.getElementById(cleanTargetId) || document.getElementById(el.dataset.target);
          if (targetByData) {
            targetByData.classList.add("simulation-wrapper");
            return targetByData;
          }
        }
        var found = el.closest(".simulation-wrapper, .sim-box, .sim-stage, .simulation, #sim, #simContainer, .card, .main-stage, .stage, .container, .sim");
        if (found && found !== document.body && found !== document.documentElement) {
          found.classList.add("simulation-wrapper");
          return found;
        }
      }
    }
    var candidate = document.querySelector(".simulation-wrapper") ||
                    document.getElementById("simContainer") ||
                    document.getElementById("sim") ||
                    document.querySelector(".sim-stage") ||
                    document.querySelector(".sim-box") ||
                    document.querySelector(".simulation") ||
                    document.querySelector(".sim") ||
                    document.querySelector(".card") ||
                    document.querySelector(".main-stage") ||
                    document.querySelector(".container") ||
                    document.body;
    if (candidate && candidate !== document.documentElement) {
      candidate.classList.add("simulation-wrapper");
      return candidate;
    }
    document.body.classList.add("simulation-wrapper");
    return document.body;
  }

  function toggleSimulationFullscreen(triggerEl) {
    try {
      if (!document.fullscreenElement) {
        var container = findSimulationRootContainer(triggerEl);
        if (container && container.requestFullscreen) {
          container.requestFullscreen().catch(function(err) {
            console.error("Fullscreen request failed:", err);
            if (document.body && document.body.requestFullscreen) {
              document.body.classList.add("simulation-wrapper");
              document.body.requestFullscreen().catch(function(e) { console.error(e); });
            }
          });
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function(err) {
            console.error("Exit fullscreen error:", err);
          });
        }
      }
    } catch (err) {
      console.error("Fullscreen toggle error:", err);
    }
  }

  // Override/intercept all simulation fullscreen function names
  window.toggleFullscreen = function(target) {
    toggleSimulationFullscreen(target || this);
  };
  window.toggleSimFullscreen = function(boxId) {
    var el = boxId ? document.getElementById(boxId) : this;
    toggleSimulationFullscreen(el || boxId);
  };
  window.toggleFs = function() {
    toggleSimulationFullscreen(this);
  };
  window.openFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) {
        ov.classList.remove("active");
        ov.style.display = "none";
      }
      var clean = id.replace(/^fs-?/, "");
      var target = document.getElementById(clean) ||
                   document.getElementById(clean + "SimBox") ||
                   document.getElementById("t-" + clean) ||
                   document.querySelector("[data-topic="" + clean + ""]") ||
                   document.getElementById(id);
      toggleSimulationFullscreen(target || clean);
      return;
    }
    toggleSimulationFullscreen(this);
  };
  window.launchFullscreen = function(topicId) {
    window.openFullscreen(topicId);
  };
  window.closeFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) ov.classList.remove("active");
    }
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };
  window.exitSimFullscreen = function() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };

  // Canvas Re-sizing and Redrawing on fullscreen change and window resize
  function resizeAndRedrawSimulationCanvases() {
    window.dispatchEvent(new Event("resize"));

    document.querySelectorAll("canvas").forEach(function(cv) {
      try {
        var rect = cv.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          if (cv.width === 0 || cv.height === 0) {
            cv.width = rect.width;
            cv.height = rect.height;
          }
        }
      } catch(e) {}
    });

    var redrawFns = [
      "draw", "render", "animate", "redraw", "update", "drawCanvas",
      "drawBohrModel", "drawScaleCanvas", "drawTitrationCanvas",
      "resizeMeasureCanvas", "updateSimulation", "drawScene", "drawOrbit",
      "drawWaves", "drawField", "drawCircuit", "drawGenetics"
    ];
    redrawFns.forEach(function(fn) {
      if (typeof window[fn] === "function") {
        try { window[fn](); } catch(e) {}
      }
    });
  }

  document.addEventListener("fullscreenchange", function() {
    var isFs = !!document.fullscreenElement;
    var fsButtons = document.querySelectorAll(
      ".b-fs, .b-exit, [data-role="fs-btn"], .fs-btn, .btn-fs, .fullscreen-btn, #bFs, #fsExitBtn, .fs-exit, #btnFullscreen, #fullscreenBtn, [data-fs], #psFsBtn, #fsToggleBtn, [id*="fsToggleBtn"], #fsBtn, #btnFsMoon, #seFsBtn, #dnFsBtn, #waterFsBtn"
    );
    fsButtons.forEach(function(btn) {
      if (btn.classList.contains("fs-exit-btn") || btn.classList.contains("fs-exit")) {
        return;
      }
      if (isFs) {
        btn.innerHTML = "✕ Exit full screen";
        btn.classList.add("is-fullscreen-active");
      } else {
        btn.innerHTML = "⛶ Full screen";
        btn.classList.remove("is-fullscreen-active");
      }
    });

    resizeAndRedrawSimulationCanvases();
    setTimeout(resizeAndRedrawSimulationCanvases, 50);
    setTimeout(resizeAndRedrawSimulationCanvases, 150);
    setTimeout(resizeAndRedrawSimulationCanvases, 300);
  });

  window.addEventListener("resize", resizeAndRedrawSimulationCanvases);

  // Event delegation to capture clicks on any built-in fullscreen button reliably
  document.addEventListener("click", function(e) {
    var btn = e.target.closest(
      "button.b-fs, button.b-exit, button[data-role="fs-btn"], button.fs-btn, button.btn-fs, button.fullscreen-btn, button#bFs, button#fsExitBtn, button.fs-exit, button#btnFullscreen, button#fullscreenBtn, button[data-fs], button#psFsBtn, button#fsToggleBtn, button[id*="fsToggleBtn"], button#fsBtn, button#btnFsMoon, button#seFsBtn, button#dnFsBtn, button#waterFsBtn, button.icon-btn[onclick*="toggleSimFullscreen"]"
    );
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      toggleSimulationFullscreen(btn);
    }
  }, true);
})();
</script>

</body>
