<style>

<script>
const $=s=>document.querySelector(s);
const BN={z:"صفتِ ذاتی",r:"صفتِ نسبتی",c:"صفتِ عددی",q:"صفتِ مقداری",d:"صفتِ اشاری"};
const DEF={z:"صفتِ ذاتی: اسم کی اپنی خوبی یا حالت بتائے (خوبصورت، سرخ، محنتی)",r:"صفتِ نسبتی: کسی جگہ یا چیز سے نسبت بتائے (پاکستانی، دیہاتی، ملکی)",c:"صفتِ عددی: اسم کی گنتی یا ترتیب بتائے (دو، چار، پہلا)",q:"صفتِ مقداری: اسم کی مقدار بتائے (تھوڑا، سارا، زیادہ)",d:"صفتِ اشاری: اسم کی طرف اشارہ کرے (یہ، وہ، اس)"};
const CL={z:{a:"#ff5d8f",b:"#ffffff",c:"#ffd23c",c2:"#ffb300",rb:"#e0457a",n:6},r:{a:"#a56bff",b:"#f4c6ff",c:"#fff3b0",c2:"#ff9ad5",rb:"#7a3fe0",n:5},c:{a:"#ffd400",b:"#ff9f1a",c:"#6b3b00",c2:"#6b3b00",rb:"#f2a900",n:10},q:{a:"#ff8a1f",b:"#ffe14d",c:"#ffe08a",c2:"#b45300",rb:"#e8590c",n:6},d:{a:"#ff4d4d",b:"#3f8cff",c:"#2b1a00",c2:"#fff3b0",rb:"#d62828",n:5}};
const ORDER=["z","r","c","q","d"];
const S=["یہ/d کتاب/- خوبصورت/z ہے۔/-","میں/- نے/- دو/c سرخ/z سیب/- خریدے۔/-","ہمیں/- تھوڑا/q دودھ/- چاہیے۔/-","وہ/d لڑکا/- محنتی/z ہے۔/-","پاکستانی/r جھنڈا/- سبز/z اور/- سفید/z ہے۔/-","پہلا/c انعام/- اسے/- ملا۔/-","سارا/q دودھ/- گرم/z ہے۔/-","دیہاتی/r لوگ/- سادہ/z ہوتے/- ہیں۔/-","اس/d کمرے/- میں/- چار/c کرسیاں/- ہیں۔/-","ہمارے/- پاس/- زیادہ/q پیسے/- نہیں/- ہیں۔/-","ملکی/r حالات/- اچھے/z ہیں۔/-","پانچ/c سفید/z کبوتر/- اڑ/- رہے/- ہیں۔/-"].map(s=>s.split(" ").map(t=>{const[w,k]=t.split("/");return{w,k:k==="-"?null:k}}));
/* ---------- mascots ---------- */
let uid=0;
function butterfly(gl){const u="w"+uid++;return `<svg viewBox="0 0 220 240" width="100%" height="100%"><defs><linearGradient id="${u}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7bd0"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd2ff"/></linearGradient><linearGradient id="${u}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23c"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient><radialGradient id="${u}h" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffe3a8"/><stop offset="1" stop-color="#ff9f43"/></radialGradient>

<ellipse cx="94" cy="104" rx="12" ry="15" fill="#fff"/><ellipse cx="126" cy="104" rx="12" ry="15" fill="#fff"/><circle cx="96" cy="107" r="8" fill="#3b2314"/><circle cx="124" cy="107" r="8" fill="#3b2314"/><circle cx="99" cy="102" r="3" fill="#fff"/><circle cx="127" cy="102" r="3" fill="#fff"/>
<circle cx="80" cy="126" r="8" fill="#ff7aa2" opacity=".6"/><circle cx="140" cy="126" r="8" fill="#ff7aa2" opacity=".6"/><path d="M98 124Q110 144 122 124Z" fill="#c0392b"/>

function book(c1,c2){const u="k"+uid++;return `<svg viewBox="0 0 130 175" width="100%" height="100%"><defs><linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>

<g class="wave" style="transform-origin:26px 90px;animation-direction:alternate-reverse"><path d="M26 90Q6 72 10 42" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="10" cy="38" r="8" fill="#ffd6a8"/></g>
<path d="M50 130V156M80 130V156" stroke="#333" stroke-width="6"/><ellipse cx="44" cy="160" rx="14" ry="7" fill="#222"/><ellipse cx="86" cy="160" rx="14" ry="7" fill="#222"/>

<ellipse cx="55" cy="70" rx="10" ry="12" fill="#fff"/><ellipse cx="85" cy="70" rx="10" ry="12" fill="#fff"/><circle cx="57" cy="72" r="6" fill="#222"/><circle cx="83" cy="72" r="6" fill="#222"/><circle cx="59" cy="69" r="2.5" fill="#fff"/><circle cx="85" cy="69" r="2.5" fill="#fff"/><circle cx="44" cy="92" r="7" fill="#ff7aa2" opacity=".6"/><circle cx="96" cy="92" r="7" fill="#ff7aa2" opacity=".6"/><path d="M58 92Q70 108 82 92Z" fill="#7a1f0e"/></svg>`}
$("#bf1").innerHTML=butterfly(0);$("#bf2").innerHTML=butterfly(1);$("#bk1").innerHTML=book("#ffb347","#ff7a18");$("#bk2").innerHTML=book("#7be87b","#1fa83a");
/* ---------- flower baskets ---------- */
function flower(x,y,r,p,c,n){let o=`<g transform="translate(${x} ${y})">`;for(let i=0;i<n;i++)o+=`<ellipse cx="0" cy="${-r*.62}" rx="${r*(n>8?.17:.34)}" ry="${r*.5}" fill="${p}" stroke="rgba(0,0,0,.28)" stroke-width="1" transform="rotate(${i*360/n})"/>`;return o+`<circle r="${r*.34}" fill="${c}" stroke="rgba(0,0,0,.35)"/><circle cx="${-r*.1}" cy="${-r*.1}" r="${r*.1}" fill="rgba(255,255,255,.65)"/></g>`}
function binSVG(k){const c=CL[k],g="b"+k;const F=[[80,42,20],[50,54,17],[110,54,17],[30,80,15],[130,80,15],[66,80,17],[96,80,17],[80,66,19],[48,100,13],[114,100,13]];
const fl=F.map((f,i)=>flower(f[0],f[1],f[2],i%3==2?c.b:c.a,i%3==2?c.c2:c.c,i%3==2?6:c.n)).join("");
const lv=[[22,98,-50],[138,98,50],[58,106,-25],[102,106,25],[80,110,0]].map(l=>`<ellipse cx="${l[0]}" cy="${l[1]}" rx="9" ry="20" fill="#2fa84a" stroke="#1a6a2c" transform="rotate(${l[2]} ${l[0]} ${l[1]})"/>`).join("");
return `<svg viewBox="0 0 160 262"><defs><linearGradient id="${g}w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0c27d"/><stop offset=".55" stop-color="#cf9145"/><stop offset="1" stop-color="#9a6224"/></linearGradient><pattern id="${g}p" width="14" height="12" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="12" height="4.5" rx="2" fill="rgba(255,235,180,.28)" stroke="rgba(90,50,10,.45)"/><rect x="1" y="7" width="12" height="4.5" rx="2" fill="rgba(0,0,0,.08)" stroke="rgba(90,50,10,.45)"/></pattern></defs>
<ellipse cx="80" cy="256" rx="62" ry="5" fill="rgba(0,40,90,.3)"/>${lv}${fl}
<path d="M24 122C10 -30 150 -30 136 122" stroke="#8a5320" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M26 118C14 -22 146 -22 134 118" stroke="rgba(255,225,160,.7)" stroke-width="2.5" fill="none"/>
<path d="M80 24C56 2 48 32 80 28C112 32 104 2 80 24Z" fill="${c.rb}" stroke="#fff" stroke-width="2"/><circle cx="80" cy="26" r="5.5" fill="${c.rb}" stroke="#fff" stroke-width="2"/>
<path d="M16 124H144L130 252Q128 260 118 260H42Q32 260 30 252Z" fill="url(#${g}w)" stroke="#6b3d10" stroke-width="3"/><path d="M16 124H144L130 252Q128 260 118 260H42Q32 260 30 252Z" fill="url(#${g}p)"/><path d="M30 134L40 250" stroke="rgba(255,255,255,.35)" stroke-width="6" stroke-linecap="round"/>
<rect x="5" y="114" width="150" height="20" rx="10" fill="url(#${g}w)" stroke="#6b3d10" stroke-width="3"/><rect x="5" y="114" width="150" height="20" rx="10" fill="url(#${g}p)"/><rect x="12" y="117" width="136" height="4" rx="2" fill="rgba(255,255,255,.5)"/>
<rect x="12" y="136" width="136" height="34" rx="13" fill="${c.rb}" stroke="#fff" stroke-width="3"/><rect x="18" y="139" width="124" height="7" rx="3.5" fill="rgba(255,255,255,.4)"/></svg>`}
const binEl={};
ORDER.forEach(k=>{const d=document.createElement("div");d.className="bin";d.title=DEF[k];d.innerHTML=binSVG(k)+`<div class="lab">${BN[k]}</div><div class="slot"></div>`;$("#bins").appendChild(d);binEl[k]=d;
d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");
d.ondrop=e=>{e.preventDefault();d.classList.remove("over");const i=e.dataTransfer.getData("text");if(i!=="")drop(+i,k)};
d.onclick=()=>{if(sel>=0)drop(sel,k)}})
/* ---------- audio / fx ---------- */
let ac;function snd(f,d=.15,t="sine",v=.15,when=0){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+when;g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const good=()=>{snd(660,.15,"triangle",.2);snd(880,.2,"triangle",.2,.12)},bad=()=>snd(150,.3,"sawtooth",.12),win=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.3,"triangle",.2,i*.12));
function burst(el,em){const s=$("#stage").getBoundingClientRect(),r=el.getBoundingClientRect(),k=s.width/1280,cx=(r.left+r.width/2-s.left)/k,cy=(r.top+r.height/2-s.top)/k;
for(let i=0;i<22;i++){const p=document.createElement("div");p.className="spark";p.textContent=em[i%em.length];p.style.left=cx+"px";p.style.top=cy+"px";$("#stage").appendChild(p);const a=Math.random()*6.28,d=60+Math.random()*130;p.animate([{transform:"translate(0,0) scale(.4)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-60}px) rotate(${Math.random()*360}deg) scale(1.2)`,opacity:0}],{duration:900+Math.random()*600,easing:"ease-out"}).onfinish=()=>p.remove()}}
/* ---------- game ---------- */
let si=0,toks=[],placed=[],sel=-1,score=0,base=0,time=180,over=false,tEls=[],timer;
const say=t=>$("#msg").innerHTML=t,tg=()=>toks.map((t,i)=>t.k?i:-1).filter(i=>i>=0),EM=["🌸","🌼","🌷","✨"];
function load(){toks=S[si];placed=toks.map(t=>t.k?0:2);sel=-1;over=false;time=180;base=score;ORDER.forEach(k=>binEl[k].querySelector(".slot").innerHTML="");
$("#row").innerHTML="";tEls=toks.map((t,i)=>{const d=document.createElement("div");d.textContent=t.w;
if(!t.k){d.className="tile ctx";$("#row").appendChild(d);return d}
d.className="tile tgt";d.draggable=true;
d.ondragstart=e=>{if(placed[i]!==0||over){e.preventDefault();return}e.dataTransfer.setData("text",i);sel=i;paint()};
d.onclick=()=>{if(placed[i]!==0||over)return;sel=sel===i?-1:i;paint();if(sel>=0)say("اب «"+t.w+"» کی صحیح ٹوکری پر کلک کریں")};
$("#row").appendChild(d);return d});
$("#sn").textContent="Sentence "+(si+1)+" / "+S.length;$("#nx").classList.remove("pulse");say("سنہری کنارے والے لفظ (صفت) کو صحیح ٹوکری میں ڈالیں");prog();clock();paint()}
function paint(){tEls.forEach((d,i)=>{d.classList.toggle("done",placed[i]===1);d.classList.toggle("sel",sel===i&&placed[i]===0)})}
function prog(){const a=tg(),n=a.filter(i=>placed[i]===1).length;$("#pb").style.width=n/a.length*100+"%";$("#pt").textContent=n+" / "+a.length;$("#sc").textContent=score}
function clock(){const m=Math.floor(time/60),s=time%60;$("#tm").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");$("#tm").style.color=time<30?"#ff8a7a":"#fff"}
function drop(i,k){if(over||placed[i]!==0)return;const t=toks[i],b=binEl[k];
if(t.k===k){placed[i]=1;sel=-1;const m=document.createElement("div");m.className="mini";m.textContent=t.w;b.querySelector(".slot").appendChild(m);score+=20;good();b.classList.remove("bounce");void b.offsetWidth;b.classList.add("bounce");burst(b,EM);say("✔ شاباش! «"+t.w+"» "+BN[k]+" ہے");$("#star").animate([{transform:"scale(1.5) rotate(20deg)"},{transform:"scale(1)"}],400);
paint();prog();if(tg().every(j=>placed[j]===1))finish()}
else{score=Math.max(0,score-5);bad();tEls[i].classList.remove("shake");void tEls[i].offsetWidth;tEls[i].classList.add("shake");b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");say("✘ غلط! «"+t.w+"» "+BN[k]+" نہیں ہے۔ دوبارہ کوشش کریں");prog()}}
function finish(){over=true;const bonus=Math.floor(time/6);score+=bonus;prog();win();burst($("#panel"),["🎉","🌸","🌼","🌷","✨"]);say("🎉 زبردست! سب صفتیں درست ہیں۔ وقت کا بونس: +"+bonus);
if(si===S.length-1)setTimeout(final,1600);else $("#nx").classList.add("pulse")}
function final(){const mx=S.flat().filter(t=>t.k).length*20,r=score/mx,st=r>.85?3:r>.55?2:1;$("#card").innerHTML=`<div style="font-size:64px">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><h2>شاباش! کھیل مکمل</h2><p>آپ کا اسکور: <b style="font-family:Arial;color:#d9480f">${score}</b></p><button class="btn b3" id="again" style="position:static;margin:14px auto 0">↻ دوبارہ کھیلیں</button>`;$("#modal").style.display="flex";$("#again").onclick=()=>{$("#modal").style.display="none";si=0;score=0;load()};win()}
$("#nx").onclick=()=>{si=(si+1)%S.length;load()};
$("#rt").onclick=()=>{score=base;load()};
$("#hp").onclick=()=>{if(over)return;let i=sel>=0&&placed[sel]===0?sel:tg().find(j=>placed[j]===0);if(i===undefined)return;const k=toks[i].k,b=binEl[k];b.classList.remove("hint");void b.offsetWidth;b.classList.add("hint");setTimeout(()=>b.classList.remove("hint"),2600);say("💡 «"+toks[i].w+"» ← "+DEF[k])};
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
$("#fs").onclick=()=>{const a=document.documentElement;if(!fsEl())(a.requestFullscreen||a.webkitRequestFullscreen).call(a);else(document.exitFullscreen||document.webkitExitFullscreen).call(document)};
function fsUpd(){$("#fs").innerHTML=fsEl()?"⛶ فل سکرین بند کریں":"⛶ فل سکرین";fit()}
document.addEventListener("fullscreenchange",fsUpd);document.addEventListener("webkitfullscreenchange",fsUpd);
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$("#stage").style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();
timer=setInterval(()=>{if(over||$("#modal").style.display==="flex")return;time--;clock();if(time<=0){over=true;bad();say("⏰ وقت ختم ہو گیا! «اگلا جملہ» دبائیں");$("#nx").classList.add("pulse")}},1000);
load();
</script></body></html>
