*{box-sizing:border-box;margin:0}
html,body{height:100%}

#desc{font-size:14px;line-height:1.4}

.gl{color:#fff;font-weight:700;font-size:13px}

 c.fillStyle=dark?'rgba(255,255,255,.06)':'rgba(0,40,120,.07)';for(let x=20;x<W;x+=40)for(let y=20;y<H;y+=40)c.fillRect(x,y,2,2)}

 const mc=MEDS[medName][1],g=c.createLinearGradient(0,O[1],0,H);g.addColorStop(0,mc+'cc');g.addColorStop(1,mc+'55');c.fillStyle=g;c.fillRect(0,O[1],W,H);
 if(medName==='Water'){c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=3;c.beginPath();for(let x=0;x<=W;x+=8)c.lineTo(x,O[1]+Math.sin(x/28+t*2)*2.5);c.stroke()}
 else{c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=3;c.beginPath();c.moveTo(0,O[1]);c.lineTo(W,O[1]);c.stroke()}
 if(medName==='Diamond'){c.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<14;i++){const x=(i*173)%W,y=O[1]+30+(i*97)%(H*.4),r=3+Math.abs(Math.sin(t*3+i))*5;c.fillRect(x-r,y-1,2*r,2);c.fillRect(x-1,y-r,2,2*r)}}
 c.font='60px "Segoe UI Emoji","Apple Color Emoji",sans-serif';c.textAlign='center';c.fillStyle='#000';c.fillText({Water:'🐟',Glass:'🥛',Diamond:'💎',Oil:'🫒'}[medName],W*.1,H*.85);
 txt('Air  (n = 1.00)',14,O[1]-16,tx(),15,'left');txt(medName+'  (n = '+nm.toFixed(2)+')',14,O[1]+22,'#fff',15,'left');
 if(normal){c.strokeStyle=dark?'#e3e8ff':'#334';c.lineWidth=1.8;c.setLineDash([7,6]);c.beginPath();c.moveTo(O[0],O[1]-D*1.05);c.lineTo(O[0],O[1]+D*1.05);c.stroke();c.setLineDash([]);txt('Normal',O[0]+8,O[1]-D*1.07,tx(),13,'left')}

 list.push({hit:[0,h],after:isM?[-fl*sgn,-h*sgn]:[fl*sgn,-h*sgn]});
 list.push({hit:[0,0],after:isM?[-u,-h]:[u,-h]});
 if(Math.abs(y3*s)<half*1.5)list.push({hit:[0,y3],after:isM?[-1,0]:[1,0]});else list.push(null);
 const imgx=isM?-v:v,imgTip=[X(imgx),Y(m*h)],far_=Math.abs(v*s)>4000;
 list.forEach((r,i)=>{if(!r||!on[i])return;const H_=[X(r.hit[0]),Y(r.hit[1])];ray([tip,H_],cols[i],{pulse:1});ray([H_,far(H_,r.after)],cols[i],{pulse:1});if(v<0&&!far_)ray([H_,imgTip],cols[i],{dash:1,a:.8,w:2})});
 candle(X(-u),AY,s,1,1);
 if(!far_){candle(X(imgx),AY,s,m,v>0?.9:.5);if(labels){const hh=Math.min(Math.abs(m),6)*h*s;txt('Image ('+(v>0?'real':'virtual')+')',X(imgx),AY+(m<0?hh+20:20),'#7ee0ff',14)}}
 if(labels)txt('Object',X(-u),AY+22,'#ffe08a',14);
 return{u,v,m,fl,far_}}
/* ---------- info ---------- */
let lastInfo='';
function info(r){const d=M[mode],V=[];
 const add=(a,b,cc)=>V.push(`<div class="val" style="background:${cc}">${a}<b>${b}</b></div>`);
 if(mode==='plane'){add('Angle of incidence (i)',Math.round(ang)+'°','#e8590c');add('Angle of reflection (r)',Math.round(ang)+'°','#2b8a3e');add('Angle between the rays',Math.round(2*ang)+'°','#1c7ed6');add('Image','Virtual, same size','#7048e8')}
 else if(mode==='refr'){const cr=critical();add('Angle θ₁',Math.round(ang)+'°','#e8590c');add('Angle θ₂',r.tir?'No refraction':Math.round(deg(r.a2))+'°','#2b8a3e');add('n₁ → n₂',r.n1.toFixed(2)+' → '+r.n2.toFixed(2),'#1c7ed6');add('Critical angle',cr?cr.toFixed(1)+'°':'None','#7048e8');
  add('What happens',r.tir?'Total Internal Reflection':(r.n2>r.n1?'Bends towards normal':'Bends away from normal'),'#c2255c')}
 else{const real=r.v>0,fmt=x=>Math.abs(x)>200?'very far':x.toFixed(1)+' cm';add('Object distance u',r.u.toFixed(1)+' cm','#e8590c');add('Image distance v',r.far_?'very far':Math.abs(r.v).toFixed(1)+' cm','#2b8a3e');add('Focal length f',Math.abs(r.fl)+' cm'+(r.fl<0?' (−)':''),'#1c7ed6');add('Magnification m',r.far_?'very large':r.m.toFixed(2)+'×','#7048e8');
  add('Image type',r.far_?'At infinity':(real?'Real':'Virtual')+', '+(r.m<0?'inverted':'upright')+', '+(Math.abs(r.m)>1.02?'bigger':Math.abs(r.m)<.98?'smaller':'same size'),'#c2255c')}
 const html=V.join('');if(html!==lastInfo){$('vals').innerHTML=html;lastInfo=html}}
function setInfo(){const d=M[mode];$('mt').textContent=d.n;$('badge').textContent=d.n;$('law').textContent=d.law;$('desc').textContent=d.d;lastInfo='';
 $('objs').innerHTML=d.o.map(o=>`<button class="obj" data-t="${o[1]}"><i>${o[0]}</i>${o[1]}</button>`).join('');
 document.querySelectorAll('.obj').forEach(b=>b.onclick=()=>say(b.dataset.t));$('legend').style.display=TY[mode]?'flex':'none'}
function say(s){try{speechSynthesis.cancel();const q=new SpeechSynthesisUtterance(s);q.lang='en-US';q.rate=.9;speechSynthesis.speak(q)}catch(e){}}
/* ---------- loop ---------- */
function frame(now){t=now/1000;const dt=Math.min(.05,t-last);last=t;
 if(anim){if(TY[mode]){u+=sweep*9*dt;const hi=TY[mode].k==='mirror'?50:46;if(u>hi){u=hi;sweep=-1}if(u<6){u=6;sweep=1}}else{ang+=sweep*18*dt;if(ang>80){ang=80;sweep=-1}if(ang<2){ang=2;sweep=1}}}
 c.clearRect(0,0,W,H);bg();let r;if(mode==='plane')drawPlane();else if(mode==='refr')r=drawRefr();else r=drawOptics();
 if(msgT>t){pill(W/2,H*.9-60,msg,'#e03131')}
 info(r);requestAnimationFrame(frame)}
/* ---------- UI ---------- */
function mk(parent,label,color,fn,cls){const b=document.createElement('button');b.className='b'+(cls?' '+cls:'');b.style.setProperty('--c',color);b.innerHTML=label;b.onclick=()=>fn(b);$(parent).appendChild(b);return b}
function tog(parent,label,color,get,set,on){const b=mk(parent,label,color,b=>{set(!get());b.classList.toggle('on',get())});b.classList.toggle('on',get());return b}
const expB={};
function setMode(m){mode=m;anim=false;sweep=1;document.querySelectorAll('.anim').forEach(b=>b.classList.remove('on'));
 if(TY[m]){fm=15;u=30}else if(m==='plane')ang=40;else{ang=45;dirOut=false}
 Object.entries(expB).forEach(([k,b])=>b.classList.toggle('sel',k===m));
 const tk=['all',m];if(TY[m])tk.push('opt');if(m==='plane'||m==='refr')tk.push('ang');
 document.querySelectorAll('[data-m]').forEach(e=>{e.style.display=e.dataset.m.split(',').some(x=>tk.includes(x))?'flex':'none'});
 document.querySelectorAll('.only').forEach(b=>{b.style.display=b.dataset.o.split(',').includes(m)?'':'none'});setInfo()}
[['plane','🪞 Plane Mirror','#e8590c'],['concave','🥄 Concave Mirror','#d6336c'],['convex','🚗 Convex Mirror','#7048e8'],['convexL','🔍 Convex Lens','#1c7ed6'],['concaveL','👓 Concave Lens','#0ca678'],['refr','🥤 Refraction','#f59f00']].forEach(([k,l,cl])=>expB[k]=mk('gExp',l,cl,()=>setMode(k)));
const fsb=mk('gExp','⛶ Full Screen','#c2255c',()=>{const a=$('app');document.fullscreenElement?document.exitFullscreen():(a.requestFullscreen||a.webkitRequestFullscreen).call(a)});
document.addEventListener('fullscreenchange',()=>{fsb.innerHTML=document.fullscreenElement?'🗗 Exit Full Screen':'⛶ Full Screen';setTimeout(resize,120)});
/* angle buttons */
const setA=v=>ang=Math.max(0,Math.min(85,v));
[['−10°',-10,'#e03131'],['−5°',-5,'#f76707'],['−1°',-1,'#f59f00'],['+1°',1,'#37b24d'],['+5°',5,'#1c7ed6'],['+10°',10,'#7048e8']].forEach(([l,d,cl])=>mk('gAng',l,cl,()=>setA(ang+d)));
mk('gAng','0° Straight','#495057',()=>ang=0);mk('gAng','45°','#0ca678',()=>ang=45);
['#ff3b3b','#ff922b','#51cf66','#339af0','#be4bdb','#f8f9fa'].forEach(cl=>mk('gCol','',cl,()=>col=cl,'sw'));
/* materials */
Object.entries(MEDS).forEach(([k,[n,cl]])=>mk('gMed',k+' ('+n+')',{Water:'#1c7ed6',Glass:'#0ca678',Diamond:'#7048e8',Oil:'#e67700'}[k],()=>{medName=k;nm=n}));
mk('gMed','⬇ Air → Material','#37b24d',()=>dirOut=false);mk('gMed','⬆ Material → Air','#d6336c',()=>dirOut=true);
mk('gMed','🎯 Critical Angle','#e8590c',()=>{const cr=critical();if(cr)ang=cr;else{msg='No critical angle: light must start in the denser material.';msgT=t+2.6}});
mk('gMed','🔁 Total Reflection','#c2255c',()=>{dirOut=true;const cr=critical();ang=Math.min(80,cr+8)});
/* optics */
const hi=()=>TY[mode].k==='mirror'?50:46,setU=v=>u=Math.max(5,Math.min(hi(),v));
mk('gObj','◀ Closer','#e8590c',()=>setU(u-2));mk('gObj','Farther ▶','#1c7ed6',()=>setU(u+2));
mk('gObj','At F','#d6336c',()=>setU(fm));mk('gObj','At 2F','#7048e8',()=>setU(2*fm));
mk('gObj','Inside F','#f59f00',()=>setU(fm*.55));mk('gObj','Beyond 2F','#0ca678',()=>setU(Math.min(hi(),2.6*fm)));
mk('gObj','Focal Length +','#37b24d',()=>fm=Math.min(28,fm+2));mk('gObj','Focal Length −','#e03131',()=>fm=Math.max(6,fm-2));
tog('gRay','Ray 1 Parallel','#e03131',()=>r1,v=>r1=v);tog('gRay','Ray 2 Centre','#2f9e44',()=>r2,v=>r2=v);tog('gRay','Ray 3 Focus','#e67700',()=>r3,v=>r3=v);
/* tools */
const an=tog('gTool','▶ Animate','#f59f00',()=>anim,v=>anim=v);an.classList.add('anim');
tog('gTool','🏷️ Labels','#0ca678',()=>labels,v=>labels=v);
{const b=tog('gTool','📏 Normal Line','#4263eb',()=>normal,v=>normal=v);b.dataset.m='ang'}
{const b=tog('gTool','👻 Virtual Image','#ae3ec9',()=>virt,v=>virt=v);b.dataset.m='plane'}
{const b=tog('gTool','◑ Partial Reflection','#12b886',()=>partial,v=>partial=v);b.dataset.m='refr'}
tog('gTool','🌙 Dark Room','#343a40',()=>dark,v=>dark=v);
mk('gTool','🔊 Explain','#d6336c',()=>say(M[mode].n+'. '+M[mode].law.replace(/[₁₂θ]/g,' ')+'. '+M[mode].d));
mk('gTool','↺ Reset','#495057',()=>{setMode(mode);r1=r2=r3=labels=normal=virt=partial=true;document.querySelectorAll('#gRay .b,#gTool .b').forEach(b=>{if(/Labels|Normal|Virtual|Partial|Ray|Dark/.test(b.textContent))b.classList.add('on')});dark=true;col='#ff3b3b'});
document.querySelectorAll('#gTool .b,#gRay .b').forEach(b=>{if(/Dark|Ray|Labels|Normal|Virtual|Partial/.test(b.textContent))b.classList.add('on')});
/* per-button visibility inside shared groups */
document.querySelectorAll('#gTool .b').forEach(b=>{if(b.dataset.m){b.classList.add('only');b.dataset.o=b.dataset.m==='ang'?'plane,refr':b.dataset.m;b.removeAttribute('data-m')}});
addEventListener('resize',resize);
setMode('plane');resize();requestAnimationFrame(frame);
</script>
