/* navigation */
let ci=0,autoT=null,cur="learn",qt=0;
function go(v){qt++;stopAuto();cur=v;document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==v));document.querySelectorAll("#tabs .bt").forEach(b=>b.classList.toggle("on",b.dataset.v==v));$("#wr").style.display="none";
if(v=="learn")render(0);if(v=="quiz")startQuiz();if(v=="spell")startSpell()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-v]");if(t)go(t.dataset.v)});
$("#ch").onclick=()=>go("chart");
/* learn */
const strip=$("#strip");for(let i=0;i<26;i++){const b=document.createElement("button");b.className="bt";b.setAttribute("style",cv(i));b.textContent=Lt(i);b.onclick=()=>{ci=i;render(1)};strip.appendChild(b)}
function render(sp){const i=ci,w=WD[i],ch=[...w],n=ch.filter(c=>/[A-Za-z]/.test(c)).length,ts=Math.max(30,Math.min(54,Math.floor(380/n)-6));
$("#cl").innerHTML=pic(i,372,330,"fl");$("#cl").style.background=`radial-gradient(circle at 50% 45%,#fff 25%,${sh(LC[i],.88)})`;
$("#cr").innerHTML=`<div class="bl" style="color:${LC[i]};text-shadow:0 6px 0 ${sh(LC[i],-.4)},0 14px 8px rgba(0,0,0,.25)" data-l>${Lt(i)}<small>${Lt(i).toLowerCase()}</small></div><div class="rr"><div class="fr">${Lt(i)} is for</div><div class="wd" style="font-size:${w.length>8?52:68}px;color:${LC[i]}">${w}</div><div class="sp">${ch.map((c,k)=>c==" "?'<span style="width:18px"></span>':`<b data-c="${c}" style="${cv((i+k*5)%26)};width:${ts}px;height:${ts+10}px;font-size:${ts*.62}px">${c}</b>`).join("")}</div></div>`;
["#cl","#cr"].forEach(q=>{const e=$(q);e.classList.remove("flip");void e.offsetWidth;e.classList.add("flip")});
[...strip.children].forEach((b,k)=>b.classList.toggle("on",k==i));if(sp)sayItem()}
function sayItem(){say(`${Lt(ci)}. ${Lt(ci)} for ${WD[ci]}`)}
const step=d=>{ci=(ci+d+26)%26;render(1)};
$("#pv").onclick=()=>step(-1);$("#nx").onclick=()=>step(1);$("#ls").onclick=sayItem;$("#rd").onclick=()=>{ci=Math.random()*26|0;render(1)};
function stopAuto(){clearInterval(autoT);autoT=null;$("#au").innerHTML="🔁 Auto Play"}
$("#au").onclick=()=>{if(autoT)return stopAuto();$("#au").innerHTML="⏸ Stop Auto";autoT=setInterval(()=>step(1),3600);step(1)};
document.addEventListener("click",e=>{const l=e.target.closest("[data-l]");if(l)sayItem();const c=e.target.closest("[data-c]");if(c){c.classList.remove("pp");void c.offsetWidth;c.classList.add("pp");say(c.dataset.c);tone(420+Math.random()*300,.12)}});
document.addEventListener("keydown",e=>{if(cur!="learn")return;if(e.key=="ArrowRight")step(1);else if(e.key=="ArrowLeft")step(-1);else if(e.code=="Space"){e.preventDefault();sayItem()}else if(/^[a-z]$/i.test(e.key)&&!e.ctrlKey&&!e.metaKey){ci=e.key.toUpperCase().charCodeAt(0)-65;render(1)}});
$("#snd").onclick=function(){soundOn=!soundOn;this.innerHTML=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(!soundOn&&window.speechSynthesis)speechSynthesis.cancel()};
/* chart */
for(let i=0;i<26;i++){const b=document.createElement("button");b.className="gc";b.setAttribute("style",cv(i));b.innerHTML=pic(i,104,134)+`<span class="cp" style="color:${LC[i]}">${Lt(i)} ${WD[i]}</span>`;b.onclick=()=>{ci=i;go("learn");render(1)};$("#grid").appendChild(b)}
/* quiz */
let qs=[],qn=0,sc=0;
function startQuiz(){qs=shuf([...Array(26).keys()]).slice(0,10).map((i,k)=>({i,t:k%2}));qn=0;sc=0;showQ()}
function showQ(){if(cur!="quiz")return;if(qn>=qs.length)return result("#qa","#qc",sc,10,startQuiz);const q=qs[qn],tk=qt,i=q.i,c=$("#qc");
$("#qi").innerHTML=`Question ${qn+1} / ${qs.length} &nbsp;•&nbsp; ⭐ Score: ${sc}`;$("#qp").style.width=qn/qs.length*100+"%";c.innerHTML="";
const sp=q.t?`Find the picture that starts with ${Lt(i)}`:`Which letter does this picture start with?`;
$("#qa").innerHTML=(q.t?`<div class="qt" style="margin-top:6px">Find the picture that starts with</div><div style="font-size:92px;line-height:1.05;font-weight:700;color:${LC[i]};text-shadow:0 6px 0 ${sh(LC[i],-.4)}">${Lt(i)}</div>`:`${pic(i,190,235,true)}<div class="qt">Which letter does this picture start with?</div>`)+`<button class="bt g" id="hq" style="height:38px;font-size:16px;padding:0 14px;margin-top:2px">🔊 Hear question</button>`;
$("#hq").onclick=()=>say(sp);c.className="qc"+(q.t?" pics":"");
opts(i).forEach(j=>{const b=document.createElement("button");const cl=["r","b","g","o"][c.children.length];if(q.t){b.className="pc "+cl;b.innerHTML=pic(j,180,212,true)}else{b.className="bt "+cl;b.textContent=Lt(j)}
b.onclick=()=>{if(c.dataset.l)return;c.dataset.l=1;const ok=j===i;if(ok){b.classList.add("ok");sc++;good();burst()}else{b.classList.add("no");bad();[...c.children][opts_i(c,i)].classList.add("ok")}setTimeout(()=>{if(tk!==qt)return;delete c.dataset.l;qn++;showQ()},1400)};b.dataset.j=j;c.appendChild(b)});setTimeout(()=>say(sp),300)}
const opts_i=(c,i)=>[...c.children].findIndex(b=>+b.dataset.j===i);
function result(a,c,s,n,again){const st=s>=.8*n?3:s>=.5*n?2:1;$(a).innerHTML=`<div class="res"><div class="st">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><h2>${st==3?"Super Star!":st==2?"Well Done!":"Good Try!"}</h2><p>You got ${s} out of ${n}</p><button class="bt g" id="ra">🔁 Play Again</button><button class="bt b" data-v="learn">📘 Back to Learn</button><button class="bt o" data-v="chart">🧩 Full Chart</button></div>`;$(c).innerHTML="";win();burst();say("Well done!");$("#ra").onclick=again}
/* spell */
let sw=[],sn=0,ss=0,sI=0,sk=0,sL=[];
function startSpell(){sw=shuf([...Array(26).keys()].filter(i=>/^[A-Za-z]+$/.test(WD[i]))).slice(0,8);sn=0;ss=0;nextSpell()}
function nextSpell(){if(cur!="spell")return;if(sn>=sw.length){$("#sv").innerHTML="";$("#sl").innerHTML="";$("#hn").style.display=$("#hs").style.display=$("#sk").style.display="none";$("#sq").innerHTML="";$("#tl").innerHTML=`<div class="res" style="padding:0"></div>`;result("#tl","#sl",ss,sw.length,startSpell);return}
$("#hn").style.display=$("#hs").style.display=$("#sk").style.display="";sI=sw[sn];sk=0;const w=WD[sI].toUpperCase();$("#si").innerHTML=`Word ${sn+1} / ${sw.length} &nbsp;•&nbsp; ⭐ ${ss}`;$("#sp").style.width=sn/sw.length*100+"%";$("#sq").textContent="Spell the word!";
$("#sv").innerHTML=pic(sI,290,440,true);sL=shuf([...w].map((c,k)=>({c,k})));
$("#sl").innerHTML=[...w].map(()=>`<div class="slot"></div>`).join("");
$("#tl").innerHTML="";sL.forEach(o=>{const b=document.createElement("button");b.className="bt";b.setAttribute("style",cv((o.c.charCodeAt(0)-65+o.k*3)%26));b.textContent=o.c;b.dataset.k=o.k;b.onclick=()=>pick(b,o);$("#tl").appendChild(b)});setTimeout(()=>say("Spell "+WD[sI]),250)}
function pick(b,o){const w=WD[sI].toUpperCase();if(b.disabled)return;if(o.c===w[sk]){const s=$("#sl").children[sk];s.textContent=o.c;s.classList.add("f");s.setAttribute("style",cv((o.c.charCodeAt(0)-65)%26));b.disabled=true;b.style.visibility="hidden";sk++;tone(500+sk*70,.15);say(o.c);
if(sk==w.length){ss++;good();burst();$("#sv").innerHTML=pic(sI,290,440,false);$("#sq").textContent=WD[sI]+"! 🎉";setTimeout(()=>say(WD[sI]),300);const t=qt;setTimeout(()=>{if(t!==qt)return;sn++;nextSpell()},2300)}}
else{b.classList.remove("no");void b.offsetWidth;b.classList.add("no");bad()}}
$("#hn").onclick=()=>{const w=WD[sI].toUpperCase();const t=[...$("#tl").children].find(b=>!b.disabled&&b.textContent===w[sk]);if(t){t.classList.remove("h");void t.offsetWidth;t.classList.add("h")}};
$("#hs").onclick=()=>say(WD[sI]);$("#sk").onclick=()=>{sn++;nextSpell()};
/* writing pad */
const wc=$("#wc"),wx=wc.getContext("2d");let pen="#ff4d6d",dr=false;
function ghost(){wx.clearRect(0,0,780,420);wx.fillStyle="rgba(120,140,180,.28)";wx.textAlign="center";wx.textBaseline="middle";wx.font="300px Fredoka,'Trebuchet MS',sans-serif";wx.fillText(Lt(ci)+" "+Lt(ci).toLowerCase(),390,215)}
$("#wt").onclick=()=>{$("#wr").style.display="flex";ghost()};$("#wcx").onclick=()=>{$("#wr").style.display="none";good()};$("#wcl").onclick=ghost;
document.querySelectorAll(".pen").forEach(b=>b.onclick=()=>pen=b.dataset.c);
const pos=e=>{const r=wc.getBoundingClientRect();return[(e.clientX-r.left)*780/r.width,(e.clientY-r.top)*420/r.height]};
wc.onpointerdown=e=>{dr=true;const p=pos(e);wx.strokeStyle=pen;wx.lineWidth=14;wx.lineCap=wx.lineJoin="round";wx.beginPath();wx.moveTo(p[0],p[1]);wx.lineTo(p[0]+.1,p[1]);wx.stroke();wc.setPointerCapture(e.pointerId)};
wc.onpointermove=e=>{if(!dr)return;const p=pos(e);wx.strokeStyle=pen;wx.lineTo(p[0],p[1]);wx.stroke()};wc.onpointerup=()=>dr=false;
/* fullscreen + fit */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
$("#fs").onclick=()=>{const a=document.documentElement;if(!fsEl())(a.requestFullscreen||a.webkitRequestFullscreen).call(a);else(document.exitFullscreen||document.webkitExitFullscreen).call(document)};
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$("#stage").style.transform=`translate(-50%,-50%) scale(${s})`}
function fsUpd(){$("#fs").innerHTML=fsEl()?"⛶ Exit Full Screen":"⛶ Full Screen";fit()}
document.addEventListener("fullscreenchange",fsUpd);document.addEventListener("webkitfullscreenchange",fsUpd);addEventListener("resize",fit);fit();
go("learn");
</script></body></html>
