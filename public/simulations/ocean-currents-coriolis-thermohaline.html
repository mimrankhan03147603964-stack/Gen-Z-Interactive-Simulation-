<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Ocean Currents & Coriolis Dynamics Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020c1b; font-family: system-ui, -apple-system, sans-serif; color: #f0f9ff; }
    .sim { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
    .stage { flex: 1 1 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, #032147 0%, #020d1c 80%, #01060e 100%); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    .ctl {
      flex-shrink: 0;
      width: 100%;
      background: rgba(2, 12, 27, 0.96);
      border-top: 1.5px solid rgba(56, 189, 248, 0.45);
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(16px);
      z-index: 20;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .row span.lbl { font-size: 11px; font-weight: 800; color: #7dd3fc; text-transform: uppercase; letter-spacing: 0.05em; min-width: 90px; }
    .btn {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: #fff;
    }
    .btn:hover { transform: translateY(-1.5px); filter: brightness(1.15); }
    .btn:active { transform: translateY(1px); }
    .b-mode { background: #0c4a6e; border-color: #0284c7; }
    .b-mode.active { background: #0284c7; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.6); }
    .b-warm { background: #991b1b; border-color: #ef4444; }
    .b-cold { background: #1e3a8a; border-color: #3b82f6; }
    .b-reset { background: #374151; border-color: #6b7280; }
    .b-fs { background: linear-gradient(135deg, #0284c7, #06b6d4); border-color: #38bdf8; margin-left: auto; }
    .slider-box { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #bae6fd; }
    input[type=range] { accent-color: #38bdf8; width: 110px; cursor: pointer; }
    .hud { position: absolute; top: 12px; left: 14px; background: rgba(3, 20, 48, 0.88); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 10px 14px; font-size: 11px; line-height: 1.5; pointer-events: none; backdrop-filter: blur(8px); }
    .hud b { color: #38bdf8; }
  </style>

<!-- ================= FULLSCREEN ENGINE STYLES ================= -->
<style id="genz-simulation-fullscreen-styles">
  :fullscreen, ::backdrop {
    background-color: #0b0f19 !important;
  }
  .simulation-wrapper:fullscreen {
    width: 100vw !important;
    height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    background-color: #0b0f19 !important;
    position: fixed !important;
    inset: 0 !important;
    z-index: 999999 !important;
    margin: 0 !important;
    padding: 8px 16px !important;
    box-sizing: border-box !important;
  }
  .simulation-wrapper:fullscreen canvas,
  .simulation-wrapper:fullscreen iframe,
  .simulation-wrapper:fullscreen svg {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    flex: 1 1 0 !important;
    min-height: 0 !important;
    margin: 0 auto !important;
  }
  /* Preserve Overlay Controls and Interactive State with high z-index (50+) */
  .simulation-wrapper:fullscreen .ctl,
  .simulation-wrapper:fullscreen .controls,
  .simulation-wrapper:fullscreen .sim-controls,
  .simulation-wrapper:fullscreen .sim-readout,
  .simulation-wrapper:fullscreen .preset-chips,
  .simulation-wrapper:fullscreen .row,
  .simulation-wrapper:fullscreen .fs-bar,
  .simulation-wrapper:fullscreen .floating-controls,
  .simulation-wrapper:fullscreen .btn,
  .simulation-wrapper:fullscreen .fs-topbar,
  .simulation-wrapper:fullscreen .fullscreen-overlay-controls,
  .simulation-wrapper:fullscreen .topic-header,
  .simulation-wrapper:fullscreen .control-panel,
  .simulation-wrapper:fullscreen .dashboard {
    position: relative !important;
    z-index: 50 !important;
    flex-shrink: 0 !important;
    max-width: 100% !important;
  }
  /* Neutralize legacy empty overlay divs that blank out the page */
  .fs-overlay {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
</style>

</head>
<body>
  <div class="sim" id="simContainer">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">
        <b>Global Ocean Currents & Coriolis Dynamics</b><br/>
        Coriolis Effect: <span style="color:#fde047; font-weight:900;">Deflects Right in North, Left in South</span><br/>
        Active Flow: <span id="hudFlow" style="color:#38bdf8; font-weight:900;">Surface Wind Gyres & Gulf Stream</span><br/>
        Active Drifter Buoys: <span id="hudDrifters" style="color:#67e8f9; font-weight:900;">120</span>
      </div>
    </div>
    <div class="ctl">
      <div class="row">
        <span class="lbl">Oceanic Regimes</span>
        <button class="btn b-mode active" id="btnGyres" onclick="setRegime('gyres')">🌀 Wind-Driven Oceanic Gyres</button>
        <button class="btn b-mode" id="btnThermo" onclick="setRegime('thermo')">🌍 Great Ocean Conveyor Belt (Thermohaline)</button>
        <button class="btn b-mode" id="btnCoriolis" onclick="setRegime('coriolis')">🔄 Coriolis Vector Deflection</button>
        <button class="btn b-reset" onclick="resetSim()">⟳ Reset Drifters</button>
        <button class="btn b-fs" id="bFs" onclick="toggleFs()">⛶ Full Screen</button>
      </div>
      <div class="row">
        <span class="lbl">Parameters</span>
        <div class="slider-box">
          Earth Spin Rate:
          <input type="range" id="rngSpin" min="0" max="3" step="0.2" value="1.0" oninput="updateVars()" />
          <span id="valSpin">1.0x (Normal)</span>
        </div>
        <div class="slider-box">
          Drifter Count:
          <input type="range" id="rngCount" min="40" max="250" step="10" value="120" oninput="updateVars()" />
          <span id="valCount">120 Buoys</span>
        </div>
        <div class="slider-box">
          Sea Surface Temp:
          <button class="btn b-warm" onclick="filterTemp('warm')">🔥 Warm Currents (Red)</button>
          <button class="btn b-cold" onclick="filterTemp('cold')">❄️ Deep Cold (Blue)</button>
          <button class="btn b-mode" onclick="filterTemp('all')">🌐 Both</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    let width, height;
    let regime = 'gyres'; // 'gyres', 'thermo', 'coriolis'
    let spinSpeed = 1.0;
    let drifterCount = 120;
    let tempFilter = 'all';
    let t = 0;

    const drifters = [];

    function resize() {
      const rect = cv.parentElement.getBoundingClientRect();
      width = cv.width = rect.width * (window.devicePixelRatio || 1);
      height = cv.height = rect.height * (window.devicePixelRatio || 1);
      initDrifters();
    }
    window.addEventListener('resize', resize);

    function initDrifters() {
      drifters.length = 0;
      for (let i = 0; i < drifterCount; i++) {
        drifters.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.8) + height * 0.1,
          temp: Math.random() > 0.5 ? 'warm' : 'cold',
          age: Math.random() * 100
        });
      }
    }

    function setRegime(r) {
      regime = r;
      document.getElementById('btnGyres').classList.toggle('active', r === 'gyres');
      document.getElementById('btnThermo').classList.toggle('active', r === 'thermo');
      document.getElementById('btnCoriolis').classList.toggle('active', r === 'coriolis');
      document.getElementById('hudFlow').textContent = (r === 'gyres' ? 'Surface Wind Gyres & Gulf Stream' : (r === 'thermo' ? 'Thermohaline Deep Cold vs Warm Surface' : 'Coriolis Deflection Forces'));
      initDrifters();
    }

    function filterTemp(f) {
      tempFilter = f;
    }

    function updateVars() {
      spinSpeed = parseFloat(document.getElementById('rngSpin').value);
      drifterCount = parseInt(document.getElementById('rngCount').value);
      document.getElementById('valSpin').textContent = spinSpeed.toFixed(1) + 'x';
      document.getElementById('valCount').textContent = drifterCount + ' Buoys';
      document.getElementById('hudDrifters').textContent = drifterCount;
      if (drifters.length !== drifterCount) initDrifters();
    }

    function resetSim() {
      document.getElementById('rngSpin').value = 1.0;
      document.getElementById('rngCount').value = 120;
      setRegime('gyres');
      filterTemp('all');
      updateVars();
      initDrifters();
    }

    // Mathematical vector flow field
    function getFlowVelocity(x, y) {
      const ny = (y / height) * 2 - 1; // -1 (North) to +1 (South), 0 is Equator
      const nx = (x / width) * 2 - 1;
      let vx = 0, vy = 0;

      if (regime === 'gyres' || regime === 'thermo') {
        // Trade winds near equator blow West (vx < 0)
        // Westerlies in mid-latitudes blow East (vx > 0)
        if (Math.abs(ny) < 0.3) {
          vx = -2.2 * spinSpeed;
        } else if (Math.abs(ny) < 0.7) {
          vx = 2.0 * spinSpeed;
        } else {
          vx = -1.2 * spinSpeed;
        }

        // Clockwise in Northern Hemisphere (ny < 0)
        // Counter-clockwise in Southern Hemisphere (ny > 0)
        if (ny < 0) {
          // North Gyre
          const gX = width * 0.45, gY = height * 0.30;
          const dx = x - gX, dy = y - gY;
          vx += (dy / height) * 3.5 * spinSpeed;
          vy += (-dx / width) * 3.5 * spinSpeed;
        } else {
          // South Gyre
          const gX = width * 0.50, gY = height * 0.70;
          const dx = x - gX, dy = y - gY;
          vx += (-dy / height) * 3.5 * spinSpeed;
          vy += (dx / width) * 3.5 * spinSpeed;
        }
      } else {
        // Pure Coriolis deflection demo
        // Initial longitudinal flow deflected right in North, left in South
        const force = ny * spinSpeed * 2.5;
        vx = -force;
        vy = (ny < 0 ? 1.5 : -1.5) * spinSpeed;
      }

      return { vx, vy };
    }

    function loop() {
      t += 0.03;
      ctx.clearRect(0, 0, width, height);

      // Draw Equator & Latitude Guideline Grid
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
      ctx.lineWidth = 1;
      const eqY = height * 0.5;
      ctx.beginPath();
      ctx.moveTo(0, eqY);
      ctx.lineTo(width, eqY);
      ctx.stroke();
      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 11px system-ui';
      ctx.fillText('0° EQUATOR (Trade Winds ←)', 14, eqY - 6);

      ctx.strokeStyle = 'rgba(239, 68, 68, 0.2)';
      const tropicNY = height * 0.3;
      ctx.beginPath(); ctx.moveTo(0, tropicNY); ctx.lineTo(width, tropicNY); ctx.stroke();
      ctx.fillStyle = '#f87171';
      ctx.fillText('30° N Tropic of Cancer (Westerlies →)', 14, tropicNY - 6);

      ctx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
      const tropicSY = height * 0.7;
      ctx.beginPath(); ctx.moveTo(0, tropicSY); ctx.lineTo(width, tropicSY); ctx.stroke();
      ctx.fillStyle = '#60a5fa';
      ctx.fillText('30° S Tropic of Capricorn (Westerlies →)', 14, tropicSY + 16);

      // Stylized Continents Outlines
      ctx.fillStyle = 'rgba(30, 41, 59, 0.45)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.8;

      // North America
      ctx.beginPath();
      ctx.moveTo(width * 0.15, height * 0.15);
      ctx.lineTo(width * 0.32, height * 0.18);
      ctx.lineTo(width * 0.28, height * 0.45);
      ctx.lineTo(width * 0.22, height * 0.48);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // South America
      ctx.beginPath();
      ctx.moveTo(width * 0.24, height * 0.52);
      ctx.lineTo(width * 0.34, height * 0.62);
      ctx.lineTo(width * 0.30, height * 0.88);
      ctx.lineTo(width * 0.22, height * 0.72);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Eurasia / Africa
      ctx.beginPath();
      ctx.moveTo(width * 0.55, height * 0.12);
      ctx.lineTo(width * 0.85, height * 0.18);
      ctx.lineTo(width * 0.78, height * 0.50);
      ctx.lineTo(width * 0.58, height * 0.48);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(width * 0.58, height * 0.52);
      ctx.lineTo(width * 0.72, height * 0.58);
      ctx.lineTo(width * 0.68, height * 0.85);
      ctx.lineTo(width * 0.56, height * 0.75);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Draw Major Current Streams (e.g. Gulf Stream)
      ctx.lineWidth = 4;
      // Gulf Stream (Warm Red)
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
      ctx.beginPath();
      ctx.moveTo(width * 0.26, height * 0.45);
      ctx.quadraticCurveTo(width * 0.35, height * 0.32, width * 0.55, height * 0.22);
      ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 11px system-ui';
      ctx.fillText('Gulf Stream (Warm)', width * 0.38, height * 0.28);

      // Canary Cold Current (Blue)
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
      ctx.beginPath();
      ctx.moveTo(width * 0.55, height * 0.24);
      ctx.quadraticCurveTo(width * 0.52, height * 0.40, width * 0.42, height * 0.48);
      ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('Canary Current (Cold)', width * 0.46, height * 0.38);

      // Update & Render Drifter Particles
      drifters.forEach(d => {
        const flow = getFlowVelocity(d.x, d.y);
        d.x += flow.vx;
        d.y += flow.vy;

        // Wrap around world edges
        if (d.x < 0) d.x = width;
        if (d.x > width) d.x = 0;
        if (d.y < height * 0.05) d.y = height * 0.05;
        if (d.y > height * 0.95) d.y = height * 0.95;

        // Determine particle color
        const isWarm = d.y < height * 0.5 ? d.y > height * 0.25 : d.y < height * 0.75;
        if (tempFilter === 'warm' && !isWarm) return;
        if (tempFilter === 'cold' && isWarm) return;

        ctx.fillStyle = isWarm ? '#ef4444' : '#0284c7';
        ctx.beginPath();
        ctx.arc(d.x, d.y, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Direction vector trail
        ctx.strokeStyle = isWarm ? 'rgba(248, 113, 113, 0.4)' : 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - flow.vx * 3, d.y - flow.vy * 3);
        ctx.stroke();
      });

      requestAnimationFrame(loop);
    }

    function toggleFs() {
      const container = document.getElementById('simContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '✕ Exit full screen';
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '⛶ Full Screen';
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.getElementById('bFs').innerHTML = isFs ? '✕ Exit full screen' : '⛶ Full Screen';
      setTimeout(resize, 100);
    });

    resize();
    updateVars();
    requestAnimationFrame(loop);
  </script>

<!-- ================= FULLSCREEN ENGINE CONTROLLER ================= -->
<script id="genz-simulation-fullscreen-engine">
(function() {
  function findSimulationRootContainer(el) {
    if (el && el.nodeType === 1) {
      var found = el.closest(".simulation-wrapper, .sim, .sim-box, .sim-stage, .simulation, #sim, #simContainer, .card, .main-stage, .stage, .container");
      if (found && found !== document.body && found !== document.documentElement) {
        found.classList.add("simulation-wrapper");
        return found;
      }
    }
    var candidate = document.querySelector(".simulation-wrapper") ||
                    document.getElementById("simContainer") ||
                    document.getElementById("sim") ||
                    document.querySelector(".sim-stage") ||
                    document.querySelector(".sim-box") ||
                    document.querySelector(".simulation") ||
                    document.querySelector(".sim") ||
                    document.querySelector(".card") ||
                    document.querySelector(".main-stage") ||
                    document.querySelector(".container") ||
                    document.body;
    if (candidate && candidate !== document.documentElement) {
      candidate.classList.add("simulation-wrapper");
      return candidate;
    }
    document.body.classList.add("simulation-wrapper");
    return document.body;
  }

  function toggleSimulationFullscreen(triggerEl) {
    try {
      if (!document.fullscreenElement) {
        var container = findSimulationRootContainer(triggerEl);
        if (container && container.requestFullscreen) {
          container.requestFullscreen().catch(function(err) {
            console.error("Fullscreen request failed:", err);
            if (document.body && document.body.requestFullscreen) {
              document.body.classList.add("simulation-wrapper");
              document.body.requestFullscreen().catch(function(e) { console.error(e); });
            }
          });
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function(err) {
            console.error("Exit fullscreen error:", err);
          });
        }
      }
    } catch (err) {
      console.error("Fullscreen toggle error:", err);
    }
  }

  // Override/intercept all simulation fullscreen function names
  window.toggleFullscreen = function(target) {
    toggleSimulationFullscreen(target || this);
  };
  window.toggleSimFullscreen = function(boxId) {
    var el = boxId ? document.getElementById(boxId) : this;
    toggleSimulationFullscreen(el);
  };
  window.toggleFs = function() {
    toggleSimulationFullscreen(this);
  };
  window.openFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) {
        ov.classList.remove("active");
        ov.style.display = "none";
      }
      var clean = id.replace(/^fs-?/, "");
      var target = document.getElementById(clean) ||
                   document.getElementById(clean + "SimBox") ||
                   document.getElementById("t-" + clean) ||
                   document.querySelector("[data-topic="" + clean + ""]") ||
                   document.getElementById(id);
      toggleSimulationFullscreen(target);
      return;
    }
    toggleSimulationFullscreen(this);
  };
  window.launchFullscreen = function(topicId) {
    window.openFullscreen(topicId);
  };
  window.closeFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) ov.classList.remove("active");
    }
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };
  window.exitSimFullscreen = function() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };

  // Canvas Re-sizing and Redrawing on fullscreen change and window resize
  function resizeAndRedrawSimulationCanvases() {
    window.dispatchEvent(new Event("resize"));

    document.querySelectorAll("canvas").forEach(function(cv) {
      try {
        var rect = cv.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          if (cv.width === 0 || cv.height === 0) {
            cv.width = rect.width;
            cv.height = rect.height;
          }
        }
      } catch(e) {}
    });

    var redrawFns = [
      "draw", "render", "animate", "redraw", "update", "drawCanvas",
      "drawBohrModel", "drawScaleCanvas", "drawTitrationCanvas",
      "resizeMeasureCanvas", "updateSimulation", "drawScene", "drawOrbit",
      "drawWaves", "drawField", "drawCircuit", "drawGenetics"
    ];
    redrawFns.forEach(function(fn) {
      if (typeof window[fn] === "function") {
        try { window[fn](); } catch(e) {}
      }
    });
  }

  document.addEventListener("fullscreenchange", function() {
    var isFs = !!document.fullscreenElement;
    var fsButtons = document.querySelectorAll(
      ".b-fs, .b-exit, [data-role="fs-btn"], .fs-btn, .btn-fs, .fullscreen-btn, #bFs, #fsExitBtn, .fs-exit, #btnFullscreen, #fullscreenBtn, [data-fs], #psFsBtn"
    );
    fsButtons.forEach(function(btn) {
      if (isFs) {
        btn.innerHTML = "✕ Exit full screen";
        btn.classList.add("is-fullscreen-active");
      } else {
        btn.innerHTML = "⛶ Full screen";
        btn.classList.remove("is-fullscreen-active");
      }
    });

    resizeAndRedrawSimulationCanvases();
    setTimeout(resizeAndRedrawSimulationCanvases, 50);
    setTimeout(resizeAndRedrawSimulationCanvases, 150);
    setTimeout(resizeAndRedrawSimulationCanvases, 300);
  });

  window.addEventListener("resize", resizeAndRedrawSimulationCanvases);

  // Event delegation to capture clicks on any fullscreen button reliably
  document.addEventListener("click", function(e) {
    var btn = e.target.closest(
      ".b-fs, .b-exit, [data-role="fs-btn"], .fs-btn, .btn-fs, .fullscreen-btn, #bFs, #fsExitBtn, .fs-exit, #btnFullscreen, #fullscreenBtn, [data-fs], #psFsBtn"
    );
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      toggleSimulationFullscreen(btn);
    }
  }, true);
})();
</script>

</body>
</html>
