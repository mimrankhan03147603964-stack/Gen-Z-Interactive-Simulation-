<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herbivores, Carnivores and Omnivores Simulation</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Segoe UI,Arial,sans-serif;color:#fff;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:radial-gradient(ellipse at 50% 25%,#2a6a3a,#0a2a1c 80%)}
#scene{flex:1;display:flex;align-items:center;justify-content:center;perspective:1200px;width:100%;min-height:0}
#stage{position:relative;transform-style:preserve-3d;border-radius:16px;line-height:0;box-shadow:1px 1px 0 #17361f,2px 2px 0 #17361f,3px 3px 0 #17361f,4px 4px 0 #14301c,5px 5px 0 #14301c,6px 6px 0 #112a18,7px 7px 0 #112a18,8px 8px 0 #0e2314,0 40px 60px #000a,0 0 50px #7dff9a44}
canvas{width:min(100vw - 28px,(100vh - 118px)*1.7768);height:auto;aspect-ratio:1672/941;border-radius:16px;display:block;cursor:pointer}
#gl{position:absolute;inset:0;border-radius:16px;pointer-events:none;mix-blend-mode:soft-light}
#bar{width:100%;padding:8px 10px 12px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
button{font:700 14px Segoe UI,Arial;color:#fff;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;box-shadow:0 5px 0 #0007,0 8px 12px #0005;text-shadow:0 1px 2px #0008;transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.18)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #0007}
button.on{outline:3px solid #fff;filter:brightness(1.25)}
.g{background:linear-gradient(#37c95e,#13823a)}.r{background:linear-gradient(#ff5555,#b81616)}.p{background:linear-gradient(#a45cff,#5f1db0)}
.b{background:linear-gradient(#3d8bff,#1647b8)}.o{background:linear-gradient(#ff9a3d,#c2480a)}.t{background:linear-gradient(#25c9b8,#0a7a70)}
.k{background:linear-gradient(#8a93a6,#4a5266)}.m{background:linear-gradient(#ff63b8,#b5136f)}.y{background:linear-gradient(#ffd23d,#b88a00);color:#222;text-shadow:none}
#msg{flex-basis:100%;text-align:center;font-size:15px;font-weight:600;color:#ffe9a8;min-height:20px}
</style></head><body>
<div id="app">
<div id="scene"><div id="stage"><canvas id="c" width="1672" height="941"></canvas><div id="gl"></div></div></div>
<div id="bar">
<button class="b" id="bAll">Show All</button>
<button class="g" id="b0">Herbivores</button>
<button class="r" id="b1">Carnivores</button>
<button class="p" id="b2">Omnivores</button>
<button class="o" id="bFeed">Feed Animals</button>
<button class="t" id="bTour">Auto Tour</button>
<button class="k" id="bAnim">Pause Animals</button>
<button class="k" id="bSlow">Slower</button>
<button class="k" id="bFast">Faster</button>
<button class="m" id="bTilt">3D Tilt: On</button>
<button class="y" id="bFull">Full Screen</button>
<div id="msg"></div>
</div></div>

['meat',[588,718,158,100],3,1],['fish',[745,722,205,100],4,1],['chicken',[952,702,140,114],3,1],
['fruits',[1140,698,120,125],5,2],['grains',[1288,712,180,108],6,2],['meat',[1490,722,160,100],5,2]];
const GN=[['Herbivores','eat only plants. Examples: grass, leaves, carrots. Animals: cow, sheep, rabbit.'],['Carnivores','eat only meat. Examples: meat, fish, chicken. Animals: lion, leopard.'],['Omnivores','eat both plants and meat. Examples: fruits, grains, meat. Animals: bear, crow.']];
const P=[[12,140,543,732],[573,140,535,732],[1113,140,548,732]],GC=['#3dff6a','#ff4d4d','#b46bff'],CX=[283,840,1389];
let spr=[],fl=[],sp2=[],tx=[];
function mk(r){const c=document.createElement('canvas');c.width=r[2];c.height=r[3];const x=c.getContext('2d');x.drawImage(img,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);
 const d=x.getImageData(0,0,r[2],r[3]),p=d.data,a=x.getImageData(2,2,1,1).data,b=x.getImageData(r[2]-3,2,1,1).data,
 R=(a[0]+b[0])/2,G=(a[1]+b[1])/2,B=(a[2]+b[2])/2;
 for(let i=0;i<p.length;i+=4)p[i+3]=255*ss((Math.hypot(p[i]-R,p[i+1]-G,p[i+2]-B)-28)/45);x.putImageData(d,0,0);return c}
function warp(R,fn){const st=10,nx=Math.ceil((R.x1-R.x0)/st),ny=Math.ceil((R.y1-R.y0)/st),Q=[];
 for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++)Q.push(fn(Math.min(R.x0+i*st,R.x1),Math.min(R.y0+j*st,R.y1)));
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=Q[j*(nx+1)+i],d=Q[(j+1)*(nx+1)+i+1],sx=R.x0+i*st,sy=R.y0+j*st,w=Math.min(st,R.x1-sx),h=Math.min(st,R.y1-sy);
  ctx.drawImage(img,sx,sy,w,h,a[0]-.5,a[1]-.5,d[0]-a[0]+1,d[1]-a[1]+1)}}
function fa(a){const ph=tt*a.f+a.p*1.7,e=Math.min(1,a.eat/.4);return(x,y)=>{
 const h=(a.y1-y)/(a.y1-a.y0),w=ss((x-a.x0)/45)*ss((a.x1-x)/45)*ss((y-a.y0)/30);
 let dx=a.A*Math.sin(ph)*h*h*w,dy=a.B*Math.sin(ph*1.7)*h*w+(y-a.y1)*.012*Math.sin(ph*1.3)*w;
 if(e>0){dy+=a.C*e*Math.sin(tt*16)*h*h*w;dx+=a.C*.4*e*Math.sin(tt*8)*h*w}return[x+dx,y+dy]}}
const LL={x0:0,y0:0,x1:150,y1:190},LR={x0:1520,y0:0,x1:1672,y1:190},GR={x0:0,y0:876,x1:W,y1:H};
const leaf=(ax,R)=>(x,y)=>{const h=Math.min(1,Math.hypot(x-ax,y-170)/150),w=ss(Math.abs(x-(R.x0?R.x1:R.x0))/1+0)*0+ss(Math.abs(x-(ax?R.x0:R.x1))/40)*ss((190-y)/40);
 const s=Math.sin(tt*1.6+(ax?2:0));return[x+7*s*h*w,y+3*Math.cos(tt*1.6)*h*w]};
const grass=(x,y)=>{const w=ss(x/60)*ss((W-x)/60)*ss((y-876)/25);return[x+5*Math.sin(x*.03+tt*2.2)*w*(y-876)/65,y]};
function select(g){sel=g;tour.on=false;setMsg()}
function setMsg(){$('msg').textContent=sel<0?'Click a button or click on a group to learn more.':GN[sel][0]+' '+GN[sel][1]}
function feed(){const L=F.map((f,i)=>i).filter(i=>sel<0||F[i][3]==sel);L.forEach((i,k)=>fl.push({i,t:-k*.5,d:1.3,ate:false}))}
const tour={on:false,i:-1,next:0};
function rr(x,y,w,h,r){ctx.roundRect(x,y,w,h,r)}
function frame(ts){
 const rd=Math.min(.05,(ts-t0)/1000||0);t0=ts;now=ts;const dt=anim?rd*sp:0;tt+=dt;
 if(tour.on&&ts>=tour.next){tour.i=(tour.i+1)%3;sel=tour.i;setMsg();tour.next=ts+9000/sp;setTimeout(()=>{if(tour.on)feed()},1200)}
 const tg=sel<0?{s:1,x:W/2,y:H/2}:{s:1.3,x:Math.max(W/2/1.3,Math.min(W-W/2/1.3,CX[sel])),y:505};
 for(const k in cam)cam[k]+=(tg[k]-cam[k])*Math.min(1,rd*5);
 dim+=((sel<0?0:1)-dim)*Math.min(1,rd*5);
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
 ctx.setTransform(cam.s,0,0,cam.s,W/2-cam.s*cam.x,H/2-cam.s*cam.y);
 ctx.drawImage(img,0,0);
 A.forEach(a=>{if(a.eat>0)a.eat-=dt;warp(a,fa(a))});
 warp(LL,leaf(0,LL));warp(LR,leaf(W,LR));warp(GR,grass);
 // food flights
 fl=fl.filter(o=>{o.t+=dt;const f=F[o.i],a=A[f[2]],r=f[1];
  if(o.t<0){ctx.save();ctx.strokeStyle='rgba(255,230,80,'+(.5+.5*Math.sin(ts/80))+')';ctx.lineWidth=5;ctx.beginPath();rr(r[0]-4,r[1]-4,r[2]+8,r[3]+8,14);ctx.stroke();ctx.restore();return true}
  const q=Math.min(1,o.t/o.d),sx=r[0]+r[2]/2,sy=r[1]+r[3]/2,mx=a.m[0],my=a.m[1];
  const x=sx+(mx-sx)*ss(q),y=sy+(my-sy)*ss(q)-170*Math.sin(Math.PI*q);
  if(q>=1&&!o.ate){o.ate=true;a.eat=1.6;$('msg').textContent='The '+a.n+' eats '+f[0]+'!';for(let k=0;k<14;k++)sp2.push({x:mx,y:my,vx:(Math.random()-.5)*260,vy:-Math.random()*240-40,l:1});tx.push({x:mx,y:my-40,l:1})}
  const shrink=q<1?1:Math.max(0,1-(o.t-o.d)/.8);if(shrink<=0)return false;
  const s=spr[o.i],sc=(.85-.25*q)*shrink,w=s.width*sc,h=s.height*sc;
  ctx.save();ctx.translate(x,y);ctx.rotate(q<1?q*5:0);ctx.shadowColor='#0008';ctx.shadowBlur=18;ctx.shadowOffsetY=12;ctx.drawImage(s,-w/2,-h/2,w,h);ctx.restore();return true});
 sp2=sp2.filter(p=>{p.l-=rd*1.1;p.x+=p.vx*rd;p.y+=p.vy*rd;p.vy+=500*rd;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle='#ffd83a';ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,6,0,6.3);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;return p.l>0});
 tx=tx.filter(p=>{p.l-=rd*.8;p.y-=50*rd;ctx.globalAlpha=Math.max(0,p.l);ctx.font='bold 44px Arial';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#c2480a';ctx.fillStyle='#fff';ctx.strokeText('Yum!',p.x,p.y);ctx.fillText('Yum!',p.x,p.y);ctx.globalAlpha=1;return p.l>0});
 // spotlight
 if(dim>.01&&sel>=0){const r=P[sel];ctx.save();ctx.beginPath();ctx.rect(-W,-H,3*W,3*H);rr(r[0],r[1],r[2],r[3],40);ctx.fillStyle='rgba(0,0,0,'+.6*dim+')';ctx.fill('evenodd');
  ctx.beginPath();rr(r[0],r[1],r[2],r[3],40);ctx.lineWidth=8;ctx.strokeStyle=GC[sel];ctx.shadowColor=GC[sel];ctx.shadowBlur=28;ctx.globalAlpha=dim*(.65+.35*Math.sin(ts/220));ctx.stroke();ctx.restore()}
 ctx.setTransform(1,0,0,1,0,0);
 // UI
 [0,1,2].forEach(i=>$('b'+i).classList.toggle('on',sel==i));$('bAll').classList.toggle('on',sel<0);$('bTour').classList.toggle('on',tour.on);
 $('bAnim').textContent=anim?'Pause Animals':'Play Animals';$('bTilt').textContent='3D Tilt: '+(tilt?'On':'Off');
 // 3D tilt
 const idle=ts-mv>2500;let ty=tilt?(idle?4*Math.sin(ts/1700):mx*12):0,tx2=tilt?(idle?2.5*Math.cos(ts/2100):-my*9):0;
 ry+=(ty-ry)*.1;rx+=(tx2-rx)*.1;$('stage').style.transform='rotateY('+ry.toFixed(2)+'deg) rotateX('+rx.toFixed(2)+'deg) translateZ(30px)';
 $('gl').style.background='radial-gradient(circle at '+(50+ry*4)+'% '+(40-rx*4)+'%,#fff9,#0000 55%)';
 requestAnimationFrame(frame)}
let mx=0,my=0,mv=-9999,rx=0,ry=0;
$('scene').addEventListener('mousemove',e=>{const r=$('scene').getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5;mv=performance.now()});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),ix=(e.clientX-r.left)/r.width*W,wx=(ix-W/2)/cam.s+cam.x;select(wx<565?0:wx<1110?1:2)});
$('bAll').onclick=()=>select(-1);[0,1,2].forEach(i=>$('b'+i).onclick=()=>select(i));
$('bFeed').onclick=feed;
$('bTour').onclick=()=>{tour.on=!tour.on;tour.i=-1;tour.next=0;if(!tour.on)setMsg()};
$('bAnim').onclick=()=>{anim=!anim};
$('bSlow').onclick=()=>{sp=Math.max(.4,sp-.3);$('msg').textContent='Speed: '+sp.toFixed(1)+'x'};
$('bFast').onclick=()=>{sp=Math.min(2.5,sp+.3);$('msg').textContent='Speed: '+sp.toFixed(1)+'x'};
$('bTilt').onclick=()=>{tilt=!tilt};
$('bFull').onclick=()=>{const a=$('app');if(document.fullscreenElement)document.exitFullscreen();else(a.requestFullscreen||a.webkitRequestFullscreen).call(a)};
document.addEventListener('fullscreenchange',()=>{$('bFull').textContent=document.fullscreenElement?'Exit Full Screen':'Full Screen'});
img.onload=()=>{spr=F.map(f=>mk(f[1]));setMsg();requestAnimationFrame(frame)};
</script></body></html>
