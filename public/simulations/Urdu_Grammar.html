    if(t.gi!=gi)return;

    else if(!v||t.n.toLowerCase().indexOf(v)>-1){gr.appendChild(btn(i,function(){setOpen(i)}));m++;}
  });
  return m;
}
function pick(i){cur=i;draw();var h=box.querySelector(".hd");if(h)h.scrollIntoView({behavior:"smooth",block:"start"});}
function draw(){
  box.innerHTML="";var v=q.value.trim(),seen=0;
  q.style.display=cur>=0?"none":"";
  G.forEach(function(g,gi){
    if(cur>=0&&all[cur].gi!=gi)return;
    var hd=document.createElement("div"),h=document.createElement("h2"),gr=document.createElement("div");
    hd.className="hd";gr.className="gr";h.textContent=g.g;hd.appendChild(h);
    var f=document.createElement("button");f.className="fs";f.type="button";f.textContent="\u26F6 پوری اسکرین";
    f.onclick=function(){openFS(gi)};hd.appendChild(f);
    var m=fillGroup(gr,gi,cur,pick,v);
    if(m){box.appendChild(hd);box.appendChild(gr);seen+=m;}
  });
  document.getElementById("none").style.display=(!seen&&v)?"block":"none";
}
function drawFS(){
  tabs.innerHTML="";
  G.forEach(function(g,gi){
    var b=document.createElement("button");b.className="tab"+(gi==fsG?" act":"");b.type="button";
    b.textContent=g.g;b.style.setProperty("--c",g.c);
    b.onclick=function(){fsG=gi;fsCur=-1;drawFS();fsb.scrollTop=0;};
    tabs.appendChild(b);
  });
  var act=tabs.querySelector(".act");if(act&&act.scrollIntoView)act.scrollIntoView({inline:"center",block:"nearest"});
  fsb.innerHTML="";
  var g=G[fsG],h=document.createElement("h2"),gr=document.createElement("div");
  h.textContent=g.g;h.style.color=g.c;gr.className="gr";
  fsb.appendChild(h);fsb.appendChild(gr);
  fillGroup(gr,fsG,fsCur,function(i){fsCur=i;drawFS();fsb.scrollTop=0;},"");
}
function openFS(gi){
  fsG=gi;fsCur=-1;fs.classList.add("on");document.body.style.overflow="hidden";drawFS();fsb.scrollTop=0;
  try{var r=fs.requestFullscreen||fs.webkitRequestFullscreen;if(r){var p=r.call(fs);if(p&&p.catch)p.catch(function(){});}}catch(e){}
}
function closeFS(){
  fs.classList.remove("on");document.body.style.overflow="";
  try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}catch(e){}
}
document.getElementById("fsc").onclick=closeFS;
document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&fs.classList.contains("on"))closeFS();});
document.addEventListener("keydown",function(e){if(e.key=="Escape"&&fs.classList.contains("on"))closeFS();});
q.oninput=draw;draw();
</script></body></html>
