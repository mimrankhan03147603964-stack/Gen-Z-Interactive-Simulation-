<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Respiratory System Simulation</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#1b3a7a,#08122c 75%);font-family:Segoe UI,Arial,sans-serif;color:#fff;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:radial-gradient(ellipse at 50% 30%,#1b3a7a,#08122c 75%)}
#scene{flex:1;display:flex;align-items:center;justify-content:center;perspective:1400px;width:100%;min-height:0}
#stage{transition:transform .15s ease-out;transform-style:preserve-3d;border-radius:14px;box-shadow:0 30px 60px #000a,0 0 0 3px #ffffff33,0 0 40px #4aa3ff55;line-height:0}
canvas{width:min(100vw - 24px,(100vh - 84px)*1.5);height:auto;aspect-ratio:3/2;border-radius:14px;display:block}
#bar{height:76px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;flex-wrap:wrap}
button{font:700 15px Segoe UI,Arial;color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 5px 0 #0006,0 8px 14px #0005;transition:transform .08s,box-shadow .08s,filter .15s;text-shadow:0 1px 2px #0008}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #0006}
button.on{outline:3px solid #fff;filter:brightness(1.2)}
#bAuto{background:linear-gradient(#35c45b,#13863a)}
#bIn{background:linear-gradient(#3d8bff,#1647b8)}
#bOut{background:linear-gradient(#b05bff,#6a1fb5)}
#bZoom{background:linear-gradient(#ff8a3d,#c2480a)}
#bFull{background:linear-gradient(#ffd23d,#b88a00);color:#222;text-shadow:none}
#msg{font-size:15px;font-weight:600;min-width:330px;text-align:center;color:#ffe9a8}
</style></head><body>
<div id="app">
<div id="scene"><div id="stage"><canvas id="c" width="1536" height="1024"></canvas></div></div>
<div id="bar">
<button id="bAuto">Pause</button>
<button id="bIn">Breathe In</button>
<button id="bOut">Breathe Out</button>
<button id="bZoom">Zoom Gas Exchange</button>
<button id="bFull">Full Screen</button>
<span id="msg"></span>
</div></div>

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let b=0,dir=1,running=true,hold=false,zoom=false,cam={s:1,x:768,y:512},t0=0;
const ss=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
// ---- warp regions (pixels of the original picture really move) ----
const R1={x0:140,x1:720,y0:400,y1:860,st:10};
const R2={x0:855,x1:1075,y0:690,y1:955,st:10};
function warp(R,fn){
 const nx=Math.ceil((R.x1-R.x0)/R.st),ny=Math.ceil((R.y1-R.y0)/R.st),P=[];
 for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){
  const x=Math.min(R.x0+i*R.st,R.x1),y=Math.min(R.y0+j*R.st,R.y1);P.push(fn(x,y));}
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
  const a=P[j*(nx+1)+i],d=P[(j+1)*(nx+1)+i+1];
  const sx=R.x0+i*R.st,sy=R.y0+j*R.st,w=Math.min(R.st,R.x1-sx),h=Math.min(R.st,R.y1-sy);
  ctx.drawImage(img,sx,sy,w,h,a[0]-.5,a[1]-.5,d[0]-a[0]+1,d[1]-a[1]+1);}
}
function f1(e){return(x,y)=>{
 const w=ss((x-140)/90)*ss((720-x)/90)*ss((y-400)/80)*ss((860-y)/90);
 const k=.05*e*w;
 let dy=34*e*Math.exp(-Math.pow((y-770)/60,2))*ss((x-150)/80)*ss((710-x)/80)*ss((860-y)/40);
 return[x+(x-435)*k,y+(y-640)*k+dy];}}
function f2(e){return(x,y)=>{
 const w=ss((x-855)/50)*ss((1075-x)/50)*ss((y-690)/50)*ss((955-y)/50),k=.07*e*w;
 return[x+(x-965)*k,y+(y-815)*k];}}
// ---- airway particles ----
const main=[[235,228],[285,222],[350,230],[405,265],[425,330],[432,430],[436,545]];
const brs=[[[436,545],[395,590],[320,640],[270,690]],[[436,545],[480,590],[550,640],[600,690]]];
const paths=brs.map(br=>{const p=main.concat(br.slice(1)),L=[0];
 for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));return{p,L}});
function at(P,t){const d=t*P.L[P.L.length-1];let i=1;while(i<P.L.length-1&&P.L[i]<d)i++;
 const u=(d-P.L[i-1])/(P.L[i]-P.L[i-1]||1);return[P.p[i-1][0]+(P.p[i][0]-P.p[i-1][0])*u,P.p[i-1][1]+(P.p[i][1]-P.p[i-1][1])*u]}
let air=[],acc=0;
// ---- gas exchange particles ----
const gas=[];for(let i=0;i<18;i++){gas.push({o:i<9,u:Math.random(),j:[Math.random(),Math.random(),Math.random(),Math.random()]})}
function drawDot(x,y,r,c,l){const g=ctx.createRadialGradient(x-r/3,y-r/3,1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.35,c);g.addColorStop(1,c);

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function frame(ts){
 const dt=Math.min(.05,(ts-t0)/1000||0);t0=ts;
 let moving=false;
 if(running){b+=dir*dt/2.8;moving=true;
  if(b>=1){b=1;if(hold){running=false;moving=false}else dir=-1}
  if(b<=0){b=0;if(hold){running=false;moving=false}else dir=1}}
 const e=ss(b);
 // camera
 const tg=zoom?{s:2.1,x:1185,y:760}:{s:1,x:768,y:512};
 for(const k in cam)cam[k]+=(tg[k]-cam[k])*Math.min(1,dt*6);
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,1536,1024);
 ctx.setTransform(cam.s,0,0,cam.s,768-cam.s*cam.x,512-cam.s*cam.y);
 ctx.drawImage(img,0,0);
 warp(R1,f1(e));warp(R2,f2(e));
 // restore static labels
 [[345,656,152,50],[343,806,182,54],[661,693,152,50],[50,522,105,82],[694,527,100,80],[608,376,155,76]].forEach(r=>ctx.drawImage(img,r[0],r[1],r[2],r[3],r[0],r[1],r[2],r[3]));
 // panel highlight
 const pu=.6+.4*Math.sin(ts/180);
 ctx.save();ctx.lineWidth=6;ctx.shadowBlur=22;
 if(dir==1){ctx.strokeStyle='rgba(30,200,70,'+pu+')';ctx.shadowColor='#2f4';rr(803,188,352,334,16)}
 else{ctx.strokeStyle='rgba(170,60,255,'+pu+')';ctx.shadowColor='#b4f';rr(1163,188,352,334,16)}
 if(running||true)ctx.stroke();ctx.restore();
 // airflow
 if(moving){acc+=dt*18;while(acc>1){acc--;const br=Math.random()<.5?0:1;air.push({br,t:dir==1?0:1,v:.35+Math.random()*.15,d:dir})}}
 air=air.filter(a=>{if(moving)a.t+=a.d*a.v*dt;return a.t>=0&&a.t<=1});
 air.forEach(a=>{const p=at(paths[a.br],a.t);const o=Math.sin(a.t*40+a.v*50)*3;drawDot(p[0]+o,p[1],8,a.d==1?'#1f6fe0':'#e02020',a.d==1?'O₂':'CO₂')});
 // gas exchange: inhale -> O2 goes IN (blue arrow); exhale -> CO2 comes OUT
 gas.forEach(g=>{const act=g.o==(dir==1);
  if(act&&moving){g.u+=dt*.3;if(g.u>1){g.u=0;g.j=[Math.random(),Math.random(),Math.random(),Math.random()]}}
  if(!act)return;
  const q=ss(g.u),j=g.j,ix=1130+j[0]*80,iy=715+j[1]*65;
  let x,y;
  if(g.o){const sx=1330+j[2]*20,sy=650+j[3]*40;x=sx+(ix-sx)*q;y=sy+(iy-sy)*q}
  else{const ex=1310+j[2]*20,ey=805+j[3]*40;x=ix+(ex-ix)*q;y=iy+(ey-iy)*q}
  ctx.globalAlpha=Math.min(1,Math.min(g.u,1-g.u)*5);
  drawDot(x,y,g.o?9:10,g.o?'#1f6fe0':'#e02020',g.o?'O₂':'CO₂');ctx.globalAlpha=1});
 ctx.setTransform(1,0,0,1,0,0);
 // UI state
 $('msg').textContent=dir==1?'Inhalation: diaphragm moves down, lungs expand, oxygen (O₂) goes in.':'Exhalation: diaphragm moves up, lungs get smaller, carbon dioxide (CO₂) goes out.';
 $('bAuto').textContent=running&&!hold?'Pause':'Auto Breathing';
 $('bIn').classList.toggle('on',hold&&dir==1);$('bOut').classList.toggle('on',hold&&dir==-1);
 $('bZoom').textContent=zoom?'Back to Full View':'Zoom Gas Exchange';
 requestAnimationFrame(frame)}
$('bAuto').onclick=()=>{if(running&&!hold)running=false;else{running=true;hold=false}};
$('bIn').onclick=()=>{dir=1;hold=true;running=b<1};
$('bOut').onclick=()=>{dir=-1;hold=true;running=b>0};
$('bZoom').onclick=()=>{zoom=!zoom};
$('bFull').onclick=()=>{const a=$('app');if(document.fullscreenElement)document.exitFullscreen();else(a.requestFullscreen||a.webkitRequestFullscreen).call(a)};
document.addEventListener('fullscreenchange',()=>{$('bFull').textContent=document.fullscreenElement?'Exit Full Screen':'Full Screen'});
const st=$('stage');
$('scene').addEventListener('mousemove',ev=>{const r=$('scene').getBoundingClientRect();
 const x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;st.style.transform='rotateY('+x*6+'deg) rotateX('+(-y*5)+'deg)'});
$('scene').addEventListener('mouseleave',()=>st.style.transform='');
img.onload=()=>requestAnimationFrame(frame);
</script></body></html>
