<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABO Blood Group System and Rh Factor Compatibility</title>
<style>
*{box-sizing:border-box;margin:0;font-family:"Trebuchet MS",Arial,sans-serif;font-weight:800}
html,body{height:100%;background:#0b1224;overflow:hidden}body{display:flex;flex-direction:column}
#wrap{flex:1;position:relative;min-height:0}
#st{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;background:radial-gradient(circle at 50% 45%,#fff,#eaf6ff 55%,#c9e6ff);overflow:hidden}
.a{position:absolute}
.pill{position:absolute;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:60px;border:4px solid #fff8;text-shadow:0 3px 3px #0006;box-shadow:0 6px 14px #0004;z-index:3}
.pan{position:absolute;border-radius:34px;border:5px solid #3b9cf0;background:#ffffffb0}
.card{width:176px;height:340px;cursor:pointer;z-index:2;transition:.2s}.card:hover{transform:translateY(-4px)}
.tg{height:68px;border-radius:20px;color:#fff;font-size:62px;text-align:center;line-height:66px;text-shadow:0 3px 3px #0006;border:3px solid #fff9;box-shadow:0 4px 8px #0004}
.cell{position:absolute;left:3px;top:80px;width:170px;height:170px;object-fit:contain;animation:wob 3s ease-in-out infinite alternate}
.lb{position:absolute;left:0;top:262px;width:100%;height:76px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;line-height:1.05;background:#fff4d6;border:3px solid #f0c97a;border-radius:16px;color:#222}
.card.sel .tg{box-shadow:0 0 0 5px #fde047,0 0 28px #fde047}.card.sel .cell{animation:spin 4s linear infinite}
.fast .cell,.fast .rhi{animation:spin 2s linear infinite!important}
.rb{position:absolute;background:#fff;border-radius:22px;overflow:hidden;z-index:2;cursor:pointer;transition:.2s}
.rb .h{height:52px;color:#fff;font-size:34px;text-align:center;line-height:52px;text-shadow:0 2px 3px #0006}
.rb .c{position:absolute;bottom:8px;width:100%;text-align:center;font-size:31px;color:#111}
.rhi{position:absolute;left:50%;top:62px;width:240px;margin-left:-120px;height:140px;object-fit:contain;animation:wob 3.4s ease-in-out infinite alternate}
.tb{position:absolute;left:1030px;width:568px;border:4px solid #1d4ed8;border-radius:16px;overflow:hidden;background:#fff;z-index:2;transition:.2s}
.tb .t{height:48px;font-size:38px;color:#fff;text-align:center;line-height:48px;text-shadow:0 2px 3px #0006}
.rw{display:grid;grid-template-columns:245px 1fr;height:45px;cursor:pointer;border-top:2px solid #fff}
.rw>div{display:flex;align-items:center;justify-content:center;font-size:34px}
.rt{color:#fff;text-shadow:0 2px 3px #0006}.rv{background:#fbf0cf;color:#111}.rw.sel .rv{background:#fde047}.rw.sel{outline:4px solid #fde047;position:relative}
.hd .rv,.hd .rt{background:#fff;color:#111;font-size:30px;text-shadow:none}.hd{height:44px;cursor:default}
.hl{animation:glow .6s ease-in-out infinite alternate!important}
@keyframes glow{to{filter:drop-shadow(0 0 22px #facc15) brightness(1.15);transform:scale(1.03)}}
@keyframes wob{from{transform:rotate(-9deg) scale(.96)}to{transform:rotate(9deg) scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(.98)}}
@keyframes fl{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.fc{position:absolute;pointer-events:none;z-index:1}
.pause *{animation-play-state:paused!important}
#drop{left:780px;top:255px;width:235px;height:366px;object-fit:contain;z-index:2;animation:beat 1.2s ease-in-out infinite}
#glow{left:700px;top:230px;width:400px;height:420px;border-radius:50%;background:radial-gradient(#fde68a,#fde68a00 68%);animation:beat 1.2s ease-in-out infinite;z-index:1}
#info{left:790px;top:652px;width:192px;height:250px;background:#fffffff0;border:5px solid #f43f5e;border-radius:22px;padding:10px;font-size:19px;line-height:1.25;color:#1e293b;z-index:3;overflow:hidden}
#info b{color:#be123c}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px;justify-content:center;background:#0a1020;border-top:3px solid #e11d48}
#bar button,#lab button{border:0;border-radius:10px;padding:9px 12px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 #0007;transition:.15s}
#bar button:hover,#lab button:hover{transform:translateY(-2px);filter:brightness(1.18)}#bar button:active,#lab button:active{transform:translateY(2px);box-shadow:none}
#lab{display:none;position:absolute;inset:0;background:#0b1224e6;z-index:20;align-items:center;justify-content:center}
.lbx{position:relative;width:1372px;height:800px;background:linear-gradient(#e0f2fe,#fff);border-radius:40px;border:6px solid #6d28d9;overflow:hidden}
.lt{left:0;top:16px;width:100%;text-align:center;font-size:52px;color:#5b21b6}
.sl{font-size:28px;color:#1e293b}.sl div{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;width:420px}
#lab .sl button{font-size:24px;padding:10px 18px;opacity:.7}#lab .sl button.on{opacity:1;outline:5px solid #facc15;transform:scale(1.1)}
.pipe{left:270px;top:395px;width:800px;height:120px;border-radius:60px;background:linear-gradient(#fecdd3,#fda4af 50%,#fecdd3);border:4px solid #fb7185}
.orb{position:absolute;left:0;top:0;width:220px;height:220px;animation:spin 9s linear infinite}.orb span{position:absolute;left:100px;top:96px;font-size:40px;font-weight:900}
#lm{left:60px;top:640px;width:1250px;height:130px;background:#fff;border:5px solid #38bdf8;border-radius:22px;padding:12px 18px;font-size:27px;line-height:1.3;color:#1e293b}
#lm.ok{border-color:#22c55e}#lm.bad{border-color:#ef4444}
.lbt{right:50px;top:560px;display:flex;gap:10px}
.yy{position:absolute;font-size:30px;font-weight:900;pointer-events:none}
</style></head><body>

<div class="pan" style="left:15px;top:150px;width:765px;height:400px"></div>

<div class="pan" style="left:10px;top:600px;width:770px;height:310px"></div>

<div class="rb" data-g="Rh+" id="rhc" style="left:997px;top:763px;width:640px;height:147px;background:#f0f9d8;border:5px solid #65b32e;border-radius:28px;cursor:default">
<div class="pill" style="left:85px;top:-1px;width:465px;height:52px;font-size:36px;background:linear-gradient(#3fcf4f,#13801a);border-radius:30px">Rh Factor Compatibility</div></div>

[['f1',25,45,110,'40px','50px','30deg',7],['f4',1550,30,100,'-40px','45px','-25deg',6],['f2',835,125,115,'30px','40px','60deg',5],['f3',818,860,100,'60px','-30px','-50deg',8],['f1',2,560,70,'25px','30px','80deg',6],['f3',1610,270,90,'-30px','40px','40deg',7],['f2',1610,430,80,'-25px','-40px','70deg',9],['f4',1590,620,95,'-30px','25px','-60deg',8]].forEach(([k,x,y,w,dx,dy,r,d],i)=>st.insertAdjacentHTML('afterbegin',`<img class="fc" src="${S[k]}" style="left:${x}px;top:${y}px;width:${w}px;--dx:${dx};--dy:${dy};--r:${r};animation:fl ${d}s ease-in-out ${i*.4}s infinite alternate">`));
const T={A:'<b>Blood group A</b> has antigen A on its red cells. It can receive red cells from A and O.',B:'<b>Blood group B</b> has antigen B on its red cells. It can receive red cells from B and O.',AB:'<b>Blood group AB</b> has both antigens A and B. It can receive red cells from every group.',O:'<b>Blood group O</b> has no antigen. It can give red cells to everyone and receives only from O.','Rh+':'<b>Rh positive</b>: the Rh antigen is present. Can receive Rh+ and Rh− blood.','Rh−':'<b>Rh negative</b>: the Rh antigen is absent. Can receive Rh− blood only.'};
const info=$('#info');let cur='';
function pick(g){cur=g;info.innerHTML=T[g];$$('[data-g]').forEach(e=>e.classList.toggle('sel',e.dataset.g==g&&!e.classList.contains('a')));$$('.rb[data-g]').forEach(e=>e.classList.toggle('sel',e.dataset.g==g));hl($$(`.card[data-g="${g}"],.rb[data-g="${g}"]:not(#rhc)`))}
function hl(l,ms=2200){l.forEach(e=>{e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),ms)})}
$$('.card,.rw:not(.hd),.rb[data-g],[data-g].a').forEach(e=>e.onclick=()=>pick(e.dataset.g));
info.innerHTML='Click a blood group, a table row or an Rh box to explore it.';
function fit(){const w=$('#wrap'),s=Math.min(w.clientWidth/1672,w.clientHeight/941);st.style.transform=`translate(${(w.clientWidth-1672*s)/2}px,${(w.clientHeight-941*s)/2}px) scale(${s})`;$('#lab').style.transform=st.style.transform;$('#lab').style.cssText+=`;width:1672px;height:941px;transform-origin:0 0`}
new ResizeObserver(fit).observe($('#wrap'));addEventListener('resize',fit);
// bottom bar
const B=[['Full Screen','#16a34a',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()],['Group A','#ef4444',()=>pick('A')],['Group B','#2563eb',()=>pick('B')],['Group AB','#22a447',()=>pick('AB')],['Group O','#f97316',()=>pick('O')],['Rh+','#0d9488',()=>pick('Rh+')],['Rh−','#db2777',()=>pick('Rh−')],['Red Cell Table','#0ea5e9',()=>{hl([$('#t1')]);info.innerHTML='<b>Red cell transfusion</b>: this table shows which groups a patient can receive red cells from.'}],['Plasma Table','#7c3aed',()=>{hl([$('#t2')]);info.innerHTML='<b>Plasma transfusion</b>: this table shows which groups can receive plasma from each donor group.'}],['Rh Compatibility','#65a30d',()=>{hl([$('#rhc')]);info.innerHTML='<b>Rh rule</b>: Rh+ can receive Rh+ and Rh−. Rh− can receive Rh− only.'}],['Live Transfusion Test','#e11d48',()=>{$('#lab').style.display='flex';upd();rst()}],['Spin Cells','#f59e0b',e=>{st.classList.toggle('fast');e.target.textContent=st.classList.contains('fast')?'Slow Cells':'Spin Cells'}],['Pause','#64748b',e=>{st.classList.toggle('pause');e.target.textContent=st.classList.contains('pause')?'Play':'Pause'}],['Reset View','#0891b2',()=>{cur='';$$('.sel').forEach(e=>e.classList.remove('sel'));info.innerHTML='Click a blood group, a table row or an Rh box to explore it.'}]];
B.forEach(([n,c,f])=>{const b=document.createElement('button');b.textContent=n;b.style.background=c;b.onclick=f;$('#bar').append(b)});
document.addEventListener('fullscreenchange',()=>{B[0][0]=0;$('#bar button').textContent=document.fullscreenElement?'Exit Full Screen':'Full Screen'});
// live test
const L={dg:'O',dr:'−',pg:'A',pr:'+'};let fly=[],run=0,sp=0,N=10,res=0,last=0,okk=1;
const has=(g,r)=>({A:g[0]=='A',B:g.includes('B'),D:r=='+'});
const why=()=>{const a=has(L.dg,L.dr),b=has(L.pg,L.pr),r=[];if(a.A&&!b.A)r.push(['A','Donor cells have antigen A, but the patient has anti-A antibodies.']);if(a.B&&!b.B)r.push(['B','Donor cells have antigen B, but the patient has anti-B antibodies.']);if(a.D&&!b.D)r.push(['D','Donor cells have the Rh antigen, and an Rh− patient can make anti-D antibodies.']);return r};
const YC={A:'#2f7cf6',B:'#eab308',D:'#16a34a'};
$('#lbx').innerHTML=`<div class="a lt">Live Transfusion Test</div><div class="a sl" style="left:50px;top:90px">Donor (giver)<div id="ds"></div></div><div class="a sl" style="right:50px;top:90px">Patient (receiver)<div id="ps"></div></div><div class="a pipe"></div><div class="a" id="dv" style="left:50px;top:340px;width:200px;text-align:center;font-size:30px"></div><div class="a" id="pv" style="left:1090px;top:300px;width:220px;text-align:center;font-size:28px"></div><div class="a" id="fly" style="left:0;top:0;width:1372px;height:800px;pointer-events:none"></div><div class="a" id="lm"></div><div class="a lbt" id="lbt"></div>`;
function sb(id,kg,kr){$(id).innerHTML=[...G.map(x=>`<button data-k="${kg}" data-v="${x[0]}" style="background:linear-gradient(${x[1][0]},${x[1][1]})">${x[0]}</button>`),`<button data-k="${kr}" data-v="+" style="background:#0d9488">Rh+</button>`,`<button data-k="${kr}" data-v="−" style="background:#db2777">Rh−</button>`].join('');$(id).onclick=e=>{const k=e.target.dataset.k;if(k){L[k]=e.target.dataset.v;upd();rst()}}}
sb('#ds','dg','dr');sb('#ps','pg','pr');
[['Start Test','#16a34a',()=>{rst();run=1}],['Reset','#64748b',()=>rst()],['Random Case','#f59e0b',()=>{const r=a=>a[Math.random()*a.length|0];L.dg=r(['A','B','AB','O']);L.pg=r(['A','B','AB','O']);L.dr=r(['+','−']);L.pr=r(['+','−']);upd();rst()}],['Speed','#db2777',()=>sp=(sp+1)%3],['Close','#e11d48',()=>$('#lab').style.display='none']].forEach(([n,c,f])=>{const b=document.createElement('button');b.textContent=n;b.style.background=c;b.style.fontSize='22px';b.onclick=f;$('#lbt').append(b)});
function upd(){$$('#lab .sl button').forEach(b=>b.classList.toggle('on',L[b.dataset.k]==b.dataset.v));
 $('#dv').innerHTML=`<img src="${S[L.dg]}" width="160" style="animation:wob 2s ease-in-out infinite alternate;${L.dr=='+'?'filter:drop-shadow(0 0 10px #16a34a)':''}"><div>Donor: ${L.dg}${L.dr}</div>`;
 const b=has(L.pg,L.pr),ab=['A','B','D'].filter(k=>!b[k]);
 $('#pv').innerHTML=`<div style="position:relative;height:230px"><div class="orb">${ab.map((k,i)=>`<span style="color:${YC[k]};transform:rotate(${i*(360/ab.length)}deg) translateY(-92px)">Y</span>`).join('')}</div><img src="${S.drop}" style="position:absolute;left:55px;top:28px;width:110px;animation:beat 1.2s infinite"></div><div>Patient: ${L.pg}${L.pr}</div><div style="font-size:20px">Antibodies: ${ab.length?ab.map(k=>'anti-'+k).join(', '):'none'}</div>`}
function rst(){run=0;res=0;fly.forEach(c=>{c.e.remove();(c.ys||[]).forEach(y=>y.remove())});fly=[];okk=!why().length;upd();$('#lm').className='a';$('#lm').innerHTML=`Donor <b>${L.dg}${L.dr}</b> → Patient <b>${L.pg}${L.pr}</b>. Press <b>Start Test</b> to send the donor red cells into the patient's blood.`}
let spawned=0;
function loop(t){if($('#lab').style.display=='flex'&&run){const k=[1,2,4][sp];
 if(fly.length<N&&t-last>400/k){last=t;const e=document.createElement('img');e.src=S[L.dg];e.className='fc';e.style.width='74px';if(L.dr=='+')e.style.filter='drop-shadow(0 0 8px #16a34a)';$('#fly').append(e);fly.push({e,x:280,y:415+Math.random()*30,s:0,r:0,i:fly.length})}
 fly.forEach(c=>{c.r+=2*k;if(c.s==0){c.x+=3*k;c.y+=Math.sin(t/180+c.i)*.5;if(c.x>=930){if(okk)c.s=1;else{c.s=2;c.tx=960+(c.i%4)*26;c.ty=425+(c.i>>2)*36;res++;why().forEach(([k2])=>{const y=document.createElement('span');y.className='yy';y.textContent='Y';y.style.color=YC[k2];$('#fly').append(y);(c.ys=c.ys||[]).push(y)})}}}
  else if(c.s==1){c.x+=2.4*k;c.sc=Math.max(.2,1-(c.x-930)/180);if(c.x>1100){c.e.style.display='none';c.s=3;res++}}
  else if(c.s==2){c.x+=(c.tx-c.x)*.06;c.y+=(c.ty-c.y)*.06;c.x+=Math.random()*3-1.5;c.y+=Math.random()*3-1.5;(c.ys||[]).forEach((y,j)=>{y.style.left=c.x+34+j*12+'px';y.style.top=c.y-16+'px'})}
  c.e.style.transform=`translate(${c.x}px,${c.y}px) rotate(${c.r}deg) scale(${c.sc||1})`;c.e.style.left=c.e.style.top='0';c.e.style.opacity=c.s==2?.95:1});
 if(res>=N&&run){run=0;const r=why();$('#lm').className='a '+(r.length?'bad':'ok');$('#lm').innerHTML=r.length?'✖ <b>Not compatible.</b> The red cells clump together (agglutination). '+r.map(x=>x[1]).join(' '):`✔ <b>Compatible.</b> The patient has no antibodies against the donor antigens, so ${L.dg}${L.dr} red cells are safe for a ${L.pg}${L.pr} patient.`}}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);fit();pick('A');
