<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractals, Chaos Theory & Mandelbrot Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, -apple-system, sans-serif; color: #f9fafb; }
    .sim { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
    .stage { flex: 1 1 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; cursor: grab; }
    .stage:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    .ctl {
      flex-shrink: 0;
      width: 100%;
      background: rgba(8, 6, 22, 0.96);
      border-top: 1.5px solid rgba(245, 158, 11, 0.45);
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(16px);
      z-index: 20;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .row span.lbl { font-size: 11px; font-weight: 800; color: #fcd34d; text-transform: uppercase; letter-spacing: 0.05em; min-width: 90px; }
    .btn {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: #fff;
    }
    .btn:hover { transform: translateY(-1.5px); filter: brightness(1.15); }
    .btn:active { transform: translateY(1px); }
    .b-set { background: #78350f; border-color: #f59e0b; }
    .b-set.active { background: #d97706; border-color: #fde68a; box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }
    .b-pal { background: #1e1b4b; border-color: #6366f1; }
    .b-pal.active { background: #4f46e5; border-color: #a5b4fc; }
    .b-reset { background: #374151; border-color: #6b7280; }
    .b-fs { background: linear-gradient(135deg, #f59e0b, #ef4444); border-color: #fca5a5; margin-left: auto; }
    .slider-box { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #fde68a; }
    input[type=range] { accent-color: #f59e0b; width: 110px; cursor: pointer; }
    .hud { position: absolute; top: 12px; left: 14px; background: rgba(15, 8, 30, 0.88); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 12px; padding: 10px 14px; font-size: 11px; line-height: 1.5; pointer-events: none; backdrop-filter: blur(8px); }
    .hud b { color: #fde047; }
    .hud .coord { font-family: monospace; color: #a5b4fc; }
  </style>




<!-- ================= FULLSCREEN ENGINE STYLES ================= -->
<style id="genz-simulation-fullscreen-styles">
  :fullscreen, ::backdrop {
    background-color: #0b0f19 !important;
  }
  .simulation-wrapper:fullscreen {
    width: 100vw !important;
    height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    background-color: #0b0f19 !important;
    position: fixed !important;
    inset: 0 !important;
    z-index: 999999 !important;
    margin: 0 !important;
    padding: 8px 16px !important;
    box-sizing: border-box !important;
  }
  .simulation-wrapper:fullscreen canvas,
  .simulation-wrapper:fullscreen iframe,
  .simulation-wrapper:fullscreen svg {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    flex: 1 1 0 !important;
    min-height: 0 !important;
    margin: 0 auto !important;
  }
  /* Preserve Overlay Controls and Interactive State with high z-index (50+) */
  .simulation-wrapper:fullscreen .ctl,
  .simulation-wrapper:fullscreen .controls,
  .simulation-wrapper:fullscreen .sim-controls,
  .simulation-wrapper:fullscreen .sim-readout,
  .simulation-wrapper:fullscreen .preset-chips,
  .simulation-wrapper:fullscreen .row,
  .simulation-wrapper:fullscreen .fs-bar,
  .simulation-wrapper:fullscreen .floating-controls,
  .simulation-wrapper:fullscreen .btn,
  .simulation-wrapper:fullscreen .fs-topbar,
  .simulation-wrapper:fullscreen .fullscreen-overlay-controls,
  .simulation-wrapper:fullscreen .topic-header,
  .simulation-wrapper:fullscreen .control-panel,
  .simulation-wrapper:fullscreen .controls-bar,
  .simulation-wrapper:fullscreen .dashboard {
    position: relative !important;
    z-index: 50 !important;
    flex-shrink: 0 !important;
    max-width: 100% !important;
  }
  /* Neutralize legacy empty overlay divs that blank out the page */
  .fs-overlay {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
</style>

</head>
<body>
  <div class="sim" id="simContainer">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">
        <b>Fractal Mathematics & Complex Dynamics</b><br/>
        Equation: <span style="color:#fde047; font-family:monospace; font-weight:900;">z_{n+1} = z_n² + c</span><br/>
        Center: <span class="coord" id="hudCoord">Re: -0.750, Im: 0.000</span><br/>
        Zoom Scale: <span id="hudZoom" style="color:#34d399; font-weight:900;">1.00x</span> |
        Mode: <span id="hudMode" style="color:#67e8f9; font-weight:900;">Mandelbrot Set</span>
      </div>
    </div>
    <div class="ctl">
      <div class="row">
        <span class="lbl">Fractal Type</span>
        <button class="btn b-set active" id="btnMandel" onclick="setMode('mandel')">🌌 Mandelbrot Set</button>
        <button class="btn b-set" id="btnJulia" onclick="setMode('julia')">✨ Julia Set Morph</button>
        <button class="btn b-pal active" id="btnPal1" onclick="setPalette('cosmic')">🔮 Cosmic Violet</button>
        <button class="btn b-pal" id="btnPal2" onclick="setPalette('fire')">🔥 Solar Fire</button>
        <button class="btn b-pal" id="btnPal3" onclick="setPalette('aurora')">🟢 Emerald Aurora</button>
        <button class="btn b-reset" onclick="resetView()">⟳ Reset View</button>
        <button class="btn b-fs" id="bFs" onclick="toggleFs()">⛶ Full Screen</button>
      </div>
      <div class="row">
        <span class="lbl">Parameters</span>
        <div class="slider-box">
          Max Iterations:
          <input type="range" id="rngIter" min="30" max="300" step="10" value="80" oninput="updateVars()" />
          <span id="valIter">80</span>
        </div>
        <div class="slider-box">
          Julia Parameter (c):
          <input type="range" id="rngJulia" min="-1.5" max="1.5" step="0.05" value="-0.4" oninput="updateVars()" />
          <span id="valJulia">-0.40 + 0.60i</span>
        </div>
        <div class="slider-box">
          Quick Zoom:
          <button class="btn b-set" onclick="zoomIn(2.0)">🔍 Zoom In (2x)</button>
          <button class="btn b-set" onclick="zoomIn(0.5)">🔎 Zoom Out</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    let width, height;
    let mode = 'mandel'; // 'mandel' or 'julia'
    let palette = 'cosmic';
    let maxIter = 80;
    let juliaRe = -0.4, juliaIm = 0.6;

    let centerX = -0.75, centerY = 0.0;
    let zoom = 1.0;

    let isDragging = false;
    let startX = 0, startY = 0;

    function resize() {
      const rect = cv.parentElement.getBoundingClientRect();
      width = cv.width = Math.min(960, Math.floor(rect.width * 0.75));
      height = cv.height = Math.min(540, Math.floor(rect.height * 0.75));
      renderFractal();
    }
    window.addEventListener('resize', resize);

    function setMode(m) {
      mode = m;
      document.getElementById('btnMandel').classList.toggle('active', m === 'mandel');
      document.getElementById('btnJulia').classList.toggle('active', m === 'julia');
      document.getElementById('hudMode').textContent = m === 'mandel' ? 'Mandelbrot Set' : 'Julia Set Morph';
      if (m === 'julia') { centerX = 0.0; centerY = 0.0; }
      else { centerX = -0.75; centerY = 0.0; }
      zoom = 1.0;
      updateVars();
      renderFractal();
    }

    function setPalette(p) {
      palette = p;
      document.getElementById('btnPal1').classList.toggle('active', p === 'cosmic');
      document.getElementById('btnPal2').classList.toggle('active', p === 'fire');
      document.getElementById('btnPal3').classList.toggle('active', p === 'aurora');
      renderFractal();
    }

    function zoomIn(factor) {
      zoom *= factor;
      updateVars();
      renderFractal();
    }

    function resetView() {
      centerX = mode === 'mandel' ? -0.75 : 0.0;
      centerY = 0.0;
      zoom = 1.0;
      maxIter = 80;
      document.getElementById('rngIter').value = 80;
      updateVars();
      renderFractal();
    }

    function updateVars() {
      maxIter = parseInt(document.getElementById('rngIter').value);
      juliaRe = parseFloat(document.getElementById('rngJulia').value);
      document.getElementById('valIter').textContent = maxIter;
      document.getElementById('valJulia').textContent = `${juliaRe.toFixed(2)} + 0.60i`;
      document.getElementById('hudCoord').textContent = `Re: ${centerX.toFixed(3)}, Im: ${centerY.toFixed(3)}`;
      document.getElementById('hudZoom').textContent = zoom.toFixed(2) + 'x';
    }

    // Color mapper
    function getColor(iter, max) {
      if (iter === max) return [0, 0, 0];
      const norm = iter / max;
      if (palette === 'cosmic') {
        const r = Math.floor(Math.sin(norm * Math.PI * 4) * 127 + 128);
        const g = Math.floor(Math.sin(norm * Math.PI * 2) * 60 + 60);
        const b = Math.floor(Math.cos(norm * Math.PI * 3) * 127 + 128);
        return [r, g, b];
      } else if (palette === 'fire') {
        const r = Math.min(255, Math.floor(norm * 3 * 255));
        const g = Math.min(255, Math.floor(Math.max(0, norm - 0.3) * 3 * 255));
        const b = Math.min(255, Math.floor(Math.max(0, norm - 0.7) * 4 * 255));
        return [r, g, b];
      } else {
        // Aurora
        const r = Math.floor(norm * 80);
        const g = Math.min(255, Math.floor(norm * 280));
        const b = Math.min(255, Math.floor(norm * 200 + 40));
        return [r, g, b];
      }
    }

    function renderFractal() {
      if (!width || !height) return;
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      const scale = 3.0 / (zoom * Math.min(width, height));
      const halfW = width / 2;
      const halfH = height / 2;

      for (let py = 0; py < height; py++) {
        for (let px = 0; px < width; px++) {
          let cr, ci, zr, zi;
          if (mode === 'mandel') {
            cr = centerX + (px - halfW) * scale;
            ci = centerY + (py - halfH) * scale;
            zr = 0; zi = 0;
          } else {
            cr = juliaRe;
            ci = juliaIm;
            zr = centerX + (px - halfW) * scale;
            zi = centerY + (py - halfH) * scale;
          }

          let iter = 0;
          while (zr * zr + zi * zi <= 4 && iter < maxIter) {
            const nextZr = zr * zr - zi * zi + cr;
            zi = 2 * zr * zi + ci;
            zr = nextZr;
            iter++;
          }

          const [r, g, b] = getColor(iter, maxIter);
          const idx = (py * width + px) * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // Drag to Pan
    const stage = document.getElementById('stage');
    stage.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;
      const scale = 3.0 / (zoom * Math.min(width, height));
      centerX -= dx * scale;
      centerY -= dy * scale;
      updateVars();
      renderFractal();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // Wheel to Zoom
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.25 : 0.8;
      zoomIn(factor);
    }, { passive: false });

    function toggleFs() {
      const container = document.getElementById('simContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '✕ Exit full screen';
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '⛶ Full Screen';
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.getElementById('bFs').innerHTML = isFs ? '✕ Exit full screen' : '⛶ Full Screen';
      setTimeout(resize, 100);
    });

    resize();
    updateVars();
  </script>




<!-- ================= FULLSCREEN ENGINE CONTROLLER ================= -->
<script id="genz-simulation-fullscreen-engine">
(function() {
  function findSimulationRootContainer(el) {
    if (el) {
      if (typeof el === "string") {
        var cleanId = el.replace(/^fs-?/, "");
        var byId = document.getElementById(cleanId) || document.getElementById(el) || document.getElementById(cleanId + "SimBox");
        if (byId) {
          byId.classList.add("simulation-wrapper");
          return byId;
        }
      }
      if (el.nodeType === 1) {
        if (el.dataset && el.dataset.fs) {
          var targetByFs = document.getElementById(el.dataset.fs);
          if (targetByFs) {
            targetByFs.classList.add("simulation-wrapper");
            return targetByFs;
          }
        }
        if (el.dataset && el.dataset.target) {
          var cleanTargetId = el.dataset.target.replace(/^fs-?/, "");
          var targetByData = document.getElementById(cleanTargetId) || document.getElementById(el.dataset.target);
          if (targetByData) {
            targetByData.classList.add("simulation-wrapper");
            return targetByData;
          }
        }
        var found = el.closest(".simulation-wrapper, .sim-box, .sim-stage, .simulation, #sim, #simContainer, .card, .main-stage, .stage, .container, .sim");
        if (found && found !== document.body && found !== document.documentElement) {
          found.classList.add("simulation-wrapper");
          return found;
        }
      }
    }
    var candidate = document.querySelector(".simulation-wrapper") ||
                    document.getElementById("simContainer") ||
                    document.getElementById("sim") ||
                    document.querySelector(".sim-stage") ||
                    document.querySelector(".sim-box") ||
                    document.querySelector(".simulation") ||
                    document.querySelector(".sim") ||
                    document.querySelector(".card") ||
                    document.querySelector(".main-stage") ||
                    document.querySelector(".container") ||
                    document.body;
    if (candidate && candidate !== document.documentElement) {
      candidate.classList.add("simulation-wrapper");
      return candidate;
    }
    document.body.classList.add("simulation-wrapper");
    return document.body;
  }

  function toggleSimulationFullscreen(triggerEl) {
    try {
      if (!document.fullscreenElement) {
        var container = findSimulationRootContainer(triggerEl);
        if (container && container.requestFullscreen) {
          container.requestFullscreen().catch(function(err) {
            console.error("Fullscreen request failed:", err);
            if (document.body && document.body.requestFullscreen) {
              document.body.classList.add("simulation-wrapper");
              document.body.requestFullscreen().catch(function(e) { console.error(e); });
            }
          });
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function(err) {
            console.error("Exit fullscreen error:", err);
          });
        }
      }
    } catch (err) {
      console.error("Fullscreen toggle error:", err);
    }
  }

  // Override/intercept all simulation fullscreen function names
  window.toggleFullscreen = function(target) {
    toggleSimulationFullscreen(target || this);
  };
  window.toggleSimFullscreen = function(boxId) {
    var el = boxId ? document.getElementById(boxId) : this;
    toggleSimulationFullscreen(el || boxId);
  };
  window.toggleFs = function() {
    toggleSimulationFullscreen(this);
  };
  window.openFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) {
        ov.classList.remove("active");
        ov.style.display = "none";
      }
      var clean = id.replace(/^fs-?/, "");
      var target = document.getElementById(clean) ||
                   document.getElementById(clean + "SimBox") ||
                   document.getElementById("t-" + clean) ||
                   document.querySelector("[data-topic="" + clean + ""]") ||
                   document.getElementById(id);
      toggleSimulationFullscreen(target || clean);
      return;
    }
    toggleSimulationFullscreen(this);
  };
  window.launchFullscreen = function(topicId) {
    window.openFullscreen(topicId);
  };
  window.closeFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) ov.classList.remove("active");
    }
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };
  window.exitSimFullscreen = function() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };

  // Canvas Re-sizing and Redrawing on fullscreen change and window resize
  function resizeAndRedrawSimulationCanvases() {
    window.dispatchEvent(new Event("resize"));

    document.querySelectorAll("canvas").forEach(function(cv) {
      try {
        var rect = cv.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          if (cv.width === 0 || cv.height === 0) {
            cv.width = rect.width;
            cv.height = rect.height;
          }
        }
      } catch(e) {}
    });

    var redrawFns = [
      "draw", "render", "animate", "redraw", "update", "drawCanvas",
      "drawBohrModel", "drawScaleCanvas", "drawTitrationCanvas",
      "resizeMeasureCanvas", "updateSimulation", "drawScene", "drawOrbit",
      "drawWaves", "drawField", "drawCircuit", "drawGenetics"
    ];
    redrawFns.forEach(function(fn) {
      if (typeof window[fn] === "function") {
        try { window[fn](); } catch(e) {}
      }
    });
  }

  document.addEventListener("fullscreenchange", function() {
    var isFs = !!document.fullscreenElement;
    var fsButtons = document.querySelectorAll(
      ".b-fs, .b-exit, [data-role="fs-btn"], .fs-btn, .btn-fs, .fullscreen-btn, #bFs, #fsExitBtn, .fs-exit, #btnFullscreen, #fullscreenBtn, [data-fs], #psFsBtn, #fsToggleBtn, [id*="fsToggleBtn"], #fsBtn, #btnFsMoon, #seFsBtn, #dnFsBtn, #waterFsBtn"
    );
    fsButtons.forEach(function(btn) {
      if (btn.classList.contains("fs-exit-btn") || btn.classList.contains("fs-exit")) {
        return;
      }
      if (isFs) {
        btn.innerHTML = "✕ Exit full screen";
        btn.classList.add("is-fullscreen-active");
      } else {
        btn.innerHTML = "⛶ Full screen";
        btn.classList.remove("is-fullscreen-active");
      }
    });

    resizeAndRedrawSimulationCanvases();
    setTimeout(resizeAndRedrawSimulationCanvases, 50);
    setTimeout(resizeAndRedrawSimulationCanvases, 150);
    setTimeout(resizeAndRedrawSimulationCanvases, 300);
  });

  window.addEventListener("resize", resizeAndRedrawSimulationCanvases);

  // Event delegation to capture clicks on any built-in fullscreen button reliably
  document.addEventListener("click", function(e) {
    var btn = e.target.closest(
      "button.b-fs, button.b-exit, button[data-role="fs-btn"], button.fs-btn, button.btn-fs, button.fullscreen-btn, button#bFs, button#fsExitBtn, button.fs-exit, button#btnFullscreen, button#fullscreenBtn, button[data-fs], button#psFsBtn, button#fsToggleBtn, button[id*="fsToggleBtn"], button#fsBtn, button#btnFsMoon, button#seFsBtn, button#dnFsBtn, button#waterFsBtn, button.icon-btn[onclick*="toggleSimFullscreen"]"
    );
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      toggleSimulationFullscreen(btn);
    }
  }, true);
})();
</script>

</body>
</html>
