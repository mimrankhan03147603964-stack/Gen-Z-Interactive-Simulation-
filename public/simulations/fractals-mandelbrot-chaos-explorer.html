<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractals, Chaos Theory & Mandelbrot Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: system-ui, -apple-system, sans-serif; color: #f9fafb; }
    .sim { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
    .stage { flex: 1 1 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; cursor: grab; }
    .stage:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    .ctl {
      flex-shrink: 0;
      width: 100%;
      background: rgba(8, 6, 22, 0.96);
      border-top: 1.5px solid rgba(245, 158, 11, 0.45);
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(16px);
      z-index: 20;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .row span.lbl { font-size: 11px; font-weight: 800; color: #fcd34d; text-transform: uppercase; letter-spacing: 0.05em; min-width: 90px; }
    .btn {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: #fff;
    }
    .btn:hover { transform: translateY(-1.5px); filter: brightness(1.15); }
    .btn:active { transform: translateY(1px); }
    .b-set { background: #78350f; border-color: #f59e0b; }
    .b-set.active { background: #d97706; border-color: #fde68a; box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }
    .b-pal { background: #1e1b4b; border-color: #6366f1; }
    .b-pal.active { background: #4f46e5; border-color: #a5b4fc; }
    .b-reset { background: #374151; border-color: #6b7280; }
    .b-fs { background: linear-gradient(135deg, #f59e0b, #ef4444); border-color: #fca5a5; margin-left: auto; }
    .slider-box { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #fde68a; }
    input[type=range] { accent-color: #f59e0b; width: 110px; cursor: pointer; }
    .hud { position: absolute; top: 12px; left: 14px; background: rgba(15, 8, 30, 0.88); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 12px; padding: 10px 14px; font-size: 11px; line-height: 1.5; pointer-events: none; backdrop-filter: blur(8px); }
    .hud b { color: #fde047; }
    .hud .coord { font-family: monospace; color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="sim" id="simContainer">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">
        <b>Fractal Mathematics & Complex Dynamics</b><br/>
        Equation: <span style="color:#fde047; font-family:monospace; font-weight:900;">z_{n+1} = z_n² + c</span><br/>
        Center: <span class="coord" id="hudCoord">Re: -0.750, Im: 0.000</span><br/>
        Zoom Scale: <span id="hudZoom" style="color:#34d399; font-weight:900;">1.00x</span> |
        Mode: <span id="hudMode" style="color:#67e8f9; font-weight:900;">Mandelbrot Set</span>
      </div>
    </div>
    <div class="ctl">
      <div class="row">
        <span class="lbl">Fractal Type</span>
        <button class="btn b-set active" id="btnMandel" onclick="setMode('mandel')">🌌 Mandelbrot Set</button>
        <button class="btn b-set" id="btnJulia" onclick="setMode('julia')">✨ Julia Set Morph</button>
        <button class="btn b-pal active" id="btnPal1" onclick="setPalette('cosmic')">🔮 Cosmic Violet</button>
        <button class="btn b-pal" id="btnPal2" onclick="setPalette('fire')">🔥 Solar Fire</button>
        <button class="btn b-pal" id="btnPal3" onclick="setPalette('aurora')">🟢 Emerald Aurora</button>
        <button class="btn b-reset" onclick="resetView()">⟳ Reset View</button>
        <button class="btn b-fs" id="bFs" onclick="toggleFs()">⛶ Full Screen</button>
      </div>
      <div class="row">
        <span class="lbl">Parameters</span>
        <div class="slider-box">
          Max Iterations:
          <input type="range" id="rngIter" min="30" max="300" step="10" value="80" oninput="updateVars()" />
          <span id="valIter">80</span>
        </div>
        <div class="slider-box">
          Julia Parameter (c):
          <input type="range" id="rngJulia" min="-1.5" max="1.5" step="0.05" value="-0.4" oninput="updateVars()" />
          <span id="valJulia">-0.40 + 0.60i</span>
        </div>
        <div class="slider-box">
          Quick Zoom:
          <button class="btn b-set" onclick="zoomIn(2.0)">🔍 Zoom In (2x)</button>
          <button class="btn b-set" onclick="zoomIn(0.5)">🔎 Zoom Out</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    let width, height;
    let mode = 'mandel'; // 'mandel' or 'julia'
    let palette = 'cosmic';
    let maxIter = 80;
    let juliaRe = -0.4, juliaIm = 0.6;

    let centerX = -0.75, centerY = 0.0;
    let zoom = 1.0;

    let isDragging = false;
    let startX = 0, startY = 0;

    function resize() {
      const rect = cv.parentElement.getBoundingClientRect();
      width = cv.width = Math.min(960, Math.floor(rect.width * 0.75));
      height = cv.height = Math.min(540, Math.floor(rect.height * 0.75));
      renderFractal();
    }
    window.addEventListener('resize', resize);

    function setMode(m) {
      mode = m;
      document.getElementById('btnMandel').classList.toggle('active', m === 'mandel');
      document.getElementById('btnJulia').classList.toggle('active', m === 'julia');
      document.getElementById('hudMode').textContent = m === 'mandel' ? 'Mandelbrot Set' : 'Julia Set Morph';
      if (m === 'julia') { centerX = 0.0; centerY = 0.0; }
      else { centerX = -0.75; centerY = 0.0; }
      zoom = 1.0;
      updateVars();
      renderFractal();
    }

    function setPalette(p) {
      palette = p;
      document.getElementById('btnPal1').classList.toggle('active', p === 'cosmic');
      document.getElementById('btnPal2').classList.toggle('active', p === 'fire');
      document.getElementById('btnPal3').classList.toggle('active', p === 'aurora');
      renderFractal();
    }

    function zoomIn(factor) {
      zoom *= factor;
      updateVars();
      renderFractal();
    }

    function resetView() {
      centerX = mode === 'mandel' ? -0.75 : 0.0;
      centerY = 0.0;
      zoom = 1.0;
      maxIter = 80;
      document.getElementById('rngIter').value = 80;
      updateVars();
      renderFractal();
    }

    function updateVars() {
      maxIter = parseInt(document.getElementById('rngIter').value);
      juliaRe = parseFloat(document.getElementById('rngJulia').value);
      document.getElementById('valIter').textContent = maxIter;
      document.getElementById('valJulia').textContent = `${juliaRe.toFixed(2)} + 0.60i`;
      document.getElementById('hudCoord').textContent = `Re: ${centerX.toFixed(3)}, Im: ${centerY.toFixed(3)}`;
      document.getElementById('hudZoom').textContent = zoom.toFixed(2) + 'x';
    }

    // Color mapper
    function getColor(iter, max) {
      if (iter === max) return [0, 0, 0];
      const norm = iter / max;
      if (palette === 'cosmic') {
        const r = Math.floor(Math.sin(norm * Math.PI * 4) * 127 + 128);
        const g = Math.floor(Math.sin(norm * Math.PI * 2) * 60 + 60);
        const b = Math.floor(Math.cos(norm * Math.PI * 3) * 127 + 128);
        return [r, g, b];
      } else if (palette === 'fire') {
        const r = Math.min(255, Math.floor(norm * 3 * 255));
        const g = Math.min(255, Math.floor(Math.max(0, norm - 0.3) * 3 * 255));
        const b = Math.min(255, Math.floor(Math.max(0, norm - 0.7) * 4 * 255));
        return [r, g, b];
      } else {
        // Aurora
        const r = Math.floor(norm * 80);
        const g = Math.min(255, Math.floor(norm * 280));
        const b = Math.min(255, Math.floor(norm * 200 + 40));
        return [r, g, b];
      }
    }

    function renderFractal() {
      if (!width || !height) return;
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      const scale = 3.0 / (zoom * Math.min(width, height));
      const halfW = width / 2;
      const halfH = height / 2;

      for (let py = 0; py < height; py++) {
        for (let px = 0; px < width; px++) {
          let cr, ci, zr, zi;
          if (mode === 'mandel') {
            cr = centerX + (px - halfW) * scale;
            ci = centerY + (py - halfH) * scale;
            zr = 0; zi = 0;
          } else {
            cr = juliaRe;
            ci = juliaIm;
            zr = centerX + (px - halfW) * scale;
            zi = centerY + (py - halfH) * scale;
          }

          let iter = 0;
          while (zr * zr + zi * zi <= 4 && iter < maxIter) {
            const nextZr = zr * zr - zi * zi + cr;
            zi = 2 * zr * zi + ci;
            zr = nextZr;
            iter++;
          }

          const [r, g, b] = getColor(iter, maxIter);
          const idx = (py * width + px) * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // Drag to Pan
    const stage = document.getElementById('stage');
    stage.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;
      const scale = 3.0 / (zoom * Math.min(width, height));
      centerX -= dx * scale;
      centerY -= dy * scale;
      updateVars();
      renderFractal();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // Wheel to Zoom
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.25 : 0.8;
      zoomIn(factor);
    }, { passive: false });

    function toggleFs() {
      const container = document.getElementById('simContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '✕ Exit full screen';
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '⛶ Full Screen';
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.getElementById('bFs').innerHTML = isFs ? '✕ Exit full screen' : '⛶ Full Screen';
      setTimeout(resize, 100);
    });

    resize();
    updateVars();
  </script>
</body>
</html>
