*{box-sizing:border-box}
html{font-size:clamp(13px,.95vw,18px)}
body{margin:0;min-width:1000px;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif}
#app{display:flex;height:100vh;background:linear-gradient(135deg,#e6e0ff,#dff3ff)}
#sw{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 10px 40px rgba(70,30,140,.35)}
#world{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;transition:transform .9s ease;background:var(--img) no-repeat;background-size:1672px 941px}
.w{position:absolute;transition:transform 1.2s ease,filter 1s}
.o{position:absolute;inset:0;background:var(--img) no-repeat;background-size:1672px 941px;-webkit-mask-image:radial-gradient(closest-side,#000 80%,transparent 100%);mask-image:radial-gradient(closest-side,#000 80%,transparent 100%);animation:var(--k) var(--d) ease-in-out var(--dl) infinite}
@keyframes sw{0%,100%{transform:rotate(calc(var(--a)*-1))}50%{transform:rotate(var(--a))}}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(0,var(--a))}}
@keyframes bx{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--a),0)}}
@keyframes pl{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(var(--a));filter:brightness(1.3)}}
.o.hl{animation-duration:.5s!important;filter:brightness(1.55) saturate(1.3)}
#fx{position:absolute;left:0;top:0;width:1672px;height:941px;z-index:10;pointer-events:none}
.g{opacity:0;transition:opacity .4s}.g.on{opacity:1}
.rg{fill:none;stroke-width:8;stroke-dasharray:18 12;animation:rt 4s linear infinite}
@keyframes rt{to{stroke-dashoffset:-120}}
.pt{position:absolute;z-index:20;width:60px;height:60px;line-height:60px;text-align:center;pointer-events:none}
#side{width:clamp(370px,28vw,500px);padding:12px;overflow:auto;background:rgba(255,255,255,.78);display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:1.3rem;color:#5b1aa0;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:5px}
.b{border:0;border-radius:11px;padding:7px 8px;font:700 .86rem system-ui,Arial;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:1 1 auto}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.b:disabled{opacity:.4}.b.sel{outline:3px solid #222}
.card{background:#fff;border-radius:14px;padding:9px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#nm{font-size:1.2rem;font-weight:800}#fn{margin:4px 0 0;font-size:.95rem;line-height:1.4;color:#333}
#msg{min-height:4.4rem;font-size:.98rem;font-weight:700;color:#0a5f2d;background:#eaffef;border-radius:12px;padding:9px}
.lab{font-size:.75rem;font-weight:800;color:#666}
#q{font-size:1.05rem;font-weight:800;margin-bottom:6px}

const K=Object.keys(PT);
F.innerHTML=K.map(k=>`<g class="g" id="p_${k}">`+PT[k].r.map(r=>`<ellipse class="rg" stroke="${PT[k].c}" cx="${r[0]}" cy="${r[1]}" rx="${r[2]}" ry="${r[3]}"/>`).join('')+'</g>').join('');
let AC,snd=1,run=0,qm=0,spd=1,my=1,ht,syn=0;
function tone(f,t=.2,ty='sine',v=.08,d=0){if(!snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+t)}catch(e){}}
const say=t=>$('#msg').textContent=t;
function trail(e,p,dur,sz=44){dur/=spd;const d=document.createElement('div');d.className='pt';d.textContent=e;d.style.fontSize=sz+'px';d.style.left=p[0][0]-30+'px';d.style.top=p[0][1]-30+'px';W.appendChild(d);const n=p.length-1;
 return d.animate(p.map((q,i)=>({transform:`translate(${q[0]-p[0][0]}px,${q[1]-p[0][1]}px) scale(${i&&i<n?1:.4})`,opacity:i&&i<n?1:0,offset:i/n})),{duration:dur,easing:'linear'}).finished.then(()=>d.remove())}
function clr(){clearTimeout(ht);K.forEach(k=>$('#p_'+k).classList.remove('on'))}
function zoom(cx,cy,s){const hw=836/s,hh=470/s;cx=Math.max(hw,Math.min(1672-hw,cx));cy=Math.max(hh,Math.min(941-hh,cy));W.style.transform=`translate(${836-cx*s}px,${470-cy*s}px) scale(${s})`}
const full=()=>zoom(836,470,1);
function show(k,z=1,ms=6500){clr();$('#p_'+k).classList.add('on');if(z)zoom(...PT[k].z);ht=setTimeout(clr,ms)}
function sel(k,keep){document.querySelectorAll('.row .b[data-k]').forEach(b=>b.classList.toggle('sel',b.dataset.k===k));qm=0;$('#quiz').hidden=true;$('#learn').hidden=false;const t=PT[k];
 $('#nm').innerHTML=`<span style="color:${t.c}">${t.n}</span>`;$('#fn').textContent=t.f;show(k,1,keep?9e5:6500);say(t.n+': '+t.f);tone(380+K.indexOf(k)*40,.2)}
K.forEach(k=>{const b=document.createElement('button');b.className='b';b.dataset.k=k;b.style.background=PT[k].c;b.textContent=PT[k].n;b.onclick=()=>{run++;sel(k)};$('#t'+PT[k].g).appendChild(b)});
const AX=[[120,330],[200,400],[262,460],[345,505],[400,535],[435,590],[447,640],[430,690],[395,730],[380,765],[420,810],[530,850]];
async function neuron(){zoom(320,560,1.45);clr();say('A message (electric signal) starts at the dendrites.');$('#p_dendrites').classList.add('on');const T=my?3600:8000;tone(500,.15);
 const p=trail('⚡',AX,T,50);for(let i=0;i<6;i++)setTimeout(()=>{flash('M'+i,my?500:1200);tone(600+i*60,.1)},(T/spd)*(.35+i*.1));
 await wait(T/spd*.3);say('It goes through the cell body...');await wait(T/spd*.35);say(my?'With myelin the message jumps quickly along the axon!':'Without myelin the message is much slower!');await p;flash('AT',1200);say('The message reaches the axon terminals. It is ready to pass to the next cell.');tone(900,.3);clr()}
async function reflex(){zoom(1290,430,1.55);clr();const H=mv.HD.e,M=mv.MS.e;say('Step 1: The finger touches a sharp pin (stimulus).');$('#p_stimulus').classList.add('on');flash('PN',1500);tone(300,.2,'square',.05);await wait(1400/spd);
 say('Step 2: The sensory neuron carries the message to the spinal cord.');$('#p_sensory').classList.add('on');await trail('⚡',[[1030,405],[1075,402],[1120,385],[1185,350],[1250,335],[1300,337]],1800);
 say('Step 3: The interneuron passes it to the motor neuron.');$('#p_spinal').classList.add('on');flash('SC',1400);await trail('⚡',[[1300,337],[1335,350],[1380,345],[1385,380]],1100);
 say('Step 4: The motor neuron sends the command to the muscle.');$('#p_motor').classList.add('on');await trail('⚡',[[1385,380],[1440,395],[1490,415],[1520,468]],1500);
 say('Step 5: The muscle squeezes and the hand pulls away. This is the reflex response!');tone(700,.2);H.style.transition='transform .25s';H.style.transform='translate(-90px,50px) rotate(-12deg)';M.style.transform='scale(.9,.88) rotate(-3deg)';flash('MS',1500);await wait(2200);H.style.transform='';M.style.transform='';
 say('A reflex is fast because the message goes to the spinal cord, not the brain. The brain is told later, so you feel the pain.');full();await trail('⚡',[[1300,300],[1100,235],[930,260],[820,280]],2200,44);flash('BR',1500);tone(900,.3);clr()}
async function toBrain(){full();clr();say('Sensory messages travel UP the spinal cord to the brain.');for(let i=0;i<4;i++){trail('⚡',[[805,860],[805,650],[800,500],[790,400],[775,330]],2600,46);await wait(500)}await wait(2300);flash('BR',1500);say('The brain understands the message: "I feel it!"');tone(850,.3)}
async function fromBrain(){full();clr();flash('BR',1000);say('The brain sends commands DOWN the spinal cord to the body.');for(let i=0;i<4;i++){trail('⚡',[[775,330],[790,400],[800,500],[805,650],[805,800],i%2?[700,880]:[920,880]],2800,46);await wait(500)}await wait(2400);say('The muscles get the command and move.');tone(500,.3)}
const SY=[async()=>{say('Step 1: An electric signal reaches the end of the presynaptic neuron.');show('pre');await trail('⚡',[[850,790],[930,790],[1030,790]],1500)},
async()=>{say('Step 2: Vesicles (small bags) move to the edge of the neuron tip.');show('pre',0);const v=mv.VS.e;v.style.transform='translate(48px,0)';flash('VS',1500);await wait(1600)},
async()=>{say('Step 3: The vesicles open and release neurotransmitters into the gap.');show('neuro',0);const a=[];for(let i=0;i<12;i++){a.push(trail('🟠',[[1120,790+(rp()-.5)*40],[1200,735+rp()*110],[1288,735+rp()*110]],2200+rp()*500,30));await wait(120)}tone(600,.2);await Promise.all(a)},
async()=>{say('Step 4: The neurotransmitters fit into the receptors, like a key in a lock.');show('receptor',0);flash('RC',1800);tone(800,.15);tone(1000,.25,'sine',.08,.12);await wait(1800)},
async()=>{say('Step 5: The postsynaptic neuron gets the message and sends it on!');show('post',0);mv.VS.e.style.transform='';await trail('⚡',[[1340,790],[1450,785],[1560,790],[1630,780]],1800);tone(900,.3)}];
async function synAll(){zoom(1230,790,1.8);for(const s of SY){await s();await wait(900/spd)}say('Synaptic transmission complete: signal → vesicles → neurotransmitters → receptors → next neuron.');clr()}
async function synNext(){zoom(1230,790,1.8);if(syn>=5){syn=0;mv.VS.e.style.transform=''}await SY[syn++]()}
const PRC=[['⚡ Neuron Signal','#7a2bd6',neuron],['🖐️ Reflex Action','#d03030',reflex],['⬆️ Message to Brain','#2b7fd6',toBrain],['⬇️ Command from Brain','#1c8a1c',fromBrain],['🔗 Synapse: Play All','#ff7a00',synAll],['➡️ Synapse: Next Step','#e0197d',synNext]];
PRC.forEach(p=>{const b=document.createElement('button');b.className='b';b.style.background=p[1];b.textContent=p[0];b.onclick=()=>{if(p[0].includes('Next'))p[2]();else{run++;syn=0;mv.VS.e.style.transform='';p[2]()}};$('#procs').appendChild(b)});

[['s1',.5,'Slow Motion'],['s2',1,'Normal'],['s3',2,'Fast']].forEach(s=>$('#'+s[0]).onclick=()=>{spd=s[1];say('Signal speed: '+s[2]);['s1','s2','s3'].forEach(x=>$('#'+x).classList.toggle('sel',x===s[0]))});

const QZ=[['Which part receives messages from other neurons?',['Dendrites','Axon','Myelin','Muscle'],'dendrites'],['Which part is the control centre of a neuron?',['Cell Body','Axon Terminal','Myelin','Receptor'],'cellbody'],['Which long wire carries the message away from the cell body?',['Axon','Dendrite','Stimulus','Brain'],'axon'],['Myelin sheath helps the message travel ...',['faster','slower','backwards','nowhere'],'myelin'],['Which neuron carries the message from skin to spinal cord?',['Sensory neuron','Motor neuron','Muscle','Receptor'],'sensory'],['Which neuron carries the command to the muscle?',['Motor neuron','Sensory neuron','Dendrite','Brain'],'motor'],['In a reflex, who decides quickly?',['Spinal cord','Eye','Stomach','Heart'],'spinal'],['What are the chemical messengers called?',['Neurotransmitters','Myelin','Dendrites','Muscles'],'neuro'],['What catches the neurotransmitters on the next neuron?',['Receptors','Axon','Stimulus','Bones'],'receptor'],['What is the control centre of the whole body?',['Brain','Muscle','Skin','Receptor'],'brain']];
let qs,qi,score;

 q[1].slice().sort(()=>rp()-.5).forEach(t=>{const b=document.createElement('button');b.className='b';b.style.background='#5b3fd0';b.textContent=t;b.onclick=()=>{
