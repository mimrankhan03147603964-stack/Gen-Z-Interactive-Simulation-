/* ---------------- sound ---------------- */
let soundOn=true,ac;
function tone(f,d,t="triangle",v=.18,w=0){if(!soundOn)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+w;g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const good=()=>{tone(660,.15);tone(880,.2,"triangle",.18,.12)},bad=()=>tone(150,.3,"sawtooth",.1),win=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,"triangle",.2,i*.12));
function say(t,lang="en-US"){if(!soundOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.8;u.pitch=1.2;speechSynthesis.speak(u)}
function sayItem(){const m=MODS[cur];if(!m)return;if(m.ur){const v=window.speechSynthesis&&speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("ur"));if(v){say(U[ci][0],"ur-PK")}else say(`${U[ci][1]}. ${U[ci][3]}`)}else say(m.sp(ci))}
function burst(){const st=$("#stage");for(let i=0;i<26;i++){const p=document.createElement("div");p.className="sp";p.textContent=["⭐","🎉","✨","🎈","🌟"][i%5];p.style.left="620px";p.style.top="300px";st.appendChild(p);const a=Math.random()*6.28,d=160+Math.random()*340;p.animate([{transform:"scale(.4)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d*.7}px) rotate(${Math.random()*540}deg) scale(1.3)`,opacity:0}],{duration:1000+Math.random()*700,easing:"ease-out"}).onfinish=()=>p.remove()}}
/* ---------------- decor / home ---------------- */
const dc=$("#deco");["⭐","✨","🎈","🌈","☁️","🦋","🌸","🎨","🔤","🍎","🐥"].forEach((e,k)=>{for(let j=0;j<2;j++){const s=document.createElement("div");s.className="dc";s.textContent=e;s.style.left=Math.random()*1220+"px";s.style.top=(300+Math.random()*500)+"px";s.style.fontSize=(24+Math.random()*34)+"px";s.style.animationDuration=(16+Math.random()*18)+"s";s.style.animationDelay=-Math.random()*20+"s";dc.appendChild(s)}});
$("#h1").innerHTML=[..."ECCE Learning World"].map((c,i)=>c==" "?" ":`<span style="color:hsl(${i*38} 95% 62%);animation-delay:${i*.1}s">${c}</span>`).join("");
$("#today").textContent="📅 Today is "+new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
Object.keys(MODS).forEach(k=>{const m=MODS[k],d=document.createElement("div");d.className="mc "+m.cls;
d.innerHTML=`<div class="em">${em(m.em,84)}</div><div class="gi ${m.ur?"ur":""}" style="direction:ltr">${m.g}</div><div class="nm ${m.ur?"ur":""}">${m.nm}</div><div class="row"><button class="bt y" style="color:#5a3a00;text-shadow:none" data-a="l">▶ Learn</button><button class="bt k" data-a="q">🎮 Quiz</button></div>`;
d.onclick=e=>{const a=e.target.closest("[data-a]");openMod(k);if(a&&a.dataset.a=="q")startQuiz()};$("#cards").appendChild(d)});
/* ---------------- navigation ---------------- */
let cur=null,ci=0,autoT=null,qs=[],qn=0,score=0,qt=0;
function view(v,title){["home","mod","qz"].forEach(x=>$("#"+x).classList.toggle("on",x==v));$("#hm").style.display=v=="home"?"none":"inline-flex";$("#tt").innerHTML=title||"";$("#tt").className=(cur&&MODS[cur]&&MODS[cur].ur&&v!="home")?"ur":"";$("#stage").style.setProperty("--bg",(v=="home"||!cur)?"linear-gradient(135deg,#4facfe,#00f2fe,#a8ff78,#4facfe)":MODS[cur].bg)}
function goHome(){qt++;stopAuto();try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}$("#wr").style.display="none";cur=null;view("home","")}
function openMod(k){cur=k;const m=MODS[k];ci=m.start||0;const s=$("#strip");s.innerHTML="";const p=m.rows,w=Math.floor((1200-8*(p-1))/p);
for(let i=0;i<m.n;i++){const b=document.createElement("button");b.className="bt "+CLS[i%8]+(m.ur?" ur":"");b.style.width=w+"px";b.style.fontSize=m.ur?"34px":"28px";b.style.lineHeight=m.ur?"1.5":"";b.textContent=m.lab(i);b.onclick=()=>{ci=i;render(1)};s.appendChild(b)}
view("mod",m.t);render(0)}
function render(sp){const m=MODS[cur],c=m.card(ci);$("#cl").innerHTML=c[0];$("#cr").innerHTML=c[1];["#cl","#cr"].forEach(q=>{const e=$(q);e.classList.remove("flip");void e.offsetWidth;e.classList.add("flip")});
[...$("#strip").children].forEach((b,i)=>b.classList.toggle("on",i==ci));if(sp)sayItem()}
const step=d=>{const m=MODS[cur];ci=(ci+d+m.n)%m.n;render(1)};
$("#pv").onclick=()=>step(-1);$("#nx").onclick=()=>step(1);$("#ls").onclick=sayItem;$("#rd").onclick=()=>{ci=Math.random()*MODS[cur].n|0;render(1)};
$("#hm").onclick=goHome;
function stopAuto(){clearInterval(autoT);autoT=null;$("#au").innerHTML="🔁 Auto Play"}
$("#au").onclick=()=>{if(autoT)return stopAuto();$("#au").innerHTML="⏸ Stop Auto";autoT=setInterval(()=>step(1),3500);step(1)};
$("#snd").onclick=function(){soundOn=!soundOn;this.innerHTML=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(!soundOn&&window.speechSynthesis)speechSynthesis.cancel()};
document.addEventListener("click",e=>{const s=e.target.closest("[data-s]");if(s)sayItem();const k=e.target.closest("[data-k]");if(k){k.classList.remove("pp");void k.offsetWidth;k.classList.add("pp");say(k.dataset.k);tone(400+k.dataset.k*30,.12)}});
document.addEventListener("keydown",e=>{if(!cur||$("#qz").classList.contains("on"))return;if(e.key=="ArrowRight")step(1);if(e.key=="ArrowLeft")step(-1);if(e.code=="Space"){e.preventDefault();sayItem()}});
/* ---------------- quiz ---------------- */
$("#qb").onclick=()=>{stopAuto();startQuiz()};
function startQuiz(){qt++;qs=MODS[cur].quiz();qn=0;score=0;view("qz","🎮 "+MODS[cur].t);showQ()}
$("#qx").onclick=()=>{qt++;if(cur)view("mod",MODS[cur].t)};
function showQ(){if(!cur)return;const tk=qt,m=MODS[cur];if(qn>=qs.length)return resQ();const q=qs[qn];$("#qi").innerHTML=`Question ${qn+1} / ${qs.length} &nbsp;•&nbsp; ⭐ Score: ${score}`;$("#qp i").style.width=qn/qs.length*100+"%";
$("#qa").innerHTML=q.p+`<div style="margin-top:6px"><button class="bt g" id="hq" style="height:44px;font-size:18px;padding:0 18px">🔊 Hear question</button></div>`;$("#hq").onclick=()=>say(q.s);
const c=$("#qc");c.innerHTML="";q.c.forEach((i,k)=>{const b=document.createElement("button");b.className="bt "+CLS[(k*2+qn)%8]+(m.ur?" ur":"");b.innerHTML=m.lab(i);if(m.ur)b.style.lineHeight="1.6";b.onclick=()=>{if(c.dataset.l)return;c.dataset.l=1;if(i===q.a){b.classList.add("ok");score+=10;good();burst()}else{b.classList.add("no");bad();[...c.children][q.c.indexOf(q.a)].classList.add("ok")}setTimeout(()=>{if(tk!==qt||!cur)return;delete c.dataset.l;qn++;showQ()},1400)};c.appendChild(b)});setTimeout(()=>say(q.s),300)}
function resQ(){const st=score>=80?3:score>=50?2:1;$("#qi").textContent="";$("#qp i").style.width="100%";$("#qc").innerHTML="";$("#qa").innerHTML=`<div id="res"><div class="st">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><h2>${st==3?"Super Star!":st==2?"Well Done!":"Good Try!"}</h2><p>You scored ${score} out of 100</p><button class="bt g" id="pa" style="height:64px;font-size:26px;padding:0 30px">🔁 Play Again</button> <button class="bt b" id="bl" style="height:64px;font-size:26px;padding:0 30px">📘 Back to Learn</button> <button class="bt o" id="bh" style="height:64px;font-size:26px;padding:0 30px">🏠 Home</button></div>`;win();burst();say("Well done!");$("#pa").onclick=startQuiz;$("#bl").onclick=()=>{if(cur)view("mod",MODS[cur].t)};$("#bh").onclick=goHome}
/* ---------------- writing pad ---------------- */
const wc=$("#wc"),wx=wc.getContext("2d");let pen="#ff4d6d",dr=false,ghost="";
function ghostDraw(){wx.clearRect(0,0,780,420);const m=MODS[cur],t=ghost,L=t.length;wx.fillStyle="rgba(120,140,180,.28)";wx.textAlign="center";wx.textBaseline="middle";wx.font=m.ur?"230px 'Noto Nastaliq Urdu','Segoe UI',serif":(L<=2?"330px":L<7?"170px":"120px")+" Fredoka,'Trebuchet MS',sans-serif";wx.fillText(t,390,m.ur?240:215);wx.strokeStyle=pen}
$("#wt").onclick=()=>{ghost=MODS[cur].wr(ci);$("#wr").style.display="flex";ghostDraw()};
$("#wcx").onclick=()=>{$("#wr").style.display="none";good()};$("#wcl").onclick=ghostDraw;
document.querySelectorAll(".pen").forEach(b=>b.onclick=()=>pen=b.dataset.c);
function pos(e){const r=wc.getBoundingClientRect();return[(e.clientX-r.left)*780/r.width,(e.clientY-r.top)*420/r.height]}
wc.onpointerdown=e=>{dr=true;const p=pos(e);wx.strokeStyle=pen;wx.lineWidth=14;wx.lineCap=wx.lineJoin="round";wx.beginPath();wx.moveTo(p[0],p[1]);wx.lineTo(p[0]+.1,p[1]);wx.stroke();wc.setPointerCapture(e.pointerId)};
wc.onpointermove=e=>{if(!dr)return;const p=pos(e);wx.strokeStyle=pen;wx.lineTo(p[0],p[1]);wx.stroke()};wc.onpointerup=()=>dr=false;
/* ---------------- fullscreen + fit ---------------- */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
$("#fs").onclick=()=>{const a=document.documentElement;if(!fsEl())(a.requestFullscreen||a.webkitRequestFullscreen).call(a);else(document.exitFullscreen||document.webkitExitFullscreen).call(document)};
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$("#stage").style.transform=`translate(-50%,-50%) scale(${s})`}
function fsUpd(){$("#fs").innerHTML=fsEl()?"⛶ Exit Full Screen":"⛶ Full Screen";fit()}
document.addEventListener("fullscreenchange",fsUpd);document.addEventListener("webkitfullscreenchange",fsUpd);addEventListener("resize",fit);fit();
if(window.speechSynthesis)speechSynthesis.getVoices();
view("home","");
</script></body></html>
