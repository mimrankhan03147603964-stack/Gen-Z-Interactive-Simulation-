<style>

.r{--c:#ff4d6d;--d:#a3153a;--l:#ff9aae}.o{--c:#ff9f1c;--d:#ad6200;--l:#ffd08a}.y{--c:#ffd60a;--d:#a88700;--l:#fff27a}.g{--c:#2ecc71;--d:#12793d;--l:#8df0b4}.t{--c:#14b8a6;--d:#0a766b;--l:#6ef0dd}.b{--c:#3b82f6;--d:#1a46b5;--l:#9cc6ff}.p{--c:#a855f7;--d:#661f9e;--l:#dcb8ff}.k{--c:#ec4899;--d:#99174f;--l:#ffb0d6}

#cl{left:40px;width:420px}#cr{left:480px;width:760px}
.flip{animation:flip .45s}@keyframes flip{from{transform:rotateY(90deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
.bl{font-size:200px;line-height:1;font-weight:700;margin-left:6px;cursor:pointer;animation:bob 2.6s ease-in-out infinite;white-space:nowrap}.bl small{font-size:150px;margin-left:8px}
@keyframes bob{50%{transform:translateY(-10px)}}
.rr{width:400px;text-align:center}.fr{font-size:34px;font-weight:600;color:#566a8f}.wd{font-weight:700;line-height:1.1;margin:2px 0 12px;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.sp{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.sp b{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;color:#fff;font-size:30px;cursor:pointer;background:linear-gradient(var(--l),var(--c));box-shadow:0 5px 0 var(--d);text-shadow:0 2px 0 rgba(0,0,0,.3);transition:.12s}

#ctl{position:absolute;left:40px;top:454px;width:1200px;display:flex;gap:12px}#ctl .bt{height:56px;font-size:19px;padding:0 8px;flex:1}
#strip{position:absolute;left:40px;top:534px;width:1200px;display:flex;flex-wrap:wrap;gap:10px 8px}
#strip .bt{height:62px;width:84px;font-size:36px;border-radius:16px;box-shadow:0 6px 0 var(--d),0 10px 10px rgba(0,0,0,.25)}#strip .bt.on{outline:5px solid #fff;transform:translateY(-6px) scale(1.1);z-index:2}

.gc{border:none;background:#fff;border-radius:18px;padding:6px;display:flex;align-items:center;justify-content:center;height:196px;cursor:pointer;border:4px solid var(--c);box-shadow:0 7px 0 var(--d),0 12px 12px rgba(0,0,0,.25);transition:.15s;position:relative}
.gc:hover{transform:translateY(-8px) scale(1.12) rotate(-2deg);z-index:3}.gc .pic{box-shadow:none}
.box{position:absolute;left:40px;top:90px;width:1200px;height:610px;border-radius:40px;background:rgba(255,255,255,.94);border:6px solid #fff;box-shadow:0 14px 0 rgba(0,0,0,.2),0 28px 40px rgba(0,0,0,.3)}
.box .xi{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:26px;font-weight:700;color:#33436b}
.box .pr{position:absolute;left:60px;right:60px;top:56px;height:22px;border-radius:12px;background:#dbe6fb;overflow:hidden;box-shadow:inset 0 3px 5px rgba(0,0,0,.25)}.box .pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ecc71,#ffd60a,#ff4d6d);transition:.4s}
.box .qa{position:absolute;left:0;right:0;top:90px;text-align:center;color:#233657;display:flex;flex-direction:column;align-items:center;gap:6px}.qt{font-size:36px;font-weight:700}
.qc{position:absolute;left:60px;right:60px;top:372px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:22px}.qc.pics{top:338px}
.qc .bt{height:104px;font-size:70px;border-radius:28px}.qc .pc{background:#fff;border:6px solid var(--c);border-radius:26px;height:252px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 0 var(--d),0 14px 14px rgba(0,0,0,.25);transition:.12s}.qc .pc:hover{transform:translateY(-6px)}
.qc .ok{--c:#16a34a;--l:#86efac;--d:#0b6b2c;outline:6px solid #16a34a}.qc .no{--c:#dc2626;--l:#fca5a5;--d:#8f1414;animation:shk .4s}.qc .pc.ok{background:#e8ffe9}.qc .pc.no{background:#ffe8e8}
@keyframes shk{25%{transform:translateX(-12px)}50%{transform:translateX(12px)}75%{transform:translateX(-7px)}}
.xb{position:absolute;left:30px;top:8px;height:40px;font-size:18px;padding:0 16px}
.res{text-align:center;padding-top:50px}.res .st{font-size:110px}.res h2{font-size:62px;color:#e0457a}.res p{font-size:36px;color:#33436b;margin:6px 0 24px}.res .bt{height:64px;font-size:25px;padding:0 28px;margin:0 6px}
#sl{display:flex;gap:10px;justify-content:center}.slot{width:64px;height:76px;border-radius:16px;border:4px dashed #9cc6ff;background:#f3f8ff;font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}.slot.f{border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.2);background:linear-gradient(var(--l),var(--c))}
#tl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:900px}#tl .bt{width:78px;height:84px;font-size:46px;border-radius:20px}#tl .bt.h{animation:hh .5s 4}@keyframes hh{50%{transform:scale(1.25)}}#tl .bt.no{animation:shk .4s}
.ob{position:relative;display:flex;align-items:center;justify-content:center}
.ob:before{content:"";position:absolute;left:10%;right:10%;bottom:1%;height:10%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.38),rgba(0,0,0,0) 70%)}
.ei{position:relative;object-fit:contain;filter:drop-shadow(0 16px 8px rgba(0,0,0,.32))}.ob.fl .ei{animation:bob 3s ease-in-out infinite}
.gc{flex-direction:column;gap:2px}.cp{font-weight:700;font-size:15px;white-space:nowrap}
.sp2{position:absolute;pointer-events:none;font-size:34px;z-index:40}
#wr{position:absolute;inset:0;background:rgba(10,20,60,.75);z-index:30;display:none;align-items:center;justify-content:center}
#wr .pad{background:#fffdf4;border-radius:36px;padding:16px;border:6px solid #ffd60a;box-shadow:0 14px 0 #b8860b;text-align:center}
#wc{background:repeating-linear-gradient(#fffdf4 0 69px,#cfe3ff 69px 71px);border-radius:20px;border:4px dashed #9cc6ff;touch-action:none;cursor:crosshair}
#wr .tools{display:flex;gap:12px;justify-content:center;margin-top:14px}#wr .tools .bt{height:50px;font-size:20px;padding:0 20px}.pen{width:50px;height:50px;border-radius:50%!important;padding:0!important}
</style></head><body>
<div id="stage">
 <div id="deco"></div>
 <div id="top"><div id="tabs"><button class="bt r" data-v="learn">📖 Learn</button><button class="bt b" data-v="chart">🧩 Full Chart</button><button class="bt g" data-v="quiz">🎮 Quiz</button><button class="bt o" data-v="spell">🔤 Spell It</button></div>
  <div id="tt">My ABC Book</div><button class="bt y" id="snd" style="right:208px;color:#5a3a00;text-shadow:none">🔊 Sound ON</button><button class="bt p" id="fs" style="right:20px">⛶ Full Screen</button></div>
 <div class="view on" id="learn"><div id="cl"></div><div id="cr"></div>
  <div id="ctl"><button class="bt b" id="pv">◀ Previous</button><button class="bt g" id="ls">🔊 Listen</button><button class="bt b" id="nx">Next ▶</button><button class="bt o" id="wt">✏️ Write</button><button class="bt p" id="au">🔁 Auto Play</button><button class="bt t" id="rd">🔀 Random</button><button class="bt k" id="ch">🧩 Full Chart</button></div>
  <div id="strip"></div></div>
 <div class="view" id="chart"><div id="grid"></div></div>
 <div class="view" id="quiz"><div class="box"><button class="bt o xb" data-v="learn">✖ Exit Quiz</button><div class="xi" id="qi"></div><div class="pr"><i id="qp"></i></div><div class="qa" id="qa"></div><div class="qc" id="qc"></div></div></div>
 <div class="view" id="spell"><div class="box"><button class="bt o xb" data-v="learn">✖ Exit</button><div class="xi" id="si"></div><div class="pr"><i id="sp"></i></div>
  <div id="sv" style="position:absolute;left:60px;top:96px;width:300px;height:480px;display:flex;align-items:center;justify-content:center"></div>
  <div style="position:absolute;left:390px;right:30px;top:100px;text-align:center"><div class="qt" id="sq">Spell the word!</div><div id="sl" style="margin:30px 0 40px"></div><div id="tl"></div>
  <div style="margin-top:34px"><button class="bt y" id="hn" style="height:54px;font-size:21px;padding:0 22px;color:#5a3a00;text-shadow:none">💡 Hint</button> <button class="bt g" id="hs" style="height:54px;font-size:21px;padding:0 22px">🔊 Hear word</button> <button class="bt b" id="sk" style="height:54px;font-size:21px;padding:0 22px">⏩ Skip</button></div></div></div></div>
 <div id="wr"><div class="pad"><canvas id="wc" width="780" height="420"></canvas><div class="tools"><button class="bt pen r" data-c="#ff4d6d"></button><button class="bt pen b" data-c="#3b82f6"></button><button class="bt pen g" data-c="#16a34a"></button><button class="bt pen o" data-c="#ff9f1c"></button><button class="bt pen p" data-c="#a855f7"></button><button class="bt o" id="wcl">🧽 Clear</button><button class="bt g" id="wcx">✔ Done</button></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const WD=["Apple","Banana","Cat","Dog","Elephant","Fish","Grapes","House","Ice cream","Juice","Kite","Lion","Mango","Nest","Orange","Peacock","Queen","Rose","Sun","Tree","Umbrella","Van","Watch","X-mas Tree","Yacht","Zebra"];
const LC=["#e02020","#1e40c8","#e0189a","#1a9a30","#8a2be2","#ff7a00","#1a9a30","#e02020","#1e40c8","#e0189a","#7a1fc8","#7a4a1a","#1e40c8","#1a8a30","#ff7a00","#e0189a","#1e40c8","#e02020","#7a1fc8","#1a9a30","#e02020","#7a1fc8","#1a9a30","#e0189a","#1e40c8","#7a1fc8"];
const Lt=i=>String.fromCharCode(65+i),shuf=a=>[...a].sort(()=>Math.random()-.5);
function sh(h,f){const n=parseInt(h.slice(1),16),k=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return"#"+[n>>16,n>>8&255,n&255].map(v=>k(v).toString(16).padStart(2,"0")).join("")}
const cv=i=>`--c:${LC[i]};--d:${sh(LC[i],-.4)};--l:${sh(LC[i],.45)}`;
const EM=["🍎","🍌","🐈","🐕","🐘","🐟","🍇","🏠","🍦","🧃","🪁","🦁","🥭","🪺","🍊","🦚","👸","🌹","☀️","🌳","☂️","🚐","⌚","🎄","⛵","🦓"];
const FN=["Red apple","Banana","Cat","Dog","Elephant","Fish","Grapes","House","Soft ice cream","Beverage box","Kite","Lion","Mango","Nest with eggs","Tangerine","Peacock","Princess","Rose","Sun","Deciduous tree","Umbrella","Minibus","Watch","Christmas tree","Sailboat","Zebra"];
function urls(i){const L=String.fromCharCode(65+i),f=FN[i],F="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/"+encodeURIComponent(f),sn=f.toLowerCase().replace(/ /g,"_"),cp=[...EM[i]].map(c=>c.codePointAt(0).toString(16)),pl=cp.filter(x=>x!=="fe0f"),B="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/png/512/emoji_u";
const u=["photos/"+L+".jpg","photos/"+L+".png",i==16?F+"/Default/3D/princess_3d_default.png":F+"/3D/"+sn+"_3d.png",B+cp.join("_")+".png"];if(pl.length!==cp.length)u.push(B+pl.join("_")+".png");u.push("https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.0.3/assets/svg/"+pl.join("-")+".svg");return u}
function oi(i,s){const u=urls(i);return `<img class="ei" width="${s}" height="${s}" alt="${EM[i]}" src="${u[0]}" data-u='${JSON.stringify(u)}' data-i="0" onerror="ef(this)">`}
function ef(im){const u=JSON.parse(im.dataset.u),i=+im.dataset.i+1;if(i<u.length){im.dataset.i=i;im.src=u[i]}else{const p=document.createElement("span");p.textContent=im.alt;p.style.fontSize=Math.round(im.width*.8)+"px";p.style.lineHeight="1.1";im.replaceWith(p)}}
function pic(i,bw,bh,cls){return `<div class="ob ${cls||""}" style="width:${bw}px;height:${bh}px">${oi(i,Math.round(Math.min(bw,bh)*.92))}</div>`}
function opts(a){return shuf([a,...shuf([...Array(26).keys()].filter(i=>i!==a)).slice(0,3)])}
/* sound */
let soundOn=true,ac;
function tone(f,d,t="triangle",v=.18,w=0){if(!soundOn)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+w;g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const good=()=>{tone(660,.15);tone(880,.2,"triangle",.18,.12)},bad=()=>tone(150,.3,"sawtooth",.1),win=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,"triangle",.2,i*.12));
function say(t){if(!soundOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function burst(){const st=$("#stage");for(let i=0;i<26;i++){const p=document.createElement("div");p.className="sp2";p.textContent=["⭐","🎉","✨","🎈","🌟"][i%5];p.style.left="620px";p.style.top="300px";st.appendChild(p);const a=Math.random()*6.28,d=160+Math.random()*340;p.animate([{transform:"scale(.4)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d*.7}px) rotate(${Math.random()*540}deg) scale(1.3)`,opacity:0}],{duration:1000+Math.random()*700,easing:"ease-out"}).onfinish=()=>p.remove()}}
/* decor */
["⭐","✨","🎈","🌈","☁️","🦋","🌸","🎨","🖍️","🍎","🐥"].forEach(e=>{for(let j=0;j<2;j++){const s=document.createElement("div");s.className="dc";s.textContent=e;s.style.left=Math.random()*1220+"px";s.style.top=(300+Math.random()*500)+"px";s.style.fontSize=(24+Math.random()*34)+"px";s.style.animationDuration=(16+Math.random()*18)+"s";s.style.animationDelay=-Math.random()*20+"s";$("#deco").appendChild(s)}});
/* navigation */
let ci=0,autoT=null,cur="learn",qt=0;
function go(v){qt++;stopAuto();cur=v;document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==v));document.querySelectorAll("#tabs .bt").forEach(b=>b.classList.toggle("on",b.dataset.v==v));$("#wr").style.display="none";
if(v=="learn")render(0);if(v=="quiz")startQuiz();if(v=="spell")startSpell()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-v]");if(t)go(t.dataset.v)});
$("#ch").onclick=()=>go("chart");
/* learn */
const strip=$("#strip");for(let i=0;i<26;i++){const b=document.createElement("button");b.className="bt";b.setAttribute("style",cv(i));b.textContent=Lt(i);b.onclick=()=>{ci=i;render(1)};strip.appendChild(b)}
function render(sp){const i=ci,w=WD[i],ch=[...w],n=ch.filter(c=>/[A-Za-z]/.test(c)).length,ts=Math.max(30,Math.min(54,Math.floor(380/n)-6));
$("#cl").innerHTML=pic(i,372,330,"fl");$("#cl").style.background=`radial-gradient(circle at 50% 45%,#fff 25%,${sh(LC[i],.88)})`;
$("#cr").innerHTML=`<div class="bl" style="color:${LC[i]};text-shadow:0 6px 0 ${sh(LC[i],-.4)},0 14px 8px rgba(0,0,0,.25)" data-l>${Lt(i)}<small>${Lt(i).toLowerCase()}</small></div><div class="rr"><div class="fr">${Lt(i)} is for</div><div class="wd" style="font-size:${w.length>8?52:68}px;color:${LC[i]}">${w}</div><div class="sp">${ch.map((c,k)=>c==" "?'<span style="width:18px"></span>':`<b data-c="${c}" style="${cv((i+k*5)%26)};width:${ts}px;height:${ts+10}px;font-size:${ts*.62}px">${c}</b>`).join("")}</div></div>`;
["#cl","#cr"].forEach(q=>{const e=$(q);e.classList.remove("flip");void e.offsetWidth;e.classList.add("flip")});
[...strip.children].forEach((b,k)=>b.classList.toggle("on",k==i));if(sp)sayItem()}
function sayItem(){say(`${Lt(ci)}. ${Lt(ci)} for ${WD[ci]}`)}
const step=d=>{ci=(ci+d+26)%26;render(1)};
$("#pv").onclick=()=>step(-1);$("#nx").onclick=()=>step(1);$("#ls").onclick=sayItem;$("#rd").onclick=()=>{ci=Math.random()*26|0;render(1)};
function stopAuto(){clearInterval(autoT);autoT=null;$("#au").innerHTML="🔁 Auto Play"}
$("#au").onclick=()=>{if(autoT)return stopAuto();$("#au").innerHTML="⏸ Stop Auto";autoT=setInterval(()=>step(1),3600);step(1)};
document.addEventListener("click",e=>{const l=e.target.closest("[data-l]");if(l)sayItem();const c=e.target.closest("[data-c]");if(c){c.classList.remove("pp");void c.offsetWidth;c.classList.add("pp");say(c.dataset.c);tone(420+Math.random()*300,.12)}});
document.addEventListener("keydown",e=>{if(cur!="learn")return;if(e.key=="ArrowRight")step(1);else if(e.key=="ArrowLeft")step(-1);else if(e.code=="Space"){e.preventDefault();sayItem()}else if(/^[a-z]$/i.test(e.key)&&!e.ctrlKey&&!e.metaKey){ci=e.key.toUpperCase().charCodeAt(0)-65;render(1)}});
$("#snd").onclick=function(){soundOn=!soundOn;this.innerHTML=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(!soundOn&&window.speechSynthesis)speechSynthesis.cancel()};
/* chart */
for(let i=0;i<26;i++){const b=document.createElement("button");b.className="gc";b.setAttribute("style",cv(i));b.innerHTML=pic(i,104,134)+`<span class="cp" style="color:${LC[i]}">${Lt(i)} ${WD[i]}</span>`;b.onclick=()=>{ci=i;go("learn");render(1)};$("#grid").appendChild(b)}
/* quiz */
let qs=[],qn=0,sc=0;
function startQuiz(){qs=shuf([...Array(26).keys()]).slice(0,10).map((i,k)=>({i,t:k%2}));qn=0;sc=0;showQ()}
function showQ(){if(cur!="quiz")return;if(qn>=qs.length)return result("#qa","#qc",sc,10,startQuiz);const q=qs[qn],tk=qt,i=q.i,c=$("#qc");
$("#qi").innerHTML=`Question ${qn+1} / ${qs.length} &nbsp;•&nbsp; ⭐ Score: ${sc}`;$("#qp").style.width=qn/qs.length*100+"%";c.innerHTML="";
const sp=q.t?`Find the picture that starts with ${Lt(i)}`:`Which letter does this picture start with?`;
