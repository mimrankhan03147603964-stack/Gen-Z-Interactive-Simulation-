<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Logic Gates & Boolean Circuit Workbench</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04121a; font-family: system-ui, -apple-system, sans-serif; color: #f0fdfa; }
    .sim { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
    .stage { flex: 1 1 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 45% 50%, #082f3c 0%, #041620 70%, #020b10 100%); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    .ctl {
      flex-shrink: 0;
      width: 100%;
      background: rgba(3, 16, 24, 0.96);
      border-top: 1.5px solid rgba(45, 212, 191, 0.45);
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(16px);
      z-index: 20;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
    }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .row span.lbl { font-size: 11px; font-weight: 800; color: #5eead4; text-transform: uppercase; letter-spacing: 0.05em; min-width: 90px; }
    .btn {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: #fff;
    }
    .btn:hover { transform: translateY(-1.5px); filter: brightness(1.15); }
    .btn:active { transform: translateY(1px); }
    .b-preset { background: #134e4a; border-color: #0d9488; }
    .b-preset.active { background: #0d9488; border-color: #5eead4; box-shadow: 0 0 12px rgba(45, 212, 191, 0.6); }
    .b-switch { background: #334155; border-color: #64748b; }
    .b-switch.on { background: #059669; border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.5); }
    .b-reset { background: #374151; border-color: #6b7280; }
    .b-fs { background: linear-gradient(135deg, #0d9488, #0284c7); border-color: #38bdf8; margin-left: auto; }
    .hud { position: absolute; top: 12px; left: 14px; background: rgba(3, 22, 32, 0.88); border: 1px solid rgba(45, 212, 191, 0.4); border-radius: 12px; padding: 10px 14px; font-size: 11px; line-height: 1.5; pointer-events: none; backdrop-filter: blur(8px); }
    .hud b { color: #5eead4; }
  </style>

<!-- ================= FULLSCREEN ENGINE STYLES ================= -->
<style id="genz-simulation-fullscreen-styles">
  /* 1. RESTORE NATURAL SCROLLBARS (Normal & Fullscreen Flexibility) */
  html, body {
    overflow-x: hidden !important;
    overflow-y: auto !important;
    min-height: 100vh !important;
    scrollbar-width: thin !important;
    scrollbar-color: #0284c7 rgba(15, 23, 42, 0.6) !important;
  }

  :fullscreen, ::backdrop {
    background-color: #060e1d !important;
  }

  html:fullscreen,
  body:fullscreen,
  :fullscreen,
  :-webkit-full-screen,
  :-moz-full-screen,
  :-ms-fullscreen,
  .simulation-wrapper:fullscreen,
  .is-fullscreen,
  [data-is-fullscreen="true"] {
    width: 100vw !important;
    max-width: 100vw !important;
    min-height: 100vh !important;
    overflow-x: hidden !important;
    overflow-y: auto !important; /* Allows natural vertical scrolling so nothing is ever clipped */
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-start !important;
    align-items: stretch !important;
    box-sizing: border-box !important;
    margin: 0 !important;
    padding: 10px 16px !important;
    background-color: #060e1d !important;
    background: radial-gradient(circle at 50% 0%, #0d1e3d 0%, #040915 100%) !important;
    position: fixed !important;
    inset: 0 !important;
    z-index: 999999 !important;
    scrollbar-width: thin !important;
    scrollbar-color: #0284c7 rgba(15, 23, 42, 0.6) !important;
  }

  :fullscreen::-webkit-scrollbar,
  :-webkit-full-screen::-webkit-scrollbar,
  ::-webkit-scrollbar {
    display: block !important;
    width: 8px !important;
    height: 8px !important;
  }

  :fullscreen::-webkit-scrollbar-track,
  :-webkit-full-screen::-webkit-scrollbar-track,
  ::-webkit-scrollbar-track {
    background: rgba(10, 15, 30, 0.7) !important;
  }

  :fullscreen::-webkit-scrollbar-thumb,
  :-webkit-full-screen::-webkit-scrollbar-thumb,
  ::-webkit-scrollbar-thumb {
    background: #0284c7 !important;
    border-radius: 4px !important;
  }

  /* 2. AUTO-SCALE MAIN CANVAS & VISUAL WORKSPACE */
  :fullscreen canvas,
  :fullscreen svg,
  :-webkit-full-screen canvas,
  :-webkit-full-screen svg,
  .is-fullscreen canvas,
  .is-fullscreen svg {
    display: block !important;
    object-fit: contain !important;
    width: 100% !important;
    max-width: 100% !important;
    max-height: 70vh !important;
    min-height: 280px !important;
    flex-shrink: 0 !important;
    margin: 4px auto !important;
  }

  /* 3. PINNED & VISIBLE CONTROLS: docked neatly with natural auto-height */
  :fullscreen .ctl,
  :fullscreen .controls,
  :fullscreen .sim-controls,
  :fullscreen .dock,
  :fullscreen .control-panel,
  :fullscreen .controls-bar,
  :fullscreen .fs-bar,
  :fullscreen .fs-topbar,
  :fullscreen .fullscreen-overlay-controls,
  :fullscreen .floating-controls,
  :fullscreen .preset-chips,
  :fullscreen .stats-bar,
  :fullscreen .sim-readout,
  :fullscreen .readout,
  :fullscreen header,
  :-webkit-full-screen .ctl,
  :-webkit-full-screen .controls,
  :-webkit-full-screen .sim-controls,
  :-webkit-full-screen .dock,
  :-webkit-full-screen .control-panel,
  :-webkit-full-screen .controls-bar,
  :-webkit-full-screen .fs-bar,
  :-webkit-full-screen .fs-topbar,
  :-webkit-full-screen .fullscreen-overlay-controls,
  :-webkit-full-screen .floating-controls,
  :-webkit-full-screen .preset-chips,
  :-webkit-full-screen .stats-bar,
  :-webkit-full-screen .sim-readout,
  :-webkit-full-screen .readout,
  :-webkit-full-screen header,
  .is-fullscreen .ctl,
  .is-fullscreen .controls,
  .is-fullscreen .sim-controls,
  .is-fullscreen .dock,
  .is-fullscreen .control-panel,
  .is-fullscreen .controls-bar,
  .is-fullscreen .fs-bar,
  .is-fullscreen .fs-topbar,
  .is-fullscreen .fullscreen-overlay-controls,
  .is-fullscreen .floating-controls,
  .is-fullscreen .preset-chips,
  .is-fullscreen .stats-bar,
  .is-fullscreen .sim-readout,
  .is-fullscreen .readout,
  .is-fullscreen header {
    flex-shrink: 0 !important;
    position: relative !important;
    z-index: 100 !important;
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    max-height: none !important;
    box-sizing: border-box !important;
    margin: 4px auto !important;
    visibility: visible !important;
    opacity: 1 !important;
  }

  /* Bottom docked toolbars */
  :fullscreen .ctl,
  :fullscreen .dock,
  :fullscreen .control-panel,
  :fullscreen .fs-bar,
  :-webkit-full-screen .ctl,
  :-webkit-full-screen .dock,
  :-webkit-full-screen .control-panel,
  :-webkit-full-screen .fs-bar,
  .is-fullscreen .ctl,
  .is-fullscreen .dock,
  .is-fullscreen .control-panel,
  .is-fullscreen .fs-bar {
    padding: 8px 14px !important;
    background: rgba(5, 10, 30, 0.94) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1.5px solid rgba(56, 189, 248, 0.5) !important;
    border-radius: 16px !important;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(2, 132, 199, 0.25) !important;
  }

  /* Top docked toolbars */
  :fullscreen .sim-controls,
  :fullscreen .fs-topbar,
  :fullscreen header,
  :fullscreen .stats-bar,
  :-webkit-full-screen .sim-controls,
  :-webkit-full-screen .fs-topbar,
  :-webkit-full-screen header,
  :-webkit-full-screen .stats-bar,
  .is-fullscreen .sim-controls,
  .is-fullscreen .fs-topbar,
  .is-fullscreen header,
  .is-fullscreen .stats-bar {
    padding: 8px 14px !important;
    background: rgba(6, 14, 34, 0.92) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border-radius: 14px !important;
    border: 1px solid rgba(56, 189, 248, 0.4) !important;
  }

  /* Readouts between top toolbar and simulation canvas */
  :fullscreen .sim-readout,
  :fullscreen .readout,
  :-webkit-full-screen .sim-readout,
  :-webkit-full-screen .readout,
  .is-fullscreen .sim-readout,
  .is-fullscreen .readout {
    margin: 4px auto !important;
    padding: 4px 10px !important;
    font-size: clamp(12px, 1.2vw, 15px) !important;
  }

  /* Ensure all buttons, controls, and sliders remain visible and easily clickable */
  :fullscreen .btn,
  :fullscreen button,
  :-webkit-full-screen .btn,
  :-webkit-full-screen button,
  .is-fullscreen .btn,
  .is-fullscreen button {
    font-size: clamp(11px, 1.1vw, 15px) !important;
    padding: 6px 12px !important;
    line-height: 1.2 !important;
    white-space: nowrap !important;
    cursor: pointer !important;
    visibility: visible !important;
    opacity: 1 !important;
    pointer-events: auto !important;
  }

  :fullscreen .row,
  :-webkit-full-screen .row,
  .is-fullscreen .row {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 6px !important;
    align-items: center !important;
    justify-content: center !important;
  }

  :fullscreen .ctrl-group,
  :-webkit-full-screen .ctrl-group,
  .is-fullscreen .ctrl-group {
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
  }

  :fullscreen input[type="range"],
  :-webkit-full-screen input[type="range"],
  .is-fullscreen input[type="range"] {
    max-width: 140px !important;
    cursor: pointer !important;
  }

  :fullscreen select,
  :-webkit-full-screen select,
  .is-fullscreen select {
    cursor: pointer !important;
    font-size: clamp(11px, 1.1vw, 14px) !important;
  }

  /* Keep teacher notes and explanations visible and reachable in scrolling view */
  :fullscreen .teacher-note,
  :fullscreen .sim-info,
  :fullscreen .desc,
  :-webkit-full-screen .teacher-note,
  :-webkit-full-screen .sim-info,
  :-webkit-full-screen .desc,
  .is-fullscreen .teacher-note,
  .is-fullscreen .sim-info,
  .is-fullscreen .desc {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
  }
</style>
</head>
<body>
  <div class="sim" id="simContainer">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">
        <b>Digital Logic Gates & Boolean Architecture</b><br/>
        Circuit: <span id="hudCircuit" style="color:#5eead4; font-weight:900;">1-Bit Half Adder (Sum & Carry)</span><br/>
        Inputs: <span id="hudIn" style="color:#fde047; font-family:monospace; font-weight:900;">A = 0, B = 0</span> | 
        Outputs: <span id="hudOut" style="color:#34d399; font-family:monospace; font-weight:900;">Sum = 0, Carry = 0</span>
      </div>
    </div>
    <div class="ctl">
      <div class="row">
        <span class="lbl">Circuit Preset</span>
        <button class="btn b-preset active" id="btnAdder" onclick="setCircuit('adder')">➕ 1-Bit Half Adder</button>
        <button class="btn b-preset" id="btnXor" onclick="setCircuit('xor')">⚡ XOR vs OR Gate</button>
        <button class="btn b-preset" id="btnNand" onclick="setCircuit('nand')">🔒 Universal NAND Latch</button>
        <button class="btn b-preset" id="btnMux" onclick="setCircuit('mux')">🔀 2-to-1 Multiplexer (MUX)</button>
        <button class="btn b-reset" onclick="resetSim()">⟳ Reset All</button>
        <button class="btn b-fs" id="bFs" onclick="toggleFs()">⛶ Full Screen</button>
      </div>
      <div class="row">
        <span class="lbl">Logic Inputs</span>
        <button class="btn b-switch" id="btnInA" onclick="toggleInput('A')">Toggle Input A: 0 (LOW)</button>
        <button class="btn b-switch" id="btnInB" onclick="toggleInput('B')">Toggle Input B: 0 (LOW)</button>
        <button class="btn b-switch" id="btnInC" onclick="toggleInput('C')">Toggle Select S: 0</button>
      </div>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    let width, height;
    let circuit = 'adder'; // 'adder', 'xor', 'nand', 'mux'
    let inA = 0, inB = 0, inC = 0;
    let t = 0;

    function resize() {
      const rect = cv.parentElement.getBoundingClientRect();
      width = cv.width = rect.width * (window.devicePixelRatio || 1);
      height = cv.height = rect.height * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resize);

    function setCircuit(c) {
      circuit = c;
      document.getElementById('btnAdder').classList.toggle('active', c === 'adder');
      document.getElementById('btnXor').classList.toggle('active', c === 'xor');
      document.getElementById('btnNand').classList.toggle('active', c === 'nand');
      document.getElementById('btnMux').classList.toggle('active', c === 'mux');
      document.getElementById('btnInC').style.display = (c === 'mux' ? 'inline-flex' : 'none');
      document.getElementById('hudCircuit').textContent = (c === 'adder' ? '1-Bit Half Adder (Sum & Carry)' : (c === 'xor' ? 'XOR vs OR Gate Comparison' : (c === 'nand' ? 'Universal NAND Gate' : '2-to-1 Multiplexer (MUX)')));
      updateVars();
    }

    function toggleInput(pin) {
      if (pin === 'A') inA = inA === 0 ? 1 : 0;
      if (pin === 'B') inB = inB === 0 ? 1 : 0;
      if (pin === 'C') inC = inC === 0 ? 1 : 0;
      updateVars();
    }

    function updateVars() {
      const btnA = document.getElementById('btnInA');
      const btnB = document.getElementById('btnInB');
      const btnC = document.getElementById('btnInC');
      btnA.classList.toggle('on', inA === 1);
      btnA.textContent = inA === 1 ? 'Input A: 1 (HIGH)' : 'Input A: 0 (LOW)';
      btnB.classList.toggle('on', inB === 1);
      btnB.textContent = inB === 1 ? 'Input B: 1 (HIGH)' : 'Input B: 0 (LOW)';
      btnC.classList.toggle('on', inC === 1);
      btnC.textContent = inC === 1 ? 'Select S: 1 (HIGH)' : 'Select S: 0 (LOW)';

      document.getElementById('hudIn').textContent = `A = ${inA}, B = ${inB}` + (circuit === 'mux' ? `, S = ${inC}` : '');
      let outText = '';
      if (circuit === 'adder') {
        const sum = inA ^ inB;
        const carry = inA & inB;
        outText = `Sum = ${sum}, Carry = ${carry}`;
      } else if (circuit === 'xor') {
        outText = `XOR = ${inA ^ inB}, OR = ${inA | inB}`;
      } else if (circuit === 'nand') {
        outText = `NAND = ${!(inA && inB) ? 1 : 0}`;
      } else {
        const out = inC === 0 ? inA : inB;
        outText = `Y = ${out}`;
      }
      document.getElementById('hudOut').textContent = outText;
    }

    function resetSim() {
      inA = 0; inB = 0; inC = 0;
      setCircuit('adder');
      updateVars();
    }

    function drawWire(x1, y1, x2, y2, state) {
      ctx.strokeStyle = state === 1 ? '#00f5ff' : '#64748b';
      ctx.lineWidth = state === 1 ? 4 : 2;
      ctx.shadowColor = state === 1 ? '#00f5ff' : 'transparent';
      ctx.shadowBlur = state === 1 ? 12 : 0;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawGate(x, y, type, w = 90, h = 60) {
      ctx.fillStyle = '#0f2937';
      ctx.strokeStyle = '#2dd4bf';
      ctx.lineWidth = 2.5;
      ctx.fillRect(x - w / 2, y - h / 2, w, h);
      ctx.strokeRect(x - w / 2, y - h / 2, w, h);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(type, x, y + 5);
    }

    function drawBulb(x, y, state, label) {
      ctx.fillStyle = state === 1 ? '#facc15' : '#1e293b';
      ctx.strokeStyle = state === 1 ? '#fef08a' : '#475569';
      ctx.lineWidth = 2;
      ctx.shadowColor = state === 1 ? '#facc15' : 'transparent';
      ctx.shadowBlur = state === 1 ? 20 : 0;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = state === 1 ? '#04121a' : '#94a3b8';
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(state === 1 ? '1' : '0', x, y + 4);

      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 12px system-ui';
      ctx.fillText(label, x, y + 36);
    }

    function loop() {
      t += 0.04;
      ctx.clearRect(0, 0, width, height);

      const inX = width * 0.16;
      const inY1 = height * 0.35;
      const inY2 = height * 0.65;

      // Draw Input Terminals
      ctx.fillStyle = inA === 1 ? '#34d399' : '#475569';
      ctx.beginPath(); ctx.arc(inX, inY1, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.fillText('A=' + inA, inX - 12, inY1 - 22);

      ctx.fillStyle = inB === 1 ? '#34d399' : '#475569';
      ctx.beginPath(); ctx.arc(inX, inY2, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText('B=' + inB, inX - 12, inY2 + 32);

      if (circuit === 'adder') {
        const sum = inA ^ inB;
        const carry = inA & inB;

        // XOR Gate for Sum
        const xorX = width * 0.45, xorY = height * 0.35;
        drawWire(inX, inY1, xorX - 45, xorY - 15, inA);
        drawWire(inX, inY2, xorX - 45, xorY + 15, inB);
        drawGate(xorX, xorY, 'XOR');
        drawWire(xorX + 45, xorY, width * 0.72, xorY, sum);
        drawBulb(width * 0.72, xorY, sum, 'SUM (S)');

        // AND Gate for Carry
        const andX = width * 0.45, andY = height * 0.65;
        drawWire(inX + 30, inY1, andX - 45, andY - 15, inA);
        drawWire(inX + 50, inY2, andX - 45, andY + 15, inB);
        drawGate(andX, andY, 'AND');
        drawWire(andX + 45, andY, width * 0.72, andY, carry);
        drawBulb(width * 0.72, andY, carry, 'CARRY (C)');

        // Truth table on right side
        const ttX = width * 0.82, ttY = height * 0.25;
        ctx.fillStyle = 'rgba(8, 47, 60, 0.85)';
        ctx.fillRect(ttX, ttY, width * 0.15, height * 0.50);
        ctx.strokeStyle = '#2dd4bf'; ctx.lineWidth = 1.5;
        ctx.strokeRect(ttX, ttY, width * 0.15, height * 0.50);

        ctx.fillStyle = '#fde047'; ctx.font = 'bold 11px monospace';
        ctx.fillText('A B | S C', ttX + 15, ttY + 25);
        ctx.fillStyle = (inA === 0 && inB === 0) ? '#38bdf8' : '#cbd5e1';
        ctx.fillText('0 0 | 0 0', ttX + 15, ttY + 50);
        ctx.fillStyle = (inA === 0 && inB === 1) ? '#38bdf8' : '#cbd5e1';
        ctx.fillText('0 1 | 1 0', ttX + 15, ttY + 75);
        ctx.fillStyle = (inA === 1 && inB === 0) ? '#38bdf8' : '#cbd5e1';
        ctx.fillText('1 0 | 1 0', ttX + 15, ttY + 100);
        ctx.fillStyle = (inA === 1 && inB === 1) ? '#38bdf8' : '#cbd5e1';
        ctx.fillText('1 1 | 0 1', ttX + 15, ttY + 125);
      } else if (circuit === 'xor') {
        const xorRes = inA ^ inB;
        const orRes = inA | inB;
        drawWire(inX, inY1, width * 0.45 - 45, height * 0.35 - 15, inA);
        drawWire(inX, inY2, width * 0.45 - 45, height * 0.35 + 15, inB);
        drawGate(width * 0.45, height * 0.35, 'XOR');
        drawWire(width * 0.45 + 45, height * 0.35, width * 0.72, height * 0.35, xorRes);
        drawBulb(width * 0.72, height * 0.35, xorRes, 'A ⊕ B');

        drawWire(inX + 30, inY1, width * 0.45 - 45, height * 0.65 - 15, inA);
        drawWire(inX + 50, inY2, width * 0.45 - 45, height * 0.65 + 15, inB);
        drawGate(width * 0.45, height * 0.65, 'OR');
        drawWire(width * 0.45 + 45, height * 0.65, width * 0.72, height * 0.65, orRes);
        drawBulb(width * 0.72, height * 0.65, orRes, 'A + B');
      } else if (circuit === 'nand') {
        const nandRes = !(inA && inB) ? 1 : 0;
        drawWire(inX, inY1, width * 0.45 - 45, height * 0.5 - 15, inA);
        drawWire(inX, inY2, width * 0.45 - 45, height * 0.5 + 15, inB);
        drawGate(width * 0.45, height * 0.5, 'NAND');
        drawWire(width * 0.45 + 45, height * 0.5, width * 0.72, height * 0.5, nandRes);
        drawBulb(width * 0.72, height * 0.5, nandRes, '!(A · B)');
      } else {
        // Mux
        const sel = inC;
        const out = sel === 0 ? inA : inB;
        drawWire(inX, inY1, width * 0.45 - 45, height * 0.5 - 20, inA);
        drawWire(inX, inY2, width * 0.45 - 45, height * 0.5 + 20, inB);
        // Sel wire from bottom
        drawWire(width * 0.45, height * 0.85, width * 0.45, height * 0.5 + 30, sel);
        ctx.fillStyle = '#fff'; ctx.fillText('S=' + sel, width * 0.45, height * 0.89);

        drawGate(width * 0.45, height * 0.5, 'MUX');
        drawWire(width * 0.45 + 45, height * 0.5, width * 0.72, height * 0.5, out);
        drawBulb(width * 0.72, height * 0.5, out, 'OUTPUT Y');
      }

      requestAnimationFrame(loop);
    }

    function toggleFs() {
      const container = document.getElementById('simContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '✕ Exit full screen';
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('bFs').innerHTML = '⛶ Full Screen';
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.getElementById('bFs').innerHTML = isFs ? '✕ Exit full screen' : '⛶ Full Screen';
      setTimeout(resize, 100);
    });

    resize();
    setCircuit('adder');
    requestAnimationFrame(loop);
  </script>




<!-- ================= FULLSCREEN ENGINE CONTROLLER ================= -->
<script id="genz-simulation-fullscreen-engine">
(function() {
  'use strict';

  function findSimulationRootContainer(triggerEl) {
    if (triggerEl) {
      if (typeof triggerEl === "string") {
        var cleanId = triggerEl.replace(/^fs-?/, "");
        var byId = document.getElementById(cleanId) ||
                   document.getElementById(triggerEl) ||
                   document.getElementById(cleanId + "SimBox") ||
                   document.getElementById("box" + cleanId.charAt(0).toUpperCase() + cleanId.slice(1)) ||
                   document.getElementById("box" + cleanId) ||
                   document.getElementById("simBox" + cleanId) ||
                   document.getElementById("sim" + cleanId.charAt(0).toUpperCase() + cleanId.slice(1));
        if (byId) return byId;
      }
      if (triggerEl.nodeType === 1) {
        if (triggerEl.dataset && triggerEl.dataset.fs) {
          var targetByFs = document.getElementById(triggerEl.dataset.fs);
          if (targetByFs) return targetByFs;
        }
        if (triggerEl.dataset && triggerEl.dataset.target) {
          var cleanTargetId = triggerEl.dataset.target.replace(/^fs-?/, "");
          var targetByData = document.getElementById(cleanTargetId) || document.getElementById(triggerEl.dataset.target);
          if (targetByData) return targetByData;
        }
        var found = triggerEl.closest(
          ".sim-box, .sim-stage, .simulation, #simContainer, #sim, .main-stage, .stage, .lab, .sim, .card-board, .card, .container"
        );
        if (found && found !== document.body && found !== document.documentElement) {
          return found;
        }
      }
    }
    var candidate = document.querySelector(".sim-box") ||
                    document.querySelector(".sim-stage") ||
                    document.getElementById("simContainer") ||
                    document.getElementById("sim") ||
                    document.querySelector(".main-stage") ||
                    document.querySelector(".stage") ||
                    document.querySelector(".lab") ||
                    document.querySelector(".card-board") ||
                    document.querySelector(".simulation") ||
                    document.querySelector(".sim") ||
                    document.querySelector(".simulation-wrapper") ||
                    document.body;
    return candidate;
  }

  function toggleSimulationFullscreen(triggerEl) {
    try {
      if (!document.fullscreenElement) {
        var container = findSimulationRootContainer(triggerEl);
        if (!container) container = document.body;

        container.classList.add("simulation-wrapper");
        container.classList.add("is-fullscreen");
        container.setAttribute("data-is-fullscreen", "true");
        document.documentElement.classList.add("in-fullscreen-mode");
        document.body.classList.add("in-fullscreen-mode");

        if (container.requestFullscreen) {
          container.requestFullscreen().catch(function(err) {
            console.error("Fullscreen request failed on container:", err);
            if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen().catch(function(e) { console.error(e); });
            } else if (document.body && document.body.requestFullscreen) {
              document.body.requestFullscreen().catch(function(e) { console.error(e); });
            }
          });
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function(err) {
            console.error("Exit fullscreen error:", err);
          });
        }
      }
    } catch (err) {
      console.error("Fullscreen toggle error:", err);
    }
  }

  window.toggleFullscreen = function(target) {
    toggleSimulationFullscreen(target || this);
  };
  window.toggleSimFullscreen = function(boxId) {
    var el = boxId ? document.getElementById(boxId) : this;
    toggleSimulationFullscreen(el || boxId);
  };
  window.toggleFs = function() {
    toggleSimulationFullscreen(this);
  };
  window.openFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) {
        ov.classList.remove("active");
        ov.style.display = "none";
      }
      var clean = id.replace(/^fs-?/, "");
      var target = document.getElementById(clean) ||
                   document.getElementById(clean + "SimBox") ||
                   document.getElementById("box" + clean.charAt(0).toUpperCase() + clean.slice(1)) ||
                   document.getElementById("box" + clean) ||
                   document.getElementById("simBox" + clean) ||
                   document.getElementById("t-" + clean) ||
                   document.querySelector("[data-topic=\"" + clean + "\"]") ||
                   document.getElementById(id);
      toggleSimulationFullscreen(target || clean);
      return;
    }
    toggleSimulationFullscreen(this);
  };
  window.launchFullscreen = function(topicId) {
    window.openFullscreen(topicId);
  };
  window.closeFullscreen = function(id) {
    if (id) {
      var ov = document.getElementById(id);
      if (ov) ov.classList.remove("active");
    }
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };
  window.exitSimFullscreen = function() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function() {});
    }
  };

  function resizeAndRedrawSimulationCanvases() {
    window.dispatchEvent(new Event("resize"));

    document.querySelectorAll("canvas").forEach(function(cv) {
      try {
        var rect = cv.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          if (cv.width === 0 || cv.height === 0) {
            cv.width = rect.width;
            cv.height = rect.height;
          }
        }
      } catch(e) {}
    });

    var redrawFns = [
      "resize", "onResize", "onWindowResize", "resizeCanvas",
      "draw", "render", "animate", "redraw", "update", "drawCanvas",
      "drawBohrModel", "drawScaleCanvas", "drawTitrationCanvas",
      "resizeMeasureCanvas", "updateSimulation", "drawScene", "drawOrbit",
      "drawWaves", "drawField", "drawCircuit", "drawGenetics", "updateCanvasSize"
    ];
    redrawFns.forEach(function(fn) {
      if (typeof window[fn] === "function") {
        try { window[fn](); } catch(e) {}
      }
    });

    if (window.camera && window.renderer) {
      try {
        var rw = window.innerWidth;
        var rh = window.innerHeight;
        window.camera.aspect = rw / rh;
        if (window.camera.updateProjectionMatrix) window.camera.updateProjectionMatrix();
        window.renderer.setSize(rw, rh);
      } catch(e) {}
    }
  }

  document.addEventListener("fullscreenchange", function() {
    var isFs = !!document.fullscreenElement;
    if (isFs) {
      document.documentElement.classList.add("in-fullscreen-mode");
      document.body.classList.add("in-fullscreen-mode");
      if (document.fullscreenElement) {
        document.fullscreenElement.classList.add("is-fullscreen");
        document.fullscreenElement.classList.add("simulation-wrapper");
        document.fullscreenElement.setAttribute("data-is-fullscreen", "true");
      }
    } else {
      document.documentElement.classList.remove("in-fullscreen-mode");
      document.body.classList.remove("in-fullscreen-mode");
      document.querySelectorAll(".is-fullscreen, [data-is-fullscreen]").forEach(function(el) {
        el.classList.remove("is-fullscreen");
        el.removeAttribute("data-is-fullscreen");
      });
    }

    var fsButtons = document.querySelectorAll(
      ".b-fs, .b-exit, [data-role=\"fs-btn\"], .fs-btn, .btn-fs, .fullscreen-btn, #bFs, #fsExitBtn, .fs-exit, #btnFullscreen, #fullscreenBtn, [data-fs], #psFsBtn, #fsToggleBtn, [id*=\"fsToggleBtn\"], #fsBtn, #btnFsMoon, #seFsBtn, #dnFsBtn, #waterFsBtn, #lightFullscreenBtn, #pressureFullscreenBtn, #soundFullscreenBtn"
    );
    fsButtons.forEach(function(btn) {
      if (btn.classList.contains("fs-exit-btn") || btn.classList.contains("fs-exit")) {
        return;
      }
      if (isFs) {
        btn.innerHTML = "✕ Exit Fullscreen";
        btn.classList.add("is-fullscreen-active");
      } else {
        btn.innerHTML = "⛶ Fullscreen";
        btn.classList.remove("is-fullscreen-active");
      }
    });

    resizeAndRedrawSimulationCanvases();
    setTimeout(resizeAndRedrawSimulationCanvases, 50);
    setTimeout(resizeAndRedrawSimulationCanvases, 150);
    setTimeout(resizeAndRedrawSimulationCanvases, 300);
  });

  window.addEventListener("resize", resizeAndRedrawSimulationCanvases);

  document.addEventListener("click", function(e) {
    var btn = e.target.closest(
      "button.b-fs, button.b-exit, button[data-role=\"fs-btn\"], button.fs-btn, button.btn-fs, button.fullscreen-btn, button#bFs, button#fsExitBtn, button.fs-exit, button#btnFullscreen, button#fullscreenBtn, button[data-fs], button#psFsBtn, button#fsToggleBtn, button[id*=\"fsToggleBtn\"], button#fsBtn, button#btnFsMoon, button#seFsBtn, button#dnFsBtn, button#waterFsBtn, button#lightFullscreenBtn, button#pressureFullscreenBtn, button#soundFullscreenBtn, button.icon-btn[onclick*=\"toggleSimFullscreen\"], button[onclick*=\"openFullscreen\"], button[onclick*=\"toggleFullscreen\"], button[onclick*=\"toggleFs\"], button[onclick*=\"toggleSimFullscreen\"]"
    );
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      toggleSimulationFullscreen(btn);
    }
  }, true);
})();
</script>
