 c.lineWidth=2;c.strokeStyle='#2a1208';for(let i=0;i<=44;i++){const u=i/44,px=(1-u)*(1-u)*22+2*(1-u)*u*150+u*u*278,py=(1-u)*(1-u)*150+2*(1-u)*u*(150-110*k)+u*u*150;
  const a=-1.57+(u-.5)*2.4;c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+Math.cos(a)*10,py+Math.sin(a)*14,px+Math.cos(a+(u<.5?-.4:.4))*20,py+Math.sin(a)*26*(.6+.4*k));c.stroke()}
 c.strokeStyle='#a0603a';c.lineWidth=2;c.beginPath();c.moveTo(22,150);c.quadraticCurveTo(150,260,278,150);c.stroke();
 c.fillStyle='#f08a90';c.beginPath();c.ellipse(34,152,10,7,0,0,7);c.fill()}
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;S.hov=hitP(mx,my);cv.style.cursor=S.hov?'pointer':'default'});
cv.addEventListener('mouseleave',()=>S.hov=null);
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;const p=hitP(mx,my);if(p){S.hl=false;$('bH').classList.remove('act');select(p)}});
function hitP(mx,my){for(const p of PARTS){if(Math.abs(mx-p.p[0])<(p.w||90)/2&&Math.abs(my-p.p[1])<21)return p;if(p.ax!=null&&Math.hypot(mx-p.ax,my-p.ay)<14)return p}return null}
function frame(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 S.ang+=((S.rot?.28*Math.sin(t*.9):0)-S.ang)*.08;
 if(S.hl){tourT+=dt;if(tourT>2){tourT=0;tour=(tour+1)%ORDER.length}const np=byId(ORDER[tour]);if(S.sel!=np){S.sel=np;sync()}}
 nb-=dt;if(bt<0&&nb<=0)bt=0;if(bt>=0){bt+=dt*4;if(bt>=1){bt=-1;nb=2.5+Math.random()*3;bl=0}else bl=Math.sin(bt*Math.PI)}
 draw();extDraw();requestAnimationFrame(frame)}

frame();
