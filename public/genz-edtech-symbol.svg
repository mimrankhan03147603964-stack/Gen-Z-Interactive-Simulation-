<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sym-brain-cortex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="sym-orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="sym-ai-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="sym-student-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sym-student-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <g id="monogram-symbol" transform="translate(15, 10)">
    <!-- ORBITAL GLOW RING AROUND BRAIN -->
    <ellipse cx="145" cy="85" rx="125" ry="30" fill="none" stroke="url(#sym-orbit)" stroke-width="4.5" transform="rotate(-15 145 85)" />
    <circle cx="28" cy="105" r="3.5" fill="#fde047" />
    <circle cx="255" cy="60" r="4" fill="#38bdf8" />
    <circle cx="225" cy="108" r="3" fill="#ec4899" />

    <!-- RIGHT SIDE: CIRCUIT TRACES -->
    <g stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M 185 38 L 205 18 L 205 6" />
      <circle cx="205" cy="6" r="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 200 58 L 228 40 L 228 20" />
      <circle cx="228" cy="20" r="4.5" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" />
      <path d="M 215 78 L 246 78 L 258 65" />
      <circle cx="258" cy="65" r="4" fill="#06b6d4" stroke="#e0f2fe" stroke-width="1.5" />
      <path d="M 190 115 L 218 115 L 232 135" />
      <circle cx="232" cy="135" r="3.5" fill="#f97316" stroke="#fed7aa" stroke-width="1.5" />
      <path d="M 160 135 L 160 165 L 150 175" />
      <circle cx="150" cy="175" r="3" fill="#0284c7" />
      <path d="M 175 130 L 175 158 L 185 168" />
      <circle cx="185" cy="168" r="3" fill="#059669" />
    </g>

    <!-- LEFT & CENTER: BRAIN STRUCTURE -->
    <!-- Left Hemispheric Lobes -->
    <path d="M 140 28 C 118 20, 85 26, 72 42 C 55 62, 50 88, 66 110 C 72 120, 85 126, 98 126 C 107 126, 114 120, 125 124 C 134 128, 140 138, 148 135 C 155 133, 157 122, 158 110 C 160 70, 156 44, 140 28 Z" 
          fill="url(#sym-brain-cortex)" 
          stroke="#38bdf8" 
          stroke-width="2.5" />

    <!-- Right Hemispheric Lobes -->
    <path d="M 140 28 C 162 21, 194 28, 205 44 C 216 62, 216 92, 203 112 C 192 125, 178 130, 165 128 C 160 118, 158 110, 160 88 C 158 62, 153 44, 140 28 Z" 
          fill="#0c234b" 
          stroke="#0ea5e9" 
          stroke-width="2" />

    <!-- Brain Sulci & Neural Network Synapses -->
    <g fill="#38bdf8" stroke="#38bdf8" stroke-width="1.3" opacity="0.9">
      <line x1="80" y1="56" x2="98" y2="48" />
      <line x1="98" y1="48" x2="116" y2="60" />
      <line x1="116" y1="60" x2="98" y2="78" />
      <line x1="98" y1="78" x2="80" y2="56" />
      <line x1="98" y1="78" x2="76" y2="92" />
      <line x1="76" y1="92" x2="98" y2="105" />
      <line x1="98" y1="105" x2="120" y2="96" />
      <line x1="120" y1="96" x2="116" y2="60" />

      <circle cx="80" cy="56" r="4" fill="#fde047" stroke="#f59e0b" stroke-width="1" />
      <circle cx="98" cy="48" r="3" fill="#67e8f9" />
      <circle cx="116" cy="60" r="3.5" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1" />
      <circle cx="98" cy="78" r="4" fill="#38bdf8" />
      <circle cx="76" cy="92" r="3" fill="#a78bfa" />
      <circle cx="98" cy="105" r="3.5" fill="#34d399" />
      <circle cx="120" cy="96" r="3.5" fill="#38bdf8" />
    </g>

    <!-- Binary Matrix Overlay -->
    <g fill="#7dd3fc" font-family="monospace" font-size="7.5" font-weight="bold" opacity="0.6">
      <text x="162" y="48">10101</text>
      <text x="166" y="62">01101</text>
      <text x="162" y="76">11010</text>
      <text x="168" y="90">0011</text>
    </g>

    <!-- CENTER EMBLEM: AI BADGE -->
    <g transform="translate(122, 63)">
      <rect x="0" y="0" width="42" height="30" rx="7" fill="url(#sym-ai-badge)" stroke="#ffffff" stroke-width="2" />
      <text x="21" y="21" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">AI</text>
    </g>

    <!-- STEM OF BRAIN -->
    <path d="M 148 130 Q 154 154 146 172 Q 158 162 161 140 Z" fill="#0369a1" />

    <!-- STUDENT / HUMAN LEARNER FIGURE -->
    <circle cx="118" cy="140" r="10" fill="url(#sym-student-blue)" stroke="#e0f2fe" stroke-width="1.5" />
    <path d="M 97 146 C 108 158, 123 166, 129 190 C 123 187, 108 175, 93 161 C 88 154, 91 149, 97 146 Z" fill="url(#sym-student-blue)" />
    <path d="M 135 146 C 129 158, 132 175, 141 198 C 136 190, 134 172, 143 161 C 147 154, 144 149, 135 146 Z" fill="url(#sym-student-orange)" />
  </g>
</svg>
