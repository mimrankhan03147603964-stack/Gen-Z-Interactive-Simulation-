<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/genz-official-logo.png" />
    <meta name="description" content="Gen Z Interactive Simulations - Modern, sleek web layout and simulation embed hub for next-generation STEM learning." />
    <meta property="og:title" content="Gen Z Interactive Simulations" />
    <meta property="og:description" content="Gen Z Interactive Simulations - Modern, sleek web layout and simulation embed hub for next-generation STEM learning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Ensure 4K Ultra-HD vibrant color reproduction & crisp optics on all displays */
      html, body, #root {
        -webkit-filter: none !important;
        filter: none !important;
        forced-color-adjust: none !important;
        -ms-high-contrast-adjust: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
        text-rendering: optimizeLegibility !important;
        color-rendering: optimizeQuality !important;
        image-rendering: -webkit-optimize-contrast !important;
      }
      /* 4K Vector Sharpness: Geometric precision for all SVG icons and paths */
      svg, svg * {
        shape-rendering: geometricPrecision !important;
        text-rendering: geometricPrecision !important;
      }
      /* Clean crisp images with zero downsampling blur */
      img {
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: high-quality !important;
      }
      @media screen and (min-width: 640px),
             screen and (min-width: 768px),
             screen and (min-width: 1024px),
             screen and (min-width: 1280px),
             screen and (min-width: 1440px),
             screen and (min-width: 1920px),
             (forced-colors: active),
             (prefers-contrast),
             print {
        html, body, #root, main, canvas, svg, iframe, img, div {
          forced-color-adjust: none !important;
          -ms-high-contrast-adjust: none !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body oncontextmenu="return false;" class="bg-[#f8fafc] text-[#1e293b] antialiased select-none font-sans min-h-screen flex flex-col overflow-x-hidden w-full max-w-full">
    <div id="root" class="min-h-screen flex flex-col flex-1 w-full overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
